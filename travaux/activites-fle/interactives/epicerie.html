<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>À l'épicerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Vidéos interactives : le design du prototype « La colocation de Kenji » (version 4), repris tel quel et rendu commun
   à toutes les vidéos (deux personnes : à gauche « g », à droite « d »). Les gestes propres à chaque vidéo sont à la fin. */
/* Version 4, allégée : la vidéo est une fenêtre posée dans sa propre scène, floutée tout autour.
   Ce qui est dit apparaît en bulles de verre SUR la vidéo : la question au centre, Camille à gauche,
   Kenji à droite. Sous la fenêtre, une petite barre (réécouter, mots, lent, le bouton blanc).
   Le geste vit à côté de la vidéo : le ruban des nombres à droite, « il n'aime pas » à gauche et
   « il aime » à droite pour trier les cartes. Plus d'étapes écrites, plus de frise de la voix. */
@property --sx  { syntax: '<percentage>'; inherits: false; initial-value: 50%; }
@property --sy  { syntax: '<percentage>'; inherits: false; initial-value: 50%; }
@property --srx { syntax: '<percentage>'; inherits: false; initial-value: 140%; }
@property --sry { syntax: '<percentage>'; inherits: false; initial-value: 140%; }
@property --dim { syntax: '<number>'; inherits: false; initial-value: 0; }
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

:root {
  --text: #FFFFFF;
  --text2: rgba(255,255,255,.72);
  --text3: rgba(255,255,255,.48);
  --ink: #0B0D16;
  --env: #10121A;
  --glass: rgba(255,255,255,.13);
  --g-brand: linear-gradient(135deg, #FF4D8A 0%, #FF8A3D 100%);
  --g-g: linear-gradient(135deg, #FF5A5F 0%, #FFB020 100%);
  --g-d: linear-gradient(135deg, #3AA8FF 0%, #8A5CFF 100%);
  --g-ok: linear-gradient(135deg, #1DD6A0 0%, #2BC4F0 100%);
  --g-try: linear-gradient(135deg, #FF9A2E 0%, #FFD24A 100%);
  --rainbow: conic-gradient(from var(--spin), #FF4D8A, #FF8A3D, #FFD24A, #1DD6A0, #3AA8FF, #8A5CFF, #FF4D8A);
  --heart: #FF4D8A;
  --ok: #4BE3B4;
  --try: #FFC65C;
  --font: "Figtree", system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --apple: cubic-bezier(.32,.72,0,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121 24%, 1.149 26.3%, 1.159, 1.163, 1.161, 1.154 34.5%, 1.129 38.1%, 1.051 46.4%, 1.017 50.7%, 0.991 55.6%, 0.977 59.6%, 0.975 63.3%, 0.982 68.4%, 1.001 79%, 1.004 85.2%, 1); }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--env); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
svg { display: block; }

/* ---------- la scène autour : la vidéo elle-même, floutée ---------- */
.env { position: fixed; inset: -10%; width: 120%; height: 120%; filter: blur(42px) saturate(1.5) brightness(.8); z-index: 0; }
.env-dim { position: fixed; inset: 0; z-index: 0; background: radial-gradient(70% 60% at 50% 45%, rgba(10,12,20,.10), rgba(10,12,20,.55)), rgba(10,12,20,.22); }

/* ---------- le verre ---------- */
.glass {
  position: relative; background: var(--glass); isolation: isolate;
  backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 32px -12px rgba(0,0,0,.45);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(140deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 38%, rgba(255,255,255,.04) 62%, rgba(255,255,255,.25));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
}

.scene { position: fixed; inset: 0; z-index: 1; }
.win, .cam, .orn, .side, .bin, .deck, .talk { position: absolute; transition: left .75s var(--apple), top .75s var(--apple), width .75s var(--apple), height .75s var(--apple), bottom .75s var(--apple), opacity .4s, transform .6s var(--apple), translate .6s var(--apple), scale .35s var(--spring); }
body.boot .win, body.boot .cam, body.boot .orn, body.boot .side, body.boot .bin, body.boot .deck, body.boot .talk { transition: none; }

/* ---------- la fenêtre ---------- */
.win { border-radius: 34px; overflow: hidden; background: #000; box-shadow: 0 40px 90px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.14); isolation: isolate; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.veil { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .22s ease; z-index: 1; }
.veil.on { opacity: .55; }
.spot { position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(var(--srx) var(--sry) at var(--sx) var(--sy), rgba(0,0,0,0) 0%, rgba(0,0,0,0) 60%, rgba(0,0,0, calc(var(--dim) * .66)) 100%);
  transition: --sx .7s var(--apple), --sy .7s var(--apple), --srx .8s var(--apple), --sry .8s var(--apple), --dim .6s var(--apple); }
.hit { position: absolute; z-index: 2; border-radius: 42% 42% 20% 20%; display: none; }
body[data-turn="you"] .cam.asking .hit { display: block; }
@media (hover: hover) { .cam.asking .hit:hover { box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); background: rgba(255,255,255,.06); } }
.ripple { position: absolute; z-index: 3; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2px solid #fff; pointer-events: none; animation: ripple .7s var(--apple) forwards; }
@keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(4); opacity: 0; } }

/* étiquette posée sur la personne : un point, un fil, le prénom */
.tag { position: absolute; z-index: 4; pointer-events: none; width: 0; height: 0; opacity: 0; transition: opacity .35s; }
.tag.show { opacity: 1; }
.cam.moving .tag.show { opacity: 0; transition: opacity .18s; }
.tag .dot { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.28), 0 2px 8px rgba(0,0,0,.4); transform: scale(0); transition: transform .5s var(--spring); }
.tag .stem { position: absolute; left: -.5px; bottom: 0; width: 1px; height: var(--stem, 34px); background: linear-gradient(rgba(255,255,255,.9), rgba(255,255,255,.4)); transform-origin: bottom; transform: scaleY(0); transition: transform .45s var(--apple) .12s; }
.tag .lab { position: absolute; left: 0; bottom: var(--stem, 34px); transform: translate(calc(-50% + var(--dx, 0px)), -6px) scale(.7); opacity: 0; transition: transform .55s var(--spring) .28s, opacity .3s .28s;
  display: flex; align-items: center; height: 30px; padding: 0 13px; border-radius: 99px; white-space: nowrap; font-weight: 700; font-size: 14.5px;
  background: rgba(16,18,28,.36); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), 0 6px 18px rgba(0,0,0,.3); }
.tag .lab small { font-size: 13px; font-weight: 600; padding-left: 8px; margin-left: 8px; border-left: 1px solid rgba(255,255,255,.25); display: none; color: var(--text2); }
.tag.aged .lab small { display: inline; }
.tag.show .dot { transform: scale(1); }
.tag.show .stem { transform: scaleY(1); }
.tag.show .lab { transform: translate(calc(-50% + var(--dx, 0px)), -6px) scale(1); opacity: 1; }

/* ---------- ce qui est dit : des bulles de verre sur la vidéo ---------- */
.talk { z-index: 6; display: grid; pointer-events: none; --fs: clamp(19px, .55vw + 13px, 24px); }
.talk > * { grid-area: 1 / 1; align-self: end; transition: opacity .3s var(--apple), transform .45s var(--apple); }
.bub {
  background: rgba(22,24,32,.30); backdrop-filter: blur(22px) saturate(1.7); -webkit-backdrop-filter: blur(22px) saturate(1.7);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), inset 0 1px 0 rgba(255,255,255,.2), 0 12px 30px -14px rgba(0,0,0,.55);
  transition: background .35s;
}
/* la question : au centre, la voix de l'appli */
.qb { justify-self: center; max-width: 100%; display: flex; align-items: center; gap: 12px; padding: 7px 20px 7px 7px; border-radius: 99px; pointer-events: auto; }
.qb.empty, .talk.line .qb { opacity: 0; transform: translateY(8px) scale(.96); pointer-events: none; }
.qb[data-mode="ok"] { background: rgba(29,214,160,.26); }
.qb[data-mode="try"] { background: rgba(255,170,40,.26); }
.qt { margin: 0; font-size: var(--fs); font-weight: 700; letter-spacing: -.012em; line-height: 1.15; text-wrap: balance; }
.qt .wd { display: inline-block; transition: opacity .18s linear; }
.qt .wd.hid { opacity: .2; }
.orb { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; isolation: isolate; }
.orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--rainbow); z-index: -2; }
.orb::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: var(--rainbow); filter: blur(10px); opacity: .5; z-index: -3; transition: opacity .4s; }
.orb .core { position: absolute; inset: 2.5px; border-radius: 50%; background: rgba(12,14,22,.85); z-index: -1; transition: inset .35s, background .35s; }
.orb .ic { position: absolute; inset: 0; display: grid; place-items: center; }
.orb svg { width: 17px; height: 17px; color: #fff; }
.qb[data-mode="talk"] .orb::before, .qb[data-mode="talk"] .orb::after { animation: spin 2.2s linear infinite; }
.qb[data-mode="talk"] .orb::after { opacity: .95; }
.qb[data-mode="you"] .orb::after { opacity: .2; }
.qb[data-mode="ok"] .orb .core { background: var(--g-ok); inset: 0; }
.qb[data-mode="try"] .orb .core { background: var(--g-try); inset: 0; }
.qb[data-mode="ok"] .orb::after { background: #1DD6A0; }
.qb[data-mode="try"] .orb::after { background: #FFB020; }
@keyframes spin { to { --spin: 360deg; } }
.bars { display: flex; gap: 2.5px; align-items: center; height: 16px; }
.bars b { width: 3px; border-radius: 3px; background: #fff; height: 35%; animation: eq .9s ease-in-out infinite; }
.bars b:nth-child(2) { animation-delay: -.3s; } .bars b:nth-child(3) { animation-delay: -.6s; } .bars b:nth-child(4) { animation-delay: -.15s; }
@keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }
/* une réplique : Camille à gauche, Kenji à droite, avec son visage */
.lrow { display: flex; align-items: flex-end; gap: 9px; max-width: 100%; opacity: 0; transform: translateY(10px) scale(.96); }
.lrow[data-side="g"] { justify-self: start; transform-origin: left bottom; }
.lrow[data-side="d"] { justify-self: end; flex-direction: row-reverse; transform-origin: right bottom; }
.talk.line .lrow { opacity: 1; transform: none; pointer-events: auto; }
.av { flex: none; width: 38px; height: 38px; border-radius: 50%; object-fit: cover; max-width: none; box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 4px 12px rgba(0,0,0,.35); }
.lb { min-width: 0; padding: 10px 18px 11px; border-radius: 24px; }
.lrow[data-side="g"] .lb { border-bottom-left-radius: 8px; }
.lrow[data-side="d"] .lb { border-bottom-right-radius: 8px; }
.words { display: flex; flex-wrap: wrap; column-gap: .28em; row-gap: .12em; font-size: var(--fs); font-weight: 700; letter-spacing: -.01em; line-height: 1.16; }
.w { position: relative; color: rgba(255,255,255,.42); transition: color .12s linear; cursor: pointer; }
.w.past { color: #fff; }
.w.now { color: #FFD24A; }
.talk.playing .qb { opacity: 0; transform: translateY(8px) scale(.96); pointer-events: none; }

.bigplay { position: absolute; left: 50%; top: 46%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; z-index: 6; display: grid; place-items: center; color: #fff; transition: transform .5s var(--spring), opacity .3s; }
.bigplay:hover { transform: scale(1.06); } .bigplay:active { transform: scale(.94); }
.bigplay.gone { opacity: 0; transform: scale(.5); pointer-events: none; }
.bigplay svg { width: 30px; height: 30px; margin-left: 4px; position: relative; z-index: 2; }

/* ---------- sous la fenêtre : la petite barre ---------- */
.orn { z-index: 7; transform: translateX(-50%); }
.dock { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 6px; border-radius: 99px; }
.dock > * { position: relative; z-index: 2; }
.ico { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; transition: background .2s, transform .3s var(--spring); font-weight: 800; font-size: 15px; }
.ico:hover { background: rgba(255,255,255,.12); }
.ico:active { transform: scale(.88); }
.ico svg { width: 20px; height: 20px; }
.ico[aria-pressed="true"] { background: #fff; color: var(--ink); }
.goslot { display: flex; align-items: center; }
.goslot:empty { display: none; }
.go { flex: none; height: 40px; margin-left: 6px; padding: 0 16px 0 18px; border-radius: 99px; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); font-weight: 700; font-size: 15px;
  box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: transform .35s var(--spring), opacity .3s; animation: pop .5s var(--spring) both; position: relative; z-index: 2; }
.go svg { width: 18px; height: 18px; }
.go:active { transform: scale(.94); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- panneau du geste, à côté de la fenêtre ---------- */
.side { z-index: 6; opacity: 0; pointer-events: none; transform: translateY(-50%) scale(.96); overflow: visible; }
.side.on { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
body.tall .side { transform: translateY(12px) scale(.98); }
body.tall .side.on { transform: none; }
.panel { border-radius: 30px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel > * { position: relative; z-index: 2; }
body[data-turn="listen"] .side, body[data-turn="wait"] .side { pointer-events: none; }

/* ruban des nombres */
.tape { position: relative; height: 92px; border-radius: 20px; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; background: rgba(0,0,0,.18); }
.tape:focus-visible { box-shadow: 0 0 0 2px #fff; }
.tape.grab { cursor: grabbing; }
.tape .num { position: absolute; left: 0; top: 50%; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 22px; color: #fff; will-change: transform, opacity; }
.tape .num.c { font-weight: 800; }
.tape::before, .tape::after { content: ""; position: absolute; top: 0; bottom: 0; width: 26%; z-index: 2; pointer-events: none; }
.tape::before { left: 0; background: linear-gradient(90deg, rgba(20,22,32,.55), rgba(20,22,32,0)); }
.tape::after { right: 0; background: linear-gradient(270deg, rgba(20,22,32,.55), rgba(20,22,32,0)); }
.tape .notch { position: absolute; left: 50%; bottom: 10px; width: 24px; height: 4px; margin-left: -12px; border-radius: 4px; background: #fff; z-index: 3; transition: width .4s var(--spring), margin .4s var(--spring), background .3s; }
.tape.right .notch { background: var(--ok); width: 44px; margin-left: -22px; }
.tape.right .num.c { color: var(--ok); }
.punit { margin: -4px 0 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--text2); }
.shake { animation: shake .5s var(--apple); }
@keyframes shake { 15% { transform: translateX(-9px); } 35% { transform: translateX(7px); } 55% { transform: translateX(-4px); } 75% { transform: translateX(2px); } }

/* trier : « il n'aime pas » à gauche de la vidéo, « il aime » à droite, la carte au milieu */
.bin { z-index: 6; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 26px 14px 22px; text-align: center;
  opacity: 0; pointer-events: none; transform: translateY(-50%); }
.bin.no { translate: -18px 0; } .bin.yes { translate: 18px 0; }
.bin.on { opacity: 1; translate: 0 0; pointer-events: auto; }
body[data-turn="listen"] .bin, body[data-turn="wait"] .bin { pointer-events: none; }
.bin > * { position: relative; z-index: 2; }
.bin .bic { width: 46px; height: 46px; }
.bin.no .bic { color: #B9A8FF; } .bin.yes .bic { color: var(--heart); }
.bin .bl { font-weight: 700; font-size: 17px; line-height: 1.15; }
.bin .got { display: flex; gap: 6px; min-height: 40px; align-items: center; justify-content: center; }
.bin .mini { width: 40px; height: 40px; border-radius: 12px; background: #fff; display: grid; place-items: center; color: var(--ink); box-shadow: 0 4px 12px rgba(0,0,0,.3); animation: pop .55s var(--spring) both; }
.bin .mini svg { width: 30px; height: 30px; }
.bin.hot { scale: 1.06; }
.bin.yes.hot { background: rgba(255,77,138,.30); }
.bin.no.hot { background: rgba(140,110,255,.30); }
.deck { z-index: 8; transform: translate(-50%, -50%); width: 132px; height: 146px; pointer-events: none; }
.deck:empty { display: none; }
.deck .card { pointer-events: auto; }
.card { position: relative; width: 132px; height: 146px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; will-change: transform;
  background: rgba(255,255,255,.95); color: var(--ink); box-shadow: 0 22px 50px -14px rgba(0,0,0,.65); }
.card .pic { width: 78px; height: 78px; display: grid; place-items: center; }
.card .pic svg { width: 66px; height: 66px; }
.card[data-id="cook"] .pic { color: #F06A1F; }
.card[data-id="noise"] .pic { color: #6D44E8; }
.card .word { font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.card .ear { position: absolute; top: 9px; right: 9px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #EEF0FF; color: #5B57F0; }
.card .ear svg { width: 14px; height: 14px; }
.card.spring { transition: transform .55s var(--spring); }

/* fiches de fin */
.cast { display: flex; flex-direction: column; gap: 8px; }
.fiche { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border-radius: 22px; background: rgba(255,255,255,.07); }
.fiche .portrait { width: 58px; height: 58px; border-radius: 18px; padding: 2px; }
.fiche[data-side="g"] .portrait { background: var(--g-g); }
.fiche[data-side="d"] .portrait { background: var(--g-d); }
.fiche .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 16px; max-width: none; }
.fiche .who { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.fiche .name { font-weight: 800; font-size: 18px; line-height: 1; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 8px; border-radius: 99px; font-weight: 600; font-size: 14px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: transform .3s var(--spring), background .2s; }
.fact:hover { background: rgba(255,255,255,.2); }
.fact:active { transform: scale(.93); }
.fact svg { width: 16px; height: 16px; flex: none; }
.fact.yes svg { color: var(--heart); } .fact.no svg { color: #B9A8FF; } .fact.quote svg, .fact.age svg { color: #9FD0FF; }
.flyer { position: fixed; z-index: 50; object-fit: cover; pointer-events: none; border-radius: 6px; max-width: none; }

.ghost { position: fixed; z-index: 60; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(255,255,255,1) 0 30%, rgba(255,255,255,.35) 32% 100%); box-shadow: 0 0 0 1px rgba(255,255,255,.6), 0 8px 22px rgba(0,0,0,.35); }

/* ---------- téléphone tenu droit, téléphone couché ---------- */
body.tall .talk { --fs: 18px; }
body.tall .win { border-radius: 28px; }
body.tall .orb { width: 30px; height: 30px; }
body.tall .orb svg { width: 15px; height: 15px; }
body.tall .qb { gap: 10px; padding: 6px 16px 6px 6px; }
body.tall .lb { padding: 8px 14px 9px; border-radius: 20px; }
body.tall .av { width: 32px; height: 32px; }
body.tall .bin { transform: translateY(-50%); padding: 10px 8px; gap: 6px; border-radius: 24px; }
body.tall .bin .bic { width: 30px; height: 30px; }
body.tall .bin .bl { font-size: 14px; }
body.tall .bin .got { min-height: 30px; }
body.tall .bin .mini { width: 30px; height: 30px; border-radius: 9px; } body.tall .bin .mini svg { width: 22px; height: 22px; }
body.compact .talk { --fs: 17px; }
body.compact .tape { height: 70px; }
body.compact .deck, body.compact .card { width: 100px; height: 108px; } body.compact .card { border-radius: 20px; } body.compact .card .pic { width: 52px; height: 52px; } body.compact .card .pic svg { width: 44px; height: 44px; } body.compact .card .word { font-size: 16px; }

window.SCENARIO = (() => {
  const SVG = {
    pommes: '<svg viewBox="0 0 48 48"><path d="M24 15c-4-3-12-3-14 5-2 9 4 21 10 21 2 0 3-1 4-1s2 1 4 1c6 0 12-12 10-21-2-8-10-8-14-5z" fill="#E5383B"/><path d="M24 15c0-4 1-7 4-9" stroke="#6B4226" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M26 11c4-3 8-2 9 0-3 3-7 3-9 0z" fill="#3FA34D"/><ellipse cx="16" cy="22" rx="2.5" ry="4.5" fill="#fff" opacity=".35"/></svg>',
    pain: '<svg viewBox="0 0 48 48"><path d="M9 34C5 30 27 10 34 9c5-1 8 2 6 6C38 22 17 40 13 38z" fill="#D9A15B"/><path d="M17 28l4 2M22 23l4 2M27 18l4 2M32 14l3 1.5" stroke="#B5762F" stroke-width="2.4" stroke-linecap="round"/></svg>',
  };
  /* les produits de la boutique, repérés sur l'image où la vidéo s'arrête (9,2 s), en % */
  const PROD = [
    { id: 'pommes', nom: 'des pommes', ok: true, zones: [{ x: 0, y: 59, w: 12, h: 11 }, { x: 21, y: 92, w: 27, h: 8 }, { x: 82, y: 56, w: 7, h: 10 }] },
    { id: 'pain', nom: 'du pain', ok: true, zones: [{ x: 56, y: 54, w: 8, h: 10 }, { x: 44, y: 55, w: 7, h: 12 }] },
    { id: 'confiture', nom: 'de la confiture', pas: 'Pas de confiture.', zones: [{ x: 0, y: 4, w: 18, h: 38 }] },
    { id: 'vin', nom: 'du vin', pas: 'Pas de vin.', zones: [{ x: 40, y: 13, w: 17, h: 32 }] },
    { id: 'legumes', nom: 'des légumes', pas: 'Pas de légumes.', zones: [{ x: 6, y: 52, w: 9, h: 9 }, { x: 34, y: 52, w: 9, h: 9 }] },
    { id: 'oranges', nom: 'des oranges', pas: "Pas d'oranges.", zones: [{ x: 86, y: 78, w: 10, h: 10 }] },
  ];
  const SAC = { x: 40, y: 81 };     // le sac en papier, sur le comptoir
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const euros = v => (Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ','));
  return {
    plans: [{ de: 0, cx: { vendeur: .25, cliente: .72 } }, { de: 4.17, cx: { vendeur: .35, cliente: .6 } }, { de: 5.42, cx: { vendeur: .25, cliente: .72 } }],
    ordre: ['sac', 'payer'],
    etapes: A => {
      const { $, $$, NB, state, alive, Q, yourTurn, setTurn, WIDE, playSegment, phrase, side, idle, tapHere, sfx, fly, faux, juste, suite, goBtn, zones, cam, avant, cadreZone, marque } = A;
      PROD[0].seg = phrase('je voudrais un kilo de pommes'); PROD[1].seg = phrase('oui je voudrais du pain');
      const ACHATS = [PROD[0].seg[0], PROD[1].seg[1]];
      const PRIX = phrase('cela fait cinq euros'), SEG_PRIX = [phrase('combien ça coûte')[0], PRIX[1]];
      return {
        /* 1 · dans la boutique : toucher ce qu'elle achète, ça vole dans le sac en papier du comptoir */
        async sac(f) {
          let sac;
          const ZL = PROD.flatMap(p => p.zones.map((z, k) => ({ ...z, id: p.id + '-' + k, label: p.nom, p })));
          const pris = new Set(), reste = () => PROD.filter(p => p.ok && !pris.has(p.id));
          const ask = () => { Q.show('you', state.ask); yourTurn(); cam.classList.add('asking'); idle.set(tapHere($('.hit[data-id="vin-0"]', cam)), 5000); };
          if (!await avant(f, {
            question: "Qu'est-ce que la cliente achète" + NB + '?', seg: ACHATS, consigne: "Dans la boutique, clique sur ce qu'elle achète.",
            monte: () => { sac = document.createElement('div'); sac.className = 'surimage sacv'; Object.assign(sac.style, { left: SAC.x + '%', top: SAC.y + '%' }); cam.append(sac); },
          })) return;
          state.replay = async () => { setTurn('listen'); cam.classList.remove('asking'); await playSegment(ACHATS[0], ACHATS[1], WIDE); if (alive(f)) ask(); };
          zones(ZL, async (id, ev, z) => {
            setTurn('wait'); cam.classList.remove('asking');
            const p = z.p;
            if (p.ok && pris.has(p.id)) { Q.show('you', cap(p.nom) + NB + ': déjà dans le sac.'); setTimeout(() => { if (alive(f)) ask(); }, 900); return; }
            if (p.ok) {
              pris.add(p.id); sfx.tick();
              $$(`.hit[data-id^="${p.id}-"]`, cam).forEach(h => h.classList.remove('indice'));
              const c = cadreZone(z); p.zones.filter(x => x !== p.zones[+id.split('-')[1]]).forEach(x => cadreZone(x)); marque(z, cap(p.nom), 'juste');
              await fly(c, sac, `<div class="mini" style="width:100%;height:100%;border-radius:50%">${SVG[p.id]}</div>`, { scale: .3 });
              sac.insertAdjacentHTML('beforeend', `<span class="mini">${SVG[p.id]}</span>`);
              if (!await juste(f, 'Oui' + NB + '! ' + cap(p.nom) + '.', p.seg)) return;
              if (reste().length) ask();
              else { zones(null); Q.show('ok', 'Oui' + NB + '! Des pommes et du pain.'); suite(); }
            } else {
              cadreZone(z, 'faux'); marque(z, cap(p.nom), 'faux');
              const montrer = await faux(f, ACHATS, p.pas + ' Écoute encore.'); if (montrer === null) return;
              if (montrer) reste().forEach(x => $$(`.hit[data-id^="${x.id}-"]`, cam).forEach(h => h.classList.add('indice')));
              ask();
            }
          });
          ask();
        },

        /* 2 · payer : le vendeur redit le prix (la vidéo resserrée sur lui), on pose l'argent sur le comptoir */
        async payer(f) {
          let total = 0;
          const MONNAIE = [{ v: .5, c: 'piece', t: '50' + NB + 'c' }, { v: 1, c: 'piece blanche', t: '1' + NB + '€' }, { v: 2, c: 'piece deux', t: '2' + NB + '€' }, { v: 5, c: 'billet cinq', t: '5' + NB + '€' }, { v: 10, c: 'billet dix', t: '10' + NB + '€' }];
          const argent = (m, k) => `<button class="argent ${m.c}" data-v="${m.v}" data-k="${k}" aria-label="${m.t}">${m.t}</button>`;
          const maj = () => { total = Math.round([...$$('#posees .argent', side)].reduce((s, b) => s + +b.dataset.v, 0) * 100) / 100; $('#somme').textContent = euros(total); };
          const poser = k => {
            const box = document.createElement('div'); box.innerHTML = argent(MONNAIE[k], k); const b = box.firstChild;
            $('#posees').append(b); maj();
            b.addEventListener('click', () => { if (document.body.dataset.turn !== 'you') return; sfx.tick(); b.remove(); maj(); });
          };
          const ask = () => { Q.show('you', state.ask); goBtn('check', 'Payer', valider); yourTurn(); idle.set(tapHere($('.bourse .argent', side)), 5000); };
          if (!await avant(f, {
            question: 'Combien ça coûte' + NB + '?', qui: 'vendeur', seg: SEG_PRIX, sideW: 400, consigne: "Pose l'argent, puis clique sur Payer.",
            panneau: `<div class="panel glass"><p class="ptitre">Pose l'argent sur le comptoir</p>
              <div class="plateau" id="plateau"><div class="somme"><span id="somme">0</span><small>€</small></div><div class="posees" id="posees"></div></div>
              <div class="bourse">${MONNAIE.map(argent).join('')}</div></div>`,
            monte: p => $$('.bourse .argent', p).forEach(b => b.addEventListener('click', () => {
              if (document.body.dataset.turn !== 'you') return;
              A.unlock(); idle.reset(); sfx.coin(); poser(+b.dataset.k);
            })),
          })) return;
          state.replay = async () => { setTurn('listen'); goBtn(null); await playSegment(SEG_PRIX[0], SEG_PRIX[1], WIDE); if (alive(f)) ask(); };
          async function valider() {
            if (document.body.dataset.turn !== 'you') return;
            if (!total) { Q.show('you', "Pose l'argent sur le comptoir."); return; }
            setTurn('wait'); goBtn(null); idle.clear();
            if (total === 5) {
              $('#plateau').classList.add('juste');
              if (!await juste(f, 'Oui' + NB + '! Ça fait cinq euros.', PRIX)) return;
              suite();
            } else {
              const pl = $('#plateau'); pl.classList.remove('shake'); void pl.offsetWidth; pl.classList.add('shake');
              const montrer = await faux(f, SEG_PRIX, 'Pas ' + euros(total) + NB + '€. Écoute encore.'); if (montrer === null) return;
              if (montrer) {
                $('#posees').innerHTML = ''; poser(3); $('#plateau').classList.add('juste');
                Q.show('ok', 'Ça fait cinq euros.'); state.essais = 0; suite();
              } else ask();
            }
          }
          ask();
        },
      };
    },
    bilan: A => ({
      faits: {
        vendeur: [{ text: 'Vous désirez quoi' + A.NB + '?', seg: A.ligne(2) }, { text: 'Cela fait cinq euros.', seg: A.ligne(8) }],
        cliente: [{ text: 'un kilo de pommes', seg: A.phrase('un kilo de pommes') }, { text: 'du pain', seg: A.phrase('du pain') }, { text: 'Combien ça coûte' + A.NB + '?', seg: A.ligne(7) }],
      },
    }),
  };
})();

</script>
<script>
/* Vidéos interactives : le moteur du prototype « La colocation de Kenji », rendu commun à toutes les vidéos.
   Chaque page charge ses données (donnees/<id>.js : répliques calées mot à mot, personnes, consignes enregistrées),
   son scénario (window.SCENARIO : les étapes, avec leurs gestes propres) puis ce moteur.
   Toujours pareil : on regarde d'abord la scène entière ; on répond en agissant ; la preuve, c'est la vidéo (on réentend
   le passage) ; l'erreur ne bloque jamais (« Écoute encore », puis la réponse) ; les aides restent là (réécouter, les
   mots, plus lentement) ; un doigt fantôme montre le geste ; un bilan reprend ce qu'on a compris. */
(() => {
  'use strict';
  const DON = window.DONNEES, SC = window.SCENARIO;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const NB = ' ';
  document.title = DON.titre;
  document.body.classList.add('boot');

  /* ================= la page ================= */
  const PEOPLE = DON.people;
  document.body.insertAdjacentHTML('beforeend', `
<canvas class="env" id="amb" width="64" height="36" aria-hidden="true"></canvas>
<div class="env-dim" aria-hidden="true"></div>
<a class="retour glass" href="${SC.retour || '../index.html#videos'}" aria-label="Retour aux vidéos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M11 6l-6 6 6 6"/></svg></a>
<div class="scene" id="scene">
  <div class="win" id="win">
    <div class="cam" id="cam">
      <video id="vid" playsinline preload="auto" poster="${DON.poster}"><source src="${DON.video}" type="video/mp4"></video>
      <div class="veil" id="veil"></div>
      <div class="spot" id="spot"></div>
      ${Object.entries(PEOPLE).map(([k, p]) => `<div class="tag" data-p="${k}"><span class="stem"></span><span class="dot"></span><span class="lab">${p.name}<small></small></span></div>`).join('')}
    </div>
    <button class="bigplay glass" id="bigplay" aria-label="Regarder la scène"><svg viewBox="0 0 30 34" aria-hidden="true"><path d="M4 3.5v27a2 2 0 0 0 3 1.7l20-13.5a2 2 0 0 0 0-3.4L7 1.8A2 2 0 0 0 4 3.5Z" fill="currentColor"/></svg></button>
  </div>
  <div class="talk" id="talk" aria-live="polite">
    <div class="qb bub empty" id="qb" data-mode="you"><button class="orb" id="orb" aria-label="Réécouter la question"><span class="core"></span><span class="ic" id="orbIc"></span></button><p class="qt" id="qt"></p></div>
    <div class="lrow" id="lrow" data-side="g" aria-hidden="true"><img class="av" id="lav" src="" alt=""><div class="lb bub" id="lb"><span class="words" id="lwords"></span></div></div>
  </div>
  <div class="orn glass dock" id="dock">
    <button class="ico" id="replayBtn" aria-label="Réécouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    <button class="ico" id="ccBtn" aria-pressed="false" aria-label="Afficher les mots" title="Les mots">Aa</button>
    <button class="ico" id="slowBtn" aria-pressed="false" aria-label="Plus lentement" title="Plus lentement"><svg viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16h17.5a3 3 0 0 0 3-3V9"/><path d="M5 16a6.5 6.5 0 1 1 13 0"/><path d="M11.5 16a2.6 2.6 0 0 1 0-5.2 1.6 1.6 0 0 1 0 3.2"/><path d="M21 9.5 20 4.5M24 9.5l1-4.6"/></svg></button>
    <span id="goSlot" class="goslot"></span>
  </div>
  <aside class="side" id="side"></aside>
  <button class="bin no glass" id="binNo" data-side="no"></button>
  <button class="bin yes glass" id="binYes" data-side="yes"></button>
  <div class="deck" id="deck"></div>
</div>
<div class="ghost" id="ghost" aria-hidden="true"></div>`);

  /* ================= la scène ================= */
  const LINES = DON.lines.map(L => ({ ...L, words: L.words.map(([t, s, e]) => ({ t, s, e })) }));
  const WIDE = DON.gel;
  const CROPS = { full: { a: 16 / 9, h: 1, cx: .5, cy: .5 }, fullTall: { a: 4 / 3, h: 1, cx: .5, cy: .5 }, ...(SC.crops || {}) };
  /* un passage de la vidéo retrouvé par ses mots : phrase('un kilo de pommes') → [début, fin] */
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
  const ALLW = LINES.flatMap(L => L.words.map(w => ({ ...w, n: norm(w.t) })));
  function phrase(txt, avant = .06, apres = .12) {
    const q = norm(txt).split(' ');
    for (let i = 0; i + q.length <= ALLW.length; i++) if (q.every((m, k) => ALLW[i + k].n === m)) return [Math.max(0, ALLW[i].s - avant), ALLW[i + q.length - 1].e + apres];
    console.warn('phrase introuvable :', txt); return [0, 1];
  }
  const ligne = i => [LINES[i].s - .05, LINES[i].e + .12];

  /* ================= éléments et état ================= */
  const vid = $('#vid'), win = $('#win'), cam = $('#cam'), veil = $('#veil'), spot = $('#spot'), bigplay = $('#bigplay');
  const talk = $('#talk'), qb = $('#qb'), orbIc = $('#orbIc'), qt = $('#qt'), lrow = $('#lrow'), lav = $('#lav'), lwords = $('#lwords');
  const dock = $('#dock'), side = $('#side'), goSlot = $('#goSlot'), ghost = $('#ghost'), amb = $('#amb');
  const binNo = $('#binNo'), binYes = $('#binYes'), deck = $('#deck');
  const ccBtn = $('#ccBtn'), slowBtn = $('#slowBtn'), replayBtn = $('#replayBtn');
  const state = { step: 'intro', cc: false, slow: false, lineView: false, crop: CROPS.full, sideOn: false, split: false, essais: 0 };
  let flow = 0;
  const alive = f => f === flow;

  /* ================= mise en place : fenêtre, barre, panneau, cases ================= */
  function layout() {
    const Wd = innerWidth, Hd = innerHeight, wide = Wd / Hd >= 1.1, short = wide && Hd < 520, compact = !wide && Hd < 740;
    const B = document.body; B.classList.toggle('wide', wide); B.classList.toggle('tall', !wide); B.classList.toggle('short', short); B.classList.toggle('compact', compact);
    let c = (!wide && state.crop === CROPS.full) ? CROPS.fullTall : state.crop;
    if (!wide && c.qui) c = { ...c, a: 1.2 };
    if (short && c.a < 1.3) c = { ...c, a: 1.3 };
    const sideOn = state.sideOn, split = state.split;
    const dockH = short ? 46 : 52, dockGap = short ? 10 : 16;
    let wx, wy, ww, wh;
    if (wide) {
      const vm = short ? 12 : 36, pad = short ? 14 : 32, gap = (sideOn || split) ? (short ? 14 : 28) : 0;
      const sw = sideOn ? Math.min(short ? 230 : (state.sideW || 320), Wd * ((state.sideW || 320) > 400 ? .4 : .32)) : split ? Math.min(short ? 140 : 210, Wd * .18) : 0;
      const extra = sideOn ? sw + gap : split ? 2 * (sw + gap) : 0;
      const aw = Wd - pad * 2 - extra, ah = Hd - vm * 2 - dockGap - dockH;
      wh = Math.min(ah, aw / c.a); ww = wh * c.a;
      const gx = (Wd - ww - extra) / 2;
      wx = split ? gx + sw + gap : gx; wy = (Hd - (wh + dockGap + dockH)) / 2;
      Object.assign(side.style, { left: wx + ww + gap + 'px', top: wy + wh / 2 + 'px', width: (sideOn ? sw : Math.min(320, Wd * .3)) + 'px' });
      const bw = split ? sw : Math.min(210, Wd * .18);
      const yc = wy + wh * (short ? .46 : .56);
      Object.assign(binNo.style, { left: wx - gap - bw + 'px', top: yc + 'px', width: bw + 'px', height: '' });
      Object.assign(binYes.style, { left: wx + ww + gap + 'px', top: yc + 'px', width: bw + 'px', height: '' });
      Object.assign(deck.style, { left: wx + ww / 2 + 'px', top: yc + 'px' });
    } else {
      const pad = 12, top = Math.max(14, Math.round(Hd * .04)) + 44;
      const sideH = sideOn && side.firstElementChild ? side.firstElementChild.offsetHeight : 0, rowH = compact ? 118 : 156;
      const below = sideOn ? sideH + 12 : split ? rowH + 12 : 0;
      ww = Wd - pad * 2; wh = ww / c.a;
      const maxH = Hd - top - dockGap - dockH - below - 14;
      if (wh > maxH) { wh = Math.max(150, maxH); ww = Math.min(Wd - pad * 2, wh * c.a); }
      wx = (Wd - ww) / 2; wy = Math.max(top, Math.round((Hd - (wh + dockGap + dockH + below)) / 2));
      const yBelow = wy + wh + dockGap + dockH + 12;
      Object.assign(side.style, { left: pad + 'px', width: Wd - pad * 2 + 'px', top: yBelow + 'px' });
      const cw = compact ? 100 : 132, bw = (Wd - pad * 2 - cw - 20) / 2, yc = yBelow + rowH / 2;
      Object.assign(binNo.style, { left: pad + 'px', top: yc + 'px', width: bw + 'px', height: rowH + 'px' });
      Object.assign(binYes.style, { left: Wd - pad - bw + 'px', top: yc + 'px', width: bw + 'px', height: rowH + 'px' });
      Object.assign(deck.style, { left: Wd / 2 + 'px', top: yc + 'px' });
    }
    Object.assign(win.style, { left: wx + 'px', top: wy + 'px', width: ww + 'px', height: wh + 'px' });
    const Vh = wh / c.h, Vw = Vh * 16 / 9;
    const cl = Math.min(0, Math.max(ww - Vw, ww / 2 - c.cx * Vw)), ct = Math.min(0, Math.max(wh - Vh, wh / 2 - c.cy * Vh));
    Object.assign(cam.style, { left: cl + 'px', top: ct + 'px', width: Vw + 'px', height: Vh + 'px' });
    $$('.tag').forEach(t => { const lab = $('.lab', t), half = (lab.offsetWidth || 90) / 2, ax = cl + parseFloat(t.style.left || 0) / 100 * Vw;
      t.style.setProperty('--dx', Math.max(0, 10 - (ax - half)) - Math.max(0, ax + half - (ww - 10)) + 'px'); });
    const inset = short ? 10 : wide ? 18 : 10;
    Object.assign(talk.style, { left: wx + inset + 'px', width: ww - inset * 2 + 'px', bottom: Hd - (wy + wh) + inset + 'px' });
    Object.assign(dock.style, { left: wx + ww / 2 + 'px', top: wy + wh + dockGap + 'px' });
  }
  function frameTo(crop, sideOn, sideW) { state.crop = crop; state.focus = crop.qui || null; state.sideOn = sideOn; state.sideW = sideW; layout(); side.classList.toggle('on', sideOn && side.children.length > 0); }
  /* resserrer la vidéo sur une personne, comme sur Kenji ; SC.plans dit où elle est dans chaque plan (les coupes de la vidéo) */
  const PLANS = (SC.plans || [{ de: 0 }]).slice().sort((a, b) => a.de - b.de);
  function cadre(qui, t) { let p = PLANS[0]; for (const x of PLANS) if (t >= x.de - .01) p = x; const cx = p.cx && p.cx[qui] != null ? p.cx[qui] : .5; return { a: SC.serre || .82, h: 1, cx, cy: .5, qui }; }
  function focus(qui, sideOn, sideW) { frameTo(qui ? cadre(qui, vid.currentTime) : CROPS.full, sideOn, sideW); }
  addEventListener('resize', () => { document.body.classList.add('boot'); layout(); requestAnimationFrame(() => document.body.classList.remove('boot')); idle.reset(); });

  /* ================= médias : une seule voix à la fois ================= */
  const SRC = DON.video;
  const voice = new Audio(SRC); voice.preload = 'auto';
  const CLIPS = DON.clips;
  const plainSp = t => t.replace(/[  ]/g, ' ');
  const CLIPSN = {}; for (const [t, c] of Object.entries(CLIPS)) { c.el = new Audio(c.src); c.el.preload = 'auto'; CLIPSN[plainSp(t)] = c; }
  const clipFor = t => CLIPSN[plainSp(t)] || null;
  vid.addEventListener('loadedmetadata', async () => {
    if (vid.seekable.length && vid.seekable.end(0) >= vid.duration - .5) return;
    try { const url = URL.createObjectURL(await (await fetch(SRC)).blob()); const t = vid.currentTime; vid.src = url; voice.src = url; vid.load(); seek(vid, t); } catch (e) {}
  }, { once: true });
  let unlocked = false;
  function unlock() {
    if (unlocked) return; unlocked = true;
    voice.muted = true; const p = voice.play(); if (p && p.then) p.then(() => { voice.pause(); voice.muted = false; }).catch(() => { voice.muted = false; });
    for (const c of Object.values(CLIPS)) {
      const a = c.el; a.muted = true; const q = a.play();
      if (q && q.then) q.then(() => { if (a.muted) { a.pause(); try { a.currentTime = 0; } catch (e) {} } a.muted = false; }).catch(() => { a.muted = false; });
    }
    audioCtx();
  }
  let media = 0;
  function stopAll() { media++; vid.pause(); voice.pause(); for (const c of Object.values(CLIPS)) c.el.pause(); if ('speechSynthesis' in window) try { speechSynthesis.cancel(); } catch (e) {} }
  function seek(el, t) {
    return new Promise(res => {
      if (Math.abs(el.currentTime - t) < .02) return res();
      let done = false; const fin = () => { if (done) return; done = true; el.removeEventListener('seeked', fin); res(); };
      el.addEventListener('seeked', fin); try { el.currentTime = t; } catch (e) {} setTimeout(fin, 800);
    });
  }
  async function freeze(t) {
    stopAll();
    if (Math.abs(vid.currentTime - t) > .3) { veil.classList.add('on'); await seek(vid, t); requestAnimationFrame(() => veil.classList.remove('on')); }

  if ([...ORDRE, 'end'].includes(start)) { bigplay.classList.add('gone'); go(start); } else go('intro');
