<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>À la réception de l'hôtel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Vidéos interactives : le design du prototype « La colocation de Kenji » (version 4), repris tel quel et rendu commun
   à toutes les vidéos (deux personnes : à gauche « g », à droite « d »). Les gestes propres à chaque vidéo sont à la fin. */
/* Version 4, allégée : la vidéo est une fenêtre posée dans sa propre scène, floutée tout autour.
   Ce qui est dit apparaît en bulles de verre SUR la vidéo : la question au centre, Camille à gauche,
   Kenji à droite. Sous la fenêtre, une petite barre (réécouter, mots, lent, le bouton blanc).
   Le geste vit à côté de la vidéo : le ruban des nombres à droite, « il n'aime pas » à gauche et
   « il aime » à droite pour trier les cartes. Plus d'étapes écrites, plus de frise de la voix. */
@property --sx  { syntax: '<percentage>'; inherits: false; initial-value: 50%; }
@property --sy  { syntax: '<percentage>'; inherits: false; initial-value: 50%; }
@property --srx { syntax: '<percentage>'; inherits: false; initial-value: 140%; }
@property --sry { syntax: '<percentage>'; inherits: false; initial-value: 140%; }
@property --dim { syntax: '<number>'; inherits: false; initial-value: 0; }
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

:root {
  --text: #FFFFFF;
  --text2: rgba(255,255,255,.72);
  --text3: rgba(255,255,255,.48);
  --ink: #0B0D16;
  --env: #10121A;
  --glass: rgba(255,255,255,.13);
  --g-brand: linear-gradient(135deg, #FF4D8A 0%, #FF8A3D 100%);
  --g-g: linear-gradient(135deg, #FF5A5F 0%, #FFB020 100%);
  --g-d: linear-gradient(135deg, #3AA8FF 0%, #8A5CFF 100%);
  --g-ok: linear-gradient(135deg, #1DD6A0 0%, #2BC4F0 100%);
  --g-try: linear-gradient(135deg, #FF9A2E 0%, #FFD24A 100%);
  --rainbow: conic-gradient(from var(--spin), #FF4D8A, #FF8A3D, #FFD24A, #1DD6A0, #3AA8FF, #8A5CFF, #FF4D8A);
  --heart: #FF4D8A;
  --ok: #4BE3B4;
  --try: #FFC65C;
  --font: "Figtree", system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --apple: cubic-bezier(.32,.72,0,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121 24%, 1.149 26.3%, 1.159, 1.163, 1.161, 1.154 34.5%, 1.129 38.1%, 1.051 46.4%, 1.017 50.7%, 0.991 55.6%, 0.977 59.6%, 0.975 63.3%, 0.982 68.4%, 1.001 79%, 1.004 85.2%, 1); }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--env); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
svg { display: block; }

/* ---------- la scène autour : la vidéo elle-même, floutée ---------- */
.env { position: fixed; inset: -10%; width: 120%; height: 120%; filter: blur(42px) saturate(1.5) brightness(.8); z-index: 0; }
.env-dim { position: fixed; inset: 0; z-index: 0; background: radial-gradient(70% 60% at 50% 45%, rgba(10,12,20,.10), rgba(10,12,20,.55)), rgba(10,12,20,.22); }

/* ---------- le verre ---------- */
.glass {
  position: relative; background: var(--glass); isolation: isolate;
  backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 32px -12px rgba(0,0,0,.45);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(140deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 38%, rgba(255,255,255,.04) 62%, rgba(255,255,255,.25));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
}

.scene { position: fixed; inset: 0; z-index: 1; }
.win, .cam, .orn, .side, .bin, .deck, .talk { position: absolute; transition: left .75s var(--apple), top .75s var(--apple), width .75s var(--apple), height .75s var(--apple), bottom .75s var(--apple), opacity .4s, transform .6s var(--apple), translate .6s var(--apple), scale .35s var(--spring); }
body.boot .win, body.boot .cam, body.boot .orn, body.boot .side, body.boot .bin, body.boot .deck, body.boot .talk { transition: none; }

/* ---------- la fenêtre ---------- */
.win { border-radius: 34px; overflow: hidden; background: #000; box-shadow: 0 40px 90px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.14); isolation: isolate; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.veil { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .22s ease; z-index: 1; }
.veil.on { opacity: .55; }
.spot { position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(var(--srx) var(--sry) at var(--sx) var(--sy), rgba(0,0,0,0) 0%, rgba(0,0,0,0) 60%, rgba(0,0,0, calc(var(--dim) * .66)) 100%);
  transition: --sx .7s var(--apple), --sy .7s var(--apple), --srx .8s var(--apple), --sry .8s var(--apple), --dim .6s var(--apple); }
.hit { position: absolute; z-index: 2; border-radius: 42% 42% 20% 20%; display: none; }
body[data-turn="you"] .cam.asking .hit { display: block; }
@media (hover: hover) { .cam.asking .hit:hover { box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); background: rgba(255,255,255,.06); } }
.ripple { position: absolute; z-index: 3; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2px solid #fff; pointer-events: none; animation: ripple .7s var(--apple) forwards; }
@keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(4); opacity: 0; } }

/* étiquette posée sur la personne : un point, un fil, le prénom */
.tag { position: absolute; z-index: 4; pointer-events: none; width: 0; height: 0; opacity: 0; transition: opacity .35s; }
.tag.show { opacity: 1; }
.cam.moving .tag.show { opacity: 0; transition: opacity .18s; }
.tag .dot { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.28), 0 2px 8px rgba(0,0,0,.4); transform: scale(0); transition: transform .5s var(--spring); }
.tag .stem { position: absolute; left: -.5px; bottom: 0; width: 1px; height: var(--stem, 34px); background: linear-gradient(rgba(255,255,255,.9), rgba(255,255,255,.4)); transform-origin: bottom; transform: scaleY(0); transition: transform .45s var(--apple) .12s; }
.tag .lab { position: absolute; left: 0; bottom: var(--stem, 34px); transform: translate(calc(-50% + var(--dx, 0px)), -6px) scale(.7); opacity: 0; transition: transform .55s var(--spring) .28s, opacity .3s .28s;
  display: flex; align-items: center; height: 30px; padding: 0 13px; border-radius: 99px; white-space: nowrap; font-weight: 700; font-size: 14.5px;
  background: rgba(16,18,28,.36); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), 0 6px 18px rgba(0,0,0,.3); }
.tag .lab small { font-size: 13px; font-weight: 600; padding-left: 8px; margin-left: 8px; border-left: 1px solid rgba(255,255,255,.25); display: none; color: var(--text2); }
.tag.aged .lab small { display: inline; }
.tag.show .dot { transform: scale(1); }
.tag.show .stem { transform: scaleY(1); }
.tag.show .lab { transform: translate(calc(-50% + var(--dx, 0px)), -6px) scale(1); opacity: 1; }

/* ---------- ce qui est dit : des bulles de verre sur la vidéo ---------- */
.talk { z-index: 6; display: grid; pointer-events: none; --fs: clamp(19px, .55vw + 13px, 24px); }
.talk > * { grid-area: 1 / 1; align-self: end; transition: opacity .3s var(--apple), transform .45s var(--apple); }
.bub {
  background: rgba(22,24,32,.30); backdrop-filter: blur(22px) saturate(1.7); -webkit-backdrop-filter: blur(22px) saturate(1.7);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), inset 0 1px 0 rgba(255,255,255,.2), 0 12px 30px -14px rgba(0,0,0,.55);
  transition: background .35s;
}
/* la question : au centre, la voix de l'appli */
.qb { justify-self: center; max-width: 100%; display: flex; align-items: center; gap: 12px; padding: 7px 20px 7px 7px; border-radius: 99px; pointer-events: auto; }
.qb.empty, .talk.line .qb { opacity: 0; transform: translateY(8px) scale(.96); pointer-events: none; }
.qb[data-mode="ok"] { background: rgba(29,214,160,.26); }
.qb[data-mode="try"] { background: rgba(255,170,40,.26); }
.qt { margin: 0; font-size: var(--fs); font-weight: 700; letter-spacing: -.012em; line-height: 1.15; text-wrap: balance; }
.qt .wd { display: inline-block; transition: opacity .18s linear; }
.qt .wd.hid { opacity: .2; }
.orb { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; isolation: isolate; }
.orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--rainbow); z-index: -2; }
.orb::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: var(--rainbow); filter: blur(10px); opacity: .5; z-index: -3; transition: opacity .4s; }
.orb .core { position: absolute; inset: 2.5px; border-radius: 50%; background: rgba(12,14,22,.85); z-index: -1; transition: inset .35s, background .35s; }
.orb .ic { position: absolute; inset: 0; display: grid; place-items: center; }
.orb svg { width: 17px; height: 17px; color: #fff; }
.qb[data-mode="talk"] .orb::before, .qb[data-mode="talk"] .orb::after { animation: spin 2.2s linear infinite; }
.qb[data-mode="talk"] .orb::after { opacity: .95; }
.qb[data-mode="you"] .orb::after { opacity: .2; }
.qb[data-mode="ok"] .orb .core { background: var(--g-ok); inset: 0; }
.qb[data-mode="try"] .orb .core { background: var(--g-try); inset: 0; }
.qb[data-mode="ok"] .orb::after { background: #1DD6A0; }
.qb[data-mode="try"] .orb::after { background: #FFB020; }
@keyframes spin { to { --spin: 360deg; } }
.bars { display: flex; gap: 2.5px; align-items: center; height: 16px; }
.bars b { width: 3px; border-radius: 3px; background: #fff; height: 35%; animation: eq .9s ease-in-out infinite; }
.bars b:nth-child(2) { animation-delay: -.3s; } .bars b:nth-child(3) { animation-delay: -.6s; } .bars b:nth-child(4) { animation-delay: -.15s; }
@keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }
/* une réplique : Camille à gauche, Kenji à droite, avec son visage */
.lrow { display: flex; align-items: flex-end; gap: 9px; max-width: 100%; opacity: 0; transform: translateY(10px) scale(.96); }
.lrow[data-side="g"] { justify-self: start; transform-origin: left bottom; }
.lrow[data-side="d"] { justify-self: end; flex-direction: row-reverse; transform-origin: right bottom; }
.talk.line .lrow { opacity: 1; transform: none; pointer-events: auto; }
.av { flex: none; width: 38px; height: 38px; border-radius: 50%; object-fit: cover; max-width: none; box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 4px 12px rgba(0,0,0,.35); }
.lb { min-width: 0; padding: 10px 18px 11px; border-radius: 24px; }
.lrow[data-side="g"] .lb { border-bottom-left-radius: 8px; }
.lrow[data-side="d"] .lb { border-bottom-right-radius: 8px; }
.words { display: flex; flex-wrap: wrap; column-gap: .28em; row-gap: .12em; font-size: var(--fs); font-weight: 700; letter-spacing: -.01em; line-height: 1.16; }
.w { position: relative; color: rgba(255,255,255,.42); transition: color .12s linear; cursor: pointer; }
.w.past { color: #fff; }
.w.now { color: #FFD24A; }
.talk.playing .qb { opacity: 0; transform: translateY(8px) scale(.96); pointer-events: none; }

.bigplay { position: absolute; left: 50%; top: 46%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; z-index: 6; display: grid; place-items: center; color: #fff; transition: transform .5s var(--spring), opacity .3s; }
.bigplay:hover { transform: scale(1.06); } .bigplay:active { transform: scale(.94); }
.bigplay.gone { opacity: 0; transform: scale(.5); pointer-events: none; }
.bigplay svg { width: 30px; height: 30px; margin-left: 4px; position: relative; z-index: 2; }

/* ---------- sous la fenêtre : la petite barre ---------- */
.orn { z-index: 7; transform: translateX(-50%); }
.dock { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 6px; border-radius: 99px; }
.dock > * { position: relative; z-index: 2; }
.ico { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; transition: background .2s, transform .3s var(--spring); font-weight: 800; font-size: 15px; }
.ico:hover { background: rgba(255,255,255,.12); }
.ico:active { transform: scale(.88); }
.ico svg { width: 20px; height: 20px; }
.ico[aria-pressed="true"] { background: #fff; color: var(--ink); }
.goslot { display: flex; align-items: center; }
.goslot:empty { display: none; }
.go { flex: none; height: 40px; margin-left: 6px; padding: 0 16px 0 18px; border-radius: 99px; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); font-weight: 700; font-size: 15px;
  box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: transform .35s var(--spring), opacity .3s; animation: pop .5s var(--spring) both; position: relative; z-index: 2; }
.go svg { width: 18px; height: 18px; }
.go:active { transform: scale(.94); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- panneau du geste, à côté de la fenêtre ---------- */
.side { z-index: 6; opacity: 0; pointer-events: none; transform: translateY(-50%) scale(.96); overflow: visible; }
.side.on { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
body.tall .side { transform: translateY(12px) scale(.98); }
body.tall .side.on { transform: none; }
.panel { border-radius: 30px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel > * { position: relative; z-index: 2; }
body[data-turn="listen"] .side, body[data-turn="wait"] .side { pointer-events: none; }

/* ruban des nombres */
.tape { position: relative; height: 92px; border-radius: 20px; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; background: rgba(0,0,0,.18); }
.tape:focus-visible { box-shadow: 0 0 0 2px #fff; }
.tape.grab { cursor: grabbing; }
.tape .num { position: absolute; left: 0; top: 50%; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 22px; color: #fff; will-change: transform, opacity; }
.tape .num.c { font-weight: 800; }
.tape::before, .tape::after { content: ""; position: absolute; top: 0; bottom: 0; width: 26%; z-index: 2; pointer-events: none; }
.tape::before { left: 0; background: linear-gradient(90deg, rgba(20,22,32,.55), rgba(20,22,32,0)); }
.tape::after { right: 0; background: linear-gradient(270deg, rgba(20,22,32,.55), rgba(20,22,32,0)); }
.tape .notch { position: absolute; left: 50%; bottom: 10px; width: 24px; height: 4px; margin-left: -12px; border-radius: 4px; background: #fff; z-index: 3; transition: width .4s var(--spring), margin .4s var(--spring), background .3s; }
.tape.right .notch { background: var(--ok); width: 44px; margin-left: -22px; }
.tape.right .num.c { color: var(--ok); }
.punit { margin: -4px 0 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--text2); }
.shake { animation: shake .5s var(--apple); }
@keyframes shake { 15% { transform: translateX(-9px); } 35% { transform: translateX(7px); } 55% { transform: translateX(-4px); } 75% { transform: translateX(2px); } }

/* trier : « il n'aime pas » à gauche de la vidéo, « il aime » à droite, la carte au milieu */
.bin { z-index: 6; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 26px 14px 22px; text-align: center;
  opacity: 0; pointer-events: none; transform: translateY(-50%); }
.bin.no { translate: -18px 0; } .bin.yes { translate: 18px 0; }
.bin.on { opacity: 1; translate: 0 0; pointer-events: auto; }
body[data-turn="listen"] .bin, body[data-turn="wait"] .bin { pointer-events: none; }
.bin > * { position: relative; z-index: 2; }
.bin .bic { width: 46px; height: 46px; }
.bin.no .bic { color: #B9A8FF; } .bin.yes .bic { color: var(--heart); }
.bin .bl { font-weight: 700; font-size: 17px; line-height: 1.15; }
.bin .got { display: flex; gap: 6px; min-height: 40px; align-items: center; justify-content: center; }
.bin .mini { width: 40px; height: 40px; border-radius: 12px; background: #fff; display: grid; place-items: center; color: var(--ink); box-shadow: 0 4px 12px rgba(0,0,0,.3); animation: pop .55s var(--spring) both; }
.bin .mini svg { width: 30px; height: 30px; }
.bin.hot { scale: 1.06; }
.bin.yes.hot { background: rgba(255,77,138,.30); }
.bin.no.hot { background: rgba(140,110,255,.30); }
.deck { z-index: 8; transform: translate(-50%, -50%); width: 132px; height: 146px; pointer-events: none; }
.deck:empty { display: none; }
.deck .card { pointer-events: auto; }
.card { position: relative; width: 132px; height: 146px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; will-change: transform;
  background: rgba(255,255,255,.95); color: var(--ink); box-shadow: 0 22px 50px -14px rgba(0,0,0,.65); }
.card .pic { width: 78px; height: 78px; display: grid; place-items: center; }
.card .pic svg { width: 66px; height: 66px; }
.card[data-id="cook"] .pic { color: #F06A1F; }
.card[data-id="noise"] .pic { color: #6D44E8; }
.card .word { font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.card .ear { position: absolute; top: 9px; right: 9px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #EEF0FF; color: #5B57F0; }
.card .ear svg { width: 14px; height: 14px; }
.card.spring { transition: transform .55s var(--spring); }

/* fiches de fin */
.cast { display: flex; flex-direction: column; gap: 8px; }
.fiche { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border-radius: 22px; background: rgba(255,255,255,.07); }
.fiche .portrait { width: 58px; height: 58px; border-radius: 18px; padding: 2px; }
.fiche[data-side="g"] .portrait { background: var(--g-g); }
.fiche[data-side="d"] .portrait { background: var(--g-d); }
.fiche .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 16px; max-width: none; }
.fiche .who { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.fiche .name { font-weight: 800; font-size: 18px; line-height: 1; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 8px; border-radius: 99px; font-weight: 600; font-size: 14px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: transform .3s var(--spring), background .2s; }
.fact:hover { background: rgba(255,255,255,.2); }
.fact:active { transform: scale(.93); }
.fact svg { width: 16px; height: 16px; flex: none; }
.fact.yes svg { color: var(--heart); } .fact.no svg { color: #B9A8FF; } .fact.quote svg, .fact.age svg { color: #9FD0FF; }
.flyer { position: fixed; z-index: 50; object-fit: cover; pointer-events: none; border-radius: 6px; max-width: none; }

.ghost { position: fixed; z-index: 60; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(255,255,255,1) 0 30%, rgba(255,255,255,.35) 32% 100%); box-shadow: 0 0 0 1px rgba(255,255,255,.6), 0 8px 22px rgba(0,0,0,.35); }

/* ---------- téléphone tenu droit, téléphone couché ---------- */
body.tall .talk { --fs: 18px; }
body.tall .win { border-radius: 28px; }
body.tall .orb { width: 30px; height: 30px; }
body.tall .orb svg { width: 15px; height: 15px; }
body.tall .qb { gap: 10px; padding: 6px 16px 6px 6px; }
body.tall .lb { padding: 8px 14px 9px; border-radius: 20px; }
body.tall .av { width: 32px; height: 32px; }
body.tall .bin { transform: translateY(-50%); padding: 10px 8px; gap: 6px; border-radius: 24px; }
body.tall .bin .bic { width: 30px; height: 30px; }
body.tall .bin .bl { font-size: 14px; }
body.tall .bin .got { min-height: 30px; }
body.tall .bin .mini { width: 30px; height: 30px; border-radius: 9px; } body.tall .bin .mini svg { width: 22px; height: 22px; }
body.compact .talk { --fs: 17px; }
body.compact .tape { height: 70px; }
body.compact .deck, body.compact .card { width: 100px; height: 108px; } body.compact .card { border-radius: 20px; } body.compact .card .pic { width: 52px; height: 52px; } body.compact .card .pic svg { width: 44px; height: 44px; } body.compact .card .word { font-size: 16px; }
body.compact .panel { padding: 12px; gap: 8px; }
body.compact .fiche { grid-template-columns: 46px minmax(0, 1fr); padding: 6px; gap: 10px; } body.compact .fiche .portrait { width: 46px; height: 46px; border-radius: 14px; } body.compact .fiche .name { font-size: 16px; } body.compact .fact { height: 27px; font-size: 13px; }
body.short .talk { --fs: 16px; }
body.short .orb { width: 28px; height: 28px; }
body.short .qb { gap: 9px; padding: 5px 14px 5px 5px; }
body.short .lb { padding: 7px 13px 8px; border-radius: 18px; }
body.short .av { width: 28px; height: 28px; }
body.short .dock { height: 46px; } body.short .ico { width: 36px; height: 36px; } body.short .go { height: 36px; }
body.short .tape { height: 66px; }
body.short .deck, body.short .card { width: 92px; height: 98px; } body.short .card { border-radius: 20px; } body.short .card .pic svg { width: 40px; height: 40px; } body.short .card .pic { width: 46px; height: 46px; } body.short .card .word { font-size: 15px; }
body.short .bin { padding: 12px 8px; gap: 6px; border-radius: 24px; } body.short .bin .bic { width: 30px; height: 30px; } body.short .bin .bl { font-size: 14px; } body.short .bin .got { min-height: 30px; }
body.short .bin .mini { width: 30px; height: 30px; border-radius: 9px; } body.short .bin .mini svg { width: 22px; height: 22px; }
body.short .panel { padding: 12px; gap: 8px; border-radius: 24px; }
body.short .fiche { grid-template-columns: 44px minmax(0, 1fr); padding: 6px; gap: 8px; } body.short .fiche .portrait { width: 44px; height: 44px; border-radius: 14px; } body.short .fiche .name { font-size: 15px; } body.short .fact { height: 26px; font-size: 12.5px; }
/* ================= commun à toutes les vidéos ================= */
.retour { position: fixed; z-index: 9; left: max(14px, env(safe-area-inset-left)); top: calc(14px + env(safe-area-inset-top, 0px)); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; text-decoration: none; transition: transform .3s var(--spring); }
.retour svg { width: 20px; height: 20px; position: relative; z-index: 2; }
.retour:active { transform: scale(.9); }
.hit.zone { border-radius: 22px; }
.ptitre { margin: 0; font-weight: 700; font-size: 14px; color: var(--text2); text-align: center; letter-spacing: .01em; }
.tuile { position: relative; border-radius: 20px; background: rgba(255,255,255,.95); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  transition: transform .35s var(--spring), opacity .3s, box-shadow .3s; touch-action: manipulation; }
.tuile:hover { transform: translateY(-2px); }
.tuile:active { transform: scale(.94); }
.tuile .pic { width: 52px; height: 52px; display: grid; place-items: center; }
.tuile .pic svg { width: 46px; height: 46px; }
.tuile .nom { font-weight: 800; font-size: 14px; letter-spacing: -.01em; line-height: 1.1; text-align: center; }
.tuile.pris { opacity: .18; transform: scale(.9); pointer-events: none; }
.tuile.indice { animation: indice 1.1s var(--apple) infinite; }
@keyframes indice { 50% { box-shadow: 0 0 0 4px rgba(75,227,180,.75); transform: translateY(-3px); } }
.tuile.juste { box-shadow: 0 0 0 3px var(--ok); }
.tuile.faux { box-shadow: 0 0 0 3px var(--try); }
body[data-turn="listen"] .tuile, body[data-turn="wait"] .tuile { pointer-events: none; }

/* ================= l'épicerie : le sac, les produits ================= */
.sac { position: relative; display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 22px; background: rgba(0,0,0,.18); min-height: 82px; transition: background .3s; }
.sac.chaud { background: rgba(75,227,180,.18); }
.sac .sacpic svg { width: 60px; height: 64px; }
.sac .dans { display: flex; flex-wrap: wrap; gap: 6px; }
.sac .dans:empty::before { content: "Le sac est vide."; color: var(--text3); font-weight: 600; font-size: 14px; }
.mini { width: 40px; height: 40px; border-radius: 12px; background: #fff; display: grid; place-items: center; animation: pop .55s var(--spring) both; }
.mini svg { width: 30px; height: 30px; }
.grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grille .tuile { height: 92px; }
.volant { position: fixed; z-index: 50; pointer-events: none; }

/* payer : la monnaie, le plateau */
.plateau { border-radius: 22px; background: rgba(0,0,0,.2); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 118px; }
.plateau .somme { display: flex; align-items: baseline; justify-content: center; gap: 6px; font-weight: 800; font-size: 34px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.plateau .somme small { font-size: 15px; font-weight: 700; color: var(--text2); }
.plateau.juste .somme { color: var(--ok); }
.plateau .posees { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 40px; }
.bourse { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.argent { flex: none; display: grid; place-items: center; font-weight: 800; color: #2B2310; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55); transition: transform .3s var(--spring); }
.argent:active { transform: scale(.9); }
.argent.piece { width: 52px; height: 52px; border-radius: 50%; font-size: 15px; background: radial-gradient(circle at 35% 30%, #FFF2B8, #F2C94C 55%, #C9962A); }
.argent.piece.blanche { background: radial-gradient(circle at 35% 30%, #FFFFFF, #D9DDE3 55%, #A5ADB8); }
.argent.piece.deux { background: radial-gradient(circle at 50% 50%, #FFF2B8 0 42%, #D9DDE3 44% 100%); }
.argent.billet { width: 86px; height: 48px; border-radius: 9px; font-size: 18px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.argent.billet.cinq { background: linear-gradient(135deg, #9AA7B8, #6B7C93); }
.argent.billet.dix { background: linear-gradient(135deg, #E6857A, #C04F45); }
.posees .argent { transform: scale(.72); margin: -6px -8px; animation: pop .45s var(--spring) both; }
body[data-turn="listen"] .bourse, body[data-turn="wait"] .bourse, body[data-turn="listen"] .posees, body[data-turn="wait"] .posees { pointer-events: none; }

/* ================= la pharmacie : le plan ================= */
.plan { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 22px; overflow: hidden; background: #E9E4D8; }
.plan svg { width: 100%; height: 100%; }
.plan .bat { transition: fill .3s, opacity .3s; cursor: default; }
.plan.choisir .bat.cible { cursor: pointer; }
.plan.choisir .bat.cible:hover { fill: #FFFFFF; }
.plan .bat.faux { fill: #FFD9A0; }
.plan .bat.juste { fill: #C8F5E4; }
.plan .marcheur { transition: transform .9s var(--apple); }
.plan .trace { fill: none; stroke: #3AA8FF; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; opacity: .9; }
.plan .croix { opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity .4s, transform .6s var(--spring); transform: scale(.4); }
.plan .croix.on { opacity: 1; transform: scale(1); }
.fleches { display: flex; justify-content: center; gap: 12px; }
.fleche { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); transition: transform .3s var(--spring), background .2s; }
.fleche svg { width: 26px; height: 26px; }
.fleche:hover { background: rgba(255,255,255,.24); }
.fleche:active { transform: scale(.9); }
.fleche.faux { background: rgba(255,170,40,.5); }
.fleche.juste { background: rgba(29,214,160,.55); }
body[data-turn="listen"] .fleches, body[data-turn="wait"] .fleches, body[data-turn="listen"] .plan, body[data-turn="wait"] .plan { pointer-events: none; }

/* ================= le médecin : le corps, la semaine, le thermomètre ================= */
.corps { display: grid; place-items: center; padding: 4px 0; }
.corps svg { width: 150px; height: 270px; }
.corps .zc { fill: rgba(255,255,255,.16); stroke: rgba(255,255,255,.55); stroke-width: 2; cursor: pointer; transition: fill .25s; }
.corps .zc:hover { fill: rgba(255,255,255,.32); }
.corps .zc.juste { fill: rgba(255,77,100,.75); animation: battre 1.2s var(--apple) infinite; transform-box: fill-box; transform-origin: center; }
.corps .zc.faux { fill: rgba(255,170,40,.55); }
@keyframes battre { 50% { transform: scale(1.06); } }
.semaine { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.jour { position: relative; height: 128px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); transition: background .3s, transform .3s var(--spring); }
.jour b { font-size: 32px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.jour span { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
.jour small { min-height: 13px; font-size: 10px; font-weight: 700; color: var(--text2); }
.mois { margin: 0; text-align: center; font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.jour:active { transform: scale(.92); }
.jour.auj { box-shadow: inset 0 0 0 2px #fff; }
.jour.mal { background: rgba(255,255,255,.24); }
.jour.debut { background: #fff; color: var(--ink); }
.jour.debut span, .jour.debut small { color: rgba(20,16,40,.6); }
.jour.debut.juste { background: var(--ok); }
.jour.mal.juste { background: rgba(29,214,160,.55); }
.jour .tete { position: absolute; top: -11px; right: -7px; width: 28px; height: 28px; display: none; }
.jour.debut .tete { display: block; animation: pop .45s var(--spring) both; }
.legende { margin: 0; text-align: center; font-size: 17px; font-weight: 700; color: var(--text1, #fff); min-height: 22px; }
.thermo { display: grid; grid-template-columns: 70px 1fr; gap: 14px; align-items: stretch; padding: 4px 6px; }
.thermo svg { width: 70px; height: 240px; }
.thermo .mercure { transition: y .7s var(--spring), height .7s var(--spring); }
.niveaux { display: flex; flex-direction: column; justify-content: space-between; padding: 14px 0 52px; gap: 8px; }
.niveau { height: 46px; border-radius: 14px; padding: 0 14px; text-align: left; font-weight: 700; font-size: 16px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); transition: background .25s, transform .3s var(--spring); }
.niveau:active { transform: scale(.95); }
.niveau[aria-pressed="true"] { background: #fff; color: var(--ink); }
.niveau.juste { background: var(--ok); color: var(--ink); }
body[data-turn="listen"] .corps, body[data-turn="wait"] .corps, body[data-turn="listen"] .semaine, body[data-turn="wait"] .semaine, body[data-turn="listen"] .thermo, body[data-turn="wait"] .thermo { pointer-events: none; }

/* ================= le fleuriste : la famille, le bouquet ================= */
.famille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.famille .tuile { height: 116px; }
.famille .pic { width: 60px; height: 60px; }
.famille .pic svg { width: 58px; height: 58px; }
.bouquet { display: grid; place-items: center; padding: 4px 0 2px; }
.bouquet svg { width: 170px; height: 200px; animation: pop .8s var(--spring) both; }
.etiquette { margin: 0; text-align: center; font-weight: 800; font-size: 18px; }

/* téléphone tenu droit : le panneau du geste passe sous la vidéo */
body.tall .grille .tuile { height: 80px; } body.tall .tuile .pic { width: 40px; height: 40px; } body.tall .tuile .pic svg { width: 36px; height: 36px; }
body.tall .plan { aspect-ratio: 1.5 / 1; } body.tall .corps svg { height: 200px; width: 112px; } body.tall .thermo svg { height: 190px; }
body.tall .famille .tuile { height: 92px; } body.tall .jour { height: 76px; } body.tall .jour b { font-size: 20px; } body.tall .jour small { display: none; }
body.tall .sac { min-height: 64px; } body.tall .sac .sacpic svg { width: 46px; height: 50px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* indices après deux essais : la bonne réponse respire */
.fleche.indice { animation: indiceF 1.1s var(--apple) infinite; }
@keyframes indiceF { 50% { background: rgba(29,214,160,.45); transform: scale(1.08); } }
.plan .bat.indice { animation: indiceB 1.1s var(--apple) infinite; }
@keyframes indiceB { 50% { fill: #9EEBD0; } }
.corps .zc.indice { animation: indiceZ 1.1s var(--apple) infinite; }
@keyframes indiceZ { 50% { fill: rgba(75,227,180,.6); } }
.niveau.indice { animation: indiceF 1.1s var(--apple) infinite; }
.cam.asking .hit.indice { animation: indiceH 1.1s var(--apple) infinite; }
@keyframes indiceH { 50% { box-shadow: inset 0 0 0 3px rgba(75,227,180,.9); background: rgba(75,227,180,.18); } }
.jour[disabled] { opacity: .35; }
.jour .tete svg { width: 28px; height: 28px; display: block; }
.corps .zc.faux, .plan .bat.faux { transition: fill .15s; }

/* repères posés sur l'image : cadre d'une zone touchée, étiquette, objets sur la scène */
.surimage { position: absolute; pointer-events: none; }
.zcadre { z-index: 1; border-radius: 22px; box-shadow: inset 0 0 0 3px var(--ok); background: rgba(75,227,180,.14); animation: pop .45s var(--spring) both; }
.zcadre.faux { box-shadow: inset 0 0 0 3px var(--try); background: rgba(255,170,40,.16); animation: pop .45s var(--spring) both, s-efface .5s 1.4s forwards; }
@keyframes s-efface { to { opacity: 0; } }
.marque { z-index: 3; translate: -50% calc(-100% - 8px); white-space: nowrap; padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.96); color: var(--ink); font-weight: 800; font-size: 15px; letter-spacing: -.01em; animation: pop .45s var(--spring) both; }
.marque.juste { background: var(--ok); }
.marque.faux { background: #FFD9A0; animation: pop .45s var(--spring) both, s-efface .5s 1.4s forwards; }
.objet { position: absolute; z-index: 1; display: grid; place-items: center; transition: left .9s var(--apple), top .9s var(--apple), transform .4s var(--spring), opacity .4s; }
.objet svg { width: 100%; height: 100%; display: block; }
.objet.donne { transform: rotate(-8deg) scale(1.1); }
.sacv { position: absolute; z-index: 1; display: flex; gap: 4px; transform: translate(-50%, -50%); }
.sacv .mini { width: 34px; height: 34px; border-radius: 50%; }
.sacv .mini svg { width: 24px; height: 24px; }

/* le thermomètre se fait glisser (ou on clique sur un niveau) */
.thermo svg { touch-action: none; cursor: grab; }
.thermo.tire svg { cursor: grabbing; }
.thermo .poignee { transition: cy .7s var(--spring); }
.thermo.tire .mercure, .thermo.tire .poignee { transition: none; }
/* toucher la vidéo au bon moment */
.hit.zone { cursor: pointer; }
.cam.asking .hit.ecran { border-radius: 0; }
@media (hover: hover) { .cam.asking .hit.ecran:hover { box-shadow: none; background: none; } }
/* bilan : une réplique par ligne, alignée à gauche, même si elle passe sur deux lignes */
.facts { flex-direction: column; align-items: flex-start; }
.fact { height: auto; min-height: 30px; padding: 6px 12px 6px 9px; max-width: 100%; text-align: left; line-height: 1.25; }
.fact span { text-align: left; }

/* ================= l'hôtel : la fiche de réservation, l'ascenseur ================= */
.h-panel { gap: 14px; }

/* la fiche (papier) : le nom, les nuits */
.h-fiche { display: flex; flex-direction: column; padding: 4px 18px; border-radius: 22px; background: #FBF8F1; color: var(--ink); }
.h-ligne { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 10px; min-height: 78px; }
.h-ligne + .h-ligne { border-top: 2px dashed rgba(11,13,22,.14); }
.h-lbl { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(11,13,22,.55); }
.h-champ { display: flex; align-items: center; gap: 10px; height: 50px; border-bottom: 2px solid rgba(11,13,22,.22); }
.h-vide { display: grid; place-items: center; width: 28px; height: 28px; color: rgba(11,13,22,.32); animation: h-ecrire 1.6s var(--apple) infinite; }
.h-vide svg { width: 22px; height: 22px; }
@keyframes h-ecrire { 50% { transform: translateX(6px) rotate(-6deg); } }
.h-ecrit { font-size: 30px; font-weight: 800; letter-spacing: -.01em; color: #2346C8; animation: pop .45s var(--spring) both; }
.h-ok { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: var(--ink); animation: pop .45s .15s var(--spring) both; }
.h-ok svg { width: 18px; height: 18px; }

.h-nuits { display: flex; flex-direction: column; gap: 6px; padding: 12px 0 10px; }
.h-lunes { display: flex; gap: 8px; }
.h-lune { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: #ECEEF4; transition: background .25s, transform .3s var(--spring), box-shadow .25s, opacity .3s; }
.h-lune svg { width: 34px; height: 34px; }
.h-lune .croissant { fill: #C3C8D6; transition: fill .25s; }
.h-lune .etoile { fill: transparent; transition: fill .25s; }
.h-lune:disabled { opacity: .4; cursor: default; }
.h-ln.actif .h-lune:not(.on) { box-shadow: inset 0 0 0 2px rgba(34,48,106,.28); }
.h-lune:not(:disabled):hover { transform: translateY(-2px); }
.h-lune:not(:disabled):active { transform: scale(.9); }
.h-lune.on { background: #22306A; }
.h-lune.on .croissant { fill: #FFE08A; }
.h-lune.on .etoile { fill: #FFF3C4; }
.h-ln.actif .h-lune.juste { box-shadow: 0 0 0 3px var(--ok); }
.h-ln.actif .h-lune.faux { box-shadow: 0 0 0 3px var(--try); }
.h-total { min-height: 24px; font-weight: 800; font-size: 19px; color: var(--ink); }
.h-ln.juste .h-total::after { content: " ✓"; color: #0E9E74; }

/* les réservations du jour : quatre noms qui se ressemblent */
.h-resa { display: flex; flex-direction: column; gap: 10px; max-height: 240px; overflow: hidden; transition: max-height .6s var(--apple), opacity .35s, margin .6s var(--apple); }
.h-resa.fini { max-height: 0; opacity: 0; margin-top: -14px; }
.h-noms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 4px; }
.h-nom { height: 62px; border-radius: 18px; background: rgba(255,255,255,.95); color: var(--ink); font-weight: 800; font-size: 21px; letter-spacing: -.01em; transition: transform .35s var(--spring), box-shadow .3s; }
.h-nom:hover { transform: translateY(-2px); }
.h-nom:active { transform: scale(.95); }
.h-nom.juste { box-shadow: 0 0 0 3px var(--ok); }
.h-nom.faux { box-shadow: 0 0 0 3px var(--try); }
.h-nom.indice { animation: indice 1.1s var(--apple) infinite; }
.h-vol { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 18px; background: #fff; color: #2346C8; font-weight: 800; font-size: 21px; }

/* l'ascenseur : l'immeuble (la cabine monte), la plaque des boutons */
.h-asc { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 14px; align-items: stretch; }
.h-cage { position: relative; display: grid; grid-template-rows: repeat(5, 1fr); min-height: 330px; border-radius: 20px; background: rgba(0,0,0,.2); overflow: hidden; }
.h-niv { position: relative; display: grid; grid-template-columns: 52px 66px minmax(0, 1fr); align-items: center; transition: background .3s; }
.h-niv + .h-niv { border-top: 2px solid rgba(255,255,255,.12); }
.h-et { text-align: center; font-weight: 800; font-size: 17px; color: var(--text2); transition: color .3s; }
.h-puits { align-self: stretch; background: rgba(255,255,255,.06); border-left: 2px solid rgba(255,255,255,.18); border-right: 2px solid rgba(255,255,255,.18); }
.h-couloir { display: flex; gap: 10px; align-self: end; padding-left: 14px; }
.h-couloir i { width: 26px; height: 42px; border-radius: 5px 5px 0 0; background: radial-gradient(circle at 76% 55%, rgba(255,255,255,.75) 0 2px, transparent 2.6px), rgba(255,255,255,.15); box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); }
.h-dit { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 6px 11px; border-radius: 99px; font-weight: 800; font-size: 14px; white-space: nowrap; animation: pop .45s var(--spring) both; }
.h-dit:empty { display: none; }
.h-niv.juste { background: rgba(75,227,180,.2); }
.h-niv.juste .h-et, .h-niv.faux .h-et { color: #fff; }
.h-niv.juste .h-dit { background: var(--ok); color: var(--ink); }
.h-niv.faux { background: rgba(255,170,40,.18); }
.h-niv.faux .h-dit { background: var(--try); color: var(--ink); }
.h-cabine { position: absolute; left: 52px; bottom: 0; width: 66px; height: 20%; transform: translateY(calc(var(--k) * -100%)); transition: transform .62s var(--apple); pointer-events: none; }
.h-boite { position: absolute; inset: 6px 7px; border-radius: 9px; overflow: hidden; background: #F3E6C8; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
.h-dedans { position: absolute; left: 50%; bottom: 0; width: 32px; height: 42px; transform: translateX(-50%); }
.h-dedans svg { width: 100%; height: 100%; }
.h-pg, .h-pd { position: absolute; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #B8C0CB, #D5DAE1); transition: width .45s var(--apple); }
.h-pg { left: 0; box-shadow: inset -1px 0 0 rgba(11,13,22,.3); }
.h-pd { right: 0; box-shadow: inset 1px 0 0 rgba(11,13,22,.3); }
.h-cabine.ouverte .h-pg, .h-cabine.ouverte .h-pd { width: 3px; }

.h-plaque { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 10px; border-radius: 22px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
.h-ecran { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 12px; background: #0B0D16; color: #FFC76B; font-variant-numeric: tabular-nums; }
.h-ecran b { font-size: 30px; font-weight: 800; line-height: 1; }
.h-fl { position: absolute; left: 12px; top: 50%; width: 14px; height: 14px; margin-top: -7px; opacity: 0; transition: opacity .2s, transform .2s; }
.h-fl svg { width: 100%; height: 100%; }
.h-ecran.bouge .h-fl { opacity: 1; }
.h-ecran.bas .h-fl { transform: rotate(180deg); }
.h-boutons { display: flex; flex-direction: column; gap: 9px; }
.h-bouton { width: 56px; height: 56px; border-radius: 50%; font-size: 23px; font-weight: 800; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); transition: background .2s, color .2s, box-shadow .2s, transform .3s var(--spring); }
.h-bouton:hover { background: rgba(255,255,255,.24); }
.h-bouton:active { transform: scale(.9); }
.h-bouton.choisi { background: #fff; color: var(--ink); box-shadow: 0 0 0 4px rgba(255,255,255,.3); }
.h-bouton.juste { background: var(--ok); color: var(--ink); box-shadow: none; }
.h-bouton.faux { background: var(--try); color: var(--ink); box-shadow: none; }
.h-bouton.indice { animation: indiceF 1.1s var(--apple) infinite; }

/* téléphone tenu droit (le panneau sous la vidéo), téléphone couché (panneau étroit) */
body.tall .h-ligne { min-height: 60px; }
body.tall .h-ecrit { font-size: 24px; }
body.tall .h-lune { width: 44px; height: 44px; border-radius: 13px; } body.tall .h-lune svg { width: 28px; height: 28px; }
body.tall .h-nom { height: 50px; font-size: 18px; }
body.tall .h-cage { min-height: 0; }
body.tall .h-asc { grid-template-columns: minmax(0, 1fr) 84px; gap: 10px; }
body.tall .h-niv { grid-template-columns: 40px 56px minmax(0, 1fr); }
body.tall .h-cabine { left: 40px; width: 56px; }
body.tall .h-et { font-size: 15px; }
body.tall .h-couloir { gap: 8px; padding-left: 10px; } body.tall .h-couloir i { width: 20px; height: 34px; }
body.tall .h-niv.juste .h-couloir, body.tall .h-niv.faux .h-couloir { opacity: 0; }
body.tall .h-dit { right: 6px; padding: 5px 9px; font-size: 13px; }
body.tall .h-plaque { padding: 10px 8px; }
body.tall .h-bouton { width: 44px; height: 44px; font-size: 19px; } body.tall .h-boutons { gap: 6px; } body.tall .h-ecran { height: 42px; }
body.short .h-ligne { grid-template-columns: 1fr; gap: 2px; min-height: 0; padding: 6px 0; }
body.short .h-lune { width: 34px; height: 34px; border-radius: 10px; } body.short .h-lune svg { width: 22px; height: 22px; } body.short .h-lunes { gap: 5px; }
body.short .h-nom { height: 44px; font-size: 16px; }
body.short .h-asc { grid-template-columns: 1fr; } body.short .h-cage { display: none; }
body.short .h-boutons { flex-direction: row; flex-wrap: wrap; justify-content: center; }
body.short .h-bouton { width: 44px; height: 44px; font-size: 18px; }

<script>
/* À la réception de l'hôtel : le client redit son nom (la vidéo resserrée sur lui), on remplit la fiche de réservation
   (on clique sur son nom dans les réservations du jour, puis une lune pour chaque nuit) ; dans la vidéo, sur une image où
   la réceptionniste tient encore la carte, on touche la clé (ici, c'est une carte) ; enfin, dans l'ascenseur dessiné à
   côté, on appuie sur le bouton de son étage et la cabine monte. */
window.SCENARIO = (() => {
  const NB = '\u202f';
  const NOMS = [{ id: 'marin', t: 'Marin' }, { id: 'martin', t: 'Martin' }, { id: 'morin', t: 'Morin' }, { id: 'martel', t: 'Martel' }];
  const BON_NOM = 'martin', BONNES_NUITS = 2, MAX_NUITS = 5;
  const nuitsTxt = n => n + (n > 1 ? ' nuits' : ' nuit');
  const NUITS_MOTS = ['', 'une nuit', 'deux nuits', 'trois nuits', 'quatre nuits', 'cinq nuits'];
  const LUNE = '<svg viewBox="0 0 40 40" aria-hidden="true"><path class="croissant" d="M25 6.5a14 14 0 1 0 9.5 23.2A11.5 11.5 0 0 1 25 6.5z"/><circle class="etoile" cx="30" cy="11" r="1.6"/><circle class="etoile" cx="34" cy="19" r="1.1"/></svg>';
  const CRAYON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* l'ascenseur : les étages de haut en bas, le nom court sur l'immeuble, le nom dit dans les messages */
  const ETAGES = [4, 3, 2, 1, 0], BON_ETAGE = 2;
  const COURT = { 0: 'RDC', 1: '1er', 2: '2e', 3: '3e', 4: '4e' };
  const DIT = { 0: 'le rez-de-chaussée', 1: 'le premier étage', 2: 'le deuxième étage', 3: 'le troisième étage', 4: 'le quatrième étage' };
  const ARIA = { 0: 'Rez-de-chaussée', 1: 'Premier étage', 2: 'Deuxième étage', 3: 'Troisième étage', 4: 'Quatrième étage' };
  const CLIENT = '<svg viewBox="0 0 40 52" aria-hidden="true"><path d="M6 52c0-13 6-20 14-20s14 7 14 20z" fill="#8C8F94"/><path d="M15.5 33.5c1.4 2.4 7.6 2.4 9 0" fill="none" stroke="#F4F1EA" stroke-width="2.4"/><circle cx="20" cy="17" r="9" fill="#E9B994"/><path d="M11 16c-.4-7 3.6-11 9.2-11 5.4 0 9.2 3.6 8.8 10-1.8-3.4-4.6-5-9-5s-7.2 2-9 6z" fill="#6B4A32"/></svg>';
  const FLECHE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3l5 7H3z" fill="currentColor"/></svg>';

  /* la clé, sur l'image à 6,62 s : la réceptionniste tient la carte, elle ne la tend pas encore (en %) */
  const GEL_CLE = 6.62;
  const ZONES = [
    { id: 'cle', label: 'La clé', x: 24, y: 64, w: 17, h: 18 },
    { id: 'ecran', label: "L'écran", nom: "l'écran", dit: "l'écran", x: 45, y: 64, w: 18, h: 20 },
    { id: 'lampe', label: 'La lampe', nom: 'la lampe', dit: 'une lampe', x: 79, y: 34, w: 10, h: 15 },
    { id: 'comptoir', label: 'Le comptoir', nom: 'le comptoir', dit: 'le comptoir', x: 0, y: 87, w: 55, h: 13 },
  ];

  return {
    plans: [{ de: 0, cx: { receptionniste: .4, client: .4 } }, { de: .625, cx: { receptionniste: .62, client: .62 } }, { de: .958, cx: { receptionniste: .4, client: .4 } },
      { de: 2.125, cx: { receptionniste: .63, client: .63 } }, { de: 4.042, cx: { receptionniste: .41, client: .41 } }, { de: 5.583, cx: { receptionniste: .63, client: .63 } },
      { de: 6.458, cx: { receptionniste: .23, client: .7 } }, { de: 8.458, cx: { receptionniste: .62, client: .62 } }, { de: 9.208, cx: { receptionniste: .2, client: .71 } }],
    ordre: ['fiche', 'cle', 'etage'],
    bravo: 'Bravo' + NB + '! Monsieur Martin peut monter dans sa chambre.',
    etapes: A => {
      const { $, $$, state, alive, Q, yourTurn, setTurn, playSegment, phrase, ligne, side, idle, tapHere, sfx, faux, juste, suite, goBtn, wait, zones, cam, avant, cadreZone, marque, gel, fly } = A;
      /* les passages : la question de la réceptionniste, puis la réponse du client (on coupe avant le plan suivant) */
      const NOM = [ligne(2)[0], 4.0], SEJOUR = [phrase('Vous restez combien de nuits')[0], 6.45];
      const VOICI = phrase('Voici votre clé'), ETAGE = [phrase('Votre chambre est au deuxième étage')[0], 8.45];
      const vibre = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
      return {
        /* 1 · la fiche : le nom (dans les réservations du jour), puis les nuits (une lune par nuit) */
        async fiche(f) {
          let partie = 1, nuits = 0;
          const seg = () => (partie === 1 ? NOM : SEJOUR);
          const ask = () => {
            Q.show('you', state.ask); yourTurn();
            if (partie === 1) idle.set(tapHere($('.h-nom[data-id="marin"]', side)), 5000);
            else { goBtn('check', 'Valider', valider); idle.set(tapHere($('.h-lune[data-k="4"]', side)), 5000); }
          };
          const allumer = n => {
            nuits = n;
            $$('.h-lune', side).forEach(b => { const on = +b.dataset.k <= n; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.classList.remove('juste', 'faux', 'indice'); });
            $('#hTotal', side).textContent = n ? nuitsTxt(n) : '';
          };
          if (!await avant(f, {
            question: 'Écoute le client.', qui: 'client', seg: NOM, sideW: 460, consigne: 'La réservation est à quel nom' + NB + '? Clique sur le bon nom.',
            panneau: `<div class="panel glass h-panel"><p class="ptitre">Fiche de réservation</p>
              <div class="h-fiche">
                <div class="h-ligne"><span class="h-lbl">Nom</span><span class="h-champ" id="hNom"><span class="h-vide">${CRAYON}</span></span></div>
                <div class="h-ligne h-ln" id="hLn"><span class="h-lbl">Nuits</span><span class="h-nuits">
                  <span class="h-lunes" role="group" aria-label="Nuits">${Array.from({ length: MAX_NUITS }, (_, i) => `<button class="h-lune" data-k="${i + 1}" aria-label="${nuitsTxt(i + 1)}" aria-pressed="false" disabled>${LUNE}</button>`).join('')}</span>
                  <span class="h-total" id="hTotal" aria-live="polite"></span></span></div>
              </div>
              <div class="h-resa" id="hResa"><p class="ptitre">Les réservations du jour</p>
                <div class="h-noms">${NOMS.map(n => `<button class="h-nom" data-id="${n.id}">${n.t}</button>`).join('')}</div></div></div>`,
            monte: p => {
              $$('.h-nom', p).forEach(b => b.addEventListener('click', () => choisirNom(b)));
              $$('.h-lune', p).forEach(b => b.addEventListener('click', () => { if (document.body.dataset.turn !== 'you' || partie !== 2) return; A.unlock(); idle.reset(); sfx.tick(); allumer(+b.dataset.k); }));
            },
          })) return;
          state.replay = async () => { setTurn('listen'); goBtn(null); await playSegment(seg()[0], seg()[1], gel()); if (alive(f)) ask(); };

          async function choisirNom(b) {
            if (document.body.dataset.turn !== 'you' || partie !== 1) return;
            A.unlock(); idle.clear(); setTurn('wait'); sfx.tick();
            const n = NOMS.find(x => x.id === b.dataset.id);
            if (n.id === BON_NOM) {
              $$('.h-nom', side).forEach(x => x.classList.remove('indice')); b.classList.add('juste');
              await fly(b, $('#hNom', side), `<span class="h-vol">${n.t}</span>`, { scale: .8 }); if (!alive(f)) return;
              const champ = $('#hNom', side); champ.innerHTML = `<span class="h-ecrit">${n.t}</span><span class="h-ok">${CHECK}</span>`; champ.classList.add('rempli');
              if (!await juste(f, 'Oui' + NB + '! Au nom de Martin.', phrase('au nom de Martin'))) return;
              await wait(700); if (!alive(f)) return;
              /* 2e partie : les nuits */
              partie = 2; $('#hResa', side).classList.add('fini'); $('#hLn', side).classList.add('actif');
              $$('.h-lune', side).forEach(x => { x.disabled = false; });
              if (!await Q.say('Écoute le client.', f)) return;
              setTurn('listen'); await wait(250); if (!alive(f)) return;
              await playSegment(SEJOUR[0], SEJOUR[1], gel()); if (!alive(f)) return;
              state.ask = 'Il reste combien de nuits' + NB + '? Clique sur une lune pour chaque nuit.';
              await wait(300); if (!alive(f)) return;
              if (!await Q.say(state.ask, f)) return;
              ask();
            } else {
              b.classList.add('faux'); vibre(b);
              const montrer = await faux(f, NOM, 'Pas ' + n.t + '. Écoute encore.'); if (montrer === null) return;
              b.classList.remove('faux');
              if (montrer) $(`.h-nom[data-id="${BON_NOM}"]`, side).classList.add('indice');
              ask();
            }
          }
          async function valider() {
            if (document.body.dataset.turn !== 'you') return;
            if (!nuits) { Q.show('you', 'Clique sur une lune.'); return; }
            setTurn('wait'); goBtn(null); idle.clear();
            if (nuits === BONNES_NUITS) {
              $$('.h-lune.on', side).forEach(x => x.classList.add('juste')); $('#hLn', side).classList.add('juste');
              if (!await juste(f, 'Oui' + NB + '! Il reste deux nuits.', ligne(5))) return;
              suite();
            } else {
              $$('.h-lune.on', side).forEach(x => x.classList.add('faux')); vibre($('.h-lunes', side));
              const montrer = await faux(f, SEJOUR, 'Ça fait ' + NUITS_MOTS[nuits] + '. Écoute encore.'); if (montrer === null) return;

          if (!await avant(f, { question: 'Écoute la réceptionniste.', qui: 'receptionniste', seg: VOICI, gel: GEL_CLE, consigne: 'Où est la clé' + NB + "? Clique dans l'image." })) return;
          state.replay = async () => { setTurn('listen'); cam.classList.remove('asking'); await playSegment(VOICI[0], VOICI[1], gel()); if (alive(f)) ask(); };
          zones(ZONES, async (id, ev, z) => {
            setTurn('wait'); cam.classList.remove('asking'); sfx.tick();

              $$('.hit', cam).forEach(h => h.classList.remove('indice'));

              cadreZone(z, 'faux'); marque(z, z.nom, 'faux');

              $('#hNum', side).textContent = ici; if (!vite) sfx.tick();
            }
            ecran.classList.remove('bouge');
            if (!vite) { await wait(200); c.classList.add('ouverte'); await wait(450); }
          }
          if (!await avant(f, {
            question: 'Écoute la réceptionniste.', qui: 'receptionniste', seg: ETAGE, sideW: 460, consigne: 'La chambre est à quel étage' + NB + '? Clique sur le bon bouton.',
            panneau: `<div class="panel glass h-panel"><p class="ptitre">Dans l'ascenseur</p>
              <div class="h-asc">
                <div class="h-cage" aria-hidden="true">

                </div>

            monte: p => $$('.h-bouton', p).forEach(b => b.addEventListener('click', () => appuyer(+b.dataset.e, b))),
          })) return;
          state.replay = async () => { setTurn('listen'); await playSegment(ETAGE[0], ETAGE[1], gel()); if (alive(f)) ask(); };

          async function appuyer(e, b) {
            if (document.body.dataset.turn !== 'you') return;
            A.unlock(); idle.clear(); setTurn('wait'); sfx.tick();
            $$('.h-bouton', side).forEach(x => x.classList.remove('indice'));
            b.classList.add('choisi');
            await aller(e); if (!alive(f)) return;

              await aller(0, true); if (!alive(f)) return;
              if (montrer) btn(BON_ETAGE).classList.add('indice');
              ask();
            }
          }
          ask();
        },
      };
    },
    /* au bilan, chaque passage s'arrête avant la coupe suivante (sinon on voit l'autre plan un instant) */
    bilan: A => ({
      faits: {
        receptionniste: [{ text: 'Vous restez combien de nuits' + A.NB + '?', seg: A.phrase('Vous restez combien de nuits') }, { text: 'Voici votre clé.', seg: A.phrase('Voici votre clé') },
          { text: 'au deuxième étage', seg: [A.phrase('Votre chambre est au deuxième étage')[0], 8.45] }],

          { text: 'Merci beaucoup.', seg: A.phrase('Merci beaucoup') }],
      },
    }),
  };
})();

<script>

<div class="ghost" id="ghost" aria-hidden="true"></div>`);

  /* ================= la scène ================= */
  const LINES = DON.lines.map(L => ({ ...L, words: L.words.map(([t, s, e]) => ({ t, s, e })) }));
  const WIDE = DON.gel;
  const CROPS = { full: { a: 16 / 9, h: 1, cx: .5, cy: .5 }, fullTall: { a: 4 / 3, h: 1, cx: .5, cy: .5 }, ...(SC.crops || {}) };

  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
  const ALLW = LINES.flatMap(L => L.words.map(w => ({ ...w, n: norm(w.t) })));
  function phrase(txt, avant = .06, apres = .12) {
    const q = norm(txt).split(' ');
    for (let i = 0; i + q.length <= ALLW.length; i++) if (q.every((m, k) => ALLW[i + k].n === m)) return [Math.max(0, ALLW[i].s - avant), ALLW[i + q.length - 1].e + apres];
    console.warn('phrase introuvable :', txt); return [0, 1];
  }
  const ligne = i => [LINES[i].s - .05, LINES[i].e + .12];

  /* ================= éléments et état ================= */

  const binNo = $('#binNo'), binYes = $('#binYes'), deck = $('#deck');
  const ccBtn = $('#ccBtn'), slowBtn = $('#slowBtn'), replayBtn = $('#replayBtn');
  const state = { step: 'intro', cc: false, slow: false, lineView: false, crop: CROPS.full, sideOn: false, split: false, essais: 0 };
  let flow = 0;
  const alive = f => f === flow;

  /* ================= mise en place : fenêtre, barre, panneau, cases ================= */
  function layout() {
    const Wd = innerWidth, Hd = innerHeight, wide = Wd / Hd >= 1.1, short = wide && Hd < 520, compact = !wide && Hd < 740;
    const B = document.body; B.classList.toggle('wide', wide); B.classList.toggle('tall', !wide); B.classList.toggle('short', short); B.classList.toggle('compact', compact);

    const dockH = short ? 46 : 52, dockGap = short ? 10 : 16;
    let wx, wy, ww, wh;

      const vm = short ? 12 : 36, pad = short ? 14 : 32, gap = (sideOn || split) ? (short ? 14 : 28) : 0;
      const sw = sideOn ? Math.min(short ? 230 : (state.sideW || 320), Wd * ((state.sideW || 320) > 400 ? .4 : .32)) : split ? Math.min(short ? 140 : 210, Wd * .18) : 0;
      const extra = sideOn ? sw + gap : split ? 2 * (sw + gap) : 0;
      const aw = Wd - pad * 2 - extra, ah = Hd - vm * 2 - dockGap - dockH;
      wh = Math.min(ah, aw / c.a); ww = wh * c.a;
      const gx = (Wd - ww - extra) / 2;
      wx = split ? gx + sw + gap : gx; wy = (Hd - (wh + dockGap + dockH)) / 2;
      Object.assign(side.style, { left: wx + ww + gap + 'px', top: wy + wh / 2 + 'px', width: (sideOn ? sw : Math.min(320, Wd * .3)) + 'px' });
      const bw = split ? sw : Math.min(210, Wd * .18);
      const yc = wy + wh * (short ? .46 : .56);
      Object.assign(binNo.style, { left: wx - gap - bw + 'px', top: yc + 'px', width: bw + 'px', height: '' });
      Object.assign(binYes.style, { left: wx + ww + gap + 'px', top: yc + 'px', width: bw + 'px', height: '' });
      Object.assign(deck.style, { left: wx + ww / 2 + 'px', top: yc + 'px' });
    } else {
      const pad = 12, top = Math.max(14, Math.round(Hd * .04)) + 44;
      const sideH = sideOn && side.firstElementChild ? side.firstElementChild.offsetHeight : 0, rowH = compact ? 118 : 156;
      const below = sideOn ? sideH + 12 : split ? rowH + 12 : 0;
      ww = Wd - pad * 2; wh = ww / c.a;
      const maxH = Hd - top - dockGap - dockH - below - 14;
      if (wh > maxH) { wh = Math.max(150, maxH); ww = Math.min(Wd - pad * 2, wh * c.a); }
      wx = (Wd - ww) / 2; wy = Math.max(top, Math.round((Hd - (wh + dockGap + dockH + below)) / 2));
      const yBelow = wy + wh + dockGap + dockH + 12;
      Object.assign(side.style, { left: pad + 'px', width: Wd - pad * 2 + 'px', top: yBelow + 'px' });
      const cw = compact ? 100 : 132, bw = (Wd - pad * 2 - cw - 20) / 2, yc = yBelow + rowH / 2;
      Object.assign(binNo.style, { left: pad + 'px', top: yc + 'px', width: bw + 'px', height: rowH + 'px' });
      Object.assign(binYes.style, { left: Wd - pad - bw + 'px', top: yc + 'px', width: bw + 'px', height: rowH + 'px' });

    Object.assign(win.style, { left: wx + 'px', top: wy + 'px', width: ww + 'px', height: wh + 'px' });
    const Vh = wh / c.h, Vw = Vh * 16 / 9;

    Object.assign(cam.style, { left: cl + 'px', top: ct + 'px', width: Vw + 'px', height: Vh + 'px' });
    $$('.tag').forEach(t => { const lab = $('.lab', t), half = (lab.offsetWidth || 90) / 2, ax = cl + parseFloat(t.style.left || 0) / 100 * Vw;
      t.style.setProperty('--dx', Math.max(0, 10 - (ax - half)) - Math.max(0, ax + half - (ww - 10)) + 'px'); });
    const inset = short ? 10 : wide ? 18 : 10;
    Object.assign(talk.style, { left: wx + inset + 'px', width: ww - inset * 2 + 'px', bottom: Hd - (wy + wh) + inset + 'px' });
    Object.assign(dock.style, { left: wx + ww / 2 + 'px', top: wy + wh + dockGap + 'px' });
  }
  function frameTo(crop, sideOn, sideW) { state.crop = crop; state.focus = crop.qui || null; state.sideOn = sideOn; state.sideW = sideW; layout(); side.classList.toggle('on', sideOn && side.children.length > 0); }
  /* resserrer la vidéo sur une personne, comme sur Kenji ; SC.plans dit où elle est dans chaque plan (les coupes de la vidéo) */
  const PLANS = (SC.plans || [{ de: 0 }]).slice().sort((a, b) => a.de - b.de);
  function cadre(qui, t) { let p = PLANS[0]; for (const x of PLANS) if (t >= x.de - .01) p = x; const cx = p.cx && p.cx[qui] != null ? p.cx[qui] : .5; return { a: SC.serre || .82, h: 1, cx, cy: .5, qui }; }
  function focus(qui, sideOn, sideW) { frameTo(qui ? cadre(qui, vid.currentTime) : CROPS.full, sideOn, sideW); }
  addEventListener('resize', () => { document.body.classList.add('boot'); layout(); requestAnimationFrame(() => document.body.classList.remove('boot')); idle.reset(); });

  /* ================= médias : une seule voix à la fois ================= */
  const SRC = DON.video;
  const voice = new Audio(SRC); voice.preload = 'auto';
  const CLIPS = DON.clips;
  const plainSp = t => t.replace(/[  ]/g, ' ');
  const clipEl = new Audio(); clipEl.preload = 'auto';
  const CLIPSN = {}; for (const [t, c] of Object.entries(CLIPS)) { c.el = clipEl; CLIPSN[plainSp(t)] = c; }
  const premier = Object.values(CLIPS)[0]; if (premier) clipEl.src = premier.src;
  const clipFor = t => CLIPSN[plainSp(t)] || null;
  vid.addEventListener('loadedmetadata', async () => {
    if (vid.seekable.length && vid.seekable.end(0) >= vid.duration - .5) return;
    try { const url = URL.createObjectURL(await (await fetch(SRC)).blob()); const t = vid.currentTime; vid.src = url; voice.src = url; vid.load(); seek(vid, t); } catch (e) {}
  }, { once: true });
  let unlocked = false;
  function unlock() {
    if (unlocked) return; unlocked = true;
    voice.muted = true; const p = voice.play(); if (p && p.then) p.then(() => { voice.pause(); voice.muted = false; }).catch(() => { voice.muted = false; });
    if (clipEl.src) {
      clipEl.muted = true; const q = clipEl.play();
      if (q && q.then) q.then(() => { if (clipEl.muted) { clipEl.pause(); try { clipEl.currentTime = 0; } catch (e) {} } clipEl.muted = false; }).catch(() => { clipEl.muted = false; });
    }

  }
  let media = 0;
  function stopAll() { media++; vid.pause(); voice.pause(); clipEl.pause(); if ('speechSynthesis' in window) try { speechSynthesis.cancel(); } catch (e) {} }

    return new Promise(res => {

  }

  async function playSegment(s, e, back) {

    vid.playbackRate = state.slow ? .75 : 1;
    await seek(vid, s); if (my !== media) return false;
    state.lineView = true;
    try { await vid.play(); } catch (err) { state.lineView = false; if (movingTok === my) movingTok = -1; return false; }
    await new Promise(res => { const loop = () => { if (my !== media) return res(); if (vid.currentTime >= e - .02 || vid.ended) { vid.pause(); return res(); } requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
    if (my !== media) { state.lineView = false; return false; }

    if (back != null && my === media) { const fz = freeze(back); movingTok = media; await fz; await wait(60); }
    if (movingTok === media) movingTok = -1;
    return true;
  }
  async function hear(s, e) {
    stopAll(); const my = media;
    voice.playbackRate = state.slow ? .75 : 1;
    await seek(voice, s); if (my !== media) return false;
    try { await voice.play(); } catch (err) { return false; }
    await new Promise(res => { const loop = () => { if (my !== media) { voice.pause(); return res(); } if (voice.currentTime >= e - .02 || voice.ended) { voice.pause(); return res(); } requestAnimationFrame(loop); }; requestAnimationFrame(loop); });

  }

  /* ================= voix de synthèse (secours, quand une consigne n'est pas enregistrée) ================= */
  let frVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    frVoice = vs.find(v => /^fr[-_]FR/i.test(v.lang) && /google|amélie|amelie|thomas|audrey|marie|denise|premium|enhanced|natural/i.test(v.name)) || vs.find(v => /^fr[-_]FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
  function speak(text) {
    stopAll(); const my = media;
    const est = 700 + text.length * (state.slow ? 95 : 72);
    return new Promise(res => {
      let done = false; const fin = () => { if (done) return; done = true; clearTimeout(to); res(my === media); };
