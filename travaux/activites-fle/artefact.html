<title>Activités FLE</title>
<meta name="theme-color" content="#f4efff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Activités FLE : la charte du premier positionnement (travaux/positionnement-fle), en plein écran.
   Fond uni violet → bleu ; tuiles hexagonales à plat, coins arrondis, face blanche lavande et tranche lavande ;
   jaune citron pour le choix ; vert et rose pour le juste et le faux ; cyan pour écouter ; panneaux ton sur ton.
   Polices Baloo 2 (titres) et Nunito (texte). Une activité = une scène, annoncée par un rideau. */
:root {
  --fond-1: #9748fe; --fond-2: #8745fd; --fond-3: #6d6cf8; --fond-4: #5f76f7;
  --ton: rgba(52, 22, 176, .24); --ton-fort: rgba(44, 16, 150, .34); --ombre: rgba(50, 18, 160, .2);
  --encre: #46288c; --encre-douce: #8676bf; --lavande: #ece4fd; --blanc-levre: #d6bff9;
  --citron-1: #fffc96; --citron-2: #ffe35a; --citron-levre: #f0b03a;
  --vert-1: #cdfc2a; --vert-2: #8fe60c; --vert-levre: #5fae0c;
  --cyan-1: #78fdf8; --cyan-2: #42d8ff; --cyan-levre: #2d92e6;
  --rose-1: #ffadf6; --rose-2: #ea62de; --rose-levre: #b53cae;
  --lilas-1: #eadfff; --lilas-2: #c7adff; --lilas-levre: #9473e6;
  --titre: "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif; --texte: "Nunito", "Segoe UI", system-ui, sans-serif; --main: "Caveat", "Segoe Print", cursive;
  --haut: 76px; --ressort: cubic-bezier(.2, 1.4, .4, 1); --doux-sortie: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { background: var(--fond-2); }
body { margin: 0; overflow: hidden; color: #fff; font: 700 17px/1.45 var(--texte); background: var(--fond-2); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fond { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, var(--fond-1) 0%, var(--fond-2) 40%, var(--fond-3) 80%, var(--fond-4) 100%); }

#scene { position: fixed; inset: 0; z-index: 1; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
#scene::-webkit-scrollbar { display: none; }
#scene.attente * { animation-play-state: paused !important; }
.scene { position: relative; display: flex; flex-direction: column; min-height: 100%; padding: calc(var(--haut) + env(safe-area-inset-top, 0px)) clamp(16px, 3.2vw, 44px) calc(24px + env(safe-area-inset-bottom, 0px)); }
@keyframes monte { from { opacity: 0; transform: translateY(16px); } }
@keyframes entre { from { opacity: 0; transform: translateY(22px) scale(.96); } }
@keyframes pose { from { opacity: 0; transform: scale(.6); } }
@keyframes apparait { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.6); } }
@keyframes rebond { from { opacity: 0; transform: translateY(20px) scale(.7); } }
@keyframes choisi { 45% { scale: 1.08; } }
@keyframes secoue { 20% { translate: -10px 0; } 40% { translate: 9px 0; } 60% { translate: -6px 0; } 80% { translate: 4px 0; } }
@keyframes appel { 50% { transform: scale(1.08); } }
@keyframes onde { from { transform: scale(.88); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
@keyframes flotte { 50% { translate: 0 -8px; } }
@keyframes tourne { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------ les tuiles hexagonales (SVG) */
.tuile { --w: 120px; position: relative; display: block; flex: none; width: var(--w); aspect-ratio: 120 / 112.92; padding: 0; border: 0; background: none; color: var(--encre); }
.tuile .socle { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tuile .dessus { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 120 / 103.92; transition: translate .1s; }
.tuile .dessus > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tuile .mot { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; padding: 0 13%; text-align: center; font: 800 calc(var(--w) * .16)/1.05 var(--titre); }
.tuile .mot svg { width: calc(var(--w) * .36); height: calc(var(--w) * .36); }
.marque .mot { font-size: 17px; }
.tuile .ombre { fill: var(--ombre); }
.blanc .face { fill: url(#g-blanc); } .blanc .levre { fill: var(--blanc-levre); }
.citron .face { fill: url(#g-citron); } .citron .levre { fill: var(--citron-levre); }
.vert .face { fill: url(#g-vert); } .vert .levre { fill: var(--vert-levre); }
.cyan .face { fill: url(#g-cyan); } .cyan .levre { fill: var(--cyan-levre); }
.rose .face { fill: url(#g-rose); } .rose .levre { fill: var(--rose-levre); }
.lilas .face { fill: url(#g-lilas); } .lilas .levre { fill: var(--lilas-levre); }
.ton .face { fill: rgba(255, 255, 255, .14); } .ton .levre { fill: rgba(40, 14, 140, .22); } .ton .ombre { fill: none; } .ton .mot { color: rgba(255, 255, 255, .6); }
button.tuile:active:not(:disabled) .dessus { translate: 0 4px; }
.picto { display: block; font-size: 30px; line-height: 1.1; }

/* boutons communs */
.rond { display: grid; place-items: center; width: 48px; height: 48px; flex: none; padding: 0; border: 0; border-radius: 50%; background: var(--ton); color: #fff; transition: transform .2s var(--ressort); }
.rond:hover { transform: scale(1.06); }
.rond:active { transform: scale(.94); }
.rond svg { width: 21px; height: 21px; }
.rond[aria-pressed="true"] { background: #fff; color: var(--encre); }
.rond.cyan-r { width: 60px; height: 60px; color: #fff; background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .45), 0 4px 0 var(--cyan-levre); }
.rond.cyan-r[aria-pressed="true"] { background: linear-gradient(var(--citron-1), var(--citron-2)); color: var(--encre); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .45), 0 4px 0 var(--citron-levre); }
.go { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 62px; padding: 0 34px; border: 0; border-radius: 20px; color: var(--encre); font: 800 21px/1 var(--titre); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
  background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: 0 5px 0 var(--vert-levre), 0 9px 0 var(--ombre); transition: translate .1s, transform .2s var(--ressort); }
.go:hover { transform: scale(1.03); }
.go:active { translate: 0 4px; box-shadow: 0 1px 0 var(--vert-levre), 0 5px 0 var(--ombre); }
.go svg { width: 22px; height: 22px; }
.go.blanc-b, .sec { background: linear-gradient(#ffffff, #f2ebff); box-shadow: 0 5px 0 var(--blanc-levre), 0 9px 0 var(--ombre); color: var(--encre); }
.sec { display: inline-flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 22px; border: 0; border-radius: 18px; font: 800 17px/1 var(--texte); transition: translate .1s; }
.sec:active { translate: 0 4px; box-shadow: 0 1px 0 var(--blanc-levre), 0 5px 0 var(--ombre); }
.sec svg { width: 20px; height: 20px; }

/* ------------------------------------------------------------ la barre du haut (pendant une activité) */
.haut { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; gap: 16px; height: calc(var(--haut) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) clamp(14px, 2.6vw, 32px) 0; pointer-events: none; }
.haut > * { pointer-events: auto; }
body:not([data-vue="activite"]) .haut { display: none; }
.progres { display: flex; flex: 1; justify-content: center; gap: 6px; min-width: 0; }
.seg { flex: 0 1 44px; min-width: 14px; height: 14px; border-radius: 4px; background: rgba(255, 255, 255, .22); }
.seg.fait { background: #fff; }
.seg.actuel { background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 3px 0 var(--citron-levre); animation: pose .4s cubic-bezier(.2, 1.6, .4, 1) both; }

/* ------------------------------------------------------------ le rideau entre deux activités */
#rideau { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; justify-items: center; gap: 6px; padding: 24px; overflow: hidden; text-align: center; cursor: pointer;
  background: linear-gradient(180deg, var(--fond-1) 0%, var(--fond-2) 40%, var(--fond-3) 80%, var(--fond-4) 100%); }
#rideau .rayons { top: 38%; opacity: .12; }
#rideau .r-tuile { position: relative; z-index: 2; margin-bottom: 14px; animation: medaille .9s cubic-bezier(.2, 1.4, .3, 1) .2s both; }
#rideau .r-tuile .tuile { --w: clamp(130px, 13vw, 180px); }
#rideau .r-mot { position: relative; z-index: 2; display: flex; margin: 0; font: 800 clamp(60px, 11vw, 160px)/.95 var(--titre); text-shadow: 0 5px 0 rgba(46, 16, 150, .3); }
#rideau .r-mot span { display: inline-block; animation: lettre .6s var(--ressort) backwards; animation-delay: calc(.4s + var(--i) * 38ms); }
@keyframes lettre { from { opacity: 0; transform: translateY(.4em) scale(.6); } }
#rideau .r-titre { position: relative; z-index: 2; margin: 12px 0 0; font-size: clamp(18px, 2vw, 24px); font-weight: 800; color: rgba(255, 255, 255, .85); animation: apparait .6s ease .75s backwards; }
#rideau .r-num { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); margin: 0; font: 800 17px/1 var(--titre); letter-spacing: .12em; color: rgba(255, 255, 255, .7); transform: translateX(-50%); }
@keyframes medaille { 0% { transform: scale(.2) rotate(-200deg); opacity: 0; } 70% { transform: scale(1.1) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
.rayons { position: absolute; left: 50%; top: 34%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%; opacity: .16; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, #fff 0deg 7deg, transparent 7deg 20deg);
  -webkit-mask-image: radial-gradient(closest-side, #000 15%, transparent 70%); mask-image: radial-gradient(closest-side, #000 15%, transparent 70%); animation: tourne 22s linear infinite; }
.lueur { position: absolute; left: 50%; top: 34%; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, rgba(255, 255, 255, .35), rgba(255, 255, 255, 0)); animation: respire 2.6s ease-in-out infinite; }
@keyframes respire { 50% { transform: scale(1.12); opacity: .75; } }

/* ------------------------------------------------------------ l'accueil */
.accueil { gap: 10px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
.acc-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marque { display: flex; align-items: center; gap: 12px; font: 800 18px/1 var(--titre); letter-spacing: .02em; }
.marque .tuile { --w: 46px; }
.acc-outils { display: flex; align-items: center; gap: 10px; }
.niveaux { display: flex; padding: 4px; border-radius: 999px; background: var(--ton); }
.niveaux button { min-width: 52px; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: #fff; font: 800 16px/1 var(--titre); }
.niveaux button[aria-pressed="true"] { background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 3px 0 var(--citron-levre); color: var(--encre); }
.geant { margin: clamp(6px, 3vh, 34px) 0 0; font: 800 clamp(64px, 11vw, 168px)/.9 var(--titre); text-shadow: 0 6px 0 rgba(46, 16, 150, .3); text-wrap: balance; animation: rebond .7s var(--ressort) backwards; }
.acc-sous { margin: 4px 0 0; color: rgba(255, 255, 255, .85); font-size: clamp(18px, 1.8vw, 23px); font-weight: 800; animation: rebond .6s var(--ressort) .1s backwards; }
.chemin { position: relative; flex: 1; min-height: 300px; margin: 8px 0; }
.chemin .trace { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chemin .trace path { fill: none; stroke: rgba(255, 255, 255, .5); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1 16; animation: marche 1.4s linear infinite; }
@keyframes marche { to { stroke-dashoffset: -17; } }
.orbe { --w: clamp(92px, 9vw, 132px); position: absolute; margin: calc(var(--w) * -.47) 0 0 calc(var(--w) / -2); animation: flotte 5.5s ease-in-out infinite, pose .5s var(--ressort) backwards; animation-delay: var(--dl), calc(var(--k) * 70ms + .15s); transition: scale .3s var(--ressort); }
.orbe:hover { scale: 1.1; }
.orbe.actuelle { --w: clamp(112px, 11vw, 160px); }
.orbe.actuelle .dessus { animation: appel 1.3s ease-in-out infinite; }
.orbe .badge { position: absolute; z-index: 2; top: 0; right: 4%; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: inset 0 0 0 3px #fff, 0 3px 0 var(--vert-levre); color: var(--encre); animation: pop .45s cubic-bezier(.2, 1.8, .4, 1) backwards; }
.orbe .badge svg { width: 18px; height: 18px; }
.orbe .etiq { position: absolute; z-index: 2; top: calc(100% + 10px); left: 50%; padding: 5px 14px; border-radius: 999px; background: #fff; box-shadow: 0 3px 0 var(--blanc-levre); color: var(--encre); font: 800 15px/1.2 var(--titre); white-space: nowrap; transform: translateX(-50%); opacity: 0; transition: opacity .25s; pointer-events: none; }
.orbe:hover .etiq, .orbe.actuelle .etiq { opacity: 1; }
.acc-bas { display: flex; align-items: center; justify-content: center; gap: 14px; padding-bottom: 10px; animation: rebond .6s var(--ressort) .45s backwards; }
.acc-bas .go { min-height: 72px; padding: 0 52px; font-size: 25px; }
.acc-bas .rond { width: 62px; height: 62px; }

/* ------------------------------------------------------------ réponses : alvéoles hexagonales ou pastilles */
.q { margin: 0; font: 800 clamp(26px, 2.5vw, 40px)/1.12 var(--titre); text-wrap: balance; animation: monte .4s var(--doux-sortie) .05s both; }
.alveoles { --w: clamp(128px, 11.5vw, 168px); --g: 12px; position: relative; flex: none; width: calc(var(--w) * 2.5 + var(--g) * 1.732); height: calc(var(--w) * 1.807 + var(--g)); margin: 10px auto 8px; padding: 0; }
.alveoles > .tuile { position: absolute; --w: inherit; animation: pose .45s var(--ressort) both; animation-delay: calc(.1s + var(--n) * .07s); }
.alveoles > .tuile:nth-child(1) { left: calc(50% - var(--w) / 2); top: 0; }
.alveoles > .tuile:nth-child(2) { left: 0; top: calc(var(--w) * .433 + var(--g) / 2); }
.alveoles > .tuile:nth-child(3) { right: 0; top: calc(var(--w) * .433 + var(--g) / 2); }
.alveoles > .tuile:nth-child(4) { left: calc(50% - var(--w) / 2); top: calc(var(--w) * .866 + var(--g)); }
.alveoles.longs .mot { font-size: calc(var(--w) * .125); padding: 0 8%; }
.alveoles.pictos .mot { font-size: calc(var(--w) * .12); }
.tuile .ch-etat { position: absolute; z-index: 2; top: -2%; right: 6%; display: grid; place-items: center; width: 30%; aspect-ratio: 1; border-radius: 50%; color: var(--encre); transform: scale(0); transition: transform .4s cubic-bezier(.2, 1.8, .4, 1); }
.tuile .ch-etat svg { width: 58%; height: 58%; }
.tuile.juste .face { fill: url(#g-vert); } .tuile.juste .levre { fill: var(--vert-levre); }
.tuile.juste .ch-etat { transform: scale(1); background: #fff; box-shadow: 0 3px 0 var(--vert-levre); }
.tuile.faux .face { fill: url(#g-rose); } .tuile.faux .levre { fill: var(--rose-levre); }
.tuile.faux .ch-etat { transform: scale(1); background: #fff; box-shadow: 0 3px 0 var(--rose-levre); }
.tuile.juste .dessus, .tuile.revele .dessus { animation: choisi .35s cubic-bezier(.2, 1.6, .4, 1); }
.alveoles > .tuile.faux { animation: secoue .45s ease; }
.tuile.eteint { opacity: .35; }
.tuile.barree { opacity: .3; }
.bonbons { display: grid; gap: 14px; }
.bonbons > button { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 14px 56px 14px 18px; border: 0; border-radius: 20px; text-align: left; color: var(--encre); font: 800 clamp(18px, 1.6vw, 22px)/1.3 var(--texte);
  background: linear-gradient(#ffffff, #f2ebff); box-shadow: 0 5px 0 var(--blanc-levre), 0 9px 0 var(--ombre); animation: monte .4s var(--doux-sortie) both; animation-delay: calc(.08s + var(--n) * .05s); transition: translate .1s, opacity .3s; }
.bonbons > button:active:not(:disabled) { translate: 0 4px; box-shadow: 0 1px 0 var(--blanc-levre), 0 5px 0 var(--ombre); }
.bonbons > button:disabled { cursor: default; }
.marque-h { flex: none; width: 28px; height: 24px; }
.marque-h path { fill: #e3d8fb; }
.marque-h .coche { fill: none; stroke: #fff; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.bonbons .ch-etat { position: absolute; right: 14px; top: 50%; display: grid; place-items: center; width: 34px; height: 34px; margin-top: -17px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .4s cubic-bezier(.2, 1.8, .4, 1); }
.bonbons .ch-etat svg { width: 20px; height: 20px; }
.bonbons > .juste { background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: 0 5px 0 var(--vert-levre), 0 9px 0 var(--ombre); animation: choisi .35s cubic-bezier(.2, 1.6, .4, 1); }
.bonbons > .faux { background: linear-gradient(var(--rose-1), var(--rose-2)); box-shadow: 0 5px 0 var(--rose-levre), 0 9px 0 var(--ombre); animation: secoue .45s ease; }
.bonbons > .juste .ch-etat, .bonbons > .faux .ch-etat { transform: scale(1); }
.bonbons > .juste .marque-h path:first-child, .bonbons > .faux .marque-h path:first-child { fill: var(--encre); }
.bonbons > .juste .marque-h .coche { opacity: 1; }
.bonbons > .eteint { opacity: .4; }
.bonbons > .barree { opacity: .35; text-decoration: line-through; }
.trait path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: traceok .45s ease .1s forwards; }
@keyframes traceok { to { stroke-dashoffset: 0; } }

/* le retour après une réponse, et le bouton pour continuer */
.dock-place { min-height: 84px; margin-top: auto; padding-top: 18px; }
.dock { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 14px; animation: rebond .45s var(--ressort) backwards; }
.dock-mot { display: flex; align-items: center; gap: 12px; margin-right: auto; font: 800 clamp(22px, 2.2vw, 30px)/1 var(--titre); }
.dock-mot i { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--encre); }
.dock-mot i svg { width: 24px; height: 24px; }
.dock.ok .dock-mot i { background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: inset 0 0 0 3px #fff, 0 3px 0 var(--vert-levre); }
.dock.ko .dock-mot i { background: linear-gradient(var(--rose-1), var(--rose-2)); box-shadow: inset 0 0 0 3px #fff, 0 3px 0 var(--rose-levre); }

/* le panneau des questions (vidéo, lecture) : ton sur ton */
.panneau-q { display: flex; flex-direction: column; gap: 20px; padding: clamp(22px, 2.6vw, 38px); border-radius: 34px; background: var(--ton); }
.pq-tete { display: flex; align-items: center; gap: 12px; font: 800 16px/1 var(--titre); letter-spacing: .06em; color: rgba(255, 255, 255, .8); }
.pq-tete .num { margin-left: auto; }
.glisse { animation: glisse .5s var(--doux-sortie) backwards; }
@keyframes glisse { from { opacity: 0; transform: translateX(40px); } }

/* écouter : un bouton cyan, une onde qui bouge avec la voix */
.ecoute { display: inline-flex; align-items: center; gap: 14px; height: 62px; padding: 0 22px 0 8px; border: 0; border-radius: 999px; color: var(--encre); font: 800 17px/1 var(--titre); letter-spacing: .02em;
  background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .45), 0 4px 0 var(--cyan-levre); transition: translate .1s; }
.ecoute:active { translate: 0 3px; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .45), 0 1px 0 var(--cyan-levre); }
.ecoute .rondp { display: grid; place-items: center; width: 46px; height: 46px; flex: none; border-radius: 50%; background: #fff; color: var(--cyan-levre); }
.ecoute .rondp svg { width: 20px; height: 20px; }
.ecoute canvas { width: 104px; height: 32px; }
.ecoute.petite { height: 50px; padding: 0 16px 0 6px; font-size: 15px; } .ecoute.petite .rondp { width: 38px; height: 38px; } .ecoute.petite canvas { width: 66px; height: 24px; }

/* les mots qui s'allument au rythme de la voix (sur le violet / sur le blanc) */
.kara .k { transition: color .18s; }
.kara.suit .k { color: rgba(255, 255, 255, .42); }
.kara.suit .k.dit { color: #fff; }
.kara.suit .k.actuel { color: var(--citron-1); }
.encre .kara.suit .k, .kara.encre.suit .k { color: rgba(70, 40, 140, .32); }
.encre .kara.suit .k.dit, .kara.encre.suit .k.dit { color: var(--encre); }
.encre .kara.suit .k.actuel, .kara.encre.suit .k.actuel { color: var(--fond-1); }

/* ------------------------------------------------------------ vidéo (ou photo et son, en attendant la vidéo) */
.sc-video { padding: 0; min-height: 100%; height: 100%; overflow: hidden; }
.ecran { position: absolute; inset: 0; overflow: hidden; background: #3a1d8f; transition: filter .7s; }
.ecran .vis { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ecran img.vis { animation: kb 26s ease-in-out infinite alternate; }
@keyframes kb { from { transform: scale(1.04); } to { transform: scale(1.17) translate(-2%, -1.4%); } }
.ecran .voile { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(74, 24, 190, .66) 0%, rgba(74, 24, 190, .1) 34%, rgba(74, 24, 190, .12) 55%, rgba(60, 40, 200, .8) 100%); }
.ecran .onde-g { position: absolute; left: 50%; bottom: 150px; width: min(820px, 88vw); height: 150px; transform: translateX(-50%); transition: opacity .5s; }
.ecran .fil { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255, 255, 255, .2); }
.ecran .fil i { display: block; width: var(--p, 0%); height: 100%; background: linear-gradient(90deg, var(--citron-1), var(--citron-2)); }
.ecran .st { position: absolute; left: 50%; bottom: 140px; max-width: min(960px, 90vw); margin: 0; padding: 12px 26px; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 var(--blanc-levre); color: var(--encre); font: 800 clamp(22px, 2.4vw, 32px)/1.25 var(--texte); text-align: center; transform: translateX(-50%); animation: apparait .25s ease; }
.ecran .st b { display: block; color: var(--encre-douce); font: 800 14px/1.3 var(--titre); letter-spacing: .08em; text-transform: uppercase; }
.ecoute-ui { position: absolute; inset: calc(var(--haut) + env(safe-area-inset-top, 0px)) clamp(16px, 4vw, 60px) calc(30px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; pointer-events: none; transition: opacity .45s, transform .45s; }
.ecoute-ui > * { pointer-events: auto; }
.a-venir { align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: var(--ton-fort); font-size: 14px; font-weight: 800; }
.ecoute-q { max-width: 17ch; margin: 18px 0 0; font: 800 clamp(34px, 4.6vw, 70px)/1 var(--titre); text-shadow: 0 5px 0 rgba(46, 16, 150, .35); text-wrap: balance; animation: rebond .7s var(--ressort) .1s backwards; }
.ecoute-q small { display: block; margin-bottom: 12px; font: 800 16px/1 var(--titre); letter-spacing: .14em; text-transform: uppercase; text-shadow: none; color: rgba(255, 255, 255, .85); }
.ctrl { display: flex; align-items: center; gap: 14px; margin-top: auto; }
.ctrl .go { margin-left: auto; }
.ctrl .appelle { animation: appel 1.2s ease-in-out infinite; }
.sc-video .panneau-q { position: absolute; z-index: 2; overflow-y: auto; scrollbar-width: none; background: linear-gradient(180deg, var(--fond-1) 0%, var(--fond-2) 40%, var(--fond-3) 80%, var(--fond-4) 100%); transition: transform .6s var(--doux-sortie), opacity .4s; }
.sc-video.phase-ecoute .panneau-q { opacity: 0; pointer-events: none; }
.sc-video.phase-reponse .ecoute-ui { opacity: 0; transform: translateY(20px); pointer-events: none; }
.sc-video.phase-reponse .ecoute-ui * { pointer-events: none; }
.sc-video.phase-reponse .ecran { filter: brightness(.86) saturate(.95); }
.sc-video.phase-reponse .onde-g { opacity: .45; }
.relire { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 6px; border: 0; border-radius: 999px; color: var(--encre); font: 800 15px/1 var(--titre); letter-spacing: .03em; background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: 0 3px 0 var(--cyan-levre); }
.relire .rondp { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #fff; color: var(--cyan-levre); }
.relire svg { width: 16px; height: 16px; }
.transcrit { display: grid; gap: 12px; }
.transcrit .ligne { margin: 0; padding: 12px 18px; border-radius: 20px 20px 20px 6px; background: var(--ton); font: 800 clamp(20px, 1.8vw, 25px)/1.4 var(--texte); }
.transcrit .ligne b { display: block; font: 800 13px/1.4 var(--titre); letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .7); }

/* ------------------------------------------------------------ lecture : le document, les questions à côté */
.sc-lecture { gap: 24px; }
.table { display: grid; place-items: center; min-height: 240px; padding: 12px 0; }
.objet { position: relative; width: min(640px, 100%); color: var(--encre); animation: depose .7s var(--ressort) backwards; }
@keyframes depose { from { opacity: 0; transform: translateY(-40px) rotate(-6deg) scale(.95); } }
.legende { margin: 16px 0 0; color: rgba(255, 255, 255, .8); font-size: 17px; font-weight: 800; text-align: center; animation: apparait .6s ease .5s backwards; }
.o-panneau { display: grid; justify-items: center; color: #d0193f; transform-origin: 50% 0; animation: depose .7s var(--ressort) backwards, balance 3.4s ease-out .5s; }
@keyframes balance { 0% { transform: rotate(0); } 12% { transform: rotate(5deg); } 30% { transform: rotate(-3.5deg); } 48% { transform: rotate(2.2deg); } 66% { transform: rotate(-1.2deg); } 84% { transform: rotate(.5deg); } 100% { transform: rotate(0); } }
.o-panneau .ficelle { width: 60%; height: 80px; }
.o-panneau .ficelle path { fill: none; stroke: rgba(255, 255, 255, .7); stroke-width: 3; }
.o-panneau .ficelle circle { fill: #fff; }
.o-panneau strong { display: block; margin-top: -4px; padding: clamp(20px, 3vw, 34px) clamp(26px, 4vw, 52px); border: 7px solid currentColor; border-radius: 18px; background: #fff; box-shadow: 0 6px 0 var(--blanc-levre); font: 800 clamp(36px, 4.6vw, 68px)/1.05 var(--titre); letter-spacing: .06em; text-align: center; }
.o-panneau.sortie strong { background: #11905a; color: #fff; border-color: #0b6a42; box-shadow: 0 6px 0 #0b6a42; }
.o-panneau.neutre { color: #26357a; }
.o-tel { width: min(400px, 100%); min-height: 420px; padding: 18px; border-radius: 44px; background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); }
.o-tel .tel-tete { display: flex; align-items: center; gap: 12px; padding: 6px 6px 16px; border-bottom: 2px solid var(--lavande); }
.o-tel .tel-av { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(var(--rose-1), var(--rose-2)); color: #fff; font: 800 22px/1 var(--titre); }
.o-tel .tel-tete b { font: 800 19px/1.1 var(--titre); }
.o-tel .tel-tete small { display: block; color: var(--encre-douce); font-size: 13px; }
.o-tel .tel-fil { display: grid; gap: 10px; padding: 22px 4px; }
.bulle-sms { justify-self: start; max-width: 90%; margin: 0; padding: 14px 20px; border-radius: 24px 24px 24px 6px; background: var(--lavande); font-size: clamp(20px, 1.9vw, 24px); font-weight: 800; line-height: 1.35; }
.bulle-sms.arrive { animation: bulle .5s var(--ressort) backwards; transform-origin: 0 100%; }
@keyframes bulle { from { opacity: 0; transform: scale(.4); } }
.points { display: inline-flex; gap: 6px; }
.points i { width: 10px; height: 10px; border-radius: 50%; background: var(--encre-douce); animation: saute 1s ease-in-out infinite; }
.points i:nth-child(2) { animation-delay: .15s; } .points i:nth-child(3) { animation-delay: .3s; }
@keyframes saute { 30% { transform: translateY(-7px); opacity: .6; } }
.o-prix { display: grid; justify-items: center; gap: 2px; width: min(360px, 100%); padding: 36px 30px 28px; border-radius: 18px; background: #fff7d6; box-shadow: 0 6px 0 #e9cf7a; rotate: -3deg; }
.o-prix::before { content: ""; position: absolute; top: 12px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--fond-2); }
.o-prix b { font: 800 26px/1.1 var(--titre); } .o-prix strong { font: 800 clamp(54px, 6vw, 80px)/1 var(--titre); color: #d0193f; } .o-prix span { font-size: 19px; }
.o-plaque { width: min(560px, 100%); padding: 38px 44px; border-radius: 14px; color: #3c3f46; text-align: center; background: linear-gradient(160deg, #f4f5f7, #c9ccd3 55%, #eef0f3); box-shadow: inset 0 0 0 3px #a9adb6, 0 6px 0 rgba(40, 14, 140, .25); }
.o-plaque .vis { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #8e939c); }
.o-plaque .vis:nth-of-type(1) { left: 14px; top: 14px; } .o-plaque .vis:nth-of-type(2) { right: 14px; top: 14px; } .o-plaque .vis:nth-of-type(3) { left: 14px; bottom: 14px; } .o-plaque .vis:nth-of-type(4) { right: 14px; bottom: 14px; }
.o-plaque p { margin: 6px 0; font: 800 clamp(24px, 2.4vw, 32px)/1.2 var(--titre); }
.o-ardoise { width: min(560px, 100%); padding: 32px 36px 38px; border: 14px solid #c49a62; border-radius: 18px; background: radial-gradient(120% 90% at 30% 20%, #3b4a44, #27322d); box-shadow: 0 6px 0 rgba(40, 14, 140, .3); color: #f4f1e6; text-align: center; font-family: var(--main); }
.o-ardoise h4 { margin: 0; font-size: clamp(42px, 4.4vw, 60px); font-weight: 700; line-height: 1; }
.o-ardoise .jour { margin: 8px 0 14px; font-size: 26px; opacity: .8; }
.o-ardoise ul { margin: 0; padding: 0; list-style: none; font-size: clamp(30px, 3vw, 40px); line-height: 1.3; }
.o-affiche, .o-fiche, .o-lettre { overflow: hidden; border-radius: 20px; background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); }
.o-affiche { width: min(600px, 100%); padding: 0 0 26px; text-align: center; }
.o-affiche h4 { margin: 0 0 18px; padding: 16px; background: #26357a; color: #fff; font: 800 clamp(26px, 3vw, 40px)/1.1 var(--titre); letter-spacing: .08em; }
.o-affiche p { margin: 0 28px 10px; font-size: clamp(19px, 1.8vw, 23px); font-weight: 800; line-height: 1.45; }
.o-fiche { width: min(600px, 100%); padding: 30px 34px; }
.o-fiche h4 { margin: 0 0 12px; font: 800 clamp(26px, 2.6vw, 34px)/1.15 var(--titre); }
.o-fiche p { margin: 0 0 6px; font-size: clamp(20px, 1.9vw, 24px); font-weight: 700; line-height: 1.5; }
.o-lettre { width: min(660px, 100%); padding: clamp(26px, 3vw, 40px); }
.o-lettre h4 { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; font: 800 clamp(24px, 2.4vw, 32px)/1.15 var(--titre); }
.o-lettre h4 .em { display: grid; place-items: center; width: 54px; height: 54px; flex: none; border-radius: 16px; background: var(--lavande); font-size: 28px; }
.o-lettre p { margin: 0 0 12px; font-size: clamp(19px, 1.7vw, 22px); font-weight: 600; line-height: 1.6; text-wrap: pretty; }
.o-lettre.affiche { box-shadow: inset 0 9px 0 var(--citron-2), 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); }
.o-lettre.info { box-shadow: inset 9px 0 0 var(--cyan-2), 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); }
.o-lettre.courrier p { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }

/* ------------------------------------------------------------ grammaire : le mot choisi vole jusqu'au trou */
.sc-gram { align-items: center; justify-content: center; }
.gram { display: flex; flex-direction: column; align-items: center; gap: clamp(20px, 4vh, 44px); width: min(1100px, 100%); flex: 1; justify-content: center; text-align: center; }
.g-avant { margin: 0; color: rgba(255, 255, 255, .85); font-size: clamp(19px, 1.8vw, 24px); font-weight: 800; }
.g-phrase { margin: 0; font: 800 clamp(34px, 5vw, 74px)/1.35 var(--texte); text-wrap: balance; animation: rebond .6s var(--ressort) backwards; }
.g-phrase.form { padding: .45em .8em; border-radius: 26px; background: var(--ton); font-size: clamp(30px, 4.2vw, 58px); }
.fente { display: inline-flex; align-items: center; justify-content: center; min-width: 3.2em; height: 1.2em; padding: 0 .3em; margin: 0 .06em; vertical-align: -.14em; border-radius: .24em; background: rgba(255, 255, 255, .2); box-shadow: inset 0 -.08em 0 rgba(255, 255, 255, .5); transition: min-width .35s; }
.fente.vide { animation: respire-f 2s ease-in-out infinite; }
@keyframes respire-f { 50% { background-color: rgba(255, 255, 255, .32); } }
.fente.pleine { min-width: 0; background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 .08em 0 var(--citron-levre); color: var(--encre); }
.fente.juste { background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: 0 .08em 0 var(--vert-levre); animation: pop .35s cubic-bezier(.2, 1.7, .4, 1); }
.fente.faux { background: linear-gradient(var(--rose-1), var(--rose-2)); box-shadow: 0 .08em 0 var(--rose-levre); animation: secoue .45s ease; }
.fente.cache { color: transparent; }
.g-indice { margin: -6px 0 0; padding: 6px 16px; border-radius: 999px; background: var(--ton); font-size: 19px; font-weight: 800; }
.g-mots { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.g-mots span { padding: 10px 22px; border-radius: 14px; background: #fff; box-shadow: 0 5px 0 var(--blanc-levre); color: var(--encre); font: 800 clamp(26px, 3vw, 40px)/1.2 var(--texte); animation: pose .5s var(--ressort) backwards; }
.g-mots span:nth-child(1) { rotate: -3deg; } .g-mots span:nth-child(2) { rotate: 3deg; animation-delay: .08s; } .g-mots span:nth-child(3) { rotate: -2deg; animation-delay: .16s; }
.vol { position: fixed !important; z-index: 60; margin: 0 !important; pointer-events: none; animation: none !important; }
.gram .bonbons { width: min(820px, 100%); }
.gram .dock-place { width: min(820px, 100%); margin-top: 0; }

/* ------------------------------------------------------------ réagir : une conversation */
.sc-chat { align-items: center; }
.chat { display: flex; flex-direction: column; gap: 22px; width: min(920px, 100%); flex: 1; justify-content: center; }
.chat .dock-place, .studio .dock-place { margin-top: 0; }
.interloc { display: flex; align-items: flex-end; gap: 18px; animation: monte .5s var(--doux-sortie) backwards; }
.avatar { width: clamp(80px, 9vw, 120px); aspect-ratio: 1; flex: none; border: 5px solid #fff; border-radius: 50%; object-fit: cover; background: #fff; box-shadow: 0 5px 0 var(--blanc-levre); }
.interloc small { display: block; margin: 0 0 8px 6px; color: rgba(255, 255, 255, .8); font-size: 15px; font-weight: 800; }
.bulle-l { margin: 0; padding: 20px 30px; border-radius: 34px 34px 34px 8px; background: #fff; box-shadow: 0 5px 0 var(--blanc-levre); color: var(--encre); font: 800 clamp(26px, 3vw, 44px)/1.2 var(--texte); transform-origin: 0 100%; }
.sit { display: flex; align-items: center; gap: 22px; padding: clamp(20px, 2.4vw, 30px); border-radius: 30px; background: var(--ton); animation: monte .5s var(--doux-sortie) backwards; }
.sit .em { font-size: clamp(54px, 6vw, 80px); line-height: 1; animation: pop .6s cubic-bezier(.2, 1.7, .4, 1) .2s backwards; }
.sit p { margin: 0; font: 800 clamp(24px, 2.6vw, 36px)/1.2 var(--texte); text-wrap: balance; }
.chat-q { margin: 4px 0 0; align-self: flex-end; color: rgba(255, 255, 255, .85); font: 800 19px/1 var(--titre); letter-spacing: .03em; animation: apparait .5s ease .3s backwards; }
.reps { display: grid; gap: 14px; justify-items: end; }
.reps .rep { position: relative; display: flex; align-items: center; gap: 12px; max-width: 92%; padding: 15px 26px; border: 0; border-radius: 28px 28px 8px 28px; text-align: right; color: var(--encre); font: 800 clamp(20px, 2vw, 27px)/1.25 var(--texte);
  background: linear-gradient(#ffffff, #f2ebff); box-shadow: 0 5px 0 var(--blanc-levre), 0 9px 0 var(--ombre); animation: monte .45s var(--doux-sortie) backwards; animation-delay: calc(var(--k) * 80ms + .35s); transition: translate .1s, opacity .35s, transform .3s var(--ressort); }
.reps .rep:hover:not(:disabled) { transform: translateX(-6px); }
.reps .rep:disabled { cursor: default; }
.reps .rep.envoyee { background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 5px 0 var(--citron-levre), 0 9px 0 var(--ombre); }
.reps .rep.envoyee.ok { background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: 0 5px 0 var(--vert-levre), 0 9px 0 var(--ombre); }
.reps .rep.envoyee.faux { background: linear-gradient(var(--rose-1), var(--rose-2)); box-shadow: 0 5px 0 var(--rose-levre), 0 9px 0 var(--ombre); animation: secoue .45s ease; }
.reps .rep .reac { position: absolute; left: -20px; bottom: -14px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: #fff; box-shadow: 0 3px 0 var(--blanc-levre); font-size: 23px; animation: pop .5s cubic-bezier(.2, 1.8, .4, 1) .2s backwards; }
.reps .rep.part { opacity: 0; transform: translateX(30px) scale(.96); pointer-events: none; }
.reps .rep.bonne-rep { display: block; background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: 0 5px 0 var(--vert-levre), 0 9px 0 var(--ombre); animation: rebond .45s var(--ressort) backwards; }
.reps .rep.bonne-rep small { display: block; font: 800 14px/1.3 var(--titre); letter-spacing: .05em; opacity: .75; }

/* ------------------------------------------------------------ écrire : la feuille blanche */
.sc-ecrit { gap: 22px; }
.feuille { display: flex; flex-direction: column; gap: 18px; padding: clamp(24px, 3vw, 44px); border-radius: 30px; background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); color: var(--encre); animation: monte .5s var(--doux-sortie) backwards; }
.feuille .consigne-e { margin: 0; font: 800 clamp(28px, 3vw, 44px)/1.1 var(--titre); text-wrap: balance; }
.feuille textarea { flex: 1; min-height: 220px; width: 100%; padding: 0 4px; border: 0; outline: none; resize: none; background: repeating-linear-gradient(transparent 0 46px, var(--lavande) 46px 48px); color: var(--encre); font: 700 clamp(21px, 1.9vw, 25px)/48px var(--texte); }
.feuille textarea::placeholder { color: #c2b5e6; }
.jauge { display: flex; align-items: center; gap: 16px; }
.jauge .piste { position: relative; flex: 1; height: 18px; overflow: hidden; border-radius: 999px; background: var(--lavande); }
.jauge .piste i { position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); border-radius: 999px; background: linear-gradient(var(--citron-1), var(--citron-2)); transition: width .35s var(--doux-sortie); }
.jauge.atteint .piste i { background: linear-gradient(var(--vert-1), var(--vert-2)); }
.jauge b { min-width: 7.5em; font: 800 19px/1 var(--titre); text-align: right; color: var(--encre-douce); }
.jauge.atteint b { color: var(--vert-levre); }
.champs { display: grid; gap: 14px; }
.champs label { display: grid; gap: 4px; color: var(--encre-douce); font: 800 15px/1.2 var(--titre); letter-spacing: .03em; }
.champs input { height: 60px; padding: 0 18px; border: 3px solid var(--lavande); border-radius: 16px; background: #fff; color: var(--encre); font: 800 22px/1 var(--texte); outline: none; transition: border-color .2s; }
.champs input:focus { border-color: var(--fond-1); }
.support-e { display: grid; place-items: center; }
.photo-g { width: 100%; overflow: hidden; border: 6px solid #fff; border-radius: 30px; background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); animation: depose .7s var(--ressort) backwards; }
.photo-g img { display: block; width: 100%; height: 100%; max-height: 68vh; border-radius: 24px; object-fit: cover; animation: kb 26s ease-in-out infinite alternate; }
.exemple { display: flex; flex-direction: column; gap: 16px; padding: clamp(24px, 3vw, 40px); border-radius: 30px; background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); color: var(--encre); text-align: left; animation: glisse .6s var(--doux-sortie) backwards; }
.exemple h3 { align-self: flex-start; margin: 0; padding: 8px 18px; border-radius: 14px; background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 4px 0 var(--citron-levre); font: 800 clamp(22px, 2vw, 28px)/1 var(--titre); }
.exemple .texte-ex { margin: 0; font-size: clamp(20px, 1.8vw, 24px); font-weight: 700; line-height: 1.6; white-space: pre-line; }
.exemple .fiche-ex p { margin: 0; padding: 10px 0; border-bottom: 2px dashed var(--lavande); font-size: 21px; }
.verif { display: grid; gap: 12px; }
.verif h4 { margin: 6px 0 0; color: var(--encre-douce); font: 800 15px/1 var(--titre); letter-spacing: .1em; text-transform: uppercase; }
.verif button { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 10px 18px; border: 0; border-radius: 18px; text-align: left; color: var(--encre); font: 800 clamp(17px, 1.5vw, 20px)/1.3 var(--texte);
  background: var(--lavande); box-shadow: 0 4px 0 var(--blanc-levre); animation: monte .4s var(--doux-sortie) backwards; animation-delay: calc(var(--k) * 70ms + .4s); transition: translate .1s; }
.verif button:active { translate: 0 3px; box-shadow: 0 1px 0 var(--blanc-levre); }
.verif button .marque-h path:first-child { fill: #fff; }
.verif button[aria-pressed="true"] { background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: 0 4px 0 var(--vert-levre); }
.verif button[aria-pressed="true"] .marque-h path:first-child { fill: var(--encre); }
.verif button[aria-pressed="true"] .marque-h .coche { opacity: 1; }
.mon-texte { margin: 0; font-size: clamp(19px, 1.7vw, 22px); line-height: 1.6; white-space: pre-wrap; }
.mon-texte:empty::before { content: "(rien d'écrit)"; color: var(--encre-douce); }

/* ------------------------------------------------------------ parler : le studio */
.sc-oral { gap: 24px; }
.studio { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(16px, 3vh, 30px); flex: 1; text-align: center; }
.consigne-o { max-width: 24ch; margin: 0; font: 800 clamp(28px, 3vw, 46px)/1.1 var(--titre); text-wrap: balance; animation: rebond .6s var(--ressort) backwards; }
.phrase-o { max-width: 20ch; margin: 0; font: 900 clamp(38px, 4.6vw, 68px)/1.15 var(--texte); text-wrap: balance; animation: rebond .6s var(--ressort) .1s backwards; }
.micro-g { position: relative; display: grid; place-items: center; width: clamp(140px, 14vw, 180px); aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%; color: #fff;
  background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: inset 0 0 0 8px rgba(255, 255, 255, .4), 0 7px 0 var(--cyan-levre); transition: translate .1s, transform .25s var(--ressort); animation: pose .5s var(--ressort) .2s backwards; }
.micro-g:hover { transform: scale(1.04); }
.micro-g:active { translate: 0 5px; box-shadow: inset 0 0 0 8px rgba(255, 255, 255, .4), 0 2px 0 var(--cyan-levre); }
.micro-g .ic-m { position: relative; z-index: 1; display: grid; place-items: center; width: 34%; height: 34%; }
.micro-g .ic-m svg { width: 100%; height: 100%; }
.micro-g canvas { position: absolute; left: -45%; top: -45%; width: 190%; height: 190%; pointer-events: none; }
.micro-g svg.anneau { position: absolute; inset: -18px; width: calc(100% + 36px); height: calc(100% + 36px); transform: rotate(-90deg); pointer-events: none; }
.micro-g svg.anneau circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.micro-g svg.anneau .fond-a { stroke: rgba(255, 255, 255, .22); }
.micro-g svg.anneau .plein { stroke: var(--citron-2); transition: stroke .3s, stroke-dasharray .12s linear; }
.studio.enreg .micro-g { background: linear-gradient(var(--rose-1), var(--rose-2)); box-shadow: inset 0 0 0 8px rgba(255, 255, 255, .4), 0 7px 0 var(--rose-levre); }
.studio.atteint .micro-g svg.anneau .plein { stroke: var(--vert-1); }
.studio:not(.enreg):not(.fini) .micro-g::before { content: ""; position: absolute; inset: -10px; border: 3px solid rgba(255, 255, 255, .45); border-radius: 50%; animation: onde 2.2s ease-out infinite; }
.chrono-g { margin: 0; font: 800 clamp(38px, 3.4vw, 52px)/1 var(--titre); font-variant-numeric: tabular-nums; }
.aide-g { margin: -8px 0 0; max-width: 34ch; color: rgba(255, 255, 255, .85); font-size: 18px; font-weight: 800; text-wrap: balance; }
.apres { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.apres > * { animation: rebond .45s var(--ressort) backwards; }
.support-o { display: grid; place-items: center; }
.postit { display: grid; place-items: center; width: min(440px, 100%); aspect-ratio: 1.1; padding: 30px; border-radius: 6px; background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 6px 0 var(--citron-levre); color: var(--encre); rotate: -2.5deg; font: 700 clamp(48px, 5.4vw, 74px)/1.05 var(--main); text-align: center; animation: depose .7s var(--ressort) backwards; }
.horloge-g { display: grid; place-items: center; width: min(400px, 100%); aspect-ratio: 1; padding: 26px; border-radius: 50%; background: var(--ton); animation: depose .7s var(--ressort) backwards; }
.horloge-g svg { width: 100%; height: 100%; }
.horloge-g .aig-m { transform-origin: 100px 100px; animation: aiguille 1.6s var(--ressort) .4s backwards; }
@keyframes aiguille { from { transform: rotate(-200deg); } }
.role-g { width: min(560px, 100%); padding: clamp(26px, 3vw, 38px); border-radius: 30px; background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); color: var(--encre); text-align: left; animation: depose .7s var(--ressort) backwards; }
.role-g .masques { font-size: 54px; line-height: 1; }
.role-g h3 { margin: 12px 0 6px; color: var(--encre-douce); font: 800 15px/1 var(--titre); letter-spacing: .1em; text-transform: uppercase; }
.role-g p { margin: 0; font: 800 clamp(22px, 2.2vw, 30px)/1.25 var(--texte); }
.exemple-o { width: min(860px, 100%); }
.dialogue { display: grid; gap: 10px; }
.dialogue .ligne { max-width: 86%; margin: 0; padding: 12px 18px; border-radius: 22px 22px 22px 6px; background: var(--lavande); font-size: clamp(18px, 1.6vw, 21px); font-weight: 700; line-height: 1.45; transition: transform .3s var(--ressort), opacity .3s; }
.dialogue .ligne b { display: block; color: var(--encre-douce); font: 800 13px/1.4 var(--titre); letter-spacing: .06em; text-transform: uppercase; }
.dialogue .ligne.vous { justify-self: end; border-radius: 22px 22px 6px 22px; background: linear-gradient(#fffde0, #fff4b0); }
.dialogue.suit .ligne { opacity: .75; }
.dialogue.suit .ligne.parle { opacity: 1; transform: scale(1.02); }

/* ------------------------------------------------------------ deux colonnes sur grand écran */
@media (min-width: 900px) and (min-height: 560px) {
  .sc-lecture, .sc-ecrit.avec, .sc-oral.avec { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(0, 1fr); align-items: stretch; height: 100%; gap: clamp(24px, 3.4vw, 56px); }
  .sc-lecture .panneau-q { align-self: center; max-height: 100%; overflow-y: auto; scrollbar-width: none; }
  .sc-lecture .panneau-q .dock-place { margin-top: 6px; }
  .sc-lecture .table, .support-e, .support-o { overflow: auto; scrollbar-width: none; }
  .sc-video .panneau-q { top: calc(var(--haut) + env(safe-area-inset-top, 0px) + 6px); right: clamp(16px, 3vw, 40px); bottom: 28px; width: min(620px, 46vw); }
  .sc-video.phase-ecoute .panneau-q { transform: translateX(60px); }
  .sc-ecrit.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .sc-ecrit:not(.avec):not(.compare) .feuille { width: min(1000px, 100%); margin: 0 auto; flex: 1; }
  .sc-oral.avec .studio { overflow: auto; scrollbar-width: none; }
}
@media (max-width: 899.98px), (max-height: 559.98px) {
  :root { --haut: 64px; }
  .sc-video { height: auto; min-height: 100%; }
  .sc-video .panneau-q { left: 10px; right: 10px; bottom: 10px; max-height: 70%; border-radius: 30px; }
  .sc-video.phase-ecoute .panneau-q { transform: translateY(60px); }
  .sc-video .ecran { position: fixed; }
  .ecran .onde-g { bottom: 140px; height: 110px; }
  .ecran .st { bottom: 120px; }
  .table { min-height: 0; }
  .o-tel { min-height: 0; }
  .photo-g img { max-height: 40vh; }
  .postit, .horloge-g { width: min(280px, 78%); }
  .feuille textarea { min-height: 200px; }
}
@media (max-width: 560px) {
  .marque > span:last-child { display: none; }
  .niveaux button { min-width: 0; padding: 0 11px; }
  .chemin { min-height: 260px; }
  .orbe { --w: 74px; } .orbe.actuelle { --w: 88px; }
  .orbe .badge { width: 26px; height: 26px; } .orbe .badge svg { width: 14px; height: 14px; }
  .orbe .etiq { font-size: 13px; }
  .acc-bas .go { flex: 1; padding: 0 24px; min-height: 66px; font-size: 22px; }
  .go { min-height: 58px; padding: 0 24px; font-size: 19px; }
  .dock { justify-content: space-between; }
  .dock-mot { width: 100%; }
  .dock .go { flex: 1; }
  .alveoles { --w: min(124px, 31vw); --g: 9px; }
  .rond { width: 44px; height: 44px; } .rond.cyan-r { width: 54px; height: 54px; }
  .progres { gap: 4px; } .seg { height: 12px; }
  .panneau-q { gap: 16px; border-radius: 26px; }
  .o-panneau .ficelle { height: 56px; }
  .o-fiche, .o-lettre { padding: 22px 20px; }
  .bulle-l { padding: 16px 22px; }
}

/* ------------------------------------------------------------ le bilan : la fête */
.bilan { position: relative; align-items: center; justify-content: center; gap: clamp(14px, 2.6vh, 26px); overflow: hidden; text-align: center; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
.bilan .rayons, .bilan .lueur { top: 34%; }
.bilan > *:not(.rayons):not(.lueur) { position: relative; z-index: 2; }
.medaille-t { animation: medaille 1s cubic-bezier(.2, 1.4, .3, 1) .15s both; }
.medaille-t .tuile { --w: clamp(160px, 15vw, 210px); }
.medaille-t .mot { font-size: calc(var(--w) * .3); }
.medaille-t .mot small { display: block; font-size: .42em; opacity: .7; }
.etoiles { display: flex; align-items: flex-end; gap: 10px; }
.etoiles svg { width: 52px; height: 52px; opacity: 0; animation: etoile .5s cubic-bezier(.2, 1.8, .4, 1) both; }
.etoiles svg:nth-child(1) { animation-delay: 1.1s; } .etoiles svg:nth-child(2) { width: 68px; height: 68px; animation-delay: 1.4s; } .etoiles svg:nth-child(3) { animation-delay: 1.7s; }
@keyframes etoile { 0% { opacity: 0; transform: scale(0) rotate(-120deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.bilan .geant { margin: 0; font-size: clamp(54px, 7vw, 100px); animation-delay: .5s; }
.bilan .phrase-b { margin: -6px 0 0; color: rgba(255, 255, 255, .88); font-size: 19px; font-weight: 800; animation: rebond .5s var(--ressort) .75s backwards; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.stat { display: flex; align-items: center; gap: 12px; padding: 10px 22px 10px 10px; border-radius: 999px; background: var(--ton); font-size: 18px; font-weight: 800; animation: rebond .5s var(--ressort) backwards; animation-delay: calc(var(--k) * 90ms + .9s); }
.stat i { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; color: var(--encre); }
.stat i svg { width: 20px; height: 20px; }
.stat.s-ecrit i { background: linear-gradient(var(--citron-1), var(--citron-2)); } .stat.s-oral i { background: linear-gradient(var(--rose-1), var(--rose-2)); }
.rangee { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.rangee .mini { position: relative; }
.rangee .mini .tuile { --w: 58px; animation: pose .45s var(--ressort) both; }
.rangee .mini:nth-child(n) .tuile { animation-delay: calc(1s + var(--k) * 70ms); }
.rangee .mini small { position: absolute; z-index: 2; bottom: -6px; right: -6px; min-width: 30px; padding: 2px 6px; border-radius: 999px; background: #fff; box-shadow: 0 2px 0 var(--blanc-levre); color: var(--encre); font: 800 12px/1.3 var(--titre); }
.bilan .acc-bas { animation-delay: 1.3s; }

#confettis { position: fixed; inset: 0; z-index: 70; width: 100%; height: 100%; pointer-events: none; }

/* ------------------------------------------------------------ thème clair : la même DA sur un fond lavande pâle.
   Le violet passe dans les titres et les repères ; les cartes sont blanches avec leur tranche lavande ; les tuiles,
   le citron, le vert, le rose et le cyan ne changent pas. Sur les photos et les vidéos, le texte reste blanc. */
:root { --clair-1: #f9f6ff; --clair-2: #f2edff; --clair-3: #edf0ff; --violet: #8745fd; --ton: rgba(135, 69, 253, .08); --ton-fort: rgba(135, 69, 253, .14); --ombre: rgba(120, 70, 220, .13); --trait-titre: #e3d8fb; }
html, body { background: var(--clair-2); color: var(--encre); }
.fond { background: linear-gradient(180deg, var(--clair-1) 0%, var(--clair-2) 50%, var(--clair-3) 100%); }
:focus-visible { outline-color: var(--violet); }
.rond { color: var(--encre); }
.rond[aria-pressed="true"] { background: var(--violet); color: #fff; }
.seg { background: rgba(135, 69, 253, .15); }
.seg.fait { background: var(--violet); }
body[data-type="video"] .haut .rond { background: rgba(40, 14, 120, .42); color: #fff; }
body[data-type="video"] .seg { background: rgba(255, 255, 255, .35); }
body[data-type="video"] .seg.fait { background: #fff; }
.rayons { opacity: 1; background: repeating-conic-gradient(from 0deg, rgba(135, 69, 253, .1) 0deg 7deg, transparent 7deg 20deg); }
#rideau .rayons { opacity: 1; }
.lueur { background: radial-gradient(closest-side, rgba(255, 245, 140, .6), rgba(255, 245, 140, 0)); }
#rideau { background: linear-gradient(180deg, var(--clair-1) 0%, var(--clair-2) 50%, var(--clair-3) 100%); color: var(--encre); }
#rideau .r-mot, .geant { color: var(--violet); text-shadow: 0 6px 0 var(--trait-titre); }
#rideau .r-titre, #rideau .r-num, .acc-sous, .pq-tete, .legende, .g-avant, .interloc small, .chat-q, .aide-g, .bilan .phrase-b { color: var(--encre-douce); }
.marque, .niveaux button, .q, .dock-mot, .g-phrase, .consigne-o, .phrase-o, .chrono-g { color: var(--encre); }
.chemin .trace path { stroke: rgba(135, 69, 253, .35); }
.panneau-q { background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); color: var(--encre); }
.sc-lecture .panneau-q { background: none; box-shadow: none; padding-inline: 0; }
.sc-video .panneau-q { background: #fff; color: var(--encre); }
.ecoute-ui { color: #fff; }
.a-venir { background: rgba(40, 14, 120, .45); color: #fff; }
.kara.suit .k { color: rgba(70, 40, 140, .3); }
.kara.suit .k.dit { color: var(--encre); }
.kara.suit .k.actuel { color: var(--violet); }
.transcrit .ligne { background: var(--lavande); }
.transcrit .ligne b { color: var(--encre-douce); }
.o-panneau .ficelle path { stroke: var(--encre-douce); }
.o-panneau .ficelle circle { fill: var(--encre-douce); }
.o-prix::before { background: var(--clair-2); }
.g-phrase.form, .sit, .horloge-g, .stat { background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); color: var(--encre); }
.fente { background: rgba(135, 69, 253, .1); box-shadow: inset 0 -.08em 0 rgba(135, 69, 253, .45); }
.fente.vide { animation-name: respire-clair; }
@keyframes respire-clair { 50% { background-color: rgba(135, 69, 253, .2); } }
.g-indice { background: var(--ton); color: var(--encre); }
.micro-g svg.anneau .fond-a { stroke: rgba(135, 69, 253, .15); }
.studio:not(.enreg):not(.fini) .micro-g::before { border-color: rgba(66, 216, 255, .55); }
.stat { box-shadow: 0 4px 0 var(--blanc-levre); }
.tuile.eteint { opacity: .5; }
.bonbons > .eteint { opacity: .55; }


/* ------------------------------------------------------------ v3 : des écrans pleins. Sur grand écran, deux panneaux de la hauteur de
   l'écran (l'image à gauche, la question à droite, centrée sur ses réponses) ; pour la vidéo, la question au centre de l'image.
   Police Lexend (dessinée pour la facilité de lecture), plus classique que Baloo. */
:root { --titre: "Lexend", "Segoe UI", system-ui, sans-serif; --texte: "Lexend", "Segoe UI", system-ui, sans-serif; }
body { font-weight: 500; }
.tuile .mot { font-weight: 700; font-size: calc(var(--w) * .13); letter-spacing: -.01em; line-height: 1.12; }
.alveoles.longs .mot { font-size: calc(var(--w) * .11); }
.go { font-weight: 700; font-size: 18px; letter-spacing: .05em; }
.q, .consigne-o { font-weight: 700; letter-spacing: -.02em; }
.geant, #rideau .r-mot { font-weight: 800; letter-spacing: -.045em; }
.phrase-o { font-weight: 700; letter-spacing: -.02em; }
.g-phrase { font-weight: 700; letter-spacing: -.02em; }
.bonbons > button, .reps .rep, .bulle-l, .sit p { font-weight: 600; }

/* la question et son haut-parleur */
.q-ligne { display: flex; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.q-ligne > .q, .q-ligne > .consigne-o, .q-ligne > .g-phrase { margin: 0; }
.hp { flex: none; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; color: var(--encre); background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .5), 0 3px 0 var(--cyan-levre); transition: translate .1s, transform .2s var(--ressort); }
.hp:hover { transform: scale(1.08); }
.hp:active { translate: 0 2px; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .5), 0 1px 0 var(--cyan-levre); }
.hp svg { width: 22px; height: 22px; }
.hp.joue { animation: appel .9s ease-in-out infinite; background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .5), 0 3px 0 var(--citron-levre); }

/* deux panneaux : l'image (photo, document posé dessus, horloge…) et la carte de la question */
.sc-duo { gap: clamp(16px, 2.4vw, 32px); }
.visuel { position: relative; display: grid; place-items: center; min-height: 34vh; overflow: hidden; border-radius: 34px; background: linear-gradient(160deg, #efe7ff, #dcd2ff 60%, #d4e4ff); box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); animation: monte .5s var(--doux-sortie) backwards; }
.visuel .vis-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kb 28s ease-in-out infinite alternate; }
.visuel.avec-objet:not(.uni)::after { content: ""; position: absolute; inset: 0; background: rgba(40, 14, 120, .22); }
.visuel .pose { position: relative; z-index: 1; display: grid; justify-items: center; width: min(90%, 680px); max-height: 100%; padding: 24px 0; overflow-y: auto; scrollbar-width: none; }
.visuel .pose .legende { padding: 6px 16px; border-radius: 999px; background: #fff; color: var(--encre); box-shadow: 0 3px 0 var(--blanc-levre); }
.visuel .titre-v { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; margin: 0; padding: 80px 32px 28px; background: linear-gradient(transparent, rgba(40, 14, 120, .75)); color: #fff; font: 800 clamp(30px, 3.4vw, 56px)/1.05 var(--titre); letter-spacing: -.035em; text-align: left; }
.visuel.uni .titre-v { position: relative; padding: 30px; background: none; color: var(--violet); text-align: center; }
.visuel.avec-dit:not(.uni)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(40, 14, 120, .55)); }
.visuel .parole { position: absolute; left: clamp(14px, 2vw, 28px); right: clamp(14px, 2vw, 28px); bottom: clamp(14px, 2vw, 28px); z-index: 1; display: grid; gap: 12px; justify-items: start; }
.visuel.uni .parole { position: relative; inset: auto; width: min(90%, 600px); justify-items: center; }
.visuel .parole .interloc small { color: #fff; }
.visuel .bulle-l { font-size: clamp(22px, 2.4vw, 38px); }
.visuel .sit { background: #fff; box-shadow: 0 5px 0 var(--blanc-levre); }
.visuel .role-g { width: 100%; }
.visuel.uni .postit { width: min(70%, 440px); }
.visuel.uni .horloge-g { width: min(74%, 480px); background: #fff; }
.carte-q { display: flex; flex-direction: column; justify-content: center; min-height: 0; padding: clamp(22px, 3vw, 46px); border-radius: 34px; background: #fff; box-shadow: 0 6px 0 var(--blanc-levre), 0 11px 0 var(--ombre); overflow-y: auto; scrollbar-width: none; animation: monte .5s var(--doux-sortie) .06s backwards; }
.carte-q::-webkit-scrollbar { display: none; }
.bloc-q { display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 3vh, 30px); width: 100%; text-align: center; }
.bloc-q .bonbons { width: 100%; }
.bloc-q .dock-place, .gram .dock-place, .chat .dock-place, .studio .dock-place { width: 100%; margin-top: 4px; }
.gram { gap: clamp(16px, 2.6vh, 28px); }
.gram .g-phrase { font-size: clamp(28px, 3.1vw, 52px); }
.gram .g-phrase.form { font-size: clamp(24px, 2.6vw, 42px); background: var(--lavande); box-shadow: none; }
.chat { gap: 18px; justify-content: center; }
.chat .reps { width: 100%; justify-items: center; }
.reps .rep { justify-content: center; text-align: center; border-radius: 26px; }
.studio { gap: clamp(12px, 2.2vh, 24px); }
.micro-g { width: clamp(120px, 11vw, 160px); }
.sc-oral .exemple-o { width: 100%; }

/* vidéo : la question et les réponses au centre de l'image */
.ecoute-q { max-width: 20ch; }
.ecoute-q .q-ligne { justify-content: flex-start; text-align: left; }
.ecoute-q .eq { margin: 0; font: inherit; }
.ecoute-q .hp { width: 54px; height: 54px; }
.centre-q { position: absolute; inset: calc(var(--haut) + env(safe-area-inset-top, 0px)) 0 0; z-index: 2; display: flex; flex-direction: column; align-items: center; padding: 10px clamp(16px, 4vw, 60px) calc(24px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; scrollbar-width: none; color: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; }
.centre-q > .bloc-q { width: min(880px, 100%); margin: auto 0; }
.sc-video.phase-reponse .centre-q { opacity: 1; pointer-events: auto; }
.sc-video .ecran .vis { transition: filter .7s, transform .7s; }
.sc-video.phase-reponse .ecran .vis { filter: blur(8px) brightness(.6) saturate(1.05); transform: scale(1.08); animation: none; }
.sc-video.phase-reponse .ecran .voile { background: rgba(60, 24, 170, .36); }
.sc-video.phase-reponse .ecran .onde-g { opacity: .25; }
.centre-q .q { color: #fff; font-size: clamp(30px, 3.4vw, 56px); text-shadow: 0 4px 0 rgba(40, 14, 120, .35); }
.centre-q .dock-mot { color: #fff; }
.centre-q .relire-l { display: flex; justify-content: center; }
.centre-q .transcrit { width: 100%; text-align: left; }
.centre-q .transcrit .ligne { background: #fff; color: var(--encre); box-shadow: 0 4px 0 var(--blanc-levre); }
.sc-video .panneau-q { display: none; }

/* écrire : un vrai support et des débuts de phrase à toucher */
.carte-ecrit { justify-content: center; gap: 18px; }
.consigne-l { display: flex; align-items: flex-start; gap: 12px; }
.consigne-p { margin: 4px 0 0; color: var(--encre); font-size: clamp(17px, 1.4vw, 20px); font-weight: 500; line-height: 1.45; }
.lignes-e { display: grid; gap: 14px; }
.ligne-e { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 20px; background: var(--lavande); animation: monte .4s var(--doux-sortie) backwards; animation-delay: calc(var(--k) * 80ms + .2s); }
.ligne-e .num { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 2px 0 var(--citron-levre); font-weight: 800; }
.ligne-e .debut { flex: none; color: var(--encre); font-size: clamp(20px, 1.8vw, 26px); font-weight: 700; }
.ligne-e input { flex: 1; min-width: 0; height: 54px; padding: 0 14px; border: 0; border-bottom: 3px dashed rgba(135, 69, 253, .35); border-radius: 12px; background: #fff; color: var(--encre); font: 600 clamp(20px, 1.8vw, 26px)/1 var(--texte); outline: none; }
.ligne-e input:focus { border-bottom-color: var(--violet); }
.liste-e { display: grid; gap: 6px; margin: 0; padding: 16px 22px 16px 52px; border-radius: 20px; background: #fffdf0; box-shadow: 0 4px 0 #efe2a6; color: var(--encre-douce); font-size: 22px; font-weight: 800; }
.liste-e li { animation: monte .4s var(--doux-sortie) backwards; animation-delay: calc(var(--k) * 70ms + .2s); }
.liste-e input { width: 100%; height: 50px; border: 0; border-bottom: 2px solid #eadb9c; background: transparent; color: var(--encre); font: 600 24px/1 var(--texte); outline: none; }
.saisie { flex: 1; width: 100%; min-height: 170px; padding: 14px 16px; border: 3px solid var(--lavande); border-radius: 20px; background: #fff; color: var(--encre); font: 500 clamp(19px, 1.6vw, 23px)/1.55 var(--texte); resize: none; outline: none; }
.saisie:focus { border-color: var(--violet); }
.feuille-e { background: #fff repeating-linear-gradient(transparent 0 35px, var(--lavande) 35px 36px); background-position: 0 13px; line-height: 36px; }
.tel-e { display: grid; gap: 10px; width: min(440px, 100%); align-self: center; padding: 14px; border-radius: 36px; background: var(--lavande); box-shadow: 0 5px 0 var(--blanc-levre); }
.tel-e .tel-tete { display: flex; align-items: center; gap: 10px; padding: 4px 6px; font-weight: 700; }
.tel-e .tel-av { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(var(--rose-1), var(--rose-2)); color: #fff; font-weight: 800; }
.tel-e .saisie { min-height: 150px; border-color: #fff; border-radius: 24px 24px 6px 24px; }
.mail-e { display: grid; overflow: hidden; border: 3px solid var(--lavande); border-radius: 20px; }
.mail-l { display: flex; align-items: center; gap: 12px; margin: 0; padding: 10px 16px; border-bottom: 2px solid var(--lavande); font-size: 18px; }
.mail-l b { min-width: 4em; color: var(--encre-douce); font-weight: 700; }
.mail-l .objet { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--encre); font: 600 18px/1.2 var(--texte); outline: none; }
.mail-e .saisie { min-height: 200px; border: 0; border-radius: 0; }
.forum-e { display: grid; gap: 12px; }
.forum-e .post { padding: 16px 20px; border-radius: 20px 20px 20px 6px; background: var(--lavande); font-size: clamp(18px, 1.5vw, 21px); font-weight: 600; }
.amorces { display: flex; flex-wrap: wrap; gap: 10px; }
.amorce { padding: 10px 16px; border: 0; border-radius: 999px; background: linear-gradient(#fffde0, #fff4b0); box-shadow: 0 3px 0 var(--citron-levre); color: var(--encre); font: 600 17px/1.2 var(--texte); animation: pose .4s var(--ressort) backwards; animation-delay: calc(var(--k) * 60ms + .3s); transition: translate .1s; }
.amorce:active { translate: 0 2px; box-shadow: 0 1px 0 var(--citron-levre); }
.amorce.utilisee { background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: 0 3px 0 var(--vert-levre); }
.carte-ecrit .dock-place { margin-top: 0; }
.carte-q.mien { justify-content: flex-start; }
.titre-mien { margin: 0 0 8px; color: var(--violet); font: 800 26px/1.1 var(--titre); }
.sc-ecrit.compare .exemple { overflow-y: auto; scrollbar-width: none; }

@media (min-width: 900px) and (min-height: 560px) {
  .sc-duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; height: 100%; }
  .sc-duo > .visuel, .sc-duo > .carte-q { height: 100%; min-height: 0; }
  .sc-ecrit.sc-duo { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); }
  .sc-ecrit.compare { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; }
  .sc-ecrit.compare > * { height: 100%; overflow-y: auto; }
}
@media (max-width: 899.98px), (max-height: 559.98px) {
  .sc-duo > .visuel { min-height: 30vh; }
  .visuel:not(.uni):not(.avec-objet):not(.avec-dit) { max-height: 42vh; }
  .visuel .pose { padding: 18px 0; }
  .visuel .parole { position: relative; inset: auto; padding: 18px 14px; justify-items: start; }
  .visuel.avec-dit { place-items: end stretch; }
  .centre-q .q { font-size: clamp(24px, 6.4vw, 34px); }
  .ligne-e { flex-wrap: wrap; }
  .ligne-e input { flex-basis: 100%; }
}

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .etoiles svg { opacity: 1; } }

aidais tous les jours. Ça me faisait plaisir. Ensuite, c'est un métier utile : on voit tout de suite que notre travail aide quelqu'un. Et puis, en France, on cherche beaucoup d'auxiliaires de vie, donc je pense que je pourrais trouver un emploi facilement, ici à Vesoul. Par contre, je sais que ce n'est pas un travail facile. Les horaires sont parfois compliqués et c'est fatigant. Mais je suis une personne patiente et calme, alors je crois que ce métier me correspond. Pour commencer, je voudrais faire un stage dans une association d'aide à domicile. Ensuite, j'aimerais suivre une formation pour avoir le diplôme.","verifiez":["Vous dites quel métier vous aimeriez faire et ce qu'on fait dans ce métier.","Vous donnez au moins deux raisons (d'abord, ensuite, parce que).","Vous dites votre souhait avec « j'aimerais » ou « je voudrais ».","Vous parlez environ 1 minute 30. Quelques pauses, ce n'est pas grave."],"type":"oral","duree":90,"audio":"medias/sons/EO-36.mp3","sous":"consigne","modeleAudio":"medias/modeles/EO-36.mp3","k":[["Décrivez",0.08,0.5],["un",0.52,0.6],["métier",0.64,0.9],["que",0.98,1.08],["vous",1.1,1.24],["aimeriez",1.26,1.76],["exercer",1.82,2.38],["et",2.4,2.5],["expliquez",2.54,3.06],["pourquoi.",3.1,3.48]],"modeleK":[{"mots":[["J'aimerais",0.08,0.38],["devenir",0.42,0.78],["auxiliaire",0.92,1.38],["de",1.42,1.5],["vie.",1.56,1.82],["Dans",2.4,2.52],["ce",2.56,2.64],["métier,",2.7,3.08],["on",3.22,3.34],["aide",3.38,3.5],["les",3.54,3.62],["personnes",3.66,4.04],["âgées",4.12,4.36],["qui",4.76,4.86],["vivent",4.9,5.12],["chez",5.16,5.34],["elles.",5.4,5.58],["Par",6.02,6.1],["exemple,",6.14,6.48],["on",6.6,6.68],["prépare",6.72,7.02],["les",7.06,7.14],["repas,",7.2,7.52],["on",7.64,7.7],["fait",7.78,7.86],["les",7.88,8.0],["courses,",8.04,8.38],["on",8.76,8.86],["aide",8.92,9.08],["pour",9.12,9.2],["la",9.24,9.32],["toilette",9.34,9.7],["ou",9.88,9.92],["pour",10.02,10.12],["aller",10.16,10.32],["chez",10.36,10.46],["le",10.5,10.56],["médecin.",10.6,10. 'offres d'emploi. Par contre, la campagne a des avantages. C'est plus calme, l'air est plus pur, et les loyers sont souvent moins chers. Pour les enfants, c'est agréable d'avoir un jardin et de jouer dehors. En ville, il y a du bruit, beaucoup de monde, et la vie coûte cher. Finalement, je pense que la ville est meilleure pour s'installer, trouver un travail et rencontrer des gens. Plus tard, quand j'aurai une voiture, j'irai peut-être vivre à la campagne. Mais pour le moment, je préfère la ville.","verifiez":["Vous dites clairement votre choix : la ville ou la campagne.","Vous donnez deux ou trois raisons, avec un exemple pour chaque raison.","Vous parlez aussi des avantages de l'autre choix (par contre, mais).","Vous reliez vos idées et vous terminez par une conclusion (d'abord, ensuite, finalement)."],"type":"oral","duree":120,"audio":"medias/sons/EO-37.mp3","sous":"consigne","modeleAudio":"medias/modeles/EO-37.mp3","k":[["Selon",0.1,0.32],["vous,",0.42,0.54],["vaut-il",0.88,1.18],["mieux",1.22,1.34],["vivre",1.38,1.6],["en",1.64,1.76],["ville",1.8,2.1],["ou",2.14,2.2],["à",2.26,2.28],["la",2.32,2.42],["campagne ?",2.46,2.96],["Justifiez",3.98,4.42],["votre",4.46,4.72],["réponse",4.76,5.08],["avec",5.14,5.32],["des",5.36,5.48],["exemples.",5.54,6.06]],"modeleK":[{"mots":[["Selon",0.1,0.32],["moi,",0.36,0.46],["il",0.78,0.84],["vaut",0.88,0.98],["mieux",1.02,1.16],["vivre",1.18,1.38],["en",1.42,1.5],["ville,",1.54,1.72],["surtout",1.82,2.08],["quand",2.12,2.56],["on",2.6,2.68],["vient",2.7,2.84],["d'arriver",2.86,3.18],["en",3.22,3.28],["France.",3.34,3.64],["Je",4.18,4.22],["vais",4.24,4.36],["expliquer",4.42,4.8],["pourquoi,",4.84,5.06],["avec",5.2,5.36],["des",5.4,5.52],["exemples",5.58,5.96],["de",6.0,6.08],["ma",6.12,6.22],["vie.",6.24,6.38],["D'abord,",6.92,7.2],["en",7.3,7.36],["ville,",7.4,7.52],["les",7.74,7.8],["transports",7.86,8.18],["sont",8.22,8.34],["pratiques,",8.38,9.04],["et",9.1,9.14],["quand",9.18,9.34],["on",9.38,9.44],["n'a",9.48,9.58],["pas" ux ans."},{"qui":"Le conseiller","texte":"Je comprends, mais tous nos techniciens sont occupés. En hiver, il y a beaucoup de pannes."},{"qui":"Vous","texte":"Je sais que vous avez beaucoup de travail, mais c'est urgent. Vous pouvez appeler une autre entreprise ? Ou alors me prévenir, si un rendez-vous est annulé ?"},{"qui":"Le conseiller","texte":"Je peux vous mettre sur la liste d'attente, oui. Mais je ne peux rien vous promettre."},{"qui":"Vous","texte":"Merci. Et en attendant, qu'est-ce que je peux faire ? Le propriétaire pourrait peut-être me prêter un radiateur électrique ?"},{"qui":"Le conseiller","texte":"C'est une bonne idée. Je l'appelle cet après-midi et je vous rappelle avant ce soir."},{"qui":"Vous","texte":"Très bien. Donc, si j'ai bien compris : vous me mettez sur la liste d'attente, vous appelez le propriétaire pour le radiateur, et vous me rappelez aujourd'hui. C'est bien ça ?"},{"qui":"Le conseiller","texte":"Oui, c'est exactement ça."},{"qui":"Vous","texte":"Parfait. Vous pouvez aussi me confirmer tout ça par mail ? Merci beaucoup pour votre aide, au revoir."}],"verifiez":["Vous dites qui vous êtes et vous expliquez la panne (depuis quand, quel problème).","Vous insistez poliment, avec des raisons (Je comprends, mais… c'est urgent parce que…).","Vous proposez une solution ou vous en demandez une.","Vous reformulez la solution pour vérifier (Si j'ai bien compris…) et vous dites au revoir."],"type":"oral","duree":120,"audio":null,"sous":"role","role":"Rôle de l'interlocuteur : conseiller de l'agence qui annonce un délai de 10 jours.","modeleAudio":"medias/modeles/EO-40.mp3","modeleK":[{"qui":"Le conseiller","mots":[["Agence",0.2,0.42],["immobilière,",0.48,0.9],["bonjour,",1.02,1.28],["je",1.34,1.42],["vous",1.44,1.54],["écoute.",1.58,1.82]]},{"qui":"Vous","mots":[["Bonjour,",2.64,2.94],["monsieur.",2.98,3.28],["Je",3.48,3.52],["m'appelle",3.56,3.86],["Aïssatou",3.9,4.28],["Diallo,",4.34,4.64],["je",4.8,4.84],["suis",4.9,5.0],["locataire",5.04,5.54],[ nfants. Et puis, les horaires de journée sont pratiques pour ma famille."},{"qui":"Le recruteur","texte":"D'accord. Et en France, vous avez déjà travaillé en cuisine ?"},{"qui":"Vous","texte":"Oui. L'année dernière, j'ai fait une formation, avec un stage de deux mois dans une maison de retraite. J'ai appris les règles d'hygiène, et je préparais les entrées pour quatre-vingts personnes."},{"qui":"Le recruteur","texte":"Très bien. Quelles sont vos qualités ?"},{"qui":"Vous","texte":"Je suis quelqu'un de sérieux et d'organisé. Je ne suis jamais en retard. J'aime aussi travailler en équipe. Par exemple, pendant mon stage, un collègue était malade, et j'ai fait une partie de son travail sans problème."},{"qui":"Le recruteur","texte":"Parfait. Vous avez des questions ?"},{"qui":"Vous","texte":"Oui, deux questions. D'abord, quels sont les horaires exactement ? Et c'est un CDD ou un CDI ?"},{"qui":"Le recruteur","texte":"Vous travaillerez du lundi au vendredi, de sept heures à quinze heures. C'est un CDD de six mois, et ensuite, un CDI est possible."},{"qui":"Vous","texte":"Si j'ai bien compris, je commence avec un contrat de six mois, du lundi au vendredi, de sept heures à quinze heures. Ça me convient très bien."},{"qui":"Le recruteur","texte":"Très bien. Nous vous donnerons une réponse la semaine prochaine."},{"qui":"Vous","texte":"Merci beaucoup pour cet entretien. Au revoir, et bonne journée."}],"verifiez":["Vous expliquez pourquoi vous voulez ce poste, avec deux raisons.","Vous donnez deux ou trois qualités, avec un exemple.","Vous posez au moins une question au recruteur (horaires, contrat…).","Vous parlez poliment du début à la fin (bonjour, merci, au revoir)."],"type":"oral","duree":120,"audio":null,"sous":"role","role":"Questions du recruteur : « Pourquoi voulez-vous ce poste ? Quelles sont vos qualités ? Vous avez des questions ? »","modeleAudio":"medias/modeles/EO-41.mp3","modeleK":[{"qui":"Le recruteur","mots":[["Bonjour,",0.2,0.6],["asseyez-vous.",0.84,1.38],[ nçais très connu, avec Omar Sy et François Cluzet. C'est l'histoire de Philippe, un homme très riche. Après un accident de parapente, il ne peut plus bouger les bras ni les jambes. Il cherche quelqu'un pour l'aider tous les jours. Un jour, Driss, un jeune homme de banlieue, vient à l'entretien. En fait, il ne veut pas vraiment le travail, il veut juste une signature pour le chômage. Mais Philippe le choisit quand même. Au début, les deux hommes sont très différents et ils ne se comprennent pas. Ensuite, petit à petit, ils apprennent à se connaître. À la fin, ils deviennent de vrais amis. J'ai aimé ce film pour plusieurs raisons. D'abord, il est très drôle : je l'ai regardé avec des sous-titres, et j'ai beaucoup ri. Ensuite, il est émouvant, parce qu'il montre que l'amitié est possible entre deux personnes très différentes. Enfin, ce film m'a permis d'apprendre des expressions de la vie de tous les jours. Je le conseille à tout le monde, surtout aux personnes qui apprennent le français.","verifiez":["Vous dites le titre et vous racontez l'histoire en quelques phrases.","Vous racontez dans l'ordre (au début, ensuite, à la fin).","Vous dites pourquoi vous avez aimé, avec deux raisons (parce que, d'abord, ensuite).","Vous parlez environ 1 minute 30. Quelques pauses, ce n'est pas grave."],"type":"oral","duree":90,"audio":"medias/sons/EO-42.mp3","sous":"consigne","modeleAudio":"medias/modeles/EO-42.mp3","k":[["Racontez",0.08,0.48],["un",0.52,0.64],["film,",0.7,0.98],["un",1.28,1.36],["livre",1.42,1.7],["ou",1.88,1.96],["une",2.0,2.08],["émission",2.16,2.52],["que",2.6,2.7],["vous",2.72,2.84],["avez",2.9,3.12],["aimé",3.16,3.52],["et",3.56,3.64],["dites",3.68,3.94],["pourquoi.",3.98,4.36]],"modeleK":[{"mots":[["Je",0.1,0.18],["voudrais",0.2,0.42],["vous",0.46,0.56],["parler",0.6,0.8],["d'un",0.84,1.0],["film",1.08,1.32],["que",1.34,1.42],["j'ai",1.44,1.58],["beaucoup",1.6,1.92],["aimé :",1.96,2.28],["Intouchables.",2.72,3.34],["C'est",3.78,3.92],["un",3.94,4.02],["film",4.
