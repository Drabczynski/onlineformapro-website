un petit village. Il n'y avait pas d'électricité, mais il y avait une rivière, beaucoup d'arbres, et tous mes cousins. Un jour, mon grand-père m'a dit : « Demain, je t'apprends à nager. » J'avais très peur de l'eau, et je n'ai presque pas dormi de la nuit. Le matin, nous sommes allés à la rivière avec mes cousins. D'abord, mon grand-père m'a tenu les mains, et il m'a montré comment bouger les jambes. Ensuite, il a enlevé ses mains, doucement. J'ai bu beaucoup d'eau, j'ai crié, et tout le monde a ri. Mais après une heure, j'ai réussi à nager jusqu'à mon cousin Mamadou. Le soir, toute la famille a mangé dehors, et mon grand-père a raconté l'histoire à tout le monde. Je me souviens encore de son sourire. Aujourd'hui, j'habite en France, loin de lui, mais chaque fois que je vais à la piscine, je pense à lui. C'est un très beau souvenir.","verifiez":["Vous dites quand et où ça se passe (Quand j'avais huit ans, j'habitais…).","Vous racontez les actions dans l'ordre (d'abord, ensuite, après, le soir).","Vous utilisez l'imparfait (j'avais, il y avait) et le passé composé (j'ai appris, j'ai réussi).","Vous dites ce que vous avez ressenti ou pourquoi ce souvenir est important."],"type":"oral","duree":90,"audio":"medias/sons/EO-43.mp3","sous":"consigne","modeleAudio":"medias/modeles/EO-43.mp3","k":[["Racontez",0.08,0.42],["un",0.46,0.54],["souvenir",0.58,0.84],["d'enfance.",0.88,1.42]],"modeleK":[{"mots":[["Je",0.1,0.16],["vais",0.2,0.3],["vous",0.34,0.42],["raconter",0.46,0.78],["un",0.82,0.88],["souvenir",0.92,1.16],["d'enfance.",1.18,1.64],["Quand",2.0,2.1],["j'avais",2.12,2.38],["huit",2.4,2.58],["ans,",2.62,2.7],["j'habitais",2.74,3.12],["avec",3.18,3.34],["ma",3.38,3.48],["famille",3.54,3.92],["à",4.0,4.06],["Conakry,",4.1,4.52],["en",4.82,4.9],["Guinée.",4.94,5.22],["Pendant",5.84,6.04],["les",6.06,6.14],["grandes",6.2,6.44],["vacances,",6.48,6.86],["on",7.14,7.2],["allait",7.26,7.42],["toujours",7.48,7.72],["chez",7.74,7.86],["mes",7.9,7.98],["grands-parents,",8.02,8.5 horaires, les gens qui travaillent la journée ne pourront plus y aller. Je propose une autre solution. La mairie pourrait regarder à quels moments il y a peu de monde, par exemple le mardi matin, et fermer seulement à ces moments-là. Elle pourrait aussi faire des économies d'énergie, avec moins de chauffage et des lampes qui consomment moins. Et puis, des bénévoles pourraient aider pour certaines activités. Finalement, je pense qu'il faut garder la médiathèque ouverte le plus possible, parce que c'est un service pour tout le monde.","verifiez":["Vous dites clairement si vous êtes d'accord ou pas avec la mairie.","Vous donnez au moins deux raisons, avec un exemple.","Vous proposez une autre solution (La mairie pourrait…).","Vous reliez vos idées (d'abord, ensuite, par exemple, finalement)."],"type":"oral","duree":90,"audio":"medias/sons/EO-44.mp3","sous":"ecoute","phrase":"La mairie envisage de réduire les horaires d'ouverture de la médiathèque pour faire des économies.","modeleAudio":"medias/modeles/EO-44.mp3","modeleK":[{"mots":[["Je",0.08,0.14],["ne",0.18,0.22],["suis",0.26,0.38],["pas",0.4,0.48],["d'accord",0.52,0.84],["avec",0.9,1.08],["cette",1.12,1.28],["idée",1.34,1.5],["de",1.54,1.6],["la",1.64,1.68],["mairie.",1.74,2.04],["Je",2.34,2.4],["sais",2.46,2.58],["qu'elle",2.6,2.8],["doit",2.82,3.06],["faire",3.1,3.22],["des",3.26,3.38],["économies,",3.44,3.88],["mais",4.28,4.36],["à",4.4,4.42],["mon",4.46,4.58],["avis,",4.64,4.86],["la",5.02,5.08],["médiathèque",5.14,5.7],["est",5.72,5.8],["trop",5.84,6.0],["importante :",6.06,6.6],["il",7.1,7.18],["ne",7.22,7.3],["faut",7.34,7.46],["pas",7.5,7.58],["réduire",7.62,7.92],["ses",7.96,8.1],["horaires.",8.12,8.48],["D'abord,",9.02,9.26],["c'est",9.34,9.48],["un",9.52,9.6],["service",9.64,10.02],["presque",10.06,10.36],["gratuit.",10.4,10.88],["Beaucoup",11.7,11.88],["de",11.92,12.0],["personnes",12.04,12.46],["n'ont",12.5,12.64],["pas",12.66,12.74],["d'ordinateur",12.78,13.4],["ou",13.44,13.5],["d'internet",13.52,14. nes villes, c'est difficile d'en trouver un, alors demandez à vos voisins ou à une association. Pour prendre rendez-vous, vous avez deux possibilités. Vous pouvez téléphoner au cabinet médical : vous donnez votre nom et vous expliquez pourquoi vous voulez voir le médecin. Ou alors, vous pouvez réserver sur internet, avec une application. C'est pratique, parce que vous voyez tout de suite les horaires libres. Le jour du rendez-vous, arrivez un peu en avance, avec votre carte Vitale. Si vous ne pouvez pas venir, il faut annuler. Enfin, en cas d'urgence grave, n'attendez pas : appelez le quinze.","verifiez":["Vous expliquez les étapes dans l'ordre (d'abord, ensuite, enfin).","Vous parlez de la carte Vitale, du médecin traitant et des façons de prendre rendez-vous.","Vous utilisez des mots pour expliquer (il faut, vous pouvez, prenez, appelez).","Vous parlez environ 1 minute 30. Quelques pauses, ce n'est pas grave."],"type":"oral","duree":90,"audio":"medias/sons/EO-45.mp3","sous":"consigne","modeleAudio":"medias/modeles/EO-45.mp3","k":[["Expliquez",0.08,0.54],["à",0.6,0.64],["une",0.66,0.76],["personne",0.8,1.2],["qui",1.24,1.32],["vient",1.36,1.5],["d'arriver",1.54,1.94],["comment",2.0,2.24],["prendre",2.26,2.6],["rendez-vous",2.64,3.06],["chez",3.1,3.26],["un",3.3,3.36],["médecin",3.4,3.74],["en",3.78,3.86],["France.",3.9,4.3]],"modeleK":[{"mots":[["Bienvenue",0.1,0.36],["en",0.4,0.48],["France !",0.5,0.78],["Je",0.98,1.02],["vais",1.04,1.12],["vous",1.16,1.24],["expliquer",1.3,1.66],["comment",1.7,1.94],["prendre",1.96,2.26],["rendez-vous",2.32,2.72],["chez",2.78,2.9],["le",2.94,3.0],["médecin.",3.04,3.34],["Ce",3.74,3.78],["n'est",3.82,3.94],["pas",3.96,4.06],["très",4.1,4.24],["compliqué,",4.26,4.62],["mais",4.7,4.8],["il",4.86,4.9],["y",4.96,4.98],["a",5.0,5.06],["plusieurs",5.08,5.38],["étapes.",5.44,5.72],["D'abord,",6.12,6.5],["il",6.6,6.68],["faut",6.72,6.84],["vous",6.86,6.98],["inscrire",7.02,7.42],["à",7.5,7.52],["l'Assurance",7.56,7.98],["maladie.",8.02,8. e l'argent à ma mère, au Cameroun. Elle a besoin de faire des travaux dans sa maison, et je voudrais l'aider. Avec le reste, je ferais un cadeau à mes enfants : on partirait quelques jours à la mer, parce qu'ils ne l'ont jamais vue. Je donnerais aussi un peu d'argent à l'association de Vesoul où j'apprends le français, pour la remercier. Finalement, je ne dépenserais pas tout. Je garderais un peu d'argent à la banque, au cas où.","verifiez":["Vous utilisez « si » + imparfait et le conditionnel (Si je gagnais…, j'achèterais…).","Vous donnez au moins deux projets précis.","Vous expliquez pourquoi (parce que, comme ça).","Vous reliez vos idées (d'abord, ensuite, après, finalement)."],"type":"oral","duree":90,"audio":"medias/sons/EO-46.mp3","sous":"consigne","modeleAudio":"medias/modeles/EO-46.mp3","k":[["Si",0.1,0.16],["vous",0.22,0.32],["gagniez",0.36,0.64],["10",0.68,0.81],["000",0.81,0.94],["euros,",0.98,1.22],["que",1.52,1.64],["feriez-vous ?",1.68,2.1],["Expliquez.",2.72,3.26]],"modeleK":[{"mots":[["Si",0.1,0.16],["je",0.2,0.24],["gagnais",0.28,0.56],["dix",0.6,0.7],["mille",0.74,0.88],["euros,",0.94,1.14],["ce",1.28,1.36],["serait",1.4,1.58],["une",1.64,1.76],["très",1.82,1.96],["belle",2.0,2.14],["surprise !",2.2,2.6],["Je",3.26,3.34],["sais",3.4,3.58],["exactement",3.66,4.22],["ce",4.26,4.34],["que",4.36,4.44],["je",4.48,4.58],["ferais",4.62,4.86],["avec",4.92,5.08],["cet",5.1,5.24],["argent.",5.3,5.54],["D'abord,",5.78,6.06],["je",6.12,6.2],["passerais",6.26,6.5],["mon",6.54,6.66],["permis",6.7,6.9],["de",6.94,7.02],["conduire.",7.06,7.44],["En",7.78,7.86],["France,",7.9,8.1],["ça",8.18,8.28],["coûte",8.3,8.48],["cher,",8.52,8.74],["environ",8.86,9.18],["deux",9.24,9.32],["mille",9.36,9.48],["euros,",9.54,9.88],["et",9.94,10.0],["en",10.04,10.1],["ce",10.14,10.2],["moment,",10.24,10.44],["je",10.52,10.58],["n'ai",10.62,10.74],["pas",10.78,10.9],["assez",10.96,11.12],["d'argent.",11.16,11.58],["Avec",11.66,11.82],["le",11.86,11.94],["permis,",11.98,12.18],["je" }]},{"id":"EO-50","niveau":"B1","titre":"Apprentissage","theme":"Donner des conseils","consigne":"Un ami veut apprendre le français rapidement. Donnez-lui des conseils.","modele":"Tu veux apprendre le français rapidement ? Je vais te donner quelques conseils, parce que moi aussi, j'ai appris le français ici, à Mulhouse. D'abord, je te conseille de t'inscrire à un cours. Des associations proposent des cours gratuits ou pas chers. C'est important pour apprendre la grammaire et pour rencontrer des gens. Ensuite, il faut parler le plus possible, tous les jours. Parle avec tes voisins, avec les commerçants du marché. N'aie pas peur de faire des erreurs ! Tu devrais aussi écouter du français à la maison. Par exemple, regarde des séries avec les sous-titres en français, et écoute la radio quand tu fais la cuisine. Au début, tu ne vas pas tout comprendre, mais c'est normal. Moi, j'avais un petit carnet. Chaque jour, j'écrivais cinq nouveaux mots, et je les répétais dans le bus. Un autre conseil : fais du sport ou du bénévolat dans une association. Comme ça, tu parles français sans y penser, et tu te fais des amis. Finalement, sois patient. On n'apprend pas une langue en un mois. Mais si tu pratiques tous les jours, tu vas faire des progrès très vite.","verifiez":["Vous donnez au moins trois conseils différents.","Vous utilisez des mots pour conseiller (je te conseille de, tu devrais, il faut, parle…).","Vous donnez un exemple ou votre propre expérience.","Vous reliez vos conseils (d'abord, ensuite, aussi, finalement)."],"type":"oral","duree":90,"audio":"medias/sons/EO-50.mp3","sous":"consigne","modeleAudio":"medias/modeles/EO-50.mp3","k":[["Un",0.08,0.16],["ami",0.24,0.46],["veut",0.52,0.66],["apprendre",0.74,1.1],["le",1.14,1.24],["français",1.28,1.6],["rapidement.",1.66,2.22],["Donnez-lui",2.62,3.02],["des",3.06,3.16],["conseils.",3.2,3.68]],"modeleK":[{"mots":[["Tu",0.1,0.16],["veux",0.22,0.32],["apprendre",0.38,0.78],["le",0.82,0.9],["français",0.92,1.3],["rapidement ?"   return `<svg viewBox="0 0 200 200" role="img" aria-label="Une horloge"><circle cx="100" cy="100" r="94" fill="#fff" stroke="#3550d9" stroke-width="6"/>${Array.from({ length: 12 }, (_, k) => `<path d="M${p(k * Math.PI / 6, 82)}L${p(k * Math.PI / 6, k % 3 ? 76 : 68)}" stroke="#1d2144" stroke-width="${k % 3 ? 3 : 5}" stroke-linecap="round"/>`).join("")}<path d="M100 100L${p(ah, 48)}" stroke="#1d2144" stroke-width="8" stroke-linecap="round"/><path class="aig-m" d="M100 100L${p(am, 72)}" stroke="#3550d9" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#1d2144"/></svg>`;
}
const dureeTexte = (s) => s < 60 ? `${s} secondes` : `${Math.floor(s / 60)} minute${s >= 120 ? "s" : ""}${s % 60 ? " " + (s % 60) : ""}`;

  else if (a.sous === "role") { clsV = "avec-dit"; const r = a.role.replace(/^Rôle de l'interlocuteur\s*:\s*/i, "").replace(/^Questions du recruteur\s*:\s*/i, "Le recruteur demande : "); support = `<div class="parole"><div class="role-g"><span class="masques" aria-hidden="true">🎭</span><h3>Jeu de rôle · l'autre personne</h3><p>${echap(r.charAt(0).toUpperCase() + r.slice(1))}</p></div></div>`; }
  const photo = clsV === "uni" ? null : (a.photo || a.photoH);
  const consigneK = a.sous === "consigne" && a.k, phraseK = a.sous === "repeter";
  const hp = a.sous !== "consigne" && a.audioQ ? `<button class="hp" type="button" data-hp="${echap(a.audioQ)}" aria-label="Écouter la consigne">${HP}</button>` : "";
  const sc = rendre(`<section class="scene sc-duo sc-oral">${visuelHTML(photo, support, clsV)}
    <div class="carte-q"><div class="studio" id="studio">
      <div class="q-ligne">${hp}<h2 class="consigne-o${consigneK || (hp && a.consigneK) ? " kara" : ""}">${consigneK ? karaokeHTML(a.k) : hp && a.consigneK ? karaokeHTML(a.consigneK) : echap(a.consigne)}</h2></div>
      ${phraseK && a.phrase ? `<p class="phrase-o kara">« ${a.k ? karaokeHTML(a.k) : echap(a.phrase)} »</p>` : ""}
      ${a.audio ? ecouteHTML(a.sous === "repeter" ? "Écouter la phrase" : a.sous === "consigne" ? "Écouter la consigne" : a.sous === "question" ? "Écouter la question" : "Écouter") : ""}
      <button class="micro-g" type="button" id="micro" aria-label="Appuyer pour parler"><canvas aria-hidden="true"></canvas><svg class="anneau" viewBox="0 0 100 100" aria-hidden="true"><circle class="fond-a" cx="50" cy="50" r="46"/><circle class="plein" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="0 100"/></svg><span class="ic-m">${I.micro}</span></button>
      <p class="chrono-g" id="chrono">0:00</p><p class="aide-g" id="aide">Appuyez, puis parlez.${a.duree ? ` Environ ${dureeTexte(a.duree)}.` : ""}</p>
      <div class="apres" id="apres"></div>
      <div class="dock-place"></div>
    </div></div></section>`);
  const S = $("#studio", sc), M = $("#micro", sc), plein = $(".plein", M), chrono = $("#chrono", sc), aide = $("#aide", sc), apres = $("#apres", sc);
  brancherHP(S);
  let consigne = null;
  if (a.audio) { consigne = media(a.audio); brancherEcoute($(".ecoute", S), consigne, ENV[a.audio]); const k = consigneK ? $(".consigne-o", S) : $(".phrase-o", S); if (k && (consigneK || a.k)) suivreKaraoke(consigne, k); }

  const halo = $("canvas", M), hx = halo.getContext("2d"); let idHalo = 0, vivant = true;
  const dessinerHalo = (ts) => {

    hx.clearRect(0, 0, halo.width, halo.height); const c = halo.width / 2, r0 = halo.width * .27, n = 72, s = ts / 1000, enreg = S.classList.contains("enreg");
    if (analyseur) { analyseur.getByteFrequencyData(donnees); let t = 0; for (let i = 2; i < 40; i++) t += donnees[i]; niveauVoix += (t / 38 / 255 - niveauVoix) * .3; }

    for (let k = 0; k < n; k++) {

      const v = enreg ? (analyseur ? f * 1.2 + niveauVoix * .5 : .25 + .2 * Math.sin(s * 5 + k * .6)) : .05 + .04 * Math.sin(s * 2 + k * .5), l = halo.width * .2 * Math.min(1, v);
      hx.beginPath(); hx.moveTo(c + Math.cos(ang) * r0, c + Math.sin(ang) * r0); hx.lineTo(c + Math.cos(ang) * (r0 + 4 * dpr + l), c + Math.sin(ang) * (r0 + 4 * dpr + l)); hx.stroke();

  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const cible = a.duree || 20, max = Math.max(30, cible * 1.6);
  const arret = () => {
    clearInterval(minuterie); clearInterval(echant); if (rec && rec.state !== "inactive") rec.stop(); flux?.getTracks().forEach(t => t.stop()); flux = null; analyseur = null;
    if (S.classList.contains("enreg")) { S.classList.remove("enreg"); S.classList.add("fini"); $(".ic-m", M).innerHTML = I.micro; Son.joue("fin"); M.setAttribute("aria-label", "Recommencer"); apresParole(); }

// ---------------------------------------------------------------- le bilan
function bilan() {
  quitter(); document.body.dataset.vue = "bilan";
  const serie = etat.serie.map(id => PAR_ID[id]), R = etat.resultats;
  const qcm = serie.filter(a => a.questions && R[a.id]?.fini), bonnes = qcm.reduce((s, a) => s + R[a.id].bonnes, 0), total = qcm.reduce((s, a) => s + R[a.id].total, 0);

  const ratio = total ? bonnes / total : 1, nEtoiles = ratio >= .85 ? 3 : ratio >= .5 ? 2 : 1;
  const sc = rendre(`<section class="scene bilan"><span class="rayons"></span><span class="lueur"></span>
    <div class="medaille-t">${hexa(total ? `<span id="compte">0</span><small>sur ${total}</small>` : `<span id="compte">✓</span>`, "citron")}</div>
    <div class="etoiles">${[0, 1, 2].map(i => ETOILE(i < nEtoiles)).join("")}</div>
    <h1 class="geant">Bravo&nbsp;!</h1>
    <p class="phrase-b">${total ? `${bonnes} bonne${bonnes > 1 ? "s" : ""} réponse${bonnes > 1 ? "s" : ""} sur ${total}.` : "Série terminée."}</p>
    <div class="stats"><span class="stat s-ecrit" style="--k:0"><i>${I.ecriture}</i>${ecrits} texte${ecrits > 1 ? "s" : ""} écrit${ecrits > 1 ? "s" : ""}</span><span class="stat s-oral" style="--k:1"><i>${I.oral}</i>${oraux} réponse${oraux > 1 ? "s" : ""} à l'oral</span></div>
    <div class="rangee">${serie.map((a, k) => `<span class="mini" style="--k:${k}" title="${echap(a.titre)}">${hexa(I[a.type], TEINTE[a.type])}${R[a.id]?.total ? `<small>${R[a.id].bonnes}/${R[a.id].total}</small>` : R[a.id]?.fini ? `<small>✓</small>` : ""}</span>`).join("")}</div>
    <div class="acc-bas"><button class="go" type="button" id="nouvelle">Nouvelle série ${I.hasard}</button><button class="rond" type="button" id="maison" aria-label="Accueil">${I.maison}</button></div></section>`);

  $("#maison", sc).onclick = () => { Son.joue("tap"); accueil(); };
  annoncer(`Série terminée : ${bonnes} bonnes réponses sur ${total}.`);
}
