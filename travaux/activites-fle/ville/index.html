<meta charset="utf-8">
<title>Ma ville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
:root{--encre:#16233a;--doux:#5b6b80;--bleu:#2f7be0;--bleu2:#1d5fc2;--vert:#2fb563;--vert2:#1f8a49;--rouge:#e5484d;--rose:#ff3d7f;--or:#ffc531;--nuit:#13233a;--papier:#fffdf8;--verre:rgba(17,31,54,.78);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#f3c99a;color:var(--encre);font:16px/1.3 Figtree,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chiffre{font-family:"Baloo 2",Figtree,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

.pc{display:inline-block;width:1em;height:1em;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff6c4 0 12%,#ffd84a 30%,#f2a90c 70%,#c47a00 100%);box-shadow:inset 0 0 0 .08em #b46d00,inset 0 0 0 .16em #ffe27a,0 .06em .1em rgba(0,0,0,.3);position:relative}
.pc::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:.55em;color:#b46d00;text-shadow:0 1px 0 #ffe9a0}

#haut{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
#haut>*{pointer-events:auto}
#niveau{position:relative;width:60px;height:60px;flex:none}
#niveau .etoile{position:absolute;inset:0;background:linear-gradient(160deg,#a98bff,#5b33e0);clip-path:polygon(50% 0,61% 13%,78% 7%,80% 25%,97% 30%,89% 46%,100% 60%,85% 70%,86% 88%,68% 86%,57% 100%,43% 90%,27% 99%,22% 82%,4% 78%,11% 61%,0 46%,14% 34%,12% 16%,30% 16%,39% 2%);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
#niveau b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:25px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#xpBarre{position:absolute;left:4px;right:4px;bottom:-9px;height:8px;border-radius:9px;background:rgba(17,31,54,.7);overflow:hidden;border:1.5px solid #fff}
#xpBarre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee0ff,#3ea8ff);transition:width .5s}
.jauge{height:36px;border-radius:99px;background:var(--verre);color:#fff;display:flex;align-items:center;gap:7px;padding:0 12px 0 3px;font-size:17px;border:1.5px solid rgba(255,255,255,.35)}
.jauge>i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.16)}
#cagnotte{margin-left:auto;height:44px;font-size:23px;padding:0 16px 0 5px;background:linear-gradient(180deg,rgba(28,46,78,.92),rgba(14,26,46,.92));border:2px solid #ffd76a}
#cagnotte .pc{font-size:34px}
#cagnotte.brille{animation:brille .35s}
@keyframes brille{40%{transform:scale(1.14);box-shadow:0 0 0 6px rgba(255,214,90,.35),0 0 24px #ffd65a}}
#cagnotte.vide{animation:vide 1s infinite}
@keyframes vide{50%{border-color:var(--rouge);box-shadow:0 0 0 5px rgba(229,72,77,.35)}}
.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.18)}}
.eclat{position:fixed;z-index:22;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:3px solid #ffe27a;pointer-events:none;animation:eclat .45s ease-out forwards}
@keyframes eclat{to{transform:scale(5);opacity:0}}

.rond{position:fixed;z-index:5;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#ffffff,#dfe9f5);display:grid;place-items:center;font-size:30px;border:3px solid #fff;box-shadow:0 4px 0 #8ea3bd,0 8px 16px rgba(0,0,0,.25);transition:transform .1s}
.rond:active{transform:translateY(3px);box-shadow:0 1px 0 #8ea3bd}
.rond small{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;background:var(--verre);padding:2px 8px;border-radius:99px;white-space:nowrap}
.rond b.pastille{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;border-radius:99px;background:var(--rouge);color:#fff;font-size:14px;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
#bConstruire{left:12px;bottom:calc(36px + env(safe-area-inset-bottom,0px));width:80px;height:80px;font-size:38px;background:radial-gradient(circle at 50% 30%,#ffe27a,#f6a623);box-shadow:0 4px 0 #b06f05,0 8px 16px rgba(0,0,0,.25)}
#bTaches{right:12px;bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.tourner{position:fixed;z-index:5;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--verre);color:#fff;font-size:22px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.4)}
#gauche{left:calc(50% - 54px)}#droite{left:calc(50% + 8px)}
#bAnnuler{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));height:56px;padding:0 26px;border-radius:99px;background:linear-gradient(180deg,#4fd384,var(--vert));color:#fff;font-size:20px;font-weight:900;border:3px solid #fff;box-shadow:0 4px 0 var(--vert2)}
#aide{position:fixed;z-index:12;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top,0px));background:#fff;color:var(--encre);border-radius:18px;padding:10px 16px;font-weight:900;font-size:18px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25);border:3px solid var(--or);text-align:center}
#aide span{font-size:26px}
#doigt{position:fixed;z-index:21;left:0;top:0;pointer-events:none;font-size:52px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));transition:transform .25s}
#doigt i{position:absolute;left:-2px;top:-30px;width:56px;height:56px;border-radius:50%;border:4px solid #fff;animation:anneau 1s infinite;pointer-events:none}
#doigt b{display:block;animation:touche 1s infinite}
@keyframes touche{0%,100%{transform:translateY(8px)}50%{transform:translateY(-6px)}}
@keyframes anneau{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.3);opacity:0}}
body.parle .rond,body.parle .tourner,body.quiz .rond,body.quiz .tourner{opacity:0;pointer-events:none}

.tiroir{position:fixed;left:0;right:0;bottom:0;z-index:7;background:linear-gradient(180deg,#f7fbff,#e8f0fa);border-radius:26px 26px 0 0;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);border-top:4px solid #fff;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.tiroir.ouvert{transform:none}
.tiroir header{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.tiroir header .ico{font-size:28px}
.tiroir header b{font-size:21px;font-weight:900}
.tiroir header button.x{margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--rouge);color:#fff;font-size:20px;font-weight:900;border:3px solid #fff;box-shadow:0 3px 0 #a3262a}
.onglets{display:flex;gap:6px;padding:0 6px 10px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.onglets button{flex:none;display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:99px;background:#fff;font-size:15px;font-weight:800;border:2px solid #d5e0ee}
.onglets button span{font-size:20px}
.onglets button.actif{background:var(--bleu);color:#fff;border-color:var(--bleu2)}
.liste{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 8px;touch-action:pan-x;scrollbar-width:none}
.article{flex:none;width:122px;border-radius:20px;background:#fff;border:3px solid #fff;box-shadow:0 3px 0 #c5d3e4;padding:10px 6px 8px;display:grid;justify-items:center;gap:4px;position:relative;transition:transform .1s}
.article:active{transform:scale(.94)}
.article .picto{font-size:46px;line-height:1.05;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.article b{font-size:14px;font-weight:900;text-align:center;line-height:1.15}
.article .prix{font-size:17px;display:flex;align-items:center;gap:5px;justify-content:center}
.article .prix.cher{color:var(--rouge)}
.article.verrou{filter:grayscale(.8);opacity:.75}
.article.verrou::after{content:attr(data-voile);padding:6px;text-align:center;position:absolute;inset:0;border-radius:17px;background:rgba(232,240,250,.6);display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--nuit)}
.contenu{display:grid;gap:12px;padding:0 6px;max-height:60vh;overflow:auto}
.besoin{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid #e6ecf3;border-radius:16px;padding:6px 12px;font-size:24px}
.besoin.ok{border-color:var(--vert)}
.besoin .chiffre{font-size:19px}
.gros{height:58px;border-radius:99px;background:linear-gradient(180deg,#4fd384,var(--vert));color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;border:3px solid #fff;box-shadow:0 4px 0 var(--vert2);transition:transform .1s;padding:0 22px}
.gros:active{transform:translateY(3px);box-shadow:0 1px 0 var(--vert2)}
.gros:disabled{background:#b9c3cd;box-shadow:0 4px 0 #8d99a6}
.gros.or{background:linear-gradient(180deg,#ffe27a,#f6a623);color:var(--nuit);box-shadow:0 4px 0 #b06f05}
.gros .pc{font-size:24px}
.etat{display:flex;gap:8px;flex-wrap:wrap}
.etat span{display:flex;gap:6px;align-items:center;background:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:16px;border:2px solid #dfe8f2}
.tache{display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;padding:8px;box-shadow:0 3px 0 #c5d3e4}

#bulles{position:fixed;inset:0;pointer-events:none;z-index:3}
.b{position:absolute;left:0;top:0;pointer-events:auto;width:48px;height:48px;margin:-58px 0 0 -24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 rgba(0,0,0,.18);border:3px solid #fff;will-change:transform}
.b>*{animation:flotte 1.6s ease-in-out infinite}
.b::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-6px;border:6px solid transparent;border-top:9px solid #fff;border-bottom:0}
.b .pc{font-size:30px}
.b.argent{background:radial-gradient(circle,#fff8d8,#fff)}
.b.perso{width:66px;height:66px;margin:-80px 0 0 -33px;border-color:var(--bleu);padding:0}
.b.perso::after{border-top-color:var(--bleu);bottom:-13px}
.b.perso img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 30%;background:#dbe8fa;animation:none}
.b.perso i{position:absolute;right:-9px;top:-9px;width:26px;height:26px;border-radius:50%;background:var(--rouge);color:#fff;font:900 17px/26px Figtree,sans-serif;text-align:center;font-style:normal;animation:pulse 1s infinite;border:2px solid #fff}
.b.lecon{background:linear-gradient(180deg,#a98bff,#6a45ea);font-size:28px;width:60px;height:60px;margin:-72px 0 0 -30px}
.b.lecon::after{border-top-color:#fff}
.b.part{animation:part .25s forwards}
@keyframes part{to{opacity:0;scale:1.5}}
@keyframes flotte{50%{transform:translateY(-5px)}}
.vol{position:fixed;z-index:23;pointer-events:none;left:0;top:0;will-change:transform;font-size:28px;line-height:1}
.vol .pc{font-size:30px;animation:pile .5s linear infinite}
@keyframes pile{50%{transform:scaleX(.15)}}
.plus{position:fixed;z-index:23;pointer-events:none;font:800 28px "Baloo 2",sans-serif;color:#fff;-webkit-text-stroke:1.5px rgba(0,0,0,.35);text-shadow:0 3px 0 rgba(0,0,0,.3);animation:monte 1.1s cubic-bezier(.2,1.4,.4,1) forwards;display:flex;align-items:center;gap:6px;transform:translate(-50%,0)}
.plus .pc{font-size:26px}
@keyframes monte{0%{transform:translate(-50%,10px) scale(.4);opacity:0}25%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#combo{position:fixed;z-index:11;left:50%;top:26%;transform:translate(-50%,-50%) scale(0);font:800 46px "Baloo 2",sans-serif;color:#ffd84a;-webkit-text-stroke:2px #8a4b00;text-shadow:0 4px 0 #8a4b00;pointer-events:none;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
#combo.vu{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}

#dial{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(115%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
#dial.ouvert{transform:none}
.feuille{max-width:640px;margin:0 auto;position:relative;padding-top:64px}
.buste{position:absolute;left:4px;top:0;width:118px;height:118px;border-radius:50%;overflow:hidden;border:5px solid #fff;background:linear-gradient(180deg,#bfe0ff,#7fb7ef);box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:2}
.buste img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.buste.parle{animation:parle .5s ease-in-out infinite}
@keyframes parle{50%{transform:scale(1.05) rotate(-2deg)}}
.parole{background:#fff;border-radius:24px;padding:62px 16px 14px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.parole p{margin:0;font-size:clamp(21px,5.8vw,26px);font-weight:800;line-height:1.24}
.parole .ligne{display:flex;gap:10px;align-items:start}
.parole .ligne p{flex:1}
.son{width:50px;height:50px;border-radius:50%;background:#e8f0fc;display:grid;place-items:center;flex:none}
.son svg{width:26px;height:26px;stroke:var(--bleu)}
.moi{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:900;color:var(--doux);letter-spacing:.06em;text-transform:uppercase}
.moi::before{content:"🎩";font-size:20px}
#choix{display:grid;gap:8px}
.rep{display:flex;gap:12px;align-items:center;background:#f1f5fa;border:3px solid #e3ebf5;border-radius:18px;padding:8px 12px;text-align:left;transition:transform .1s,border-color .1s,background .1s;min-height:62px}
.rep .picto{font-size:36px;line-height:1;width:46px;text-align:center;flex:none}
.rep .mot{font-size:18px;font-weight:800;flex:1}
.rep .ok{width:48px;height:48px;border-radius:50%;background:var(--vert);color:#fff;font-size:22px;font-weight:900;display:none;place-items:center;flex:none;box-shadow:0 3px 0 var(--vert2)}
.rep.choisi{border-color:var(--bleu);background:#e8f0fc}
.rep.choisi .ok{display:grid}
.rep.juste{border-color:var(--vert);background:#e2f6ea}
.rep.faux{animation:non .4s;opacity:.3;pointer-events:none}
@keyframes non{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- vocabulaire ---------- */
#quiz{position:fixed;inset:0;z-index:14;background:rgba(19,35,58,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
.qcarte{position:relative;width:min(calc(100vw - 24px),440px);height:min(calc(100vh - 24px),760px);height:min(calc(100dvh - 24px),760px);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#e4fbe0,#7ff0ee);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.qhaut{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 14px 0 26px}
.qbarre{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.75);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.qbarre i{display:block;height:100%;width:0;background:#1fbf73;transition:width .4s}
#qX{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:20px;font-weight:900;border:3px solid #fff}
#qTheme{position:absolute;left:16px;top:34px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.qimage{flex:1;min-height:0;background:center/cover no-repeat;display:grid;place-items:center;position:relative}
.haut-parleur{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffe94d,#ffcf1a);box-shadow:0 8px 0 #f08c1a;display:grid;place-items:center}
.haut-parleur svg{width:64px;height:64px}
.haut-parleur+b{display:block;text-align:center;margin-top:16px;color:#1f8a7a;font-size:19px;font-weight:900}
.qbas{background:#fff;border-radius:28px 28px 0 0;margin-top:-28px;position:relative;padding:20px 18px 18px;display:grid;gap:10px;min-height:42%;align-content:start}
.qbas .q{text-align:center;color:var(--doux);font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center}
.qopt{height:58px;border-radius:18px;background:#fff;border:3px solid #e3e8ef;font-size:21px;font-weight:900;box-shadow:0 3px 0 #e3e8ef;transition:transform .1s}
.qopt:active{transform:scale(.97)}
.qopt.bon{background:#1fbf73;border-color:#1fbf73;color:#fff;box-shadow:0 3px 0 #13915a}
.qopt.mauvais{background:#ffe1ea;border-color:var(--rose);color:#b0164a;animation:non .4s}
.qimgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qimg{aspect-ratio:1;border-radius:18px;background:center/cover;border:4px solid #fff;box-shadow:0 0 0 2px #e3e8ef;position:relative;overflow:hidden}
.qimg span{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;border-radius:10px;padding:3px 10px;font-weight:800;font-size:15px;white-space:nowrap;opacity:0;transition:opacity .2s}
.qimg.bon{box-shadow:0 0 0 5px #1fbf73}.qimg.bon span,.qimg.mauvais span{opacity:1}
.qimg.mauvais{box-shadow:0 0 0 5px var(--rose);animation:non .4s}
.qmot{text-align:center;font:800 clamp(34px,10vw,46px)/1.1 "Baloo 2",sans-serif;color:var(--encre)}
.qmot small{display:block;font:700 16px Figtree,sans-serif;color:var(--doux);margin-top:4px}
.qtrou{display:flex;justify-content:center;align-items:flex-end;gap:10px;font:800 30px "Baloo 2",sans-serif;min-height:56px}
.qtrou .cases{display:flex;gap:4px}
.qtrou .cases i{font-style:normal;width:30px;height:44px;border-bottom:3px solid #9aa6b5;display:grid;place-items:center;color:var(--bleu2)}
.qtrou.bon .cases i{border-color:#1fbf73;color:#13915a}
.qtrou.mauvais{animation:non .4s}.qtrou.mauvais .cases i{border-color:var(--rose)}
.lettres{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lettres button{width:50px;height:54px;border-radius:14px;background:#fff;border:3px solid #e3e8ef;box-shadow:0 3px 0 #e3e8ef;font:800 25px "Baloo 2",sans-serif;text-transform:uppercase}
.lettres button:disabled{opacity:.2}
.lettres .eff{width:auto;padding:0 14px;font-size:20px}
.croix{width:56px;height:56px;border-radius:50%;background:var(--rose);color:#fff;font-size:30px;font-weight:900;display:grid;place-items:center;justify-self:center}
.fin{display:grid;gap:14px;justify-items:center;text-align:center}
.fin .gain{font:800 54px "Baloo 2",sans-serif;display:flex;align-items:center;gap:10px}
.fin .gain .pc{font-size:56px}
.etoiles3{font-size:44px;letter-spacing:6px}

#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);background:var(--papier);border-radius:22px;padding:12px 22px;display:grid;justify-items:center;gap:2px;opacity:0;transition:all .3s cubic-bezier(.2,1.3,.4,1);pointer-events:none;z-index:13;text-align:center;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.vu{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .picto{font-size:42px;line-height:1.1;display:flex;gap:6px;align-items:center}
#toast .picto .pc{font-size:40px}
#toast b{font-size:20px;font-weight:900}
#toast span{font-size:17px;color:var(--doux);font-weight:800;display:flex;gap:4px;align-items:center;justify-content:center}

#bravo{position:fixed;inset:0;z-index:16;background:radial-gradient(circle,rgba(124,92,255,.5),rgba(19,35,58,.9));display:grid;place-items:center;color:#fff;text-align:center;padding:20px;overflow:hidden}
