<meta charset="utf-8">
<title>Ma ville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
:root{--encre:#16233a;--doux:#5b6b80;--bleu:#2f7be0;--bleu2:#1d5fc2;--vert:#2fb563;--vert2:#1f8a49;--rouge:#e5484d;--or:#ffc531;--or2:#e89a0c;--nuit:#13233a;--papier:#fffdf8;--verre:rgba(17,31,54,.78);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#f3c99a;color:var(--encre);font:16px/1.3 Figtree,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chiffre{font-family:"Baloo 2",Figtree,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

.pc{display:inline-block;width:1em;height:1em;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff6c4 0 12%,#ffd84a 30%,#f2a90c 70%,#c47a00 100%);box-shadow:inset 0 0 0 .08em #b46d00,inset 0 0 0 .16em #ffe27a,0 .06em .1em rgba(0,0,0,.3);position:relative}
.pc::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:.55em;color:#b46d00;text-shadow:0 1px 0 #ffe9a0}

#haut{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;pointer-events:none}
#haut>*{pointer-events:auto}
#niveau{position:relative;width:62px;height:62px}
#niveau .etoile{position:absolute;inset:0;background:linear-gradient(160deg,#a98bff,#5b33e0);clip-path:polygon(50% 0,61% 13%,78% 7%,80% 25%,97% 30%,89% 46%,100% 60%,85% 70%,86% 88%,68% 86%,57% 100%,43% 90%,27% 99%,22% 82%,4% 78%,11% 61%,0 46%,14% 34%,12% 16%,30% 16%,39% 2%);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
#niveau b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:26px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#xpBarre{position:absolute;left:4px;right:4px;bottom:-9px;height:8px;border-radius:9px;background:rgba(17,31,54,.7);overflow:hidden;border:1.5px solid #fff}
#xpBarre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee0ff,#3ea8ff);transition:width .5s}
.colonne{display:grid;gap:6px;justify-items:start}
.jauge{height:34px;border-radius:99px;background:var(--verre);color:#fff;display:flex;align-items:center;gap:7px;padding:0 12px 0 3px;font-size:17px;border:1.5px solid rgba(255,255,255,.35);transition:transform .15s}
.jauge>i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.16)}
.jauge.alerte{background:rgba(196,40,46,.85)}
.rangee{display:flex;gap:6px;flex-wrap:wrap}
.rangee .jauge{height:28px;font-size:14px;padding-right:9px}
.rangee .jauge>i{width:22px;height:22px;font-size:13px}
#cagnotte{height:40px;font-size:21px;padding:0 14px 0 4px;background:linear-gradient(180deg,rgba(28,46,78,.9),rgba(14,26,46,.9));border:2px solid #ffd76a;position:relative}
#cagnotte .pc{font-size:32px}
#cagnotte.brille{animation:brille .35s}
@keyframes brille{40%{transform:scale(1.14);box-shadow:0 0 0 6px rgba(255,214,90,.35),0 0 24px #ffd65a}}
.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.18)}}
.eclat{position:fixed;z-index:12;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:3px solid #ffe27a;pointer-events:none;animation:eclat .45s ease-out forwards}
@keyframes eclat{to{transform:scale(5);opacity:0}}

.rond{position:fixed;z-index:5;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#ffffff,#dfe9f5);display:grid;place-items:center;font-size:30px;border:3px solid #fff;box-shadow:0 4px 0 #8ea3bd,0 8px 16px rgba(0,0,0,.25);transition:transform .1s}
.rond:active{transform:translateY(3px);box-shadow:0 1px 0 #8ea3bd}
.rond small{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;background:var(--verre);padding:2px 8px;border-radius:99px;white-space:nowrap}
.rond b.pastille{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;border-radius:99px;background:var(--rouge);color:#fff;font-size:14px;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
#bConstruire{left:12px;bottom:calc(36px + env(safe-area-inset-bottom,0px));width:76px;height:76px;font-size:36px;background:radial-gradient(circle at 50% 30%,#ffe27a,#f6a623);box-shadow:0 4px 0 #b06f05,0 8px 16px rgba(0,0,0,.25)}
#bEntrepot{right:12px;bottom:calc(36px + env(safe-area-inset-bottom,0px))}
#bTaches{right:12px;bottom:calc(128px + env(safe-area-inset-bottom,0px))}
#bEau{right:12px;bottom:calc(220px + env(safe-area-inset-bottom,0px))}
#bEau.actif{background:radial-gradient(circle at 50% 30%,#bfe6ff,#3ea8ff)}
.tourner{position:fixed;z-index:5;bottom:calc(44px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--verre);color:#fff;font-size:22px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.4)}
#gauche{left:calc(50% - 54px)}#droite{left:calc(50% + 8px)}
#bAnnuler{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));height:54px;padding:0 24px;border-radius:99px;background:linear-gradient(180deg,#4fd384,var(--vert));color:#fff;font-size:19px;font-weight:900;border:3px solid #fff;box-shadow:0 4px 0 var(--vert2)}
#aide{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top,0px));background:var(--verre);color:#fff;border-radius:16px;padding:8px 14px;font-weight:800;font-size:15px;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
body.parle .rond,body.parle .tourner,body.scene .rond,body.scene .tourner{opacity:0;pointer-events:none}

.tiroir{position:fixed;left:0;right:0;bottom:0;z-index:7;background:linear-gradient(180deg,#f7fbff,#e8f0fa);border-radius:26px 26px 0 0;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);border-top:4px solid #fff;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.tiroir.ouvert{transform:none}
.tiroir header{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.tiroir header .ico{font-size:28px}
.tiroir header b{font-size:21px;font-weight:900}
.tiroir header button.x{margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--rouge);color:#fff;font-size:20px;font-weight:900;border:3px solid #fff;box-shadow:0 3px 0 #a3262a}
.onglets{display:flex;gap:6px;padding:0 6px 10px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.onglets button{flex:none;display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:99px;background:#fff;font-size:14px;font-weight:800;border:2px solid #d5e0ee}
.onglets button span{font-size:20px}
.onglets button.actif{background:var(--bleu);color:#fff;border-color:var(--bleu2)}
.liste{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 8px;touch-action:pan-x;scrollbar-width:none}
.article{flex:none;width:118px;border-radius:20px;background:#fff;border:3px solid #fff;box-shadow:0 3px 0 #c5d3e4;padding:10px 6px 8px;display:grid;justify-items:center;gap:4px;position:relative;transition:transform .1s}
.article:active{transform:scale(.94)}
.article .picto{font-size:44px;line-height:1.05;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.article b{font-size:13px;font-weight:900;text-align:center;line-height:1.15}
.article .prix{font-size:15px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.article .prix .manque{color:var(--rouge)}
.article .effet{font-size:12px;font-weight:800;color:var(--doux)}
.article.verrou{filter:grayscale(.8);opacity:.75}
.article.verrou::after{content:"🔒 " attr(data-niv);position:absolute;inset:0;border-radius:17px;background:rgba(232,240,250,.55);display:grid;place-items:center;font-size:16px;font-weight:900;color:var(--nuit)}
.contenu{display:grid;gap:12px;padding:0 6px;max-height:60vh;overflow:auto}
.ligne-prod{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hexa{flex:none;width:92px;height:100px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#fff;display:grid;place-items:center;align-content:center;gap:0;text-align:center;transition:transform .1s;position:relative}
.hexa:active{transform:scale(.92)}
.hexa .picto{font-size:34px;line-height:1.05}
.hexa small{font-size:11px;font-weight:800;color:var(--doux)}
.hexa.verrou{filter:grayscale(1);opacity:.5;pointer-events:none}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.case{width:62px;height:68px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#dce6f2;display:grid;place-items:center;font-size:28px;position:relative;overflow:hidden}
.case .barre{position:absolute;left:0;bottom:0;height:100%;background:rgba(47,181,99,.35);transition:width .5s linear}
.case span{position:relative}
.case.pret{background:#bdf0cf;animation:pulse 1s infinite}
.case.vide{background:#eef3f9}
.besoins{display:flex;gap:10px;flex-wrap:wrap}
.besoin{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid #e6ecf3;border-radius:16px;padding:6px 12px;font-size:24px}
.besoin.ok{border-color:var(--vert)}
.besoin .chiffre{font-size:19px}
.besoin.manque .chiffre{color:var(--rouge)}
.gros{height:56px;border-radius:99px;background:linear-gradient(180deg,#4fd384,var(--vert));color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;border:3px solid #fff;box-shadow:0 4px 0 var(--vert2);transition:transform .1s;padding:0 20px}
.gros:active{transform:translateY(3px);box-shadow:0 1px 0 var(--vert2)}
.gros:disabled{background:#b9c3cd;box-shadow:0 4px 0 #8d99a6}
.gros.or{background:linear-gradient(180deg,#ffe27a,#f6a623);color:var(--nuit);box-shadow:0 4px 0 #b06f05}
.etat{display:flex;gap:8px;flex-wrap:wrap}
.etat span{display:flex;gap:6px;align-items:center;background:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:15px;border:2px solid #dfe8f2}
.etat span.ko{border-color:var(--rouge);color:var(--rouge)}
.gain{background:var(--nuit);color:#fff;border-radius:18px;padding:10px 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:18px}
.gain b{font-size:13px;opacity:.7;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;padding:0 6px}
.stock .case{width:auto;height:84px;clip-path:none;border-radius:18px;background:#fff;flex-direction:column;font-size:32px;display:flex;justify-content:center;box-shadow:0 3px 0 #c5d3e4}
.stock .case .chiffre{font-size:17px}
.tache{display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;padding:8px;box-shadow:0 3px 0 #c5d3e4}

#bulles{position:fixed;inset:0;pointer-events:none;z-index:3}
.b{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;animation:flotte 1.6s ease-in-out infinite;box-shadow:0 3px 0 rgba(0,0,0,.18);border:3px solid #fff}
.b::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-6px;border:6px solid transparent;border-top:9px solid #fff;border-bottom:0}
.b .pc{font-size:30px}
.b.argent{background:radial-gradient(circle,#fff8d8,#fff)}
.b.perso{width:64px;height:64px;border-color:var(--bleu);padding:0}
.b.perso::after{border-top-color:var(--bleu);bottom:-13px}
.b.perso img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#dbe8fa}
.b.perso i{position:absolute;right:-9px;top:-9px;width:26px;height:26px;border-radius:50%;background:var(--rouge);color:#fff;font:900 17px/26px Figtree,sans-serif;text-align:center;font-style:normal;animation:pulse 1s infinite;border:2px solid #fff}
.b.lecon{background:linear-gradient(180deg,#a98bff,#6a45ea);border-color:#fff;font-size:26px;width:56px;height:56px}
.b.lecon::after{border-top-color:#fff}
.b.manque{background:#fff1f1;border-color:var(--rouge);width:38px;height:38px;font-size:19px}
.b.manque::after{border-top-color:var(--rouge)}
.b.part{animation:part .25s forwards}
@keyframes part{to{transform:translate(-50%,-160%) scale(1.5);opacity:0}}
@keyframes flotte{50%{margin-top:-6px}}
.vol{position:fixed;z-index:11;pointer-events:none;left:0;top:0;will-change:transform;font-size:28px;line-height:1}
.vol .pc{font-size:30px;animation:pile .5s linear infinite}
@keyframes pile{50%{transform:scaleX(.15)}}
.plus{position:fixed;z-index:11;pointer-events:none;font:800 28px "Baloo 2",sans-serif;color:#fff;-webkit-text-stroke:1.5px rgba(0,0,0,.35);text-shadow:0 3px 0 rgba(0,0,0,.3);animation:monte 1.1s cubic-bezier(.2,1.4,.4,1) forwards;display:flex;align-items:center;gap:6px;transform:translate(-50%,0)}
.plus .pc{font-size:26px}
@keyframes monte{0%{transform:translate(-50%,10px) scale(.4);opacity:0}25%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#combo{position:fixed;z-index:11;left:50%;top:26%;transform:translate(-50%,-50%) scale(0);font:800 46px "Baloo 2",sans-serif;color:#ffd84a;-webkit-text-stroke:2px #8a4b00;text-shadow:0 4px 0 #8a4b00;pointer-events:none;transition:transform .2s cubic-bezier(.2,1.6,.4,1),opacity .3s}
#combo.vu{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}

#dial{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(115%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
#dial.ouvert{transform:none}
.feuille{max-width:640px;margin:0 auto;position:relative;padding-top:64px}
.buste{position:absolute;left:4px;top:0;width:118px;height:118px;border-radius:50%;overflow:hidden;border:5px solid #fff;background:linear-gradient(180deg,#bfe0ff,#7fb7ef);box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:2}
.buste img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.buste.parle{animation:parle .5s ease-in-out infinite}
@keyframes parle{50%{transform:scale(1.05) rotate(-2deg)}}
.parole{background:#fff;border-radius:24px;padding:62px 16px 14px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.parole .qui{position:absolute;left:132px;top:72px;font-size:13px;font-weight:900;color:var(--bleu);text-transform:uppercase;letter-spacing:.07em}
.parole p{margin:0;font-size:clamp(19px,5.2vw,24px);font-weight:800;line-height:1.24}
.parole .ligne{display:flex;gap:10px;align-items:start}
.parole .ligne p{flex:1}
.son{width:48px;height:48px;border-radius:50%;background:#e8f0fc;display:grid;place-items:center;flex:none}
.son svg{width:24px;height:24px;stroke:var(--bleu)}
.moi{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:900;color:var(--doux);letter-spacing:.06em;text-transform:uppercase}
.moi::before{content:"🎩";font-size:20px}
#choix,.choix{display:grid;gap:8px}
.rep{display:flex;gap:12px;align-items:center;background:#f1f5fa;border:3px solid #e3ebf5;border-radius:18px;padding:8px 12px;text-align:left;transition:transform .1s,border-color .1s,background .1s;min-height:60px}
.rep .picto{font-size:34px;line-height:1;width:44px;text-align:center;flex:none}
.rep .mot{font-size:17px;font-weight:800;flex:1}
.rep .ok{width:46px;height:46px;border-radius:50%;background:var(--vert);color:#fff;font-size:22px;font-weight:900;display:none;place-items:center;flex:none;box-shadow:0 3px 0 var(--vert2)}
.rep.choisi{border-color:var(--bleu);background:#e8f0fc}
.rep.choisi .ok{display:grid}
.rep.juste{border-color:var(--vert);background:#e2f6ea}
.rep.faux{animation:non .4s;opacity:.3;pointer-events:none}
@keyframes non{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

#scene{position:fixed;inset:0;z-index:14;background:linear-gradient(180deg,rgba(19,35,58,.55),rgba(19,35,58,.88));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;grid-template-rows:auto 1fr auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;color:#fff}
#scene header{display:flex;align-items:center;gap:10px}
#scene header b{font:800 22px "Baloo 2",sans-serif}
#scene header .x{margin-left:auto;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);font-size:20px;font-weight:900;color:#fff}
.points{display:flex;gap:6px;justify-content:center}
.points i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.points i.fait{background:var(--or)}
.points i.ici{background:#fff;transform:scale(1.3)}
.decor{align-self:center;justify-self:center;width:100%;max-width:560px;display:grid;gap:14px;justify-items:center}
.decor .buste{position:relative;left:auto;top:auto;width:150px;height:150px}
.decor .bulleP{background:#fff;color:var(--encre);border-radius:22px;padding:14px 16px;display:flex;gap:10px;align-items:center;max-width:100%;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.decor .bulleP::before{content:"";position:absolute;left:50%;top:-12px;margin-left:-10px;border:10px solid transparent;border-bottom:12px solid #fff;border-top:0}
.decor .bulleP p{margin:0;font-size:clamp(19px,5.4vw,25px);font-weight:800;line-height:1.25}
.action{width:100%;max-width:560px;justify-self:center;background:var(--papier);color:var(--encre);border-radius:24px;padding:14px;display:grid;gap:12px}
.action .consigne{display:flex;gap:8px;align-items:center;font-weight:900;font-size:14px;color:var(--doux);text-transform:uppercase;letter-spacing:.06em}
.action .consigne span{font-size:22px}
.phrase{font-size:clamp(19px,5.4vw,24px);font-weight:800;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.trou{display:inline-flex;gap:3px;padding:2px 6px;border-radius:10px;background:#eef3f9;min-height:44px;align-items:center}
.trou i{font-style:normal;width:26px;height:36px;border-bottom:3px solid var(--bleu);display:grid;place-items:center;font-size:22px;color:var(--bleu2)}
.trou.juste{background:#dff5e7}.trou.juste i{border-color:var(--vert);color:var(--vert2)}
.trou.faux{animation:non .4s;background:#ffe5e5}
.lettres{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lettres button{width:48px;height:52px;border-radius:14px;background:#fff;border:3px solid #d5e0ee;box-shadow:0 3px 0 #c5d3e4;font:800 24px "Baloo 2",sans-serif}
.lettres button:disabled{opacity:.25}
.lettres .eff{width:auto;padding:0 14px;font-size:20px}
.micro{width:96px;height:96px;border-radius:50%;justify-self:center;background:radial-gradient(circle at 50% 30%,#ff8a8a,var(--rouge));color:#fff;font-size:42px;border:5px solid #fff;box-shadow:0 5px 0 #a3262a,0 0 0 0 rgba(229,72,77,.5)}
.micro.ecoute{animation:onde 1.2s infinite}
@keyframes onde{to{box-shadow:0 5px 0 #a3262a,0 0 0 26px rgba(229,72,77,0)}}
.entendu{text-align:center;font-weight:700;color:var(--doux);min-height:22px}
.rangeeB{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

#toast{position:fixed;left:50%;top:21%;transform:translate(-50%,-50%) scale(.8);background:var(--papier);border-radius:22px;padding:12px 22px;display:grid;justify-items:center;gap:2px;opacity:0;transition:all .3s cubic-bezier(.2,1.3,.4,1);pointer-events:none;z-index:13;text-align:center;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.vu{opacity:1;transform:translate(-50%,-50%) scale(1)}

const normal = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ').replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);

/* ================================================================ BULLES AU-DESSUS DE LA VILLE */

/* ================================================================ DOIGTS */
const rayon = new THREE.Raycaster(), plan = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), v2 = new THREE.Vector2();
function versPlan(x, y) { v2.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); rayon.setFromCamera(v2, cam); const p = new THREE.Vector3(); return rayon.ray.intersectPlane(plan, p) ? p : null; }
function caseSous(x, y) { const p = versPlan(x, y); return p ? [Math.floor(p.x / T + N / 2), Math.floor(p.z / T + N / 2)] : null; }

  v2.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); rayon.setFromCamera(v2, cam);
  const h = rayon.intersectObjects(Object.values(objets), true).find(h => !h.object.isSprite);
  if (h) { let o = h.object; while (o.parent && o.parent !== monde) o = o.parent; const k = Object.keys(objets).find(k => objets[k] === o); if (k) return k; }
  const c = caseSous(x, y); return c && E.cases[cle(...c)] ? cle(...c) : null;
}
const doigts = new Map(); let bouge = 0, pinceD = 0, pinceA = 0, trace = null, tourne = false;
function ecartAngle() { const [p, q] = [...doigts.values()]; return [Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY) || 1, Math.atan2(q.clientY - p.clientY, q.clientX - p.clientX)]; }

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); doigts.set(e.pointerId, e); bouge = 0; trace = null; tourne = e.button === 2 || e.shiftKey;
  if (doigts.size === 2) [pinceD, pinceA] = ecartAngle(); else if (mode && BATIS[mode].glisse) { const c = caseSous(e.clientX, e.clientY); if (c) { poser(...c); trace = cle(...c); } } });
canvas.addEventListener('pointermove', e => {

canvas.addEventListener('pointerup', e => {

/* ================================================================ BOUCLE */
$('jouer').onclick = () => { $('menu').hidden = true; voixEl.play().catch(() => {}); voixEl.pause(); attente = 1.5;
  if (E.debut) { E.debut = false; sauver(); setTimeout(() => { dire('bienvenue'); toast('🎩', 'Bienvenue' + NB + '!', '👥❗ → 💬'); }, 500); } };

const horloge = new THREE.Clock(); let tSec = 0, tFumee = 0, fpsT = 0, fpsN = 0, leger = false, tMer = 0;
const AXE = new THREE.Vector3(0, 1, 0);

(async () => {
