<style>
:root{--encre:#1b2533;--doux:#5b6875;--bleu:#2f6fd6;--vert:#29a35e;--rouge:#e5484d;--or:#f6b630;--nuit:#13233a;--papier:#fffdf8;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#5ec3ee;color:var(--encre);font:16px/1.3 Figtree,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chiffre{font-family:"Baloo 2",Figtree,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- barre du haut ---------- */
#haut{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:6px;align-items:center;pointer-events:none}
#haut>*{pointer-events:auto}
#niveau{position:relative;width:54px;height:54px;flex:none}
#niveau svg{position:absolute;inset:0;transform:rotate(-90deg)}
#niveau b{position:absolute;inset:6px;border-radius:50%;background:linear-gradient(160deg,#7c5cff,#4b2fd1);color:#fff;display:grid;place-items:center;font-size:22px;border:3px solid #fff}
.jauge{height:36px;border-radius:99px;background:rgba(19,35,58,.72);color:#fff;display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;font-size:18px}
.jauge i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.18)}
#piecesJ{margin-left:auto}
#piecesJ i{background:var(--or)}
.jauge.pulse{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.12)}}

/* ---------- boutons du bas ---------- */
.rond{position:fixed;z-index:5;width:64px;height:64px;border-radius:20px;background:linear-gradient(180deg,#fff,#e9eef5);display:grid;place-items:center;font-size:32px;border-bottom:4px solid #b9c6d6}
.rond small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
#bConstruire{left:10px;bottom:calc(30px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#ffd35c,#f6a623);border-color:#c97f0a}
#bEntrepot{right:10px;bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#bTaches{right:10px;bottom:calc(122px + env(safe-area-inset-bottom,0px))}
#bTaches b{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;border-radius:99px;background:var(--rouge);color:#fff;font-size:14px;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
#bAnnuler{left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));width:auto;padding:0 22px;height:56px;border-radius:99px;font-size:18px;font-weight:800;gap:8px;display:flex;align-items:center}

/* ---------- catalogue de construction ---------- */
.tiroir{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--papier);border-radius:24px 24px 0 0;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.tiroir.ouvert{transform:none}
.tiroir header{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.tiroir header b{font-size:20px;font-weight:900}
.tiroir header button{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#eef2f7;font-size:20px}
.onglets{display:flex;gap:6px;padding:0 6px 10px;overflow-x:auto;scrollbar-width:none}
.onglets button{flex:none;height:40px;padding:0 14px;border-radius:99px;background:#eef2f7;font-weight:800;font-size:20px}
.onglets button.actif{background:var(--bleu);color:#fff}
.liste{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 6px;touch-action:pan-x;scrollbar-width:none}
.article{flex:none;width:108px;border-radius:18px;background:#fff;border:3px solid #e6ecf3;padding:10px 6px 8px;display:grid;justify-items:center;gap:4px;position:relative}
.article .picto{font-size:40px;line-height:1.1}
.article b{font-size:13px;font-weight:800;text-align:center;line-height:1.15;min-height:30px;display:grid;place-items:center}
.article .prix{font-size:16px;display:flex;align-items:center;gap:3px}
.article.verrou{opacity:.5}
.article.verrou::after{content:attr(data-niv);position:absolute;inset:0;border-radius:15px;background:rgba(255,255,255,.55);display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--nuit)}
.article.cher .prix{color:var(--rouge)}

/* ---------- fiche d'un bâtiment ---------- */
#fiche .contenu{display:grid;gap:12px;padding:0 6px}
.ligne-prod{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.produit{flex:none;width:96px;border-radius:16px;background:#fff;border:3px solid #e6ecf3;padding:8px 4px;display:grid;justify-items:center;gap:2px}
.produit .picto{font-size:34px;line-height:1.1}
.produit small{font-size:12px;font-weight:700;color:var(--doux)}
.produit.verrou{opacity:.4;pointer-events:none}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.case{width:58px;height:58px;border-radius:14px;background:#eef2f7;display:grid;place-items:center;font-size:28px;position:relative;overflow:hidden}
.case .barre{position:absolute;left:0;bottom:0;height:6px;background:var(--vert)}
.case.pret{background:#dcf5e5;animation:pulse 1s infinite}
.case.vide{border:2px dashed #c8d2de;background:none}
.besoins{display:flex;gap:10px;flex-wrap:wrap}
.besoin{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid #e6ecf3;border-radius:14px;padding:6px 12px;font-size:24px}
.besoin.ok{border-color:var(--vert)}
.besoin .chiffre{font-size:18px}
.besoin.manque .chiffre{color:var(--rouge)}
.gros{height:56px;border-radius:99px;background:var(--vert);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:4px solid #1b7a44}
.gros:disabled{background:#b9c3cd;border-color:#9aa5b1}
.recomp{display:flex;gap:12px;font-size:18px;color:var(--doux);align-items:center}

/* ---------- entrepôt ---------- */
.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:0 6px}
.stock .case{width:auto;height:76px;flex-direction:column;font-size:30px;display:flex;justify-content:center}
.stock .case .chiffre{font-size:16px}

/* ---------- bulles au-dessus des bâtiments et des habitants ---------- */
#bulles{position:fixed;inset:0;pointer-events:none;z-index:3}
.b{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;border:3px solid #fff;animation:flotte 1.6s ease-in-out infinite}
.b::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top:9px solid #fff;border-bottom:0}
.b.perso{width:60px;height:60px;border:4px solid var(--bleu);padding:0;overflow:visible}
.b.perso::after{border-top-color:var(--bleu)}
.b.perso img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#dbe8fa}
.b.perso i{position:absolute;right:-8px;top:-8px;width:24px;height:24px;border-radius:50%;background:var(--rouge);color:#fff;font:900 16px/24px Figtree,sans-serif;text-align:center;font-style:normal}
@keyframes flotte{50%{margin-top:-6px}}
.vol{position:fixed;z-index:9;pointer-events:none;font-size:30px;transition:all .7s cubic-bezier(.5,0,.5,1)}

/* ---------- dialogue ---------- */
#dial{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;justify-items:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#dial.ouvert{transform:none}
.feuille{width:100%;max-width:640px;background:var(--papier);border-radius:24px;padding:16px;display:grid;gap:13px}
.pnj{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.portrait{width:86px;height:86px;border-radius:50%;background:#dbe8fa;border:4px solid var(--bleu);overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.portrait.parle{animation:parle .5s ease-in-out infinite}
@keyframes parle{50%{transform:scale(1.06)}}
.pnj p{margin:0;font-size:clamp(19px,5.2vw,24px);font-weight:800;line-height:1.2}
.son{width:50px;height:50px;border-radius:50%;background:#e8f0fc;display:grid;place-items:center}
.son svg{width:25px;height:25px;stroke:var(--bleu)}
#choix{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.carte{background:#f1f5f9;border:3px solid transparent;border-radius:18px;padding:10px 4px;display:grid;gap:4px;justify-items:center;min-height:100px;align-content:center}
.carte .picto{font-size:44px;line-height:1.1}
.carte .mot{font-size:13px;font-weight:700;color:var(--doux)}
.carte.juste{border-color:var(--vert);background:#e2f6ea}
.carte.faux{animation:non .4s;opacity:.3;pointer-events:none}
@keyframes non{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);background:var(--papier);border-radius:22px;padding:14px 24px;display:grid;justify-items:center;gap:2px;opacity:0;transition:all .35s cubic-bezier(.2,1.3,.4,1);pointer-events:none;z-index:9;text-align:center}
#toast.vu{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .picto{font-size:48px;line-height:1.1}
#toast b{font-size:20px;font-weight:900}
#toast span{font-size:15px;color:var(--doux);font-weight:700}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,rgba(19,35,58,.15),rgba(19,35,58,.88));color:#fff;display:grid;align-content:end;padding:28px 22px calc(44px + env(safe-area-inset-bottom,0px));gap:18px}
#menu h1{margin:0;font:800 clamp(52px,15vw,92px)/.9 "Baloo 2",Figtree,sans-serif;letter-spacing:-.02em;text-shadow:0 3px 0 rgba(0,0,0,.2)}
#menu p{margin:0;font-size:17px;font-weight:700;opacity:.9;max-width:32ch}
#jouer{justify-self:start;height:74px;padding:0 36px 0 28px;border-radius:99px;background:linear-gradient(180deg,#ffd35c,#f6a623);color:var(--nuit);font-size:26px;font-weight:900;display:flex;gap:12px;align-items:center;border-bottom:5px solid #c97f0a}
#jouer svg{width:28px;height:28px;fill:var(--nuit)}
#zero{justify-self:start;opacity:.7;font-size:14px;font-weight:700;text-decoration:underline}
#charge{position:fixed;inset:0;z-index:30;background:var(--nuit);display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:20px}
#charge i{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,255,255,.2);border-top-color:var(--or);animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
const $ = id => document.getElementById(id), NB = ' ';
const TEL = matchMedia('(pointer: coarse)').matches;
const maintenant = () => Date.now() / 1000;

/* ================================================================ RÈGLES DU JEU */
// matières premières (usine) et objets fabriqués (atelier)
const BIENS = {
  metal: { picto: '🔩', nom: 'Métal', duree: 12 }, bois: { picto: '🪵', nom: 'Bois', duree: 18 }, plastique: { picto: '🧴', nom: 'Plastique', duree: 30, niv: 3 },
  clous: { picto: '🔨', nom: 'Clous', duree: 25, recette: { metal: 2 } }, planches: { picto: '🪚', nom: 'Planches', duree: 30, recette: { bois: 2 } },
  pain: { picto: '🥖', nom: 'Pain', duree: 20, recette: { bois: 1 }, niv: 4 }
};
const BATIS = {
  route: { picto: '🛣️', nom: 'Route', prix: 10, cat: 'route', niv: 1 },
  maison: { picto: '🏠', nom: 'Maison', prix: 50, cat: 'maison', niv: 1 },
  usine: { picto: '🏭', nom: 'Usine', prix: 150, cat: 'travail', niv: 1, produit: ['metal', 'bois', 'plastique'], places: 3 },
  atelier: { picto: '🔨', nom: 'Atelier', prix: 300, cat: 'travail', niv: 2, modele: 'building_D', produit: ['clous', 'planches', 'pain'], places: 2 },
  parc: { picto: '🌳', nom: 'Parc', prix: 80, cat: 'service', niv: 1, joie: 10 },
  boulangerie: { picto: '🥖', nom: 'Boulangerie', prix: 250, cat: 'service', niv: 2, modele: 'building_B', joie: 15 },
  ecole: { picto: '🏫', nom: 'École', prix: 500, cat: 'service', niv: 3, modele: 'building_H', joie: 20 },
  pharmacie: { picto: '💊', nom: 'Pharmacie', prix: 400, cat: 'service', niv: 3, modele: 'building_F', joie: 15 },
  cafe: { picto: '☕', nom: 'Café', prix: 350, cat: 'service', niv: 4, modele: 'building_G', joie: 15 },
  medecin: { picto: '🩺', nom: 'Médecin', prix: 600, cat: 'service', niv: 4, modele: 'building_E', joie: 20 },
  mairie: { picto: '🏛️', nom: 'Mairie', prix: 0, cat: 'aucune', modele: 'building_E' }
};
const CATS = [['maison', '🏠'], ['route', '🛣️'], ['travail', '🏭'], ['service', '🌳']];
// une maison grandit par niveaux : il faut des objets pour l'améliorer
const MAISONS = [
  { modeles: ['building_A', 'building_B'], hab: 6, impot: 3 },
  { modeles: ['building_E', 'building_F'], hab: 16, impot: 7, cout: { bois: 1, metal: 1 } },
  { modeles: ['building_C', 'building_G'], hab: 34, impot: 14, cout: { planches: 1, clous: 1 } },
  { modeles: ['building_H', 'building_D'], hab: 60, impot: 24, cout: { planches: 2, clous: 2, plastique: 1 } }
];
const XP_NIV = [0, 25, 70, 150, 260, 420, 650];
const CAPA = 30;

/* les habitants et ce qu'ils disent (voix enregistrées) */
const GENS = [{ glb: 'boulangere', img: 'portrait-mairie', v: 'f' }, { glb: 'joueur', img: 'portrait-gare', v: 'h1' }, { glb: 'passant', img: 'portrait-voisin', v: 'h2' }];
const DEMANDES = {   // c = ce qu'il faut comprendre ; donner = objets à donner ; batir = bâtiment à construire
  maison: { voix: 'd-maison', qui: 0, dit: 'Bonjour' + NB + '! Je cherche une maison.', c: 'maison', batir: 'maison' },
  boulangerie: { voix: 'd-boulangerie', qui: 1, dit: 'J’ai faim. Je voudrais une boulangerie.', c: 'boulangerie', batir: 'boulangerie', niv: 2 },
  ecole: { voix: 'd-ecole', qui: 0, dit: 'Mes enfants ont six ans. Il faut une école.', c: 'ecole', batir: 'ecole', niv: 3 },
  pharmacie: { voix: 'd-pharmacie', qui: 2, dit: 'Je suis malade. Où est la pharmacie' + NB + '?', c: 'pharmacie', batir: 'pharmacie', niv: 3 },
  parc: { voix: 'd-parc', qui: 0, dit: 'Je voudrais un parc, pour les enfants.', c: 'parc', batir: 'parc' },
  cafe: { voix: 'd-cafe', qui: 1, dit: 'Je voudrais boire un café.', c: 'cafe', batir: 'cafe', niv: 4 },
  medecin: { voix: 'd-medecin', qui: 2, dit: 'J’ai mal à la tête. Il faut un médecin.', c: 'medecin', batir: 'medecin', niv: 4 },
  bois: { voix: 'q-bois', qui: 1, dit: 'Il me faut du bois, s’il te plaît.', c: 'bois', donner: { bois: 2 } },
  metal: { voix: 'q-metal', qui: 2, dit: 'Il me faut du métal, s’il te plaît.', c: 'metal', donner: { metal: 2 } },
  plastique: { voix: 'q-plastique', qui: 0, dit: 'Il me faut du plastique, s’il te plaît.', c: 'plastique', donner: { plastique: 1 }, niv: 3 },
  clous: { voix: 'q-clous', qui: 1, dit: 'Je voudrais des clous.', c: 'clous', donner: { clous: 1 }, niv: 2 },
  planches: { voix: 'q-planches', qui: 0, dit: 'Je voudrais des planches.', c: 'planches', donner: { planches: 1 }, niv: 2 }
};
const ORDRE = ['maison', 'metal', 'parc', 'bois', 'boulangerie', 'clous', 'planches', 'ecole', 'plastique', 'pharmacie', 'cafe', 'medecin'];
const infos = k => BATIS[k] || BIENS[k];

/* ================================================================ ÉTAT ET SAUVEGARDE */
const N = 24, T = 2, CLE = 'ma-ville-3';
function neuf() {
  const c = {}, m = N / 2;
  c[cle(m, m - 1)] = { t: 'mairie' };
  for (let i = 2; i < N - 2; i++) c[cle(i, m)] = { t: 'route' };
  c[cle(m - 3, m - 1)] = { t: 'usine', file: [] };
  return { cases: c, pieces: 400, xp: 0, stock: { metal: 2, bois: 2 }, joie: 50, prochaine: 0, taches: [], vu: [], debut: true };
}
let E;
try { E = JSON.parse(localStorage.getItem(CLE) || 'null'); } catch (e) {}
if (!E || !E.cases) E = neuf();
const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} };

}
function recolter(k, idx) {
  const c = E.cases[k], f = c.file[idx]; if (!f || maintenant() - f.debut < BIENS[f.p].duree) return false;
  if (nbStock() >= CAPA) { S.faux(); toast('📦', 'Entrepôt plein'); return false; }
  c.file.splice(idx, 1); E.stock[f.p] = (E.stock[f.p] || 0) + 1; S.piece(); gagner(1);
  const [i, j] = k.split(',').map(Number), e = ecran(pos(i, j).setY(1.5)); voler(BIENS[f.p].picto, e, centreDe('bEntrepot'));
  verifierTaches(); sauver(); if (ficheCase === k) remplirFiche(); return true;
}
function ameliorer() {
  const c = E.cases[ficheCase], S2 = MAISONS[(c.n || 0) + 1]; if (!S2) return;
  for (const [r, q] of Object.entries(S2.cout)) if ((E.stock[r] || 0) < q) return;
  for (const [r, q] of Object.entries(S2.cout)) E.stock[r] -= q;
  c.n = (c.n || 0) + 1; const [i, j] = ficheCase.split(',').map(Number); redessiner(i, j, true); S.fete(); gagner(10); fermerTout(); sauver();
  toast('🏠', 'Maison ⭐' + (c.n + 1), '👥 ' + S2.hab);
}
function impots() {
  const t = maintenant();
  for (const [k, c] of Object.entries(E.cases)) if (c.t === 'maison') { const L = MAISONS[c.n || 0]; c.pret = Math.min(L.impot * 5, Math.floor((t - (c.recolte || t)) / 10) * L.impot); }
}
function encaisser(k) {
  const c = E.cases[k]; if (!c.pret) return; const [i, j] = k.split(',').map(Number);
  voler('🪙', ecran(pos(i, j).setY(2)), centreDe('piecesJ')); S.piece(); gagner(1, c.pret); c.pret = 0; c.recolte = maintenant(); sauver();
}
function ouvrirEntrepot() {
  $('entrepotNb').textContent = nbStock() + '/' + CAPA;
  $('stock').innerHTML = Object.entries(BIENS).map(([k, b]) => `<div class="case">${b.picto}<span class="chiffre">${E.stock[k] || 0}</span></div>`).join('');
  fermerTout(); $('entrepot').classList.add('ouvert');
}
$('bEntrepot').onclick = () => { S.clic(); ouvrirEntrepot(); };

/* ================================================================ LES HABITANTS : ILS MARCHENT ET DEMANDENT DES CHOSES AU MAIRE */
const mobiles = [];
const routes = () => Object.keys(E.cases).filter(k => E.cases[k].t === 'route').map(k => k.split(',').map(Number));
function nouveau(sorte, qui) {
  const R = routes(); if (!R.length) return null; const [i, j] = R[Math.floor(Math.random() * R.length)]; let o, mixer = null, actions = {};
  if (sorte === 'gens') { const G = GLB[GENS[qui].glb]; o = SkeletonUtils.clone(G.scene); o.scale.setScalar(.22); mixer = new THREE.AnimationMixer(o); for (const c of G.animations) actions[c.name] = mixer.clipAction(c); actions.Walking_A?.play(); }
  else { o = piece(['car_hatchback', 'car_sedan', 'car_taxi', 'car_stationwagon', 'car_police'][Math.floor(Math.random() * 5)]); }
  o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.frustumCulled = false; } });
  const m = { sorte, qui, o, mixer, actions, de: [i, j], vers: [i, j], t: 1, v: sorte === 'gens' ? .3 + Math.random() * .12 : .9 + Math.random() * .4, arret: false };
  monde.add(o); mobiles.push(m); return m;
}
function enlever(m) { monde.remove(m.o); mobiles.splice(mobiles.indexOf(m), 1); }
function avancer(m, dt) {
  m.mixer?.update(dt); if (m.arret) return;
  if (!estRoute(...m.vers) && !estRoute(...m.de)) return enlever(m);
  m.t += dt * m.v;
  if (m.t >= 1) { const [i, j] = m.vers; let ch = VOIS.map(([a, b]) => [i + a, j + b]).filter(([a, b]) => estRoute(a, b));
    const sans = ch.filter(([a, b]) => !(a === m.de[0] && b === m.de[1])); if (sans.length) ch = sans; if (!ch.length) { m.t = 1; return; }
    m.de = m.vers; m.vers = ch[Math.floor(Math.random() * ch.length)]; m.t = 0; }
  const a = pos(...m.de), b = pos(...m.vers), d = b.clone().sub(a); if (d.lengthSq() < .01) return; d.normalize();
  m.o.position.copy(a).lerp(b, m.t).addScaledVector(new THREE.Vector3(-d.z, 0, d.x), m.sorte === 'gens' ? .82 : .3).setY(.1);
  const cib = Math.atan2(d.x, d.z), df = ((cib - m.o.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI; m.o.rotation.y += df * Math.min(1, dt * 8);
}
let tPeuple = 0;
function peupler(dt) {
  tPeuple -= dt; if (tPeuple > 0) return; tPeuple = 1; const nbR = routes().length;
  const gens = mobiles.filter(m => m.sorte === 'gens').length, autos = mobiles.length - gens;
  if (gens < Math.min(TEL ? 12 : 18, 4 + Math.floor((E.hab || 0) / 8))) nouveau('gens', Math.floor(Math.random() * 3));
  if (autos < Math.min(10, Math.floor(nbR / 4))) nouveau('auto');
}

/* une demande : l'habitant s'arrête, une bulle apparaît ; on comprend (cartes), puis on aide */
let demandeur = null, attente = 4, enDialogue = false;
function choisirDemande() {
  const n = niveau(), deja = new Set(E.taches.map(t => t.id));
  for (let k = 0; k < ORDRE.length; k++) { const id = ORDRE[(E.prochaine + k) % ORDRE.length], D = DEMANDES[id];
    if ((D.niv || 1) > n || deja.has(id)) continue; if (D.batir && Object.values(E.cases).some(c => c.t === D.batir) && id !== 'maison') continue;
    E.prochaine = (E.prochaine + k + 1) % ORDRE.length; return id; }
  return null;
}
function prochaineDemande(dt) {
  if (demandeur || enDialogue || !$('menu').hidden || E.taches.length >= 3) return;
  attente -= dt; if (attente > 0) return;
  const id = choisirDemande(); if (!id) { attente = 10; return; } const D = DEMANDES[id];
  const m = mobiles.find(x => x.sorte === 'gens' && x.qui === D.qui && !x.arret) || nouveau('gens', D.qui); if (!m) return;
  demandeur = { m, id }; m.arret = true; m.actions.Walking_A?.stop(); m.actions.Waving?.play(); bip([[880, .1], [1100, .15]]);
}
function ecouter() {
  const { m, id } = demandeur, D = DEMANDES[id]; enDialogue = true; fermerTout();
  $('visage').src = 'sprites/' + GENS[D.qui].img + '.webp'; $('dit').textContent = D.dit; parler(D.voix);
  const pool = [...new Set([...Object.keys(BIENS), ...Object.keys(BATIS).filter(k => !['route', 'mairie', 'usine', 'atelier'].includes(k))])].filter(k => k !== D.c);
  const cartes = [D.c, ...pool.sort(() => Math.random() - .5).slice(0, 2)].sort(() => Math.random() - .5);
  const c = $('choix'); c.innerHTML = '';
  for (const k of cartes) { const I = infos(k), b = document.createElement('button'); b.className = 'carte'; b.dataset.k = k; b.innerHTML = `<span class="picto">${I.picto}</span><span class="mot">${I.nom}</span>`;
    b.onclick = () => { if (k !== D.c) { b.classList.add('faux'); S.faux(); setTimeout(() => parler('non-' + GENS[D.qui].v, () => parler(D.voix)), 250); return; }
      b.classList.add('juste'); S.juste(); setTimeout(() => accepter(), 800); };
    c.appendChild(b); }
  $('dial').classList.add('ouvert');
}
function accepter() {
  const { m, id } = demandeur, D = DEMANDES[id]; $('dial').classList.remove('ouvert'); enDialogue = false;
  E.taches.push({ id, qui: D.qui, base: D.batir ? Object.values(E.cases).filter(c => c.t === D.batir).length : 0 }); gagner(2); sauver(); compter();
  m.arret = false; m.actions.Waving?.stop(); m.actions.Walking_A?.play(); demandeur = null; attente = 14;
  if (D.batir) { toast(BATIS[D.batir].picto, 'Construis' + NB + ': ' + BATIS[D.batir].nom); }
  else toast(Object.entries(D.donner).map(([r, q]) => q + ' ' + BIENS[r].picto).join(' '), 'À donner');
  verifierTaches();
}
function parler(id, fin) { $('portrait').classList.add('parle'); dire(id, () => { $('portrait').classList.remove('parle'); fin && fin(); }); }
$('reecouter').onclick = () => demandeur && parler(DEMANDES[demandeur.id].voix);

/* la liste des demandes : on livre les objets ; une construction se valide toute seule */
function verifierTaches() {
  let fini = false;
  for (const t of [...E.taches]) { const D = DEMANDES[t.id];
    if (D.batir && Object.values(E.cases).filter(c => c.t === D.batir).length > (t.base ?? 0)) { terminer(t); fini = true; } }
  compter(); if ($('taches').classList.contains('ouvert')) remplirTaches(); return fini;
}
function terminer(t) {
  const D = DEMANDES[t.id]; E.taches.splice(E.taches.indexOf(t), 1);
  dire('merci-' + GENS[D.qui].v); S.fete(); gagner(15, 120); toast('❤️', 'Merci beaucoup' + NB + '!', '+120 🪙  +15 ⭐'); sauver();
}
function remplirTaches() {
  const C = $('tachesContenu');
  if (!E.taches.length) { C.innerHTML = '<div style="text-align:center;font-size:40px;padding:16px">😊</div>'; return; }
  C.innerHTML = E.taches.map((t, k) => { const D = DEMANDES[t.id];
    const que = D.batir ? `<span class="besoin">${BATIS[D.batir].picto}</span>` : Object.entries(D.donner).map(([r, q]) => { const a = E.stock[r] || 0; return `<span class="besoin ${a >= q ? 'ok' : 'manque'}">${BIENS[r].picto}<span class="chiffre">${Math.min(a, q)}/${q}</span></span>`; }).join('');
    const ok = D.donner && Object.entries(D.donner).every(([r, q]) => (E.stock[r] || 0) >= q);
    return `<div style="display:flex;gap:10px;align-items:center;background:#fff;border:3px solid #e6ecf3;border-radius:18px;padding:8px">
      <button class="portrait" style="width:58px;height:58px;border-width:3px" data-ecoute="${k}"><img src="sprites/${GENS[D.qui].img}.webp" alt=""></button>
      <div class="besoins" style="flex:1">${que}</div>
      ${D.donner ? `<button class="gros" style="height:48px;padding:0 16px;font-size:16px" data-donner="${k}" ${ok ? '' : 'disabled'}>🎁</button>` : '<span style="font-size:22px">🏗️</span>'}</div>`; }).join('');
  C.querySelectorAll('[data-ecoute]').forEach(b => b.onclick = () => { const D = DEMANDES[E.taches[+b.dataset.ecoute].id]; dire(D.voix); });
  C.querySelectorAll('[data-donner]').forEach(b => b.onclick = () => { const t = E.taches[+b.dataset.donner], D = DEMANDES[t.id];
    for (const [r, q] of Object.entries(D.donner)) E.stock[r] -= q; terminer(t); remplirTaches(); compter(); });
}
$('bTaches').onclick = () => { S.clic(); fermerTout(); remplirTaches(); $('taches').classList.add('ouvert'); };

/* ================================================================ BULLES (au-dessus des bâtiments et des habitants) */
const ecran = v => { const q = v.clone().project(cam); return [(q.x + 1) / 2 * innerWidth, (1 - q.y) / 2 * innerHeight]; };
const bulles = {};
function bulle(cle, html, cls, monde3, clic) {
  let b = bulles[cle]; if (!b) { b = document.createElement('button'); b.className = 'b ' + cls; b.innerHTML = html; b.onclick = e => { e.stopPropagation(); clic(); }; $('bulles').appendChild(b); bulles[cle] = b; }
  const [x, y] = ecran(monde3); b.style.left = x + 'px'; b.style.top = y + 'px'; b.dataset.vu = 1;
}
function majBulles() {
  for (const b of Object.values(bulles)) b.dataset.vu = 0;
  if (!mode) {
    const t = maintenant();
    for (const [k, c] of Object.entries(E.cases)) { const [i, j] = k.split(',').map(Number), haut = pos(i, j).setY(c.t === 'maison' ? 1.2 + (c.n || 0) * .6 : 1.6);
      if (c.t === 'maison' && c.pret > 0) bulle('p' + k, '🪙', '', haut, () => encaisser(k));
      if (c.file && c.file.length && t - c.file[0].debut >= BIENS[c.file[0].p].duree) bulle('f' + k, BIENS[c.file[0].p].picto, '', haut, () => { while (recolter(k, 0)); });
      if (c.t === 'maison' && MAISONS[(c.n || 0) + 1] && Object.entries(MAISONS[(c.n || 0) + 1].cout).every(([r, q]) => (E.stock[r] || 0) >= q) && !(c.pret > 0)) bulle('u' + k, '⬆️', '', haut, () => ouvrirFiche(k)); }
    if (demandeur && !enDialogue) bulle('d', `<img src="sprites/${GENS[DEMANDES[demandeur.id].qui].img}.webp" alt=""><i>!</i>`, 'perso', demandeur.m.o.position.clone().setY(.55), ecouter);
  }
  for (const [k, b] of Object.entries(bulles)) if (b.dataset.vu === '0') { b.remove(); delete bulles[k]; }
}

/* ================================================================ DOIGTS : DÉPLACER, ZOOMER, POSER, OUVRIR */
const rayon = new THREE.Raycaster(), plan = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), v2 = new THREE.Vector2();
function caseSous(x, y) { v2.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); rayon.setFromCamera(v2, cam); const p = new THREE.Vector3(); if (!rayon.ray.intersectPlane(plan, p)) return null; return [Math.floor(p.x / T + N / 2), Math.floor(p.z / T + N / 2)]; }
function caseBatie(x, y) {   // le bâtiment touché (même en touchant sa façade)
  v2.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); rayon.setFromCamera(v2, cam);
  const h = rayon.intersectObjects(Object.values(objets), true)[0]; if (!h) return null;
  let o = h.object; while (o.parent && o.parent !== monde) o = o.parent; return Object.keys(objets).find(k => objets[k] === o) || null;
}
const doigts = new Map(); let bouge = 0, pince = 0, trace = null;
function glisser(dx, dy) { const u = 2 * taille / innerHeight; vise.addScaledVector(new THREE.Vector3(1, 0, -1).normalize(), -dx * u).addScaledVector(new THREE.Vector3(1, 0, 1).normalize(), -dy * u * 1.42); majCam(); }
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); doigts.set(e.pointerId, e); bouge = 0; trace = null;
  if (doigts.size === 2) pince = ecart(); else if (mode === 'route') { const c = caseSous(e.clientX, e.clientY); if (c) { poser(...c); trace = cle(...c); } } });
canvas.addEventListener('pointermove', e => {
  const c = caseSous(e.clientX, e.clientY);
  if (mode && c && dans(...c)) { fantome.visible = true; fantome.position.copy(pos(...c)); }
  if (!doigts.has(e.pointerId)) return; const a = doigts.get(e.pointerId), dx = e.clientX - a.clientX, dy = e.clientY - a.clientY; doigts.set(e.pointerId, e);
  if (doigts.size === 2) { const d = ecart(); taille = THREE.MathUtils.clamp(taille * pince / d, 5, 30); pince = d; majCam(); return; }
  bouge += Math.abs(dx) + Math.abs(dy);
  if (mode === 'route') { if (c && cle(...c) !== trace) { poser(...c); trace = cle(...c); } } else glisser(dx, dy);
});
canvas.addEventListener('pointerup', e => {
  if (!doigts.has(e.pointerId)) return; const seul = doigts.size === 1; doigts.delete(e.pointerId); if (!seul || bouge > 10) return;
  if (mode && mode !== 'route') { const c = caseSous(e.clientX, e.clientY); if (c) poser(...c); return; }
  if (!mode) { const k = caseBatie(e.clientX, e.clientY); if (k) ouvrirFiche(k); else fermerTout(); }
});
canvas.addEventListener('pointercancel', e => doigts.delete(e.pointerId));
canvas.addEventListener('wheel', e => { e.preventDefault(); taille = THREE.MathUtils.clamp(taille * (e.deltaY > 0 ? 1.1 : .9), 5, 30); majCam(); }, { passive: false });
function ecart() { const [p, q] = [...doigts.values()]; return Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY) || 1; }

/* ================================================================ BOUCLE ET DÉMARRAGE */
$('jouer').onclick = () => { $('menu').hidden = true; voixEl.play().catch(() => {}); voixEl.pause();
  if (E.debut) { E.debut = false; sauver(); setTimeout(() => { dire('bienvenue'); toast('🏛️', 'Bienvenue, maire' + NB + '!', '🏗️ → 🏠'); }, 600); } };
$('zero').onclick = () => { try { localStorage.removeItem(CLE); } catch (e) {} location.reload(); };
const horloge = new THREE.Clock(); let tSec = 0, tFumee = 0;
function boucle() {
  const dt = Math.min(horloge.getDelta(), .05), t = performance.now();
  for (const g of Object.values(objets)) if (g.userData.pousse) { const k = Math.min(1, (t - g.userData.pousse) / 520), e = 1 - Math.pow(1 - k, 3); g.scale.set(.8 + .2 * e, e * (1 + .14 * Math.sin(k * Math.PI)), .8 + .2 * e); if (k >= 1) { g.scale.set(1, 1, 1); g.userData.pousse = 0; } }
  for (const m of [...mobiles]) avancer(m, dt);
  peupler(dt); prochaineDemande(dt); majParts(dt);
  tFumee -= dt; if (tFumee < 0) { tFumee = .35; for (const [k, c] of Object.entries(E.cases)) if (c.t === 'usine' && c.file?.length && objets[k]?.userData.fumee) fumee(objets[k].position.clone().add(objets[k].userData.fumee)); }
  tSec += dt; if (tSec > .5) { tSec = 0; impots(); if ($('fiche').classList.contains('ouvert')) remplirFiche(); }
  majBulles(); renderer.render(scene, cam); requestAnimationFrame(boucle);
}
(async () => {
  try {
    const [p, a, b, c] = await Promise.all([glb('modeles/ville_pack.glb'), glb('modeles/boulangere.glb'), glb('modeles/joueur.glb'), glb('modeles/passant.glb')]);
    PACK = p.scene; GLB = { boulangere: a, joueur: b, passant: c };
    PACK.traverse(m => { if (m.isMesh && m.material.map) { m.material.map.anisotropy = 4; m.material.roughness = .8; m.material.metalness = 0; } });
    for (const k of Object.keys(E.cases)) redessiner(...k.split(',').map(Number));
    semerDecor(); majCam(); compter(); impots(); boucle(); $('charge').remove();
    window.__ville = { E, poser, entrerMode, sortirMode, ouvrirFiche, lancer: p => lancer(p), recolter, encaisser, verifierTaches, vite: () => { attente = 0; }, ecouter: () => demandeur && ecouter(),
      demandeur: () => demandeur, caseEcran: (i, j) => ecran(pos(i, j)), ficheCase: k => { ficheCase = k; }, ameliorer: () => ameliorer(), remplirTaches };
  } catch (e) { console.error(e); $('charge').textContent = 'Le jeu n’a pas pu se charger.'; }
})();
</script>
