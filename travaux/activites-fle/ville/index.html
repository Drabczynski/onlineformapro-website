<meta charset="utf-8">
<title>Ma ville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
:root{--encre:#1b2533;--doux:#5b6875;--bleu:#2f6fd6;--vert:#29a35e;--rouge:#e5484d;--or:#f6b630;--nuit:#13233a;--papier:#fffdf8;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#f3c99a;color:var(--encre);font:16px/1.3 Figtree,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chiffre{font-family:"Baloo 2",Figtree,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}

#haut{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:6px;align-items:center;pointer-events:none}
#haut>*{pointer-events:auto}
#niveau{position:relative;width:54px;height:54px;flex:none}
#niveau svg{position:absolute;inset:0;transform:rotate(-90deg)}
#niveau b{position:absolute;inset:6px;border-radius:50%;background:linear-gradient(160deg,#7c5cff,#4b2fd1);color:#fff;display:grid;place-items:center;font-size:22px;border:3px solid #fff}
.jauge{height:36px;border-radius:99px;background:rgba(19,35,58,.72);color:#fff;display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;font-size:18px;transition:transform .15s}
.jauge i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.18)}
#piecesJ{margin-left:auto}
#piecesJ i{background:var(--or)}
.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.18)}}

.rond{position:fixed;z-index:5;width:64px;height:64px;border-radius:20px;background:linear-gradient(180deg,#fff,#e9eef5);display:grid;place-items:center;font-size:32px;border-bottom:4px solid #b9c6d6;transition:transform .1s}
.rond:active{transform:scale(.92)}
.rond small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
#bConstruire{left:10px;bottom:calc(30px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#ffd35c,#f6a623);border-color:#c97f0a}
#bEntrepot{right:10px;bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#bTaches{right:10px;bottom:calc(122px + env(safe-area-inset-bottom,0px))}
#bTaches b{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;border-radius:99px;background:var(--rouge);color:#fff;font-size:14px;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
.tourner{position:fixed;z-index:5;bottom:calc(36px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:rgba(19,35,58,.6);color:#fff;font-size:24px;display:grid;place-items:center}
#gauche{left:calc(50% - 56px)}#droite{left:calc(50% + 8px)}
#bAnnuler{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));height:52px;padding:0 22px;border-radius:99px;background:#fff;font-size:18px;font-weight:800;border-bottom:4px solid #b9c6d6}

.tiroir{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--papier);border-radius:24px 24px 0 0;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.tiroir.ouvert{transform:none}
.tiroir header{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.tiroir header b{font-size:20px;font-weight:900}
.tiroir header button{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#eef2f7;font-size:20px}
.onglets{display:flex;gap:6px;padding:0 6px 10px}
.onglets button{flex:none;height:42px;padding:0 16px;border-radius:99px;background:#eef2f7;font-size:21px}
.onglets button.actif{background:var(--bleu)}
.liste{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 6px;touch-action:pan-x;scrollbar-width:none}
.article{flex:none;width:112px;border-radius:18px;background:#fff;border:3px solid #e6ecf3;padding:10px 6px 8px;display:grid;justify-items:center;gap:3px;position:relative;transition:transform .1s}
.article:active{transform:scale(.94)}
.article .picto{font-size:40px;line-height:1.1}
.article b{font-size:13px;font-weight:800;text-align:center;line-height:1.15}
.article .prix{font-size:15px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.article .prix .manque{color:var(--rouge)}
.article.verrou{opacity:.5}
.article.verrou::after{content:attr(data-niv);position:absolute;inset:0;border-radius:15px;background:rgba(255,255,255,.6);display:grid;place-items:center;font-size:16px;font-weight:900;color:var(--nuit)}
.contenu{display:grid;gap:12px;padding:0 6px}
.ligne-prod{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.produit{flex:none;width:96px;border-radius:16px;background:#fff;border:3px solid #e6ecf3;padding:8px 4px;display:grid;justify-items:center;gap:2px;transition:transform .1s}
.produit:active{transform:scale(.92)}
.produit .picto{font-size:34px;line-height:1.1}
.produit small{font-size:12px;font-weight:700;color:var(--doux)}
.produit.verrou{opacity:.4;pointer-events:none}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.case{width:58px;height:58px;border-radius:14px;background:#eef2f7;display:grid;place-items:center;font-size:28px;position:relative;overflow:hidden}
.case .barre{position:absolute;left:0;bottom:0;height:6px;background:var(--vert)}
.case.pret{background:#dcf5e5;animation:pulse 1s infinite}
.case.vide{border:2px dashed #c8d2de;background:none}
.besoins{display:flex;gap:10px;flex-wrap:wrap}
.besoin{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid #e6ecf3;border-radius:14px;padding:6px 12px;font-size:24px}
.besoin.ok{border-color:var(--vert)}
.besoin .chiffre{font-size:18px}
.besoin.manque .chiffre{color:var(--rouge)}
.gros{height:56px;border-radius:99px;background:var(--vert);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:4px solid #1b7a44;transition:transform .1s}
.gros:active{transform:scale(.96)}
.gros:disabled{background:#b9c3cd;border-color:#9aa5b1}
.recomp{display:flex;gap:12px;font-size:18px;color:var(--doux);align-items:center}
.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:0 6px}
.stock .case{width:auto;height:76px;flex-direction:column;font-size:30px;display:flex;justify-content:center}
.stock .case .chiffre{font-size:16px}

#bulles{position:fixed;inset:0;pointer-events:none;z-index:3}
.b{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;animation:flotte 1.6s ease-in-out infinite}
.b::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top:9px solid #fff;border-bottom:0}
.b.perso{width:62px;height:62px;border:4px solid var(--bleu);padding:0}
.b.perso::after{border-top-color:var(--bleu);bottom:-13px}
.b.perso img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#dbe8fa}
.b.perso i{position:absolute;right:-8px;top:-8px;width:24px;height:24px;border-radius:50%;background:var(--rouge);color:#fff;font:900 16px/24px Figtree,sans-serif;text-align:center;font-style:normal;animation:pulse 1s infinite}
.b.attend{width:auto;min-width:46px;padding:0 9px;border-radius:99px;font-size:20px;gap:2px;display:flex;border:3px solid var(--or)}
.b.attend::after{border-top-color:var(--or)}
.b.attend .chiffre{font-size:15px}
.b.part{animation:part .25s forwards}
@keyframes part{to{transform:translate(-50%,-160%) scale(1.5);opacity:0}}
@keyframes flotte{50%{margin-top:-6px}}
.vol{position:fixed;z-index:9;pointer-events:none;font-size:28px;left:0;top:0;will-change:transform}
.plus{position:fixed;z-index:9;pointer-events:none;font:800 24px "Baloo 2",sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.25);animation:monte 1s ease-out forwards}
@keyframes monte{to{transform:translate(-50%,-70px);opacity:0}}

#dial{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;justify-items:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
#dial.ouvert{transform:none}
.feuille{width:100%;max-width:640px;background:var(--papier);border-radius:24px;padding:14px;display:grid;gap:12px}
.pnj{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.portrait{width:80px;height:80px;border-radius:50%;background:#dbe8fa;border:4px solid var(--bleu);overflow:hidden;flex:none}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.portrait.parle{animation:parle .5s ease-in-out infinite}
@keyframes parle{50%{transform:scale(1.06)}}
.pnj p{margin:0;font-size:clamp(18px,5vw,23px);font-weight:800;line-height:1.22}
.son{width:48px;height:48px;border-radius:50%;background:#e8f0fc;display:grid;place-items:center}
.son svg{width:24px;height:24px;stroke:var(--bleu)}
.moi{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:800;color:var(--doux);letter-spacing:.06em;text-transform:uppercase}
.moi::before{content:"🎩";font-size:20px}
#choix{display:grid;gap:8px}
.rep{display:flex;gap:12px;align-items:center;background:#f1f5f9;border:3px solid transparent;border-radius:18px;padding:8px 12px;text-align:left;transition:transform .1s,border-color .1s,background .1s}
.rep .picto{font-size:34px;line-height:1;width:44px;text-align:center;flex:none}
.rep .mot{font-size:17px;font-weight:700;flex:1}
.rep .ok{width:44px;height:44px;border-radius:50%;background:var(--vert);color:#fff;font-size:22px;font-weight:900;display:none;place-items:center;flex:none}
.rep.choisi{border-color:var(--bleu);background:#e8f0fc}
.rep.choisi .ok{display:grid}
.rep.juste{border-color:var(--vert);background:#e2f6ea}
.rep.faux{animation:non .4s;opacity:.3;pointer-events:none}
body.parle .rond,body.parle .tourner{opacity:0;pointer-events:none}
@keyframes non{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

#toast{position:fixed;left:50%;top:20%;transform:translate(-50%,-50%) scale(.8);background:var(--papier);border-radius:22px;padding:12px 22px;display:grid;justify-items:center;gap:2px;opacity:0;transition:all .3s cubic-bezier(.2,1.3,.4,1);pointer-events:none;z-index:9;text-align:center}
#toast.vu{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .picto{font-size:42px;line-height:1.1}
#toast b{font-size:19px;font-weight:900}
#toast span{font-size:15px;color:var(--doux);font-weight:700}

#bravo{position:fixed;inset:0;z-index:15;background:radial-gradient(circle,rgba(124,92,255,.55),rgba(19,35,58,.85));display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
#bravo .etoile{font-size:96px;line-height:1;animation:tourne 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes tourne{from{transform:scale(0) rotate(-180deg)}}
#bravo h2{margin:6px 0 0;font:800 46px/1 "Baloo 2",sans-serif}
#bravo .neufs{display:flex;gap:12px;justify-content:center;margin:18px 0 22px;flex-wrap:wrap}
#bravo .neufs span{width:76px;height:76px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:42px;animation:tourne .6s both}
#bravo button{height:62px;padding:0 40px;border-radius:99px;background:linear-gradient(180deg,#ffd35c,#f6a623);color:var(--nuit);font-size:24px;font-weight:900;border-bottom:5px solid #c97f0a}

#menu{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,rgba(19,35,58,0),rgba(19,35,58,.85));color:#fff;display:grid;align-content:end;padding:28px 22px calc(44px + env(safe-area-inset-bottom,0px));gap:18px}
#menu h1{margin:0;font:800 clamp(56px,16vw,96px)/.9 "Baloo 2",Figtree,sans-serif;letter-spacing:-.02em;text-shadow:0 4px 0 rgba(0,0,0,.18)}
#menu p{margin:0;font-size:18px;font-weight:700;opacity:.92;max-width:30ch}
#jouer{justify-self:start;height:74px;padding:0 36px 0 28px;border-radius:99px;background:linear-gradient(180deg,#ffd35c,#f6a623);color:var(--nuit);font-size:26px;font-weight:900;display:flex;gap:12px;align-items:center;border-bottom:5px solid #c97f0a}
#jouer svg{width:28px;height:28px;fill:var(--nuit)}
#zero{justify-self:start;opacity:.7;font-size:14px;font-weight:700;text-decoration:underline}
#charge{position:fixed;inset:0;z-index:30;background:var(--nuit);display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:20px}
#charge i{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,255,255,.2);border-top-color:var(--or);animation:tourne2 1s linear infinite}
@keyframes tourne2{to{transform:rotate(360deg)}}
</style>

<canvas id="c"></canvas>
<div id="bulles"></div>

<div id="haut">
  <div id="niveau"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="none" stroke="rgba(19,35,58,.5)" stroke-width="5"/><circle id="xpArc" cx="27" cy="27" r="24" fill="none" stroke="#ffd35c" stroke-width="5" stroke-linecap="round" stroke-dasharray="151" stroke-dashoffset="151"/></svg><b class="chiffre" id="niv">1</b></div>

</div>

/* ================================================================ PRODUIRE, ENCAISSER, AMÉLIORER */

/* ================================================================ HABITANTS */
const mobiles = [];
const routes = () => Object.keys(E.cases).filter(k => E.cases[k].t === 'route').map(k => k.split(',').map(Number));

  if (sorte === 'gens') { const G = GLB[GENS[qui].glb]; o = SkeletonUtils.clone(G.scene); o.scale.setScalar(.24); mixer = new THREE.AnimationMixer(o); for (const c of G.animations) actions[c.name] = mixer.clipAction(c); actions.Walking_A?.play(); }

  const m = { sorte, qui, o, mixer, actions, de: [i, j], vers: [i, j], t: 1, v: sorte === 'gens' ? .32 + Math.random() * .12 : 1 + Math.random() * .4, arret: false, prob: null, tache: null };

}

  const a = pos(...m.de), b = pos(...m.vers), d = b.clone().sub(a); if (d.lengthSq() < .01) { m.o.position.copy(a).setY(.1); return; } d.normalize();
  m.o.position.copy(a).lerp(b, m.t).addScaledVector(new THREE.Vector3(-d.z, 0, d.x), m.sorte === 'gens' ? .82 : .3).setY(.1);
  const cib = Math.atan2(d.x, d.z), df = ((cib - m.o.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI; m.o.rotation.y += df * Math.min(1, dt * 8);
}
let tPeuple = 0;

  const gens = mobiles.filter(m => m.sorte === 'gens').length, autos = mobiles.length - gens;
  if (gens < Math.min(TEL ? 14 : 22, 6 + Math.floor((E.hab || 0) / 6))) nouveau('gens', Math.floor(Math.random() * 3));
  if (autos < Math.min(12, Math.floor(routes().length / 4))) nouveau('auto');

let attente = 2;

  const ok = PROBLEMES.filter(p => !pris.has(p.id) && (!p.batir || (BATIS[p.batir].niv || 1) <= n) && (!p.batir || p.batir === 'maison' || p.batir === 'parc' || !Object.values(E.cases).some(c => c.t === p.batir)));

  const autre = Object.keys(REPONSES).filter(k => k !== P.rep && (!!BATIS[k] !== !!P.batir));

    b.innerHTML = `<span class="picto">${picto}</span><span class="mot">${txt}</span><span class="ok">✓</span>`;

$('reecouter').onclick = () => dialogue && parler('p-' + dialogue.P.id);
function parler(id, fin) { $('portrait').classList.add('parle'); dire(id, () => { $('portrait').classList.remove('parle'); fin && fin(); }); }

const bulles = {};
function bulle(k, html, cls, p3, action) {
  let b = bulles[k]; if (!b) { b = document.createElement('button'); b.className = 'b ' + cls; b.innerHTML = html; b.onclick = e => { e.stopPropagation(); action(); }; b.action = action; $('bulles').appendChild(b); bulles[k] = b; }
  const [x, y] = ecran(p3); b.style.left = x + 'px'; b.style.top = y + 'px'; b.dataset.vu = 1;
}
function majBulles() {
  for (const b of Object.values(bulles)) b.dataset.vu = 0;
  if (!mode && !dialogue) {
    const t = maintenant();
    for (const [k, c] of Object.entries(E.cases)) { const [i, j] = k.split(',').map(Number), haut = pos(i, j).setY(c.t === 'maison' ? 1.9 + (c.n || 0) * .6 : 2.1);
      if (c.t === 'maison' && c.pret > 0) bulle('p' + k, '🪙', '', haut, () => encaisser(k));
      else if (c.file?.length && t - c.file[0].debut >= BIENS[c.file[0].p].duree) bulle('f' + k, BIENS[c.file[0].p].picto, '', haut, () => { while (recolter(k, 0)); });
      else if (c.t === 'maison' && MAISONS[(c.n || 0) + 1] && assez(MAISONS[(c.n || 0) + 1].cout)) bulle('u' + k, '⬆️', '', haut, () => ouvrirFiche(k)); }
    for (const m of mobiles) {
      if (m.prob) bulle('m' + m.prob, `<img src="sprites/${GENS[m.qui].img}.webp" alt=""><i>!</i>`, 'perso', m.o.position.clone().setY(.7), () => ecouter(m));
      else if (m.tache) { const P = PROB[m.tache]; if (P.donner) { const [r, q] = Object.entries(P.donner)[0]; bulle('t' + m.tache, `${BIENS[r].picto}<span class="chiffre">${q}</span>`, 'attend', m.o.position.clone().setY(.65), () => { const t = E.taches.find(x => x.id === m.tache); if (t) donner(t); }); } }
    }
  }
  for (const [k, b] of Object.entries(bulles)) if (b.dataset.vu === '0') { b.classList.add('part'); delete bulles[k]; setTimeout(() => b.remove(), 250); }
}

/* ================================================================ DOIGTS */
const rayon = new THREE.Raycaster(), plan = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), v2 = new THREE.Vector2();
function versPlan(x, y) { v2.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); rayon.setFromCamera(v2, cam); const p = new THREE.Vector3(); return rayon.ray.intersectPlane(plan, p) ? p : null; }
function caseSous(x, y) { const p = versPlan(x, y); return p ? [Math.floor(p.x / T + N / 2), Math.floor(p.z / T + N / 2)] : null; }
function caseBatie(x, y) {
  v2.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); rayon.setFromCamera(v2, cam);
  const h = rayon.intersectObjects(Object.values(objets), true).find(h => !h.object.isSprite);
  if (h) { let o = h.object; while (o.parent && o.parent !== monde) o = o.parent; const k = Object.keys(objets).find(k => objets[k] === o); if (k) return k; }
  const c = caseSous(x, y); return c && E.cases[cle(...c)] ? cle(...c) : null;
}
const doigts = new Map(); let bouge = 0, pinceD = 0, pinceA = 0, trace = null, tourne = false;
function ecartAngle() { const [p, q] = [...doigts.values()]; return [Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY) || 1, Math.atan2(q.clientY - p.clientY, q.clientX - p.clientX)]; }
function ramasserSous(x, y) { for (const b of Object.values(bulles)) { if (b.classList.contains('perso')) continue; const r = b.getBoundingClientRect(); if (x > r.left - 8 && x < r.right + 8 && y > r.top - 8 && y < r.bottom + 8) b.action(); } }
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); doigts.set(e.pointerId, e); bouge = 0; trace = null; tourne = e.button === 2 || e.shiftKey;
  if (doigts.size === 2) [pinceD, pinceA] = ecartAngle(); else if (mode === 'route') { const c = caseSous(e.clientX, e.clientY); if (c) { poser(...c); trace = cle(...c); } } });
canvas.addEventListener('pointermove', e => {
  const c = caseSous(e.clientX, e.clientY);
  if (mode && c && dans(...c)) { fantome.visible = true; fantome.position.copy(pos(...c)); }
  if (!doigts.has(e.pointerId)) return; const a = doigts.get(e.pointerId), dx = e.clientX - a.clientX, dy = e.clientY - a.clientY; doigts.set(e.pointerId, e);
  if (doigts.size === 2) { const [d, ang] = ecartAngle(); cible.dist *= pinceD / d; cible.az -= (ang - pinceA); pinceD = d; pinceA = ang; bouge += 20; return; }
  bouge += Math.abs(dx) + Math.abs(dy);
  if (tourne) { cible.az -= dx * .008; cible.el = THREE.MathUtils.clamp(cible.el + dy * .005, .45, 1.35); return; }
  if (mode === 'route') { if (c && cle(...c) !== trace) { poser(...c); trace = cle(...c); } return; }
  // déplacer : le sol suit le doigt
  const u = vue.dist * Math.tan(cam.fov * Math.PI / 360) * 2 / innerHeight, s = Math.sin(vue.az), co = Math.cos(vue.az), k = 1 / Math.sin(vue.el);
  cible.x -= (dx * co + dy * s * k) * u; cible.z -= (-dx * s + dy * co * k) * u; vue.x = cible.x; vue.z = cible.z;
  if (!mode) ramasserSous(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', e => {
  if (!doigts.has(e.pointerId)) return; const seul = doigts.size === 1; doigts.delete(e.pointerId); if (!seul || bouge > 10) return;
  if (mode && mode !== 'route') { const c = caseSous(e.clientX, e.clientY); if (c) poser(...c); return; }
  if (!mode) { const k = caseBatie(e.clientX, e.clientY); if (k) ouvrirFiche(k); else fermerTout(); }
});
canvas.addEventListener('pointercancel', e => doigts.delete(e.pointerId));
canvas.addEventListener('wheel', e => { e.preventDefault(); cible.dist *= e.deltaY > 0 ? 1.1 : .9; }, { passive: false });
$('gauche').onclick = () => { cible.az += Math.PI / 4; S.clic(); }; $('droite').onclick = () => { cible.az -= Math.PI / 4; S.clic(); };

/* ================================================================ BOUCLE */
$('jouer').onclick = () => { $('menu').hidden = true; voixEl.play().catch(() => {}); voixEl.pause(); attente = 1.5;
  if (E.debut) { E.debut = false; sauver(); setTimeout(() => { dire('bienvenue'); toast('🎩', 'Bienvenue' + NB + '!', '👥 ❗ → 💬'); }, 500); } };
$('zero').onclick = () => { try { localStorage.removeItem(CLE); } catch (e) {} location.reload(); };
const horloge = new THREE.Clock(); let tSec = 0, tFumee = 0, fpsT = 0, fpsN = 0, leger = false;
function boucle() {
  const dt = Math.min(horloge.getDelta(), .05), t = performance.now();
  majCam(dt);
  for (const g of Object.values(objets)) {
    if (g.userData.pousse) { const k = Math.min(1, (t - g.userData.pousse) / 600), e = 1 - Math.pow(1 - k, 3), b = Math.sin(k * Math.PI) * (1 - k);
      g.scale.set(.6 + .4 * e - b * .2, e + b * .5, .6 + .4 * e - b * .2); if (k >= 1) { g.scale.set(1, 1, 1); g.userData.pousse = 0; } }
    else if (g.userData.tape) { const k = Math.min(1, (t - g.userData.tape) / 300), b = Math.sin(k * Math.PI * 2) * (1 - k) * .12; g.scale.set(1 + b, 1 - b, 1 + b); if (k >= 1) { g.scale.set(1, 1, 1); g.userData.tape = 0; } }
  }
  for (const m of [...mobiles]) avancer(m, dt);
  peupler(dt); appels(dt); majParts(dt); rouler(dt);
  tFumee -= dt; if (tFumee < 0) { tFumee = .3; for (const [k, c] of Object.entries(E.cases)) if (c.t === 'usine' && c.file?.length && objets[k]?.userData.fumee) fumee(objets[k].position.clone().add(objets[k].userData.fumee)); }
  tSec += dt; if (tSec > .5) { tSec = 0; impots(); if ($('fiche').classList.contains('ouvert')) remplirFiche(); }
  majBulles();
  fpsT += dt; fpsN++; if (fpsT > 3) { if (!leger && fpsN / fpsT < 24) { leger = true; ao.enabled = false; } fpsT = 0; fpsN = 0; }
  composer.render(dt); requestAnimationFrame(boucle);
}
(async () => {
  try {
    const [p, a, b, c] = await Promise.all([glb('modeles/ville_pack.glb'), glb('modeles/boulangere.glb'), glb('modeles/joueur.glb'), glb('modeles/passant.glb')]);
    PACK = p.scene; GLB = { boulangere: a, joueur: b, passant: c };
    PACK.traverse(m => { if (m.isMesh && m.material.map) { m.material.map.anisotropy = 8; m.material.roughness = .75; m.material.metalness = 0; } });
    for (const k of Object.keys(E.cases)) redessiner(...k.split(',').map(Number));
    semerDecor(); majCam(); compter(); impots(); boucle(); $('charge').remove();
    window.__ville = { E, poser, entrerMode, sortirMode, ouvrirFiche, lancer: q => lancer(q), recolter, encaisser, vite: () => { attente = 0; }, mobiles, ecouter, donner, remplirTaches,
      caseEcran: (i, j) => ecran(pos(i, j)), ficheCase: k => { ficheCase = k; }, ao, cible, vue };
  } catch (e) { console.error(e); $('charge').textContent = 'Le jeu n’a pas pu se charger.'; }
})();
</script>
