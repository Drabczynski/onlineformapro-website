.medaille-t .tuile .dessus .mot small { margin-top: .22em; font-size: .3em; font-weight: 700; opacity: .75; }
/* l'invitation : l'enveloppe s'ouvre, la carte en sort et se pose devant */
.o-env { width: min(440px, 100%); }
.env-devant::before, .env-devant::after { content: ""; position: absolute; inset: 0; background: rgba(135, 69, 253, .08); }
.env-devant::before { clip-path: polygon(0 0, 50% 56%, 0 100%); }
.env-devant::after { clip-path: polygon(100% 0, 50% 56%, 100% 100%); }
.o-env::before { content: ""; display: block; padding-top: 40%; }
.env { position: relative; width: 100%; aspect-ratio: 1.55; perspective: 900px; }
.env-dos { position: absolute; inset: 0; border-radius: 20px; background: #e2d4ff; }
.env-devant { position: absolute; inset: 0; z-index: 3; border-radius: 20px; background: linear-gradient(#ffffff, #f1e9ff); clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
.env-rabat { position: absolute; left: 0; right: 0; top: 0; z-index: 4; height: 60%; border-radius: 20px 20px 0 0; background: linear-gradient(#f8f4ff, #e9defc); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: 50% 0; transition: transform .55s cubic-bezier(.5, 0, .3, 1), z-index 0s .28s; }
.env.ouverte .env-rabat { transform: rotateX(180deg); z-index: 1; }
.env-carte { position: absolute; left: 7%; right: 7%; bottom: 10%; z-index: 2; opacity: 0; }
.env-carte .objet { width: 100%; }
.env.ouverte .env-carte { opacity: 1; animation: sort-env 1.15s cubic-bezier(.3, .9, .3, 1) .4s both; }
@keyframes sort-env { 0% { transform: translateY(0); z-index: 2; } 55% { transform: translateY(-100%); z-index: 2; } 56% { z-index: 5; } 100% { transform: translateY(-52%); z-index: 5; } }
/* écrire un SMS : une grande zone, sur toute la largeur */
.tel-e { width: 100%; }
.tel-e .saisie { min-height: clamp(170px, 26vh, 240px); font-size: clamp(21px, 1.8vw, 26px); }
.amorce.utilisee::after { content: " ×"; opacity: .75; }
@media (max-width: 899.98px), (max-height: 559.98px) { .o-env::before { padding-top: 60%; } }
/* v9 — écouter et regarder restent en plein écran, la question au centre. Quand on répond, l'onde du son s'efface (elle passait sous
   le retour) ; « Réécouter » ou « Revoir » ramène l'image nette en plein écran, puis la question revient. */
.sc-video.phase-reponse .ecran .onde-g { opacity: 0; }
/* une photo à décrire : quand l'exemple arrive, la photo se réduit pour que tout tienne à l'écran */
.visuel.sujet .vis-photo { width: auto; max-width: 100%; margin: 0 auto; transition: max-height .45s var(--doux-sortie); }
/* la revue de toutes les questions */
.revue { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + (var(--haut) - 44px) / 2); display: flex; align-items: center; gap: 8px; transform: translateX(-50%); }
.revue[hidden] { display: none; }
.revue .rond { width: 44px; height: 44px; flex: none; }
.revue [data-rev="-1"] svg { transform: scaleX(-1); }

/* v11 — grammaire : ce qui se lit va sur la photo (la phrase, le mot, le nombre, la situation) ; deux trous se remplissent l'un après
   l'autre ; deux ou trois réponses courtes se rangent en ligne ; les réponses apparaissent sans fondu (aucune ne peut rester pâle) */
.g-choix { display: flex; flex-direction: column; align-items: center; width: 100%; }
.carte-phrase .g-grand { margin: 0; color: var(--encre); font: 800 clamp(96px, 11vw, 168px)/1 var(--titre); letter-spacing: -.03em; }

.alveoles.rang { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--g) * 2); width: auto; height: auto; }
.alveoles.rang > .tuile { position: relative; left: auto; right: auto; top: auto; }
@keyframes monte-sans { from { transform: translateY(16px); } }
@keyframes pose-sans { from { transform: scale(.6); } }
.bonbons > button { animation-name: monte-sans; transition: translate .1s; }
.alveoles > .tuile { animation-name: pose-sans; }
/* v11b — après la réponse, aucune proposition ne pâlit : les autres restent nettes, à l'encre adoucie ; la mauvaise choisie est rose et
   barrée ; dans un trou, le mot remis après une erreur est cerclé de vert (le vert plein reste réservé à la bonne réponse donnée) */

.tuile.eteint .mot { color: #8d84ad; }
.bonbons > .eteint { color: #8d84ad; }

.bonbons > .barree { background: linear-gradient(var(--rose-1), var(--rose-2)); box-shadow: 0 5px 0 var(--rose-levre), 0 9px 0 var(--ombre); }
.imagettes .ch.eteint img { filter: grayscale(.85); }
.fente.corrige { background: #fff; box-shadow: inset 0 0 0 .09em var(--vert-2), 0 .08em 0 var(--vert-levre); color: var(--encre); animation: pop .35s cubic-bezier(.2, 1.7, .4, 1); }
.fente.attend.vide { opacity: 1; background: rgba(135, 69, 253, .05); box-shadow: inset 0 0 0 2px rgba(135, 69, 253, .2); }

}

// ---------------------------------------------------------------- 3. grammaire : le mot choisi vole jusqu'au trou

const deuxTrous = (q, trou) => {
  if ((trou.match(/_{3,}/g) || []).length !== 2) return null;
  const m = q.choix.map(c => c.split(/\s*…\s*|\s+\/\s+/).map(x => x.trim()).filter(Boolean));

};
function brancherFente(q, fin, fente = $(".fente"), P = $$(".puce")) {
  let fait = false;
  const voler = (puce, texte, apres) => {
    fente.classList.remove("vide"); fente.classList.add("pleine", "cache"); fente.textContent = texte;
    const r1 = puce.getBoundingClientRect(), r2 = fente.getBoundingClientRect();

    const v = puce.cloneNode(true); v.classList.add("vol"); v.style.cssText = `left:${r1.left}px;top:${r1.top}px;width:${r1.width}px;height:${r1.height}px;animation:none`;
    document.body.append(v); puce.classList.add("partie"); Son.joue("vol");
    const dx = r2.left + r2.width / 2 - (r1.left + r1.width / 2), dy = r2.top + r2.height / 2 - (r1.top + r1.height / 2), s = Math.max(.6, Math.min(2.4, r2.height / r1.height));
    v.animate([{ transform: "none" }, { transform: `translate(${dx * .5}px, ${dy * .5 - 70}px) scale(${(1 + s) / 2}) rotate(-6deg)`, offset: .5 }, { transform: `translate(${dx}px, ${dy}px) scale(${s})`, opacity: .2 }], { duration: 520, easing: "cubic-bezier(.5,0,.3,1)" })
      .onfinish = () => { v.remove(); fente.classList.remove("cache"); apres(); };
  };
  const choisir = (i) => {

      }

// ---------------------------------------------------------------- 5. écrire
function sceneEcriture(a) {

    demarrer: () => { if (intro) return intro.lancer(); if (consigne) setTimeout(() => jouer(consigne, 0), 200); },
    arreter: () => { vivant = false; tour++; intro?.arreter(); cancelAnimationFrame(idHalo); clearInterval(minuterie); clearInterval(echant); try { if (rec && rec.state !== "inactive") rec.stop(); } catch (e) {} flux?.getTracks().forEach(t => t.stop()); voix?.fin(); voix = null; },
    espace: () => { if (intro && !intro.fini()) return intro.sortir(); M.click(); },
  };
}

// l'ouverture d'un jeu de rôle : la situation et le rôle de l'autre personne, lus par la voix (les mots s'allument) ;
// puis chaque texte part à sa place dans l'écran (la situation à droite, le rôle sur la photo)
function introJeu(a, sc) {
  const J = a.jeu || {}, k = J.k;
  sc.insertAdjacentHTML("beforeend", `<div class="intro-jeu" id="intro-jeu"><div class="ij-carte"><span class="ij-masques" aria-hidden="true">🎭</span><p class="ij-label">Jeu de rôle</p>`
    + `<p class="ij-situation">${k ? karaokeHTML(k[0]) : echap(a.consigne)}</p><div class="ij-role"><p class="ij-label">L'autre personne</p><p class="ij-qui">${k ? karaokeHTML(k[1]) : echap(a.roleTexte || "")}</p></div>`
    + `<button class="lien-b ij-passer" type="button">Passer ${I.suite}</button></div></div>`);
  sc.classList.add("en-intro");
  const O = $("#intro-jeu", sc), C = $(".ij-carte", O); let m = null, attente = 0, parti = false, lance = false;
  const sortir = () => {
    if (parti) return; parti = true; clearTimeout(attente); m?.pause(); C.classList.remove("suit");
    const paires = [[$(".ij-situation", O), $(".consigne-o", sc)], [$(".ij-role", O), $(".role-g", sc)]];
    sc.classList.add("sort-intro"); sc.classList.remove("en-intro");
    if (!MOUV) { O.remove(); return; }
    const cibles = paires.map(([, d]) => d).filter(Boolean); cibles.forEach(d => { d.style.opacity = "0"; });
    for (const [src, dst] of paires) {
      if (!src || !dst) continue; const r0 = src.getBoundingClientRect(), r1 = dst.getBoundingClientRect(), e = Math.min(r1.width / r0.width, r1.height / r0.height);
      const dx = r1.left + r1.width / 2 - (r0.left + r0.width / 2), dy = r1.top + r1.height / 2 - (r0.top + r0.height / 2), fin = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${e.toFixed(3)})`;
      src.style.transformOrigin = "50% 50%";
      src.animate([{ transform: "none", opacity: 1 }, { transform: fin, opacity: 1, offset: .8 }, { transform: fin, opacity: 0 }], { duration: 820, easing: "cubic-bezier(.65,0,.25,1)", fill: "forwards" });
    }
    setTimeout(() => cibles.forEach(d => { d.style.transition = "opacity .3s"; d.style.opacity = ""; }), 650);
    C.animate([{ backgroundColor: "#fff" }, { backgroundColor: "rgba(255,255,255,0)" }], { duration: 420, fill: "forwards" });
    $$(".ij-masques, .ij-carte > .ij-label, .ij-passer", O).forEach(x => x.animate([{ opacity: 1 }, { opacity: 0, transform: "scale(.9)" }], { duration: 300, fill: "forwards" }));
    setTimeout(() => O.remove(), 860);
  };
  $(".ij-passer", O).onclick = () => { Son.joue("tap"); sortir(); };
  const lire = () => setTimeout(sortir, Math.min(14000, 1800 + (a.consigne + " " + (a.roleTexte || "")).split(/\s+/).length * 330));
  return {
    lancer: () => {
      if (lance) return; lance = true;
      if (!J.audio) { attente = lire(); return; }
      m = media(J.audio); if (k) { C.classList.add("suit"); suivreKaraoke(m, C); }
      m.addEventListener("ended", () => { attente = setTimeout(sortir, 900); });
      jouer(m, 0).then(ok => { if (!ok && !parti) { C.classList.remove("suit"); attente = lire(); } });
    },
    sortir, fini: () => parti,
    arreter: () => { parti = true; clearTimeout(attente); m?.pause(); },
  };
}

// ---------------------------------------------------------------- composer un mot avec des lettres
// à gauche, sur la photo : la phrase avec son trou et le mot de base, le nombre, ou le mot à écouter ; à droite, les cases
// et les lettres (celles du mot, et quelques-unes des mauvaises réponses). Le mot se remplit aussi dans le trou de la phrase.
function sceneLettres(a) {
  const q0 = a.questions[0];
  const sc = rendre(`<section class="scene sc-duo sc-gram sc-lettres">${visuelHTML(q0.photoH, `<div class="pose pose-phrase" id="pose-l"></div>`, "")}<div class="carte-q"><div class="gram trois" id="lettres"></div></div></section>`),
    G = $("#lettres", sc), PL = $("#pose-l", sc), V = $(".visuel", sc);
  let j = 0, bonnes = 0, motM = null;
  const montrer = () => {
    const q = a.questions[j], n = a.questions.length, mot = [...q.mot]; majNiveau(q.niveau || a.niveau);
    const hp = q.audioQ ? `&nbsp;<button class="hp" type="button" data-hp="${echap(q.audioQ)}" aria-label="Écouter">${HP}</button>` : "";
    let doc = "";
    if (q.grand) doc = `<p class="g-grand">${echap(q.grand)}</p>`;
    else if (q.phrase) doc = `<p class="g-phrase">${echap(q.phrase.replace(/ (_{3,})/, " $1")).replace(/_{3,}/, `<span class="fente vide" aria-label="mot à écrire"></span>${q.indice ? ` <span class="g-base">(${echap(q.indice)})</span>` : ""}`)}${hp}</p>`;
    const pose = doc ? `<div class="carte-phrase">${doc}</div>` : "";
    if (PL) { PL.innerHTML = pose; V.classList.toggle("avec-objet", !!pose); brancherHP(PL); }
    $(".pose-ecoute", V || sc)?.remove(); motM?.pause(); motM = null;
    if (q.son && V) V.insertAdjacentHTML("beforeend", `<div class="pose-ecoute">${ecouteHTML("Écouter le mot")}</div>`);
    const lettres = melanger([...mot.map(c => c.toLowerCase()), ...(q.extra || [])]);
    G.innerHTML = `<div class="tete-q">${PL ? "" : pose}${titreHTML(q.titre)}</div>
      <div class="g-choix"><div class="cases" role="group" aria-label="Le mot" style="--n:${mot.length}">${mot.map((_, i) => `<button class="case" type="button" data-i="${i}" aria-label="Lettre ${i + 1}"></button>`).join("")}</div></div>
      <div class="pied-q"><div class="touches" style="--col:${lettres.length <= 7 ? lettres.length : Math.ceil(lettres.length / 2)}">${lettres.map((l, i) => `<button class="touche" type="button" data-l="${i}" style="--n:${i}" aria-label="${echap(l)}">${echap(l)}</button>`).join("")}</div>
      <div class="l-outils"><button class="lien-b" type="button" id="effacer">Effacer</button></div><div class="dock-place"></div></div>`;
    if (!PL) brancherHP(G);
    if (q.son) { const b = $(".pose-ecoute .ecoute", sc) || null; motM = media(q.son); if (b) brancherEcoute(b, motM, ENV[q.son]); setTimeout(() => jouer(motM, 0), 500); }
    const cases = $$(".case", G), T = $$(".touches .touche", G), fente = $(".fente", sc), place = new Array(mot.length).fill(null); let fait = false;
    const maj = () => {
      const libre = place.indexOf(null);
      cases.forEach((c, i) => { c.textContent = place[i] === null ? "" : lettres[place[i]]; c.classList.toggle("pleine", place[i] !== null); c.classList.toggle("ici", i === libre && !fait); });
      if (fente) { const t = place.map(x => x === null ? "" : lettres[x]).join(""); fente.textContent = t; fente.classList.toggle("vide", !t); fente.classList.toggle("pleine", !!t); }
    };
    const voler = (de, vers, l) => {
      if (!MOUV) return; const r0 = de.getBoundingClientRect(), r1 = vers.getBoundingClientRect(), v = document.createElement("div");
      v.className = "vol-lettre"; v.textContent = l; Object.assign(v.style, { left: r0.left + "px", top: r0.top + "px", width: r0.width + "px", height: r0.height * .9 + "px" }); document.body.append(v);
      v.animate([{ transform: "none" }, { transform: `translate(${r1.left - r0.left}px, ${r1.top - r0.top}px) scale(${r1.width / r0.width}, ${r1.height / (r0.height * .9)})` }], { duration: 260, easing: "cubic-bezier(.3,0,.2,1)" }).onfinish = () => v.remove();
    };
    const poser = (k) => {
      if (fait) return; const i = place.indexOf(null); if (i < 0 || T[k].classList.contains("prise")) return;
      Son.joue("tap"); voler(T[k], cases[i], lettres[k]); place[i] = k; T[k].classList.add("prise"); maj();
      if (place.indexOf(null) < 0) setTimeout(verifier, 320);
    };
    const retirer = (i) => { if (fait || place[i] === null) return; Son.joue("pop"); T[place[i]].classList.remove("prise"); place[i] = null; maj(); };
    const verifier = () => {
      if (fait) return; fait = true; const dit = place.map(x => lettres[x]).join(""), juste = dit === q.mot.toLowerCase();
      T.forEach(t => t.disabled = true); $(".touches", G).classList.add("fini"); $(".l-outils", G).classList.add("fini");
      if (juste) { cases.forEach((c, i) => setTimeout(() => c.classList.add("juste"), i * 45)); fente?.classList.add("juste"); Son.joue("bon"); return fin(true); }
      cases.forEach((c, i) => { if (dit[i] !== q.mot[i].toLowerCase()) c.classList.add("faux"); }); Son.joue("faux");
      setTimeout(() => { cases.forEach((c, i) => { c.classList.remove("faux", "pleine"); c.textContent = q.mot[i].toLowerCase(); c.classList.add("corrige"); });
        if (fente) { fente.textContent = q.mot.toLowerCase(); fente.classList.add("corrige"); } fin(false); }, 750);
      maj();
    };
    T.forEach((t, k) => t.onclick = () => poser(k));
    cases.forEach((c, i) => c.onclick = () => retirer(i));
    $("#effacer", G).onclick = () => { for (let i = place.length - 1; i >= 0; i--) retirer(i); };
    maj();
    const plier = (c) => c.normalize("NFD").replace(/[̀-ͯ]/g, "");
    touche = (e) => {
      if (e.key === "Backspace") { e.preventDefault(); const i = place.map((x, i) => x === null ? -1 : i).filter(i => i >= 0).pop(); if (i !== undefined) retirer(i); return; }
      if (e.key.length !== 1) return; const l = e.key.toLowerCase();
      let k = T.findIndex((t, i) => !t.classList.contains("prise") && lettres[i] === l); if (k < 0) k = T.findIndex((t, i) => !t.classList.contains("prise") && plier(lettres[i]) === plier(l));
      if (k >= 0) poser(k);
    };
    function fin(juste) {
      if (juste) bonnes++; majProgres();
      dock($(".dock-place", G), juste, j < n - 1 ? { lib: "Suivante", action: () => { j++; montrer(); } } : { action: () => terminer(a, { bonnes, total: n }) });
    }
  };
  montrer();
  courant = { demarrer: () => {}, arreter: () => { motM?.pause(); } };
}

// ---------------------------------------------------------------- le bilan
function bilan() {
  quitter(); document.body.dataset.vue = "bilan";
  const L = Object.values(etat.resultats).filter(r => r?.fini), bonnes = L.reduce((s, r) => s + (r.bonnes || 0), 0), total = L.reduce((s, r) => s + (r.total || 0), 0);
  const ratio = total ? bonnes / total : 1, nEtoiles = ratio >= .85 ? 3 : ratio >= .5 ? 2 : 1;
  const sc = rendre(`<section class="scene bilan"><span class="rayons"></span><span class="lueur"></span>
    <div class="medaille-t">${hexa(total ? `<span id="compte">0</span><small>sur ${total}</small>` : `<span id="compte">✓</span>`, "citron")}</div>
    <div class="etoiles">${[0, 1, 2].map(i => ETOILE(i < nEtoiles)).join("")}</div>
    <h1 class="geant">Bravo&nbsp;!</h1>
    <p class="phrase-b">${total ? `${bonnes} bonne${bonnes > 1 ? "s" : ""} réponse${bonnes > 1 ? "s" : ""} sur ${total}.` : "Série terminée."}</p>
    <div class="acc-bas"><button class="go" type="button" id="nouvelle">Nouvelle série ${I.hasard}</button><button class="rond" type="button" id="maison" aria-label="Menu" title="Menu">${I.maison}</button></div></section>`);
  Son.joue("fanfare"); setTimeout(() => Confettis.pluie(70), 250);
  const t0 = performance.now() + 500, compte = $("#compte", sc), anim = (t) => { const p = Math.max(0, Math.min(1, (t - t0) / 1300)); compte.textContent = Math.round(bonnes * (1 - Math.pow(1 - p, 3))); if (p < 1 && compte.isConnected) requestAnimationFrame(anim); };
  if (total) requestAnimationFrame(anim);
  $("#nouvelle", sc).onclick = (e) => { Son.joue("pop"); tirer(); lancer(0, { x: e.clientX, y: e.clientY }); };
  $("#maison", sc).onclick = () => { Son.joue("tap"); ouvrir(); };
  annoncer(`Série terminée : ${bonnes} bonnes réponses sur ${total}.`);
}

const SCENES = { video: sceneVideo, lecture: sceneLecture, grammaire: sceneGrammaire, lettres: sceneLettres, reagir: sceneReagir, ecriture: sceneEcriture, oral: sceneOral };
