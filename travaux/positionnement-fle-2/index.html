<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9748fe">
<title>Test de niveau de français</title>
<meta name="description" content="Évaluation de positionnement en français, du niveau A1 au niveau B1, adaptative, sur mobile.">
<meta property="og:title" content="Test de niveau de français">
<meta property="og:description" content="Évaluation de positionnement adaptative, du niveau A1 au niveau B1, environ 10 minutes.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Direction artistique relevée sur la capture de référence (jeu de lettres en alvéoles) :
   fond uni violet → bleu, sans motif ni taches de couleur ; tuiles hexagonales à plat, coins
   arrondis, face blanche lavande et tranche lavande ; jaune citron pour la réponse choisie ;
   vert, cyan et rose réservés aux boutons ronds et aux niveaux. Panneaux ton sur ton, sans bordure.
   Couleurs relevées au pixel sur la capture. */
:root {
  --fond-1: #9748fe; --fond-2: #8745fd; --fond-3: #6d6cf8; --fond-4: #5f76f7;
  --ton: rgba(52, 22, 176, .24);
  --ton-fort: rgba(44, 16, 150, .34);
  --ombre: rgba(50, 18, 160, .2);
  --encre: #46288c;
  --encre-douce: #8676bf;
  --lavande: #ece4fd;
  --blanc-levre: #d6bff9;
  --citron-1: #fffc96; --citron-2: #ffe35a; --citron-levre: #f0b03a;
  --vert-1: #cdfc2a; --vert-2: #8fe60c; --vert-levre: #5fae0c;
  --cyan-1: #78fdf8; --cyan-2: #42d8ff; --cyan-levre: #2d92e6;
  --rose-1: #ffadf6; --rose-2: #ea62de; --rose-levre: #b53cae;
  --titre: "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --texte: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; color: #fff; font: 700 15px/1.5 var(--texte); overflow: hidden; background: #e8e8ec;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; display: grid; place-items: center; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 14px; }

/* l'écran d'ordinateur : le téléphone posé au centre d'un fond gris uni */

/* ------------------------------------------------------------ le téléphone */
.appli { position: relative; z-index: 1; width: min(400px, 100%); height: min(860px, 100%); display: flex; flex-direction: column; overflow: hidden;
  border: 10px solid #fff; border-radius: 48px; outline: 1px solid #d6d6dc;
  background: linear-gradient(180deg, var(--fond-1) 0%, var(--fond-2) 40%, var(--fond-3) 80%, var(--fond-4) 100%); }
.ecran { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; animation: entre .35s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes entre { from { opacity: 0; transform: translateX(24px); } }
.defile { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.defile > * { flex-shrink: 0; }
.defile, .feuille { scrollbar-width: none; }
.defile::-webkit-scrollbar, .feuille::-webkit-scrollbar { display: none; }

/* ------------------------------------------------------------ les tuiles hexagonales (SVG) */
.tuile { --w: 120px; position: relative; display: block; flex: none; width: var(--w); aspect-ratio: 120 / 112.92; padding: 0; border: 0; background: none; color: var(--encre); }
.tuile .socle { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tuile .dessus { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 120 / 103.92; transition: translate .1s; }
.tuile .dessus svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tuile .mot { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 13%; text-align: center; font: 800 calc(var(--w) * .17)/1.05 var(--titre); }
.tuile .ombre { fill: var(--ombre); }
.blanc .face { fill: url(#g-blanc); } .blanc .levre { fill: var(--blanc-levre); }
.citron .face { fill: url(#g-citron); } .citron .levre { fill: var(--citron-levre); }
.vert .face { fill: url(#g-vert); } .vert .levre { fill: var(--vert-levre); }
.cyan .face { fill: url(#g-cyan); } .cyan .levre { fill: var(--cyan-levre); }
.rose .face { fill: url(#g-rose); } .rose .levre { fill: var(--rose-levre); }
.ton .face { fill: rgba(255, 255, 255, .14); } .ton .levre { fill: rgba(40, 14, 140, .22); } .ton .ombre { fill: none; } .ton .mot { color: rgba(255, 255, 255, .6); }
@keyframes pose { from { opacity: 0; transform: scale(.6); } }
@keyframes choisi { 45% { scale: 1.07; } }

/* ------------------------------------------------------------ la barre du haut */
.haut { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; padding: 16px 16px 0; }
.rond { flex: none; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: var(--ton); color: #fff; }
.rond svg { width: 17px; height: 17px; }
.cases { display: flex; justify-content: center; gap: 3px; min-width: 0; }
.cases i { flex: 0 1 11px; min-width: 5px; height: 11px; border-radius: 3px; background: rgba(255, 255, 255, .22); }
.cases i.saut { margin-left: 8px; }
.cases i.fait { background: #fff; }
.cases i.ici { background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 2px 0 var(--citron-levre); animation: pose .4s cubic-bezier(.2, 1.6, .4, 1) both; }

/* ------------------------------------------------------------ la carte du support (ton sur ton) */
.visuel { position: relative; margin: 18px 16px 0; min-height: 150px; padding: 20px 18px; display: grid; place-items: center; align-content: center; gap: 12px; border-radius: 26px; text-align: center; background: var(--ton);
  animation: monte .4s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes monte { from { opacity: 0; transform: translateY(12px); } }
.etiquette { font-size: 12.5px; font-weight: 800; letter-spacing: .03em; color: rgba(255, 255, 255, .78); }
.panneau { padding: 14px 22px; border-radius: 12px; background: #fff; color: #d0193f; border: 5px solid #d0193f; font: 800 23px/1.1 var(--titre); letter-spacing: .06em; transform: rotate(-3deg); }
.sms { justify-self: stretch; display: grid; justify-items: start; gap: 6px; text-align: left; }
.sms p { margin: 0; padding: 12px 16px; border-radius: 20px 20px 20px 6px; background: #fff; color: var(--encre); font-size: 17px; font-weight: 800; box-shadow: 0 4px 0 var(--blanc-levre); }
.phrase { font: 800 24px/1.6 var(--texte); text-wrap: balance; }
.trou { display: inline-block; min-width: 92px; margin: 0 4px; padding: 0 12px; border-radius: 10px; background: rgba(255, 255, 255, .2); box-shadow: inset 0 -3px 0 rgba(255, 255, 255, .5); line-height: 1.4; }
.trou.rempli { background: linear-gradient(var(--citron-1), var(--citron-2)); color: var(--encre); box-shadow: 0 4px 0 var(--citron-levre); animation: pop .35s cubic-bezier(.2, 1.7, .4, 1); }
@keyframes pop { from { transform: scale(.6); } }
.indice { display: inline-flex; padding: 4px 12px; border-radius: 999px; background: var(--ton); font-size: 13px; }
.grande { padding: 12px 22px; border-radius: 18px; background: #fff; color: var(--encre); font: 800 24px/1.3 var(--texte); box-shadow: 0 5px 0 var(--blanc-levre); }
.fleche { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: 0 4px 0 var(--cyan-levre); color: var(--encre); font-size: 15px; font-weight: 900; }
.replique { display: flex; align-items: center; gap: 14px; text-align: left; }
.visage { flex: none; width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 5px 0 var(--blanc-levre); background: #fff; }
.bulle.vocale { grid-auto-flow: column; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; }
.mini-lecteur { display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; color: #fff; background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .45), 0 3px 0 var(--cyan-levre); }
.mini-lecteur svg { width: 20px; height: 20px; margin-left: 3px; }
.mini-lecteur:active { translate: 0 2px; box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .45), 0 1px 0 var(--cyan-levre); }
.mini-lecteur.parle { animation: appel 1s ease-in-out infinite; }
.vague.sombre i { background: var(--encre); opacity: .55; }
.lire-consigne { display: inline-grid; place-items: center; width: 32px; height: 32px; margin-left: 4px; padding: 0; border: 0; border-radius: 50%; vertical-align: -6px; color: #fff; background: var(--ton-fort); }
.lire-consigne svg { width: 16px; height: 16px; }
.lire-consigne.parle { background: linear-gradient(var(--cyan-1), var(--cyan-2)); color: var(--encre); }
.avatar { flex: none; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: #fff; box-shadow: 0 4px 0 var(--blanc-levre); font-size: 30px; }
.bulle { display: grid; gap: 8px; padding: 12px 16px; border-radius: 20px 20px 20px 6px; background: #fff; color: var(--encre); box-shadow: 0 4px 0 var(--blanc-levre); }
.bulle strong { font-size: 18px; line-height: 1.3; font-weight: 900; }
.mini-son { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 0; border-radius: 999px; background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: 0 3px 0 var(--cyan-levre); color: var(--encre); font-size: 12.5px; font-weight: 900; }
.mini-son svg { width: 15px; height: 15px; }
.scene-emoji { font-size: 60px; line-height: 1; }
.situation { margin: 0; max-width: 300px; font-size: 18px; font-weight: 800; line-height: 1.4; }
/* le bouton d'écoute : un bouton rond de bonus, avec sa pastille de compteur */
.lecteur { position: relative; display: grid; place-items: center; width: 96px; height: 96px; padding: 0; border: 0; border-radius: 50%; color: #fff;
  background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: inset 0 0 0 6px rgba(255, 255, 255, .4), 0 6px 0 var(--cyan-levre); }
.lecteur::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .35); animation: onde 2.2s ease-out infinite; }
.lecteur.parle::before { animation-duration: .9s; }
@keyframes onde { from { transform: scale(.88); opacity: 1; } to { transform: scale(1.28); opacity: 0; } }
.lecteur svg { width: 40px; height: 40px; margin-left: 5px; }
.lecteur:active:not(:disabled) { translate: 0 4px; box-shadow: inset 0 0 0 6px rgba(255, 255, 255, .4), 0 2px 0 var(--cyan-levre); }
.lecteur:disabled { filter: saturate(.3); opacity: .55; cursor: default; }
.lecteur:disabled::before { animation: none; opacity: 0; }
.pastille { position: absolute; top: -4px; right: -4px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--encre); box-shadow: 0 3px 0 var(--blanc-levre); font: 800 16px/1 var(--titre); }
.vague { display: flex; align-items: center; gap: 4px; height: 26px; }
.vague i { width: 5px; height: 8px; border-radius: 3px; background: rgba(255, 255, 255, .85); }
.vague i:nth-child(3n+1) { height: 12px; } .vague i:nth-child(3n+2) { height: 18px; } .vague i:nth-child(4n) { height: 8px; }
.vague.active i { animation: barre .7s ease-in-out infinite; }
.vague i:nth-child(2n) { animation-delay: -.2s; } .vague i:nth-child(3n) { animation-delay: -.45s; }
@keyframes barre { 50% { height: 24px; } }
.doc-mini { display: grid; justify-items: center; gap: 10px; }
.doc-mini .icone-doc { display: grid; place-items: center; width: 70px; height: 80px; border-radius: 16px; background: #fff; box-shadow: 0 5px 0 var(--blanc-levre); font-size: 36px; }
.doc-mini strong { font-size: 16px; }
.pilule { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 0; border-radius: 999px; background: #fff; box-shadow: 0 4px 0 var(--blanc-levre); color: var(--encre); font-size: 13.5px; font-weight: 900; }
.pilule svg { width: 16px; height: 16px; }
.transcription { padding: 12px 14px; border-radius: 14px; background: #fff; color: var(--encre); font-size: 14px; text-align: left; }

.question { margin: 26px 22px 0; font: 800 22px/1.2 var(--titre); text-align: center; text-wrap: balance; animation: monte .4s cubic-bezier(.2, .8, .2, 1) .05s both; }

.progression { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; }
.progression .tuile.puce { --w: 42px; }
.progression .puce .mot { font-size: 14px; padding: 0; }
.progression .cases { gap: 5px; }
.progression .cases i { flex: 0 1 14px; height: 12px; }
.panneau.sortie { display: inline-flex; align-items: center; gap: 12px; background: #11905a; color: #fff; border-color: #0b6a42; transform: none; }
.panneau.sortie span { font-size: 30px; }
.panneau.interdit { display: grid; justify-items: center; gap: 8px; color: #d0193f; border-color: #fff; transform: none; }
.rond-interdit { position: relative; display: grid; place-items: center; width: 64px; height: 64px; border: 6px solid #d0193f; border-radius: 50%; font-size: 30px; }
.rond-interdit::after { content: ""; position: absolute; width: 6px; height: 64px; background: #d0193f; transform: rotate(45deg); }
.prix { position: relative; display: grid; justify-items: center; gap: 2px; min-width: 170px; padding: 18px 24px 16px; border-radius: 14px; background: #fff7d6; color: var(--encre); box-shadow: 0 5px 0 #e9cf7a; transform: rotate(-3deg); }
.prix strong { font: 800 20px/1.1 var(--titre); }
.prix b { font: 800 34px/1 var(--titre); color: #d0193f; }
.prix small { font-size: 14px; font-weight: 800; }
.trou-prix { position: absolute; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--fond-2); }
.affiche, .menu, .papier-court { justify-self: stretch; display: grid; gap: 4px; padding: 0 0 14px; overflow: hidden; border-radius: 16px; background: #fff; color: var(--encre); text-align: center; box-shadow: 0 5px 0 var(--blanc-levre); }
.affiche strong, .menu strong { padding: 10px; background: #26357a; color: #fff; font: 800 20px/1.1 var(--titre); letter-spacing: .08em; }
.affiche p, .menu p { margin: 4px 14px 0; font-size: 16px; font-weight: 800; }
.menu strong { background: #2f7d4f; letter-spacing: .02em; }
.menu em { margin-top: 6px; font-style: normal; font-weight: 900; color: var(--encre-douce); }
.papier-court { padding: 14px 18px; text-align: left; }
.papier-court strong { font: 800 18px/1.2 var(--titre); text-transform: none; }
.papier-court p { margin: 0; font-size: 16px; font-weight: 700; }
.papier-court ul { margin: 2px 0 0; padding-left: 20px; font-size: 16px; font-weight: 700; }
.plaque { display: grid; gap: 2px; padding: 16px 26px; border-radius: 10px; color: #3c3f46; text-align: center; background: linear-gradient(160deg, #f4f5f7, #c9ccd3 55%, #eef0f3); box-shadow: inset 0 0 0 2px #a9adb6, 0 5px 0 rgba(40, 14, 140, .25); }
.plaque strong { font: 800 20px/1.2 var(--titre); }
.plaque p { margin: 0; font-size: 15px; font-weight: 800; }
.mots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.mots span { padding: 8px 16px; border-radius: 12px; background: #fff; color: var(--encre); font: 800 20px/1.2 var(--texte); box-shadow: 0 4px 0 var(--blanc-levre); }
.situation.petit { font-size: 15px; font-weight: 700; }
.cite { padding: 0 8px; border-radius: 8px; background: #fff; color: var(--encre); }
.pictos .mot { font-size: 15px; line-height: 1.15; }
.alveoles.longs .mot { font-size: 17px; padding: 0 6%; }
.picto { display: block; font-size: 30px; line-height: 1.1; }

/* version 2 : contexte, image, tableau, réponses en images, phrases à écouter, mots à placer, réponses écrites */
.contexte { margin: 0; max-width: 320px; font-size: 15px; font-weight: 800; line-height: 1.35; color: rgba(255, 255, 255, .92); }
.phrase.petite { font-size: 20px; }
.phrase .trou { cursor: default; }
.ordre-phrase { font-size: 19px; line-height: 1.9; }
.ordre-phrase .trou { min-width: 64px; cursor: pointer; }
.trou.pop { animation: pop .35s cubic-bezier(.2, 1.7, .4, 1); }
.image-support { display: block; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 5px 0 var(--blanc-levre); }
.image-support img { display: block; width: 100%; max-height: 190px; object-fit: contain; }
.image-grande { width: 100%; border-radius: 12px; }
.tableau-defile { overflow-x: auto; margin: 0 -8px; }
.edt { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12.5px; line-height: 1.25; text-align: center; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.edt th, .edt td { padding: 7px 3px; border: 1px solid #d8d2ee; }
.edt tr > :first-child { width: 25%; white-space: nowrap; font-size: 11px; letter-spacing: -.01em; }
.edt tr:first-child > * { font-size: 11.5px; letter-spacing: .03em; }
.edt th { background: var(--lavande); font-weight: 900; }
.edt td:empty { background: #faf8ff; }
.reponses.images { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.reponses.images[data-cols="2"] .rep-image:first-child:nth-last-child(odd) { margin-inline: calc((100% - var(--wi)) / 2); }
.rep-image { width: var(--wi, calc((100% - 24px) / 3)); padding: 6px; border: 0; border-radius: 16px; background: #fff; box-shadow: 0 5px 0 var(--blanc-levre), 0 9px 0 var(--ombre); animation: monte .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.08s + var(--n) * .05s); transition: translate .1s; }
.rep-image img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 11px; }
.rep-image:active { translate: 0 4px; }
.rep-image[aria-checked="true"] { background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 5px 0 var(--citron-levre), 0 9px 0 var(--ombre); animation: choisi .3s cubic-bezier(.2, 1.6, .4, 1); }
.ligne-audio { display: flex; align-items: center; gap: 10px; animation: monte .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.08s + var(--n) * .05s); }
.ligne-audio .rep { flex: 1; animation: none; }
.ecouter-rep { flex: none; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; color: #fff; background: linear-gradient(var(--cyan-1), var(--cyan-2)); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .45), 0 3px 0 var(--cyan-levre); }
.ecouter-rep svg { width: 18px; height: 18px; margin-left: 3px; }
.ecouter-rep.parle { animation: appel 1s ease-in-out infinite; }
.mots-a-placer { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.mot-dispo { padding: 12px 18px; border: 0; border-radius: 14px; background: linear-gradient(#ffffff, #f2ebff); color: var(--encre); font: 800 19px/1.2 var(--texte); box-shadow: 0 5px 0 var(--blanc-levre), 0 9px 0 var(--ombre); transition: translate .1s, opacity .2s; }
.mot-dispo:active { translate: 0 4px; }
.mot-dispo:disabled { opacity: .25; box-shadow: none; translate: 0 5px; cursor: default; }
.saisies { display: grid; gap: 12px; }
.champ { display: grid; gap: 6px; font-size: 13px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .8); }
.champ input { width: 100%; min-height: 56px; padding: 12px 16px; border: 0; border-radius: 18px; background: #fff; color: var(--encre); font: 800 20px/1.2 var(--texte); box-shadow: 0 5px 0 var(--blanc-levre); outline: none; }
.champ input:focus { box-shadow: 0 5px 0 var(--citron-levre), inset 0 0 0 3px var(--citron-2); }
.alveoles[data-n="3"] { height: calc(var(--w) * 1.374 + var(--g) / 2); }
.alveoles[data-n="2"] { width: calc(var(--w) * 2 + var(--g) * 2); height: calc(var(--w) * .941); }
.alveoles[data-n="2"] .rep:nth-child(1) { left: 0; top: 0; }
.alveoles[data-n="2"] .rep:nth-child(2) { left: auto; right: 0; top: 0; }
.reponses.ecrire { display: grid; justify-items: center; gap: 22px; }
.mot-ecrit .trou { min-width: 170px; margin: 0; font: 800 26px/1.6 var(--texte); text-align: center; }
.trou.curseur::after { content: ""; display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; vertical-align: -.15em; background: currentColor; animation: clignote 1.1s steps(1) infinite; }
.trou.curseur.rempli { animation: none; }
@keyframes clignote { 50% { opacity: 0; } }
.lettres { --w: 64px; position: relative; flex: none; }
.lettres .tuile { --w: inherit; position: absolute; animation: pose .4s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(.06s + var(--n) * .03s); transition: opacity .2s; }
.lettres .mot { padding: 0 0 4%; font: 800 calc(var(--w) * .4)/1 var(--titre); text-transform: uppercase; }
.lettres .tuile:active .dessus { translate: 0 4px; }

.defile.a-suivre { -webkit-mask-image: linear-gradient(#000 calc(100% - 56px), transparent); mask-image: linear-gradient(#000 calc(100% - 56px), transparent); }

/* ------------------------------------------------------------ les réponses */
.reponses { padding: 24px 16px 14px; }
/* les alvéoles sont placées en absolu : l'écart vient d'une marge, pas d'un remplissage */
.reponses.alveoles { padding: 0; margin: 36px auto 18px; }
.ecran-question .defile > :first-child { margin-top: auto; }
.ecran-question .defile > :last-child { margin-bottom: auto; }
/* réponses courtes : quatre alvéoles en fleur, symétriques (haut, gauche, droite, bas) */
.alveoles { --w: 124px; --g: 10px; position: relative; width: calc(var(--w) * 2.5 + var(--g) * 1.732); height: calc(var(--w) * 1.807 + var(--g)); margin-inline: auto; padding: 0; }
.alveoles .rep { position: absolute; --w: inherit; animation: pose .45s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(.08s + var(--n) * .06s); }
.alveoles .rep:nth-child(1) { left: calc(50% - var(--w) / 2); top: 0; }
.alveoles .rep:nth-child(2) { left: 0; top: calc(var(--w) * .433 + var(--g) / 2); }
.alveoles .rep:nth-child(3) { right: 0; top: calc(var(--w) * .433 + var(--g) / 2); }
.alveoles .rep:nth-child(4) { left: calc(50% - var(--w) / 2); top: calc(var(--w) * .866 + var(--g)); }
.alveoles .rep:active .dessus { translate: 0 4px; }
.rep[aria-checked="true"] .face { fill: url(#g-citron); }
.rep[aria-checked="true"] .levre { fill: var(--citron-levre); }
.rep[aria-checked="true"] .dessus { animation: choisi .3s cubic-bezier(.2, 1.6, .4, 1); }
/* réponses longues : pastilles blanches, une marque hexagonale à gauche */
.bonbons { display: grid; gap: 14px; }
.bonbons .rep { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 16px; border: 0; border-radius: 18px; text-align: left; color: var(--encre); font: 800 16.5px/1.3 var(--texte);
  background: linear-gradient(#ffffff, #f2ebff); box-shadow: 0 5px 0 var(--blanc-levre), 0 9px 0 var(--ombre); animation: monte .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.08s + var(--n) * .05s); transition: translate .1s; }
.bonbons .rep:active { translate: 0 4px; box-shadow: 0 1px 0 var(--blanc-levre), 0 5px 0 var(--ombre); }
.bonbons .rep[aria-checked="true"] { background: linear-gradient(var(--citron-1), var(--citron-2)); box-shadow: 0 5px 0 var(--citron-levre), 0 9px 0 var(--ombre); animation: choisi .3s cubic-bezier(.2, 1.6, .4, 1); }
.marque-h { flex: none; width: 24px; height: 21px; }
.marque-h path { fill: #e3d8fb; }
.marque-h .coche { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.rep[aria-checked="true"] .marque-h path:first-child { fill: var(--encre); }
.rep[aria-checked="true"] .marque-h .coche { opacity: 1; }
.rep.envoyee .dessus, .bonbons .rep.envoyee { animation: envoi .4s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes envoi { 40% { scale: 1.08; } 100% { scale: 1; } }

/* ------------------------------------------------------------ le bas */
.bas { display: grid; gap: 2px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.bouton { display: grid; place-items: center; width: 100%; min-height: 58px; padding: 0 20px; border: 0; border-radius: 20px; font: 800 21px/1 var(--titre); letter-spacing: .05em; text-transform: uppercase; color: var(--encre);
  background: linear-gradient(var(--vert-1), var(--vert-2)); box-shadow: 0 5px 0 var(--vert-levre), 0 9px 0 var(--ombre); transition: translate .1s; }

/* ------------------------------------------------------------ la lecture d'un document */
.papier { margin: 14px 16px 0; padding: 22px 20px; border-radius: 24px; background: #fff; color: var(--encre); box-shadow: 0 6px 0 var(--blanc-levre), 0 10px 0 var(--ombre); animation: monte .4s cubic-bezier(.2, .8, .2, 1) both; }

/* ------------------------------------------------------------ l'accueil : la mise en page du passage de niveau */
.accueil-fete { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; padding: 10px 24px 20px; text-align: center; }

/* ------------------------------------------------------------ la fête de fin de niveau */
.fete { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px 24px calc(26px + env(safe-area-inset-bottom, 0px)); overflow: hidden; text-align: center;
  background: linear-gradient(180deg, var(--fond-1) 0%, var(--fond-2) 40%, var(--fond-3) 80%, var(--fond-4) 100%); }
.rayons { position: absolute; left: 50%; top: 34%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; opacity: .16;
  background: repeating-conic-gradient(from 0deg, #fff 0deg 7deg, transparent 7deg 20deg);
  -webkit-mask-image: radial-gradient(closest-side, #000 15%, transparent 70%); mask-image: radial-gradient(closest-side, #000 15%, transparent 70%);
  animation: tourne 22s linear infinite, apparait .8s ease-out both; }

.medaille { position: relative; z-index: 2; animation: medaille 1s cubic-bezier(.2, 1.4, .3, 1) .15s both; }

/* les feuilles (relire, quitter) */
.voile { position: absolute; inset: 0; z-index: 6; display: grid; align-items: end; background: rgba(40, 14, 120, .45); animation: fondu .2s both; }
@keyframes fondu { from { opacity: 0; } }
.feuille { display: grid; gap: 12px; max-height: 86%; overflow-y: auto; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius: 28px 28px 0 0; background: #fff; color: var(--encre); animation: monte .3s cubic-bezier(.2, .8, .2, 1) both; }
.feuille h2 { margin: 0; font: 800 23px/1.2 var(--titre); }
.feuille > p { margin: 0 0 4px; color: var(--encre-douce); font-weight: 600; }
.feuille .papier { margin: 0; padding: 0; box-shadow: none; animation: none; }
.feuille .bouton { box-shadow: 0 5px 0 var(--vert-levre); }
.feuille .lien { color: var(--encre-douce); }

/* lisibilité : aucun texte de lecture sous 14 px, consignes et contextes plus grands et plus aérés */
.contexte { max-width: 340px; font-size: 17px; line-height: 1.4; }
.etiquette { font-size: 14.5px; }
.sms p { font-size: 18px; line-height: 1.45; }
.ordre-phrase { font-size: 21px; line-height: 1.85; }
.indice { padding: 5px 14px; font-size: 15px; }
.bonbons .rep { font-size: 17.5px; }
.papier p { font-size: 17.5px; }
.papier-court p { font-size: 17px; }
.papier-tete small { font-size: 14px; }
.consigne-lecture { font-size: 15.5px; line-height: 1.45; }
.pilule { font-size: 15px; }
.champ { font-size: 14px; }
.lien { font-size: 15px; }
/* sur ordinateur, le téléphone posé sur le fond gris ; sur un appareil tactile (téléphone, tablette) ou un écran
   étroit, le test occupe tout l'écran, comme une application */
@media (max-width: 520px), (hover: none) and (pointer: coarse) {
  body { padding: 0; }
  .appli { width: 100%; height: 100%; border: 0; border-radius: 0; outline: 0; }
  /* Le test est un bloc fixe de la taille de l'écran : la page elle-même ne peut plus défiler (rien ne passe sous
     la barre d'état), et Safari (iOS 26) prend la couleur des bords d'un tel bloc pour teinter ses barres :
     violet en haut, bleu en bas, comme le dégradé. Le fond violet de la page sert de repli. */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--fond-1); }
  .appli { position: fixed; inset: 0; width: auto; height: auto; }
  .haut { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
}
@media (max-width: 370px) { .alveoles { --w: 112px; } }
@media (max-width: 335px) { .alveoles { --w: 102px; } .alveoles .mot { font-size: 17px; } }
@media (max-height: 720px) { .visuel { min-height: 120px; padding: 14px 16px; margin-top: 12px; } .question { margin-top: 18px; } .reponses { padding-top: 18px; } .reponses.alveoles { --w: 106px; margin-top: 28px; } .lecteur { width: 80px; height: 80px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .etoiles svg { opacity: 1; }
}
</style>

// Sur un petit écran (téléphone avec les barres du navigateur), une question qui ne tient pas est resserrée
// (marges, lecteur, réponses), en deux crans ; les images s'ajustent ensuite à la place qui reste.
// Si elle ne tient toujours pas (long texte à lire, très petit écran), le bas du contenu s'estompe pour montrer
// qu'il y a une suite à faire défiler, jusqu'à ce qu'on arrive en bas.
function resserrer() {
  const ecran = appli.querySelector(".ecran"), d = ecran && ecran.querySelector(".defile"); if (!d) return;
  const deborde = () => d.scrollHeight > d.clientHeight + 1;
  ecran.querySelectorAll("img").forEach(i => { if (!i.complete) i.addEventListener("load", resserrer, { once: true }); });   // la taille d'une image n'est connue qu'une fois chargée
  ecran.classList.remove("serre", "tres-serre");
  if (deborde()) { ecran.classList.add("serre"); placerLettres(); ajusterImages(); }
  if (deborde()) { ecran.classList.add("tres-serre"); placerLettres(); ajusterImages(); }
  const suite = () => d.classList.toggle("a-suivre", d.scrollTop + d.clientHeight < d.scrollHeight - 4);
  suite(); if (!d.dataset.suite) { d.dataset.suite = 1; d.addEventListener("scroll", suite, { passive: true }); }
}
// Réponses en images : aussi grandes que la place le permet. On essaie deux colonnes (trois images : une en haut,
// deux en bas, comme les alvéoles), de la plus grande taille à la plus petite ; sinon, toutes sur une ligne.
function ajusterImages() {
  const bloc = appli.querySelector(".reponses.images"); if (!bloc) return;
  const defile = bloc.closest(".defile"), premier = defile.firstElementChild, dernier = defile.lastElementChild;
  const n = bloc.children.length, g = 12, larg = bloc.clientWidth - 32, ligne = Math.floor((larg - (n - 1) * g) / n);
  const marge = () => Math.min(premier.offsetTop - defile.offsetTop, defile.offsetTop + defile.clientHeight - dernier.offsetTop - dernier.offsetHeight);
  const essayer = (cols, w) => { bloc.dataset.cols = cols; bloc.style.setProperty("--wi", w + "px"); return marge() >= 18; };
  if (n > 2) for (let w = Math.min(Math.floor((larg - g) / 2), 200); w >= ligne + 16; w -= 6) if (essayer(2, w)) return;
  essayer(n, ligne);
}
// Lettres à toucher : une bande d'alvéoles (une ou deux rangées en quinconce), à la largeur de l'écran.
function placerLettres() {
  const bloc = appli.querySelector(".lettres"); if (!bloc) return;
  const t = [...bloc.children], n = t.length, rangs = n > 7 ? 2 : 1, cols = Math.ceil(n / rangs), g = 6;
  const larg = bloc.parentElement.clientWidth - 32, w = Math.min(66, Math.floor((larg - (cols - 1) * g) / ((cols - 1) * .75 + 1)));
  const pas = w * .75 + g, h = w * .866 + g;
  let bas = 0;
  t.forEach((x, k) => { const c = rangs === 2 ? Math.floor(k / 2) : k, r = rangs === 2 ? k % 2 : 0, y = r * h + (c % 2 ? h / 2 : 0);
    x.style.left = c * pas + "px"; x.style.top = y + "px"; bas = Math.max(bas, y); });
  bloc.style.setProperty("--w", w + "px"); bloc.style.width = (cols - 1) * pas + w + "px"; bloc.style.height = bas + w * .941 + "px";
}
addEventListener("resize", () => { placerLettres(); ajusterImages(); resserrer(); });
function ecranLecture(q) {
  poser(`<section class="ecran" aria-labelledby="t-doc">
    ${haut()}
    <div class="defile">${papier(q).replace("<strong>", '<strong id="t-doc">')}<p class="consigne-lecture">Lisez le document. La question arrive ensuite, et vous pourrez le relire.</p></div>
    <div class="bas">${bouton("J'ai lu", "vert", 'id="lu"')}</div>
  </section>`);
  brancherSon(); avancerJauge();
  $("#fermer").addEventListener("click", demanderQuitter);
  $("#lu").addEventListener("click", () => { etat.lus[q.id] = true; SONS.page(); afficher(); });
  resserrer();
}
function suivante(delai) {
  setTimeout(() => {
    const { justes, erreurs } = bilan(), i = ORDRE.indexOf(etat.niveau), fini = etat.k + 1 >= etat.palier.length;
    if (erreurs > etat.palier.length - seuil()) { etat.ecran = "resultat"; return afficher(); }   // le niveau ne peut plus être validé
    if (!fini) { etat.k++; return afficher(); }
    if (justes >= seuil()) {                                         // palier joué en entier et validé
      etat.valides.push(etat.niveau);
      if (i === ORDRE.length - 1) { etat.ecran = "resultat"; return afficher(); }
      etat.vus.push(...etat.palier);
      etat.precedent = etat.niveau; etat.niveau = ORDRE[i + 1];
      etat.palier = tirerPalier(etat.niveau, etat.vus.map(id => PAR_ID[id].groupe)); etat.k = 0; preparerOrdres();
      etat.ecran = "palier"; return afficher();
    }
    etat.ecran = "resultat"; afficher();
  }, delai);
}
function feuille(contenu) {
  const voile = document.createElement("div");
  voile.className = "voile";
  voile.innerHTML = `<div class="feuille" role="dialog" aria-modal="true">${contenu}</div>`;
  appli.appendChild(voile);
  voile.addEventListener("click", (e) => { if (e.target === voile || e.target.closest("[data-fermer]")) voile.remove(); });
  const premier = voile.querySelector("button"); if (premier) premier.focus({ preventScroll: true });
  return voile;
}
function demanderQuitter() {
  const v = feuille(`<h2>Quitter le test ?</h2><p>Vos réponses ne seront pas gardées.</p>${bouton("Continuer le test", "vert", "data-fermer")}<button class="lien" type="button" id="quitter">Quitter</button>`);
  $("#quitter", v).addEventListener("click", () => { etat.ecran = "accueil"; afficher(); });
}

// ------------------------------------------------------------------------------ la fête de fin de niveau
function confettis(cv, duree = 260) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !cv) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const couleurs = ["#fff27a", "#b6f51c", "#5ce9ff", "#f98aee", "#ffffff"];
  const cx = r.width / 2, cy = r.height * .34;
  const morceau = (rafale) => ({ x: rafale ? cx : Math.random() * r.width, y: rafale ? cy : -20, vx: rafale ? Math.cos(Math.random() * 6.28) * (4 + Math.random() * 9) : (Math.random() - .5) * 2, vy: rafale ? -(3 + Math.random() * 10) : 2 + Math.random() * 3,
    t: Math.random() * 6, vt: (Math.random() - .5) * .3, c: couleurs[Math.floor(Math.random() * couleurs.length)], l: 7 + Math.random() * 8, forme: Math.random() < .45 ? "hexa" : Math.random() < .5 ? "etoile" : "ruban" });
  const bouts = Array.from({ length: 150 }, () => morceau(true));
  let image = 0;
  (function pas() {
    g.clearRect(0, 0, r.width, r.height);
    if (image > 40 && image < duree - 60 && image % 3 === 0) bouts.push(morceau(false), morceau(false));
    bouts.forEach(b => {
      b.vy += .22; b.vx *= .985; b.x += b.vx + Math.sin((image + b.l * 10) / 14) * .6; b.y += b.vy; b.t += b.vt;
      g.save(); g.translate(b.x, b.y); g.rotate(b.t); g.fillStyle = b.c;
      g.beginPath();
      if (b.forme === "hexa") { for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + Math.PI / 6; g.lineTo(Math.cos(a) * b.l / 2, Math.sin(a) * b.l / 2); } g.fill(); }
      else if (b.forme === "etoile") { for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5, rr = i % 2 ? b.l / 4 : b.l / 1.8; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.fill(); }
      else g.fillRect(-b.l / 2, -b.l / 5, b.l, b.l / 2.5);
      g.restore();
    });
    if (++image < duree && document.body.contains(cv)) requestAnimationFrame(pas); else g.clearRect(0, 0, r.width, r.height);
  })();
}
function medaille(niveau, coche) {
  return `<div class="medaille" aria-hidden="true">${tuile(niveau, NIVEAUX[niveau].teinte)}${coche ? `<span class="medaille-coche">${ICONE.coche}</span>` : ""}</div>`;
}
function ecranPalier() {
  const fini = etat.precedent, suivant = etat.niveau;
  const ordre = ["A1", "A2", "B1"], f = ordre.indexOf(fini);
  poser(`<section class="ecran"><div class="fete" role="dialog" aria-labelledby="t-fete">
    <div class="rayons" aria-hidden="true"></div><div class="lueur" aria-hidden="true"></div>
    <canvas id="confettis" aria-hidden="true"></canvas>
    ${medaille(fini, true)}
    <div class="etoiles" aria-hidden="true">${ETOILE}${ETOILE}${ETOILE}</div>
    <h2 class="grand-titre" id="t-fete">Bravo !</h2>
    <p>Niveau ${fini} validé. On passe au niveau ${suivant}.</p>
    <div class="chemin" aria-hidden="true">${ordre.map((n, m) => `${m ? `<span class="trait ${m === f + 1 ? "remplit" : ""}" style="--p:${m <= f ? 1 : 0}"><i></i></span>` : ""}${tuile(m <= f ? "✓" : n, m <= f ? "citron" : m === f + 1 ? NIVEAUX[n].teinte : "ton", m === f + 1 ? "suivante" : "")}`).join("")}</div>
    ${bouton("Continuer", "vert", 'id="reprendre"')}
  </div></section>`);
  SONS.fete(); vibrer([30, 60, 30, 60, 80]);
  confettis($("#confettis"));
  setTimeout(() => { const b = $("#reprendre"); b && b.focus({ preventScroll: true }); }, 2400);
  $("#reprendre").addEventListener("click", () => { SONS.choix(); etat.ecran = "question"; afficher(); });
}

// ------------------------------------------------------------------------------ le résultat
function calculer() {
  const faites = [...etat.vus, ...etat.palier].filter(id => id in etat.reponses), diagnostic = { competence: {}, tag: {} };
  faites.forEach(id => { const q = PAR_ID[id], juste = estJuste(q, etat.reponses[id]);
    for (const [axe, cle] of [["competence", q.comp], ["tag", q.tag]]) { const d = (diagnostic[axe][cle] ??= { juste: 0, total: 0 }); d.total++; d.juste += juste; } });
  etat.diagnostic = diagnostic;
  return { niveau: etat.valides[etat.valides.length - 1] || null, diagnostic };
}
function ecranResultat() {
  const n = calculer().niveau;
  poser(`<section class="ecran" aria-labelledby="t-resultat">
    <div class="haut"><span></span><span></span>${boutonSon()}</div>
    <div class="defile">
      <div class="resultat-seul">
        <div class="rayons" aria-hidden="true"></div><div class="lueur" aria-hidden="true"></div>
        <canvas id="confettis" aria-hidden="true"></canvas>
        ${medaille(n || "A1", !!n)}
        <small>Votre niveau</small>
        <h1 class="grand-titre" id="t-resultat">${n ? `Niveau ${n}` : "A1 en cours"}</h1>
      </div>
    </div>
    <div class="bas">${bouton("Refaire le test", "blanc", 'id="refaire"')}</div>
  </section>`);
  brancherSon();
  SONS.fete(); vibrer([30, 60, 30, 60, 120]);
  confettis($("#confettis"), 220);
  $("#refaire").addEventListener("click", () => { SONS.valider(); nouveauTest(); afficher(); });
}

// ------------------------------------------------------------------------------ départ (l'état survit à une mise à jour de la page)
window.claude?.hot?.snapshot?.(() => ({ etat }));
const depart = (data) => { if (data && data.etat && (data.etat.ecran === "accueil" || data.etat.palier)) etat = data.etat; afficher(); };
window.claude?.hot?.ready ? window.claude.hot.ready(depart) : depart(window.claude?.hot?.data ?? {});
</script>
