<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onlineformapro – points de vue des particules</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400&display=swap">
<style>
  /* page d'essai : les nuées de particules sous quatre points de vue, en direct, pour choisir */
  body { margin: 0; background: #fff; color: #2a2a2c; font: 14px/1.4 "Chivo Mono", ui-monospace, monospace; }
  .essai { position: relative; height: 86vh; min-height: 560px; overflow: hidden; isolation: isolate; border-bottom: 1px solid #ececf0; }
  .essai p { position: absolute; left: 24px; top: 20px; margin: 0; letter-spacing: .06em; text-transform: uppercase; }
  .essai p span { display: block; margin-top: 4px; text-transform: none; letter-spacing: 0; color: #77777d; }
  .nuee { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; }
</style>
<script src="nuee.js" defer></script>
</head>
<body>
<section class="essai" data-nuee="anneau"><p>01 · Anneau<span>vu de&nbsp;biais, en&nbsp;grand (l’ouverture de&nbsp;Contact)</span></p></section>
<section class="essai" data-nuee="gros-plan"><p>02 · Gros plan<span>le&nbsp;boudin de&nbsp;grains traverse l’écran en&nbsp;diagonale</span></p></section>
<section class="essai" data-nuee="tres-gros-plan"><p>03 · Très gros plan<span>les&nbsp;grains deviennent de&nbsp;grosses billes</span></p></section>
<section class="essai" data-nuee="vagues"><p>04 · Vagues<span>une&nbsp;nappe en&nbsp;couches qui&nbsp;ondule et&nbsp;file</span></p></section>
</body>
