<title>Piste A · Le grand ciel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap">
<style>
/*__CSS_COMMUN__*/
/* Piste A — « Le grand ciel » : le ciel et la photo occupent la moitié gauche et se fondent vers la droite dans le
   blanc ; à droite, la question en très grand, puis les réponses. Transition : la photo suivante se pose par-dessus
   en reculant (fondu enchaîné), le texte sort par le haut et la nouvelle question monte mot à mot. */
.ciel-a { position: fixed; inset: 0 auto 0 0; width: 46vw; background: var(--ciel); }
.ecran { display: grid; grid-template-columns: 46vw minmax(0, 1fr); }
.gauche { position: relative; display: grid; place-items: center; padding: 104px 48px 64px; }
.photo { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 56%, transparent 100%); mask-image: linear-gradient(90deg, #000 56%, transparent 100%); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, 50% 50%); }
.sur { position: relative; z-index: 1; display: grid; justify-items: center; gap: 18px; width: min(440px, 100%); }
.sur .carte, .sur .sms, .sur .phrase { justify-self: stretch; }
.droite { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 36px; max-width: 900px; padding: 104px clamp(40px, 6vw, 112px) 72px clamp(24px, 3.4vw, 64px); }
.question { font-size: clamp(42px, 4.5vw, 72px); font-weight: 800; line-height: 1.03; letter-spacing: -.038em; text-wrap: balance; outline: none; }
.reponses { display: grid; gap: 12px; }
.rep { min-height: 76px; }
.titre-geant { font-size: clamp(56px, 6.2vw, 104px); font-weight: 900; line-height: .95; letter-spacing: -.05em; text-wrap: balance; outline: none; }
.ecran-accueil .droite { gap: 30px; }
.ecran-accueil .bouton { align-self: flex-start; min-height: 72px; padding-inline: 40px 30px; font-size: 22px; }
.ecran-fin .droite { gap: 26px; }
.ecran-fin .texte-fin { max-width: 32ch; color: var(--doux); font-size: 22px; line-height: 1.5; }
.ecran-fin .bouton { align-self: flex-start; }

/* entrée */
.actif .photo img { animation: recule 1.7s var(--ease-out) both; }
@keyframes recule { from { opacity: 0; transform: scale(1.14); } }
.actif .sur > * { animation: monte .8s var(--ease-out) .4s both; }
.actif .sur > :nth-child(2) { animation-delay: .5s; }
.actif .sur > :nth-child(3) { animation-delay: .6s; }
.actif .sur .bille { animation: eclot .9s var(--ressort) .45s both; }
@keyframes monte { from { opacity: 0; transform: translateY(22px); } }
@keyframes eclot { 0% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; } }
.actif .mot > span { animation: mot .95s var(--ease-out) both; animation-delay: calc(.2s + var(--i) * .045s); }
@keyframes mot { from { transform: translateY(108%); } }
.actif .rep { animation: glisse .75s var(--ease-out) both; animation-delay: calc(.5s + var(--k) * .07s); }
@keyframes glisse { from { opacity: 0; transform: translateX(32px); } }
.actif .bas, .actif .sur-titre, .actif .aptitudes, .actif .bloc-langue, .actif .texte-fin, .actif .ecran-accueil .bouton { animation: monte .8s var(--ease-out) .55s both; }
.actif .bloc-langue { animation-delay: .65s; }
.actif .coche { animation: eclot 1s var(--ressort) .2s both; }
.relangue .photo img, .relangue .aptitudes, .relangue .bloc-langue, .relangue .bouton, .relangue .sur-titre { animation: none !important; }
/* sortie */
.sort .droite > * { animation: sortHaut .42s var(--ease) forwards; }
.sort .droite > :nth-child(2) { animation-delay: .04s; }
.sort .droite > :nth-child(3) { animation-delay: .08s; }
@keyframes sortHaut { to { opacity: 0; transform: translateY(-28px); } }
.sort .sur { animation: efface .35s forwards; }
.sort .photo { animation: efface .6s .9s forwards; }
@keyframes efface { to { opacity: 0; } }

@media (max-height: 820px) {
  .droite { gap: 26px; padding-top: 84px; padding-bottom: 40px; }
  .ecran-accueil .droite { gap: 20px; }
  .titre-geant { font-size: min(6.2vw, 10.5vh); }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .ciel-a { width: 100vw; height: 46vh; inset: 0 0 auto 0; }
  .ecran { grid-template-columns: 1fr; grid-template-rows: 46vh auto; overflow: auto; }
  .photo { -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .droite { padding: 24px 20px 40px; }
}
</style>
<div class="ciel-a" aria-hidden="true"></div>
<main class="app" id="app"></main>
<div class="haut"><button class="rond" id="son" type="button" aria-label="Couper les sons"></button><button class="rond cache" id="quitter" type="button" aria-label="Quitter le test"></button></div>
<a class="pistes" href="index.html">Piste A · Le grand ciel — toutes les pistes</a>
<script>
const DONNEES = /*__DONNEES__*/;
const SORTIE = 1500;
const POS = { intro: "50% 35%", metro: "35% 50%", cinema: "68% 50%", telephone: "50% 30%", croissant: "50% 50%" };
const photo = (nom) => `<div class="photo" style="--pos:${POS[nom] || "50% 50%"}"><img src="${IMG[nom]}" alt=""></div>`;
function rendre(e) {
  if (e.type === "accueil") return `<div class="gauche">${photo(e.photo)}</div>
    <div class="droite"><p class="sur-titre"${attrs("Français · environ 10 minutes")}>${texte("Français · environ 10 minutes")}</p>
      <h1 class="titre-geant" tabindex="-1" data-focus${attrs("Évaluation de positionnement")}>${motAMot("Évaluation de positionnement")}</h1>
      ${aptitudes()}${langues()}
      <button class="bouton" type="button" data-action="commencer"><span${attrs("Commencer")}>${texte("Commencer")}</span><kbd aria-hidden="true">Entrée ↵</kbd></button></div>`;
  if (e.type === "fin") return `<div class="gauche"><div class="coche" aria-hidden="true">${ICONE.coche}</div></div>
    <div class="droite"><h1 class="titre-geant" tabindex="-1" data-focus${attrs("Évaluation terminée")}>${motAMot("Évaluation terminée")}</h1>
      <p class="texte-fin"${attrs("Merci pour vos réponses. Vous pouvez prévenir votre formateur que vous avez terminé.")}>${texte("Merci pour vos réponses. Vous pouvez prévenir votre formateur que vous avez terminé.")}</p>
      <button class="bouton" type="button" data-action="fermer"><span${attrs("Fermer")}>${texte("Fermer")}</span><kbd aria-hidden="true">Entrée ↵</kbd></button></div>`;
  return `<div class="gauche">${photo(e.photo)}<div class="sur">${surPhoto(e)}</div></div>
    <div class="droite">${titreQuestion(e)}${reponses(e)}${bas()}</div>`;
}
/*__JS_COMMUN__*/
</script>
