<title>Piste E · La scène</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap">
<style>
/*__CSS_COMMUN__*/
/* Piste E — « La scène » : l'écran mobile tel qu'il a été validé, agrandi et centré ; la photo s'étend sur toute
   la largeur derrière lui et se fond dans le blanc. Une seule colonne, le texte aligné à gauche, les réponses
   l'une sous l'autre. Transition : une mise au point ; la photo arrive floue et devient nette, le texte monte. */
.ecran { --zone: 40vh; display: flex; flex-direction: column; }
.ecran-accueil { --zone: 30vh; }
.fond { position: absolute; inset: 0 0 auto 0; height: calc(var(--zone) + 6vh); overflow: hidden; background: var(--ciel); -webkit-mask-image: linear-gradient(#000 42%, transparent 100%); mask-image: linear-gradient(#000 42%, transparent 100%); }
.fond img { width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, 50% 50%); }
.colonne { position: relative; z-index: 1; width: min(860px, calc(100% - 2 * clamp(24px, 4vw, 64px))); margin-inline: auto; }
.zone { height: var(--zone); display: grid; align-content: center; justify-items: stretch; gap: 14px; padding: 64px max(0px, (100% - 640px) / 2) 0; }
.zone > .bille, .zone > .coche { justify-self: center; }
.contenu { display: flex; flex-direction: column; gap: 24px; padding: 14px 0 28px; }
.question { font-size: clamp(36px, 3.6vw, 60px); font-weight: 800; line-height: 1.04; letter-spacing: -.036em; text-wrap: balance; outline: none; }
.reponses { display: grid; gap: 10px; }
.rep { min-height: 66px; padding-block: 12px; font-size: 21px; }
.titre-geant { font-size: clamp(50px, 5.3vw, 90px); font-weight: 900; line-height: .95; letter-spacing: -.05em; text-wrap: balance; outline: none; }
.ecran-accueil .contenu { gap: 22px; }
.ecran-accueil .bouton, .ecran-fin .bouton { align-self: flex-start; }
.ecran-accueil .bouton { min-height: 70px; padding-inline: 40px 30px; font-size: 22px; }
.texte-fin { max-width: 40ch; color: var(--doux); font-size: 22px; }

/* entrée : mise au point de la photo, puis le texte en cascade */
.actif .fond img, .actif .fond .coche { animation: net 1.5s var(--ease-out) both; }
@keyframes net { from { opacity: 0; filter: blur(22px); transform: scale(1.1); } }
.actif .zone > * { animation: monte .8s var(--ease-out) .45s both; }
.actif .zone > :nth-child(2) { animation-delay: .55s; }
.actif .zone > .bille { animation: eclot .9s var(--ressort) .5s both; }
.actif .mot > span { animation: mot .95s var(--ease-out) both; animation-delay: calc(.25s + var(--i) * .045s); }
.actif .rep { animation: monte .7s var(--ease-out) both; animation-delay: calc(.5s + var(--k) * .07s); }
.actif .bas, .actif .sur-titre, .actif .aptitudes, .actif .bloc-langue, .actif .texte-fin, .actif .contenu > .bouton { animation: monte .8s var(--ease-out) .55s both; }
.actif .zone .coche { animation: eclot 1s var(--ressort) .35s both; }
@keyframes monte { from { opacity: 0; transform: translateY(22px); } }
@keyframes mot { from { transform: translateY(108%); } }
@keyframes eclot { 0% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; } }
.relangue .fond img, .relangue .aptitudes, .relangue .bloc-langue, .relangue .bouton, .relangue .sur-titre { animation: none !important; }
/* sortie : la photo se brouille, le texte s'efface vers le haut */
.sort .fond img { animation: brouille .8s var(--ease) forwards; }
@keyframes brouille { to { opacity: 0; filter: blur(18px); transform: scale(1.04); } }
.sort .zone > *, .sort .contenu > * { animation: sortHaut .4s var(--ease) forwards; }
@keyframes sortHaut { to { opacity: 0; transform: translateY(-24px); } }

@media (max-height: 820px) {
  .ecran { --zone: 34vh; }
  .ecran-accueil { --zone: 24vh; }
  .contenu { gap: 16px; padding-bottom: 20px; }
  .ecran-accueil .contenu { gap: 16px; }
  .rep { min-height: 58px; padding-block: 9px; font-size: 19px; }
  .titre-geant { font-size: min(5.3vw, 9.4vh); }
  .zone > .bille { --b: 112px; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .ecran { overflow: auto; }
}
</style>
<main class="app" id="app"></main>
<div class="haut"><button class="rond" id="son" type="button" aria-label="Couper les sons"></button><button class="rond cache" id="quitter" type="button" aria-label="Quitter le test"></button></div>
<a class="pistes" href="index.html">Piste E · La scène — toutes les pistes</a>
<script>
const DONNEES = /*__DONNEES__*/;
const SORTIE = 850;
const POS = { intro: "50% 30%", metro: "50% 42%", cinema: "60% 38%", telephone: "50% 20%", croissant: "50% 55%" };
const fond = (nom) => `<div class="fond" aria-hidden="true">${nom ? `<img src="${IMG[nom]}" alt="" style="--pos:${POS[nom] || "50% 50%"}">` : ""}</div>`;
function rendre(e) {
  if (e.type === "accueil") return `${fond(e.photo)}<div class="colonne"><div class="zone"></div>
    <div class="contenu"><p class="sur-titre"${attrs("Français · environ 10 minutes")}>${texte("Français · environ 10 minutes")}</p>
      <h1 class="titre-geant" tabindex="-1" data-focus${attrs("Évaluation de positionnement")}>${motAMot("Évaluation de positionnement")}</h1>
      ${aptitudes()}${langues()}
      <button class="bouton" type="button" data-action="commencer"><span${attrs("Commencer")}>${texte("Commencer")}</span><kbd aria-hidden="true">Entrée ↵</kbd></button></div></div>`;
  if (e.type === "fin") return `${fond(null)}<div class="colonne"><div class="zone"><div class="coche" aria-hidden="true">${ICONE.coche}</div></div>
    <div class="contenu"><h1 class="titre-geant" tabindex="-1" data-focus${attrs("Évaluation terminée")}>${motAMot("Évaluation terminée")}</h1>
      <p class="texte-fin"${attrs("Merci pour vos réponses. Vous pouvez prévenir votre formateur que vous avez terminé.")}>${texte("Merci pour vos réponses. Vous pouvez prévenir votre formateur que vous avez terminé.")}</p>
      <button class="bouton" type="button" data-action="fermer"><span${attrs("Fermer")}>${texte("Fermer")}</span><kbd aria-hidden="true">Entrée ↵</kbd></button></div></div>`;
  return `${fond(e.photo)}<div class="colonne"><div class="zone">${surPhoto(e)}</div>
    <div class="contenu">${titreQuestion(e)}${reponses(e)}${bas()}</div></div>`;
}
/*__JS_COMMUN__*/
</script>
