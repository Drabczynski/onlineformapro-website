<meta charset="utf-8">
<title>Le village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--encre:#1d1b18;--papier:rgba(255,253,249,.95);--doux:#6f685d;--accent:#c2412d;--vert:#2f7d4f;--bleu:#2a5d8f;color-scheme:light}
html,body{height:100%;margin:0}
body{background:#9cc3e3;font:16px/1.45 Figtree,system-ui,sans-serif;color:var(--encre);overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#c.main{cursor:pointer}
.ui{position:fixed;z-index:2}
.carte{background:var(--papier);border-radius:14px}

/* carnet de missions */
#carnet{left:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:12px 16px;min-width:230px;max-width:min(320px,calc(100vw - 150px))}
#carnet h2{margin:0 0 6px;font-size:15px;font-weight:800}
#carnet ul{margin:0;padding:0;display:grid;gap:5px}
#carnet li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:14px}
#carnet li i{width:16px;height:16px;border-radius:4px;border:2px solid #b9b1a5;flex:none;margin-top:2px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:900}
#carnet li.fait i{background:var(--vert);border-color:var(--vert)}
#carnet li.fait span{text-decoration:line-through;color:#8a8378}
#carnet li.bientot{color:#9a9388}
#carnet li.bientot span::after{content:" · bientôt";font-size:12px}
#carnet li.actif span{font-weight:700}

#bourse{right:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:8px 14px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
#bourse svg{width:18px;height:18px}
#sac{right:16px;top:calc(62px + env(safe-area-inset-top,0px));padding:7px 12px;font-size:14px;font-weight:600}
#sac:empty{display:none}

#etiquette{pointer-events:none;padding:5px 11px;font-size:14px;font-weight:700;transform:translate(-50%,-140%);white-space:nowrap;display:none}
#bulle{left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;font-weight:600;display:none;max-width:calc(100vw - 40px);text-align:center}
#aide{left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font-size:14px;color:var(--doux);display:none}

/* dialogue */
#dialogue{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:860px;padding:16px 18px;display:none}
#dialogue .qui{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
#dialogue .dit{font-size:clamp(17px,2.2vw,21px);font-weight:700;margin:3px 0 12px;min-height:1.4em}
#choix{display:flex;flex-wrap:wrap;gap:8px}
#choix button{font:inherit;font-size:15px;border:2px solid #d9d2c6;background:#fff;color:var(--encre);border-radius:99px;padding:8px 15px;cursor:pointer;text-align:left}
#choix button:hover,#choix button:focus-visible{border-color:var(--encre);outline:none}
#choix.pieces button{border-radius:50%;width:58px;height:58px;padding:0;text-align:center;font-weight:800;background:#f3d36b;border-color:#c9a536}
#choix.pieces button.argent{background:#e3e3df;border-color:#a9a9a2}
#choix.pieces button.billet{border-radius:8px;width:76px;background:#bfe0c6;border-color:#7fb08c}
#retour{font-size:14px;color:var(--bleu);font-weight:600;min-height:1.3em;margin-top:9px}
#dialogue .rejouer{position:absolute;right:14px;top:12px;border:0;background:none;cursor:pointer;color:var(--doux);padding:4px}
#dialogue .rejouer svg{width:22px;height:22px}

#sortir{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-weight:700;border:0;background:var(--encre);color:#fff;border-radius:99px;padding:10px 18px;cursor:pointer;display:none}

#fondu{position:fixed;inset:0;background:#120f0c;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:5}
#toast{left:50%;top:28%;transform:translate(-50%,-50%) scale(.9);padding:18px 26px;font-size:22px;font-weight:800;opacity:0;transition:all .35s ease;text-align:center;pointer-events:none;z-index:4}
#toast.vu{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;font-size:15px;font-weight:600;color:var(--doux);margin-top:4px}

/* accueil */
#accueil{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:linear-gradient(180deg,rgba(20,30,45,.35),rgba(20,15,10,.6));padding:20px}
#accueil .boite{background:var(--papier);border-radius:20px;padding:28px 30px;max-width:460px;display:grid;gap:12px;text-align:center}
#accueil h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em}
#accueil p{margin:0;color:var(--doux)}
#accueil button{font:inherit;font-size:18px;font-weight:800;border:0;border-radius:99px;padding:13px 22px;background:var(--accent);color:#fff;cursor:pointer;justify-self:center;min-width:200px}
#accueil button:disabled{background:#b9b1a5;cursor:progress}
#barre{height:6px;border-radius:9px;background:#e7e1d7;overflow:hidden}
#barre i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#erreur{color:var(--accent);font-weight:700;display:none}
@media (max-width:560px){#carnet{min-width:0;padding:9px 12px}#carnet li{font-size:13px}#dialogue{padding:13px 14px}#choix button{font-size:14px}}
</style>

<canvas id="c"></canvas>
<div id="carnet" class="ui carte" aria-live="polite">
  <h2>Ta journée</h2>
  <ul>
    <li id="m-pain" class="actif"><i></i><span>Acheter du pain à la boulangerie</span></li>
    <li class="bientot"><i></i><span>Acheter un médicament</span></li>
    <li class="bientot"><i></i><span>Aller chez le médecin</span></li>
  </ul>
</div>
<div id="bourse" class="ui carte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9.5a3.5 3.5 0 1 0 0 5M7.5 11h6M7.5 13.5h6"/></svg><span id="argent">5,00 €</span></div>
<div id="sac" class="ui carte"></div>
<div id="etiquette" class="ui carte"></div>
<div id="aide" class="ui carte">Clique sur le sol pour marcher. Clique sur une personne pour lui parler.</div>
<div id="bulle" class="ui carte"></div>
<div id="dialogue" class="ui carte" role="dialog" aria-live="polite">
  <button class="rejouer" id="rejouer" title="Réécouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <div class="qui" id="qui"></div>
  <div class="dit" id="dit"></div>
  <div id="choix"></div>
  <div id="retour"></div>
</div>
<button id="sortir" class="ui">Sortir</button>
<div id="toast" class="ui carte"></div>
<div id="fondu"></div>
<div id="accueil">
  <div class="boite">
    <h1>Le village</h1>
    <p>Ta première journée au village. Parle aux habitants pour faire tes courses.</p>
    <div id="barre"><i></i></div>
    <button id="commencer" disabled>Chargement…</button>
    <p id="erreur"></p>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="jeu.js"></script>
