<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Le journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Texte à trous « Le journal », dans l'interface de « La chambre de Kenji » : à gauche la photo et un lecteur
   (lecture, pause, curseur pour réécouter un passage) ; à droite le texte, des trous d'encre invisible qui scintillent,
   et les mots à glisser. Un seul enregistrement pour tout : une voix à la fois, jamais coupée par une autre. */
:root {
  --text: #FFFFFF; --text2: rgba(255,255,255,.72); --text3: rgba(255,255,255,.48);
  --ink: #0B0D16; --env: #10121A; --glass: rgba(255,255,255,.13);
  --g-ok: linear-gradient(135deg, #1DD6A0 0%, #2BC4F0 100%);
  --rainbow: conic-gradient(from var(--spin), #FF4D8A, #FF8A3D, #FFD24A, #1DD6A0, #3AA8FF, #8A5CFF, #FF4D8A);
  --font: "Figtree", system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --apple: cubic-bezier(.32,.72,0,1); --spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--env); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
svg { display: block; }

.fond { position: fixed; inset: -80px; z-index: 0; background: url(micro.jpg) 36% 50% / cover no-repeat; filter: blur(42px) saturate(1.25); opacity: .42; pointer-events: none; }
.fond::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 50%, rgba(8,10,20,0), rgba(8,10,20,.75)); }
.env { position: fixed; inset: 0; z-index: 0; background: radial-gradient(55% 50% at 30% 45%, rgba(110,140,255,.18), transparent 70%), radial-gradient(45% 45% at 80% 60%, rgba(236,180,140,.12), transparent 72%), #0e1018; }

.glass { position: relative; background: var(--glass); isolation: isolate; backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 32px -12px rgba(0,0,0,.45); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(140deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 38%, rgba(255,255,255,.04) 62%, rgba(255,255,255,.25));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

.stage { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 28px 26px; }
/* la photo prend la hauteur de la carte du texte */
.row { display: flex; align-items: stretch; gap: 28px; height: min(740px, calc(100vh - 150px)); }
.pic { position: relative; flex: none; width: min(44vw, 640px); min-height: 420px; border-radius: 32px; overflow: hidden; background: #1b1e2b;
  box-shadow: 0 40px 90px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.14); isolation: isolate; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 36% 50%; }
.pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.55)); pointer-events: none; }
.card { flex: none; width: min(700px, 48vw); max-height: calc(100vh - 62px); border-radius: 30px; padding: 16px 14px 16px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- le spectre sonore, sur la photo, au-dessus du lecteur ---------- */
.spectre { position: absolute; left: 14px; right: 14px; bottom: 86px; z-index: 3; height: 110px; width: calc(100% - 28px); pointer-events: none; opacity: 0; transition: opacity .5s ease; }
body.playing .spectre { opacity: 1; }
.pic::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 55%; z-index: 2; pointer-events: none; background: linear-gradient(180deg, rgba(8,10,20,0), rgba(8,10,20,.55)); opacity: 0; transition: opacity .5s ease; }
body.playing .pic::before { opacity: 1; }

/* ---------- le lecteur, posé en bas de la photo ---------- */
.player { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 26px;
  background: rgba(16,18,28,.5); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 14px 30px -12px rgba(0,0,0,.5); transition: opacity .4s, translate .5s var(--apple); }
body[data-turn="boot"] .player { opacity: 0; translate: 0 12px; pointer-events: none; }
.ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); flex: none; transition: background .2s, color .2s, scale .3s var(--spring); }
.ico:active { scale: .92; }
.ico svg { width: 19px; height: 19px; }
.ico.play { width: 46px; height: 46px; background: #fff; color: var(--ink); }
.ico.play svg { width: 20px; height: 20px; }
.ico[aria-pressed="true"] { background: #fff; color: var(--ink); }
.time { flex: none; font-size: 13px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; }
.track { position: relative; flex: 1; height: 34px; cursor: pointer; touch-action: none; }
.track .rail { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 6px; background: rgba(255,255,255,.22); overflow: hidden; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; border-radius: 6px; }
.track .seg { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 6px; background: rgba(75,227,180,.55); opacity: 0; transition: opacity .3s; pointer-events: none; }
.track .seg.on { opacity: 1; }
.track .tick { position: absolute; top: 50%; width: 3px; height: 14px; margin: -7px 0 0 -1.5px; border-radius: 2px; background: rgba(255,255,255,.55); pointer-events: none; }
.track .knob { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); transition: scale .2s var(--spring); }
.track:active .knob { scale: 1.25; }

.bigplay { position: absolute; left: 50%; top: 50%; z-index: 6; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(16,18,28,.55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 20px 40px -14px rgba(0,0,0,.6); transition: opacity .4s, scale .5s var(--spring); }
.bigplay svg { width: 36px; height: 36px; margin-left: 5px; }
.bigplay::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); animation: ringp 2.2s ease-out infinite; }
@keyframes ringp { from { opacity: .9; scale: .9; } to { opacity: 0; scale: 1.35; } }
.bigplay.off { opacity: 0; scale: .8; pointer-events: none; }

/* ---------- ce que dit l'appli, posé sur la photo ---------- */
.say { position: absolute; left: 50%; top: 16px; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 7px 18px 7px 7px; border-radius: 24px; max-width: calc(100% - 28px); width: max-content;
  background: rgba(16,18,28,.58); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 14px 30px -12px rgba(0,0,0,.5);
  translate: -50% -8px; opacity: 0; scale: .92; transition: opacity .35s ease, translate .5s var(--apple), scale .5s var(--spring); pointer-events: none; }
.say.on { opacity: 1; translate: -50% 0; scale: 1; }
.say p { margin: 0; font-size: 17px; font-weight: 700; text-wrap: balance; line-height: 1.25; }
.orb { position: relative; width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--rainbow); animation: spin 3s linear infinite; }
.orb::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: rgba(16,18,28,.75); }
.orb svg { position: relative; z-index: 1; width: 16px; height: 16px; }
.say.ok .orb { background: var(--g-ok); animation: none; }
.say.ok .orb::after { background: transparent; }
@keyframes spin { to { --spin: 360deg; } }

/* ---------- l'en-tête de la carte ---------- */
.hd { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 22px; background: rgba(255,255,255,.08); }
.hd img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: none; padding: 2px; background: linear-gradient(135deg, #3AA8FF, #8A5CFF); }
.hd b { display: block; font-size: 15px; font-weight: 700; }
.hd span { font-size: 13px; color: var(--text2); font-weight: 600; }
.dots { margin-left: auto; display: flex; gap: 5px; padding-right: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.22); transition: background .3s, scale .4s var(--spring); }
.dots i.ok { background: #4BE3B4; scale: 1.15; }

/* ---------- le texte ---------- */
.txt { position: relative; z-index: 2; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; font-size: 21px; line-height: 1.5; font-weight: 600; letter-spacing: -.005em; overflow-y: auto; scrollbar-width: none; }
.txt::-webkit-scrollbar { display: none; }
.ln { margin: 0; padding: 6px 12px 6px 36px; border-radius: 14px; opacity: .36; transition: opacity .45s ease, background .45s ease; position: relative; }
.ln.done { opacity: .9; }
.ln.cur { opacity: 1; background: rgba(255,255,255,.07); }
.ln.speak { opacity: 1; }
.ln .spk { position: absolute; left: 8px; top: 11px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s; color: var(--text2); }
.ln .spk svg { width: 15px; height: 15px; }
.ln.cur .spk, .ln.done .spk { opacity: 1; pointer-events: auto; }
.ln.done:not(.cur) .spk { opacity: .45; }
.w { transition: opacity .18s ease; }
.ln.speak .w, .ln.speak .gap { opacity: .42; }
.ln.speak .w.said, .ln.speak .gap.said { opacity: 1; }
.gap { display: inline-block; position: relative; vertical-align: -0.2em; height: 1.32em; margin: 0 1px; border-radius: 9px; background: rgba(255,255,255,.07); transition: width .45s var(--apple), background .3s ease, opacity .18s ease; }
.ln.cur .gap { background: rgba(255,255,255,.11); }
.gap .gw { position: absolute; inset: 0; display: grid; place-items: center; white-space: nowrap; opacity: 0; transition: opacity .2s ease; }
.gap.open { background: rgba(255,255,255,.2); }
.gap.open .gw { opacity: .62; }
.gap.filled { display: inline; height: auto; width: auto !important; vertical-align: baseline; background: transparent; margin: 0 .12em; padding: 0; }
.gap.filled .gw { position: static; display: inline-block; opacity: 1; font-weight: 800; color: #4BE3B4; animation: wordIn .7s var(--spring) both; }
@keyframes wordIn { from { filter: blur(6px); scale: .86; } to { filter: none; scale: 1; } }
@keyframes lineIn { from { transform: scaleX(0); } to { transform: none; } }
.gap.shake { animation: shake .5s ease; }
@keyframes shake { 20% { translate: -6px 0; } 40% { translate: 5px 0; } 60% { translate: -3px 0; } 80% { translate: 2px 0; } }
.ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

/* ---------- les mots à poser ---------- */
.tray { position: relative; z-index: 4; min-height: 58px; max-width: 100%; display: flex; flex-wrap: nowrap; align-items: center; justify-content: safe center; gap: 10px; padding: 4px 6px; overflow-x: auto; scrollbar-width: none; }
.tray::-webkit-scrollbar { display: none; }
.peb { flex: none; }
.peb { height: 48px; padding: 0 17px; border-radius: 24px; font-size: 17px; font-weight: 700; color: #fff; position: relative; touch-action: none; cursor: grab; white-space: nowrap;
  background: rgba(255,255,255,.17); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 10px 26px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.16);
  backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  transition: transform .5s var(--spring), opacity .3s ease, box-shadow .3s ease, background .25s; will-change: transform; }
.peb.in { animation: pebIn .6s var(--spring) both; }
@keyframes pebIn { from { opacity: 0; transform: translateY(18px) scale(.8); } }
.peb.lift { transition: none; cursor: grabbing; z-index: 60; background: rgba(255,255,255,.26); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 22px 40px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.3); }
.peb.fly { transition: transform .5s var(--apple), opacity .3s ease .25s; z-index: 60; }
.peb.hint::after { content: ""; position: absolute; inset: -5px; border-radius: 28px; border: 2px solid rgba(255,255,255,.75); animation: hint 1.6s ease-in-out infinite; pointer-events: none; }
@keyframes hint { 0%, 100% { opacity: 0; scale: .96; } 50% { opacity: 1; scale: 1.04; } }
body:not([data-turn="you"]) .peb { pointer-events: none; opacity: .55; }
.go { height: 50px; padding: 0 20px 0 22px; border-radius: 25px; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); font-weight: 700; font-size: 16px;
  box-shadow: 0 10px 26px -10px rgba(0,0,0,.5); animation: pebIn .6s var(--spring) both; }
.go svg { width: 18px; height: 18px; }

.finger { position: fixed; left: 0; top: 0; z-index: 80; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0 34%, rgba(255,255,255,.35) 36% 62%, rgba(255,255,255,0) 64%); box-shadow: 0 6px 18px rgba(0,0,0,.35); }

@media (max-width: 860px) and (orientation: portrait) {
  .stage { align-items: stretch; }
  .row { flex-direction: column; gap: 12px; width: 100%; height: auto; flex: 1; min-height: 0; align-items: center; }
  .stage { padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  .pic { width: 100%; max-width: 560px; min-height: 0; height: 28vh; flex: none; border-radius: 26px; }
  .spectre { bottom: 70px; height: 60px; }
  .pic img { object-position: 36% 35%; }
  .card { width: 100%; max-width: 560px; flex: 1; min-height: 0; max-height: none; border-radius: 26px; padding: 10px 10px 12px; gap: 8px; overflow: hidden; }
  .hd { padding: 4px; } .hd img { width: 34px; height: 34px; }
  .txt { flex: 1; min-height: 0; display: block; font-size: 16px; line-height: 1.42; }
  .ln { padding: 2px 8px 2px 30px; } .ln .spk { top: 3px; left: 6px; }
  .ln { padding: 2px 8px 2px 30px; }
  .ln .spk { top: 3px; }
  .tray { flex: none; gap: 6px; min-height: 0; justify-content: flex-start; }
  .stage { gap: 10px; justify-content: flex-start; }
  .peb { height: 38px; font-size: 15px; padding: 0 13px; }
  .say p { font-size: 15px; }
  .player { left: 10px; right: 10px; bottom: 10px; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- le mode clair (l'icône en haut à droite bascule ; le choix est gardé) ---------- */
.theme { position: fixed; z-index: 30; top: calc(8px + env(safe-area-inset-top, 0px)); right: 8px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.12); color: #fff; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); transition: background .3s, color .3s, scale .3s var(--spring); }
.theme:active { scale: .9; }
.theme svg { width: 20px; height: 20px; }
.theme .lune { display: none; }
body.clair .theme .soleil { display: none; } body.clair .theme .lune { display: block; }
body.clair { --text: #1b1d2a; --text2: rgba(27,29,42,.62); --glass: rgba(255,255,255,.62); background: #eef0f7; color: var(--text); color-scheme: light; }
body.clair .theme { background: rgba(27,29,42,.07); color: #1b1d2a; box-shadow: none; }
body.clair .env { background: radial-gradient(55% 50% at 30% 45%, rgba(138,92,255,.14), transparent 70%), radial-gradient(45% 45% at 80% 60%, rgba(29,214,160,.1), transparent 72%), #eef0f7; }
body.clair .glass { box-shadow: inset 0 1px 0 #fff, 0 18px 40px -18px rgba(40,40,90,.28); }
body.clair .glass::before { background: linear-gradient(140deg, #fff, rgba(255,255,255,.4) 40%, rgba(27,29,42,.06) 70%, rgba(255,255,255,.8)); }
body.clair .hd { background: rgba(27,29,42,.05); }
body.clair .ln.cur { background: rgba(27,29,42,.06); }
body.clair .gap { background: rgba(27,29,42,.07); }
body.clair .ln.cur .gap { background: rgba(27,29,42,.1); }
body.clair .gap.open { background: rgba(27,29,42,.14); }
body.clair .gap.filled, body.clair .ln.cur .gap.filled { background: transparent; }
body.clair .player { color: #fff; } body.clair .player .time { color: rgba(255,255,255,.75); }
body.clair .gap.filled .gw { color: #0b8f63; }
body.clair .dots i { background: rgba(27,29,42,.15); }
body.clair .dots i.ok { background: #12b981; }
body.clair .card .ico, body.clair .nav .ico { background: rgba(27,29,42,.07); color: #1b1d2a; }
body.clair .hd .ico.joue { background: #1b1d2a; color: #fff; }
body.clair .peb { color: #1b1d2a; background: rgba(255,255,255,.8); box-shadow: inset 0 1px 0 #fff, 0 10px 24px -12px rgba(40,40,90,.35), 0 0 0 1px rgba(27,29,42,.08); }
body.clair .peb.lift { background: #fff; }
body.clair .peb.hint::after { border-color: rgba(27,29,42,.55); }
body.clair .go { background: #1b1d2a; color: #fff; }
body.clair .fond { opacity: .38; filter: blur(42px) saturate(1.2) brightness(1.25); }
body.clair .fond::after { background: radial-gradient(60% 60% at 50% 50%, rgba(238,240,247,0), rgba(238,240,247,.85)); }
body.clair .pile { background: radial-gradient(70% 55% at 50% 42%, rgba(138,92,255,.16), transparent 70%), linear-gradient(160deg, #ffffff, #e8eaf5); box-shadow: 0 30px 70px -36px rgba(40,40,90,.4), 0 0 0 1px rgba(27,29,42,.06); }
body.clair .nav .compte, body.clair .aide { color: var(--text2); }
body.clair .wc { box-shadow: 0 26px 44px -22px rgba(40,40,90,.45), 0 0 0 1px rgba(27,29,42,.06); }
</style>
</head>
<body data-turn="boot">
<div class="env" aria-hidden="true"></div>
<div class="fond" aria-hidden="true"></div>

<main class="stage"><div class="row">
  <div class="pic">
    <img src="micro.jpg" alt="Un micro rétro sous les lumières">
    <canvas class="spectre" id="spectre" aria-hidden="true"></canvas>
    <div class="say" id="say" aria-live="polite"><span class="orb" id="orb"></span><p id="sayText"></p></div>
    <button class="bigplay" id="bigplay" aria-label="Écouter le journal"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.87l12.5-7.5a1 1 0 0 0 0-1.74L8.5 3.63A1 1 0 0 0 7 4.5z"/></svg></button>
    <div class="player" id="player">
      <button class="ico play" id="pp" aria-label="Lecture"></button>
      <span class="time" id="cur">0:00</span>
      <div class="track" id="track" role="slider" aria-label="Position dans l'enregistrement" tabindex="0"><div class="rail"><div class="fill" id="fill"></div></div><div class="seg" id="seg"></div><div class="knob" id="knob"></div></div>
      <span class="time" id="dur">0:30</span>
      <button class="ico" id="slow" aria-pressed="false" aria-label="Plus lentement"></button>
    </div>
  </div>

  <section class="card glass" id="card" aria-label="Le texte à compléter">
    <div class="hd"><img src="micro.jpg" alt="" style="object-position:36% 40%"><div><b>Le journal</b><span>Écoute et complète</span></div><div class="dots" id="dots"></div></div>
    <div class="txt" id="txt"></div>
    <canvas class="ink" id="ink"></canvas>
  </section>
</div>
<div class="tray" id="tray"></div></main>
<div class="finger" id="finger" aria-hidden="true"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ===== le texte : une phrase par ligne, [mots] = le trou ; s / e = la phrase dans l'enregistrement, w = début de chaque mot affiché ===== */
  const LINES = [

    };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
    b.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state.turn === 'you') { e.preventDefault(); unlock(); flyTo(b); } });
  }
  function moveOnto(b) {
    const [gx, gy] = gapCenter(gaps[state.step]), br = b.getBoundingClientRect(), cur = new DOMMatrix(getComputedStyle(b).transform);
    b.classList.add('fly'); b.style.transform = `translate(${gx - (br.left + br.width / 2) + cur.m41}px, ${gy - (br.top + br.height / 2) + cur.m42}px) scale(.62)`; b.style.opacity = '0';
  }
  async function flyTo(b) { setTurn('wait'); setHover(b.dataset.w); moveOnto(b); await wait(reduced ? 50 : 620); commit(b); }
  function dropOn(b) { setTurn('wait'); moveOnto(b); setTimeout(() => commit(b), reduced ? 30 : 260); }
  async function commit(b) {
    const f = flow, i = state.step, L = LINES[i], w = b.dataset.w, g = gaps[i];
    if (w === L.ans) {
      sfx.ok(); burst(g); b.remove();
      g.classList.remove('open'); g.classList.add('filled'); $('.gw', g).textContent = w; g.style.width = (textW(w) + 2) + 'px';
      lineEls[i].classList.add('done'); $$('#dots i')[i].classList.add('ok'); montrerSegment(null);
      await wait(reduced ? 100 : 1000); if (!alive(f)) return;
      i + 1 < LINES.length ? goTask(i + 1) : finale();
    } else {
      sfx.try(); state.tries++;
      g.classList.remove('open', 'shake'); void g.offsetWidth; g.classList.add('shake'); $('.gw', g).textContent = '';
      b.classList.remove('fly'); b.style.opacity = ''; b.style.transform = '';
      await wait(reduced ? 100 : 800); if (!alive(f)) return;
      g.classList.remove('shake');
      await play(L.s, L.e + .15); if (!alive(f)) return;
      if (state.tries >= 2) $$('.peb', tray).forEach(p => p.classList.toggle('hint', p.dataset.w === L.ans));
      setTurn('you'); idle.reset();
    }
  }
  async function finale() {
    const f = ++flow; setTurn('listen'); setLine(-1); tray.innerHTML = '';
    lineEls.forEach(p => p.classList.add('done'));
    await wait(reduced ? 100 : 900); if (!alive(f)) return;
    await play(0); if (!alive(f)) return;
    sayShow('Bravo ! Tu as complété le journal.', 'ok'); sfx.ok();
    const again = document.createElement('button'); again.className = 'go'; again.innerHTML = `<span>Recommencer</span>${ICON.again}`;
    again.addEventListener('click', restart); tray.append(again);
    setTurn('end');
  }
  function restart() { ++flow; stopAll(); sayHide(); tray.innerHTML = ''; buildText(); montrerSegment(null); son.currentTime = 0; setTimeout(start, 500); }

  /* ===== le doigt fantôme : montre le geste après quelques secondes ===== */
  const finger = $('#finger');
  const idle = (() => {
    let tm = null, anim = null;
    const stop = () => { clearTimeout(tm); tm = null; if (anim) { anim.cancel(); anim = null; } finger.style.opacity = 0; };
    const show = () => {
      if (state.turn !== 'you') return;
      const p = $('.peb', tray), g = gaps[state.step]; if (!p || !g) return;
      const pr = p.getBoundingClientRect(), [gx, gy] = gapCenter(g), px = pr.left + pr.width / 2, py = pr.top + pr.height / 2;
      anim = finger.animate([
        { transform: `translate(${px}px, ${py + 30}px) scale(1)`, opacity: 0 }, { transform: `translate(${px}px, ${py}px) scale(1)`, opacity: .9, offset: .15 },
        { transform: `translate(${px}px, ${py}px) scale(.8)`, opacity: .9, offset: .25 }, { transform: `translate(${gx}px, ${gy}px) scale(.8)`, opacity: .9, offset: .7 },
        { transform: `translate(${gx}px, ${gy}px) scale(1)`, opacity: .9, offset: .8 }, { transform: `translate(${gx}px, ${gy - 10}px) scale(1)`, opacity: 0 },
      ], { duration: 2200, easing: 'cubic-bezier(.45,0,.25,1)' });
      anim.onfinish = () => { anim = null; tm = setTimeout(show, 6000); };
    };
    return { stop, reset() { stop(); if (state.turn === 'you') tm = setTimeout(show, 6000); } };
  })();

  buildText(); setTurn('boot'); setLine(-1);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeGaps);
  addEventListener('resize', sizeGaps);
  window.__journal = { state, LINES, son };
})();
</script>

(() => { const b = document.body, k = 'exercices-theme';
  try { if (localStorage.getItem(k) === 'clair') b.classList.add('clair'); } catch (e) {}
  document.getElementById('theme').addEventListener('click', () => { b.classList.toggle('clair'); try { localStorage.setItem(k, b.classList.contains('clair') ? 'clair' : 'nuit'); } catch (e) {} });
