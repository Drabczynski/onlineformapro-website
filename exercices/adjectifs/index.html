<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Les adjectifs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* « Les adjectifs », dans l'interface de « La chambre de Kenji » : à gauche une pile de cartes (on la fait défiler
   d'un glissement, on touche la bonne carte), à droite les phrases à compléter. Seule la consigne est lue. */
:root {
  --text: #FFFFFF; --text2: rgba(255,255,255,.72); --ink: #0B0D16; --env: #10121A; --glass: rgba(255,255,255,.13);
  --g-ok: linear-gradient(135deg, #1DD6A0 0%, #2BC4F0 100%);
  --rainbow: conic-gradient(from var(--spin), #FF4D8A, #FF8A3D, #FFD24A, #1DD6A0, #3AA8FF, #8A5CFF, #FF4D8A);
  --font: "Figtree", system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --apple: cubic-bezier(.32,.72,0,1); --spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--env); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
svg { display: block; }
.env { position: fixed; inset: 0; z-index: 0; background: radial-gradient(55% 50% at 30% 45%, rgba(138,92,255,.2), transparent 70%), radial-gradient(45% 45% at 80% 60%, rgba(29,214,160,.1), transparent 72%), #0e1018; }

.glass { position: relative; background: var(--glass); isolation: isolate; backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 32px -12px rgba(0,0,0,.45); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(140deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 38%, rgba(255,255,255,.04) 62%, rgba(255,255,255,.25));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

.stage { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 28px 28px 34px; }
.row { display: flex; align-items: stretch; gap: 28px; height: min(800px, calc(100vh - 62px)); }

/* ---------- l'encart de gauche : la pile de cartes ---------- */
.pile { position: relative; flex: none; width: min(44vw, 640px); min-height: 520px; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: radial-gradient(70% 55% at 50% 42%, rgba(138,92,255,.28), transparent 70%), linear-gradient(160deg, #1d1f33, #121424); box-shadow: 0 40px 90px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.12); }
.deck { position: relative; width: min(300px, 58%); aspect-ratio: 3 / 4; }
.wc { position: absolute; inset: 0; border-radius: 28px; background: #fff; color: var(--ink); display: grid; place-items: center; touch-action: none; cursor: grab;
  box-shadow: 0 30px 50px -22px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.04); transition: transform .55s var(--spring), opacity .35s ease, box-shadow .3s; will-change: transform; overflow: hidden; }
.wc::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: var(--c); }
.wc .coin { position: absolute; left: 18px; top: 26px; font-weight: 900; font-size: 15px; color: var(--c); letter-spacing: .02em; }
.wc .mot { font-weight: 900; font-size: clamp(30px, 3.2vw, 42px); letter-spacing: -.02em; }
.wc .bas { position: absolute; right: 18px; bottom: 18px; width: 30px; height: 30px; border-radius: 50%; background: var(--c); opacity: .18; }
.wc.lift { transition: none; cursor: grabbing; }
.wc.choisi { box-shadow: 0 0 0 4px #fff, 0 0 40px rgba(255,255,255,.5); }
.wc.non { animation: non .5s ease; }
@keyframes non { 20% { translate: -14px 0; } 40% { translate: 12px 0; } 60% { translate: -7px 0; } 80% { translate: 4px 0; } }
.wc.part { transition: transform .6s var(--apple), opacity .35s ease .3s; opacity: 0; pointer-events: none; }
.wc.indice::after { content: ""; position: absolute; inset: 6px; border-radius: 22px; border: 3px solid var(--c); animation: hint 1.4s ease-in-out infinite; pointer-events: none; }
@keyframes hint { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
body:not([data-turn="you"]) .wc { pointer-events: none; }
.nav { display: flex; align-items: center; gap: 14px; transition: opacity .3s; }
body:not([data-turn="you"]) .nav { opacity: .35; pointer-events: none; }
.ico { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); flex: none; transition: background .2s, scale .3s var(--spring); }
.ico:active { scale: .92; }
.ico svg { width: 20px; height: 20px; }
.nav .compte { min-width: 54px; text-align: center; font-weight: 800; font-size: 14px; color: var(--text2); font-variant-numeric: tabular-nums; }
.say.on ~ .aide { opacity: 0; }
.aide { transition: opacity .3s; position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--text2); display: flex; justify-content: center; gap: 8px; align-items: center; }
.aide svg { width: 18px; height: 18px; opacity: .8; }

.bigplay { position: absolute; left: 50%; top: 50%; z-index: 6; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(16,18,28,.55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 20px 40px -14px rgba(0,0,0,.6); transition: opacity .4s, scale .5s var(--spring); }
.bigplay svg { width: 36px; height: 36px; margin-left: 5px; }
.bigplay::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); animation: ringp 2.2s ease-out infinite; }
@keyframes ringp { from { opacity: .9; scale: .9; } to { opacity: 0; scale: 1.35; } }
.bigplay.off { opacity: 0; scale: .8; pointer-events: none; }
body[data-turn="boot"] .deck, body[data-turn="boot"] .nav, body[data-turn="boot"] .aide { opacity: .25; filter: blur(2px); }

.say { position: absolute; left: 50%; bottom: 14px; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 7px 18px 7px 7px; border-radius: 24px; max-width: calc(100% - 28px); width: max-content;
  background: rgba(16,18,28,.62); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 14px 30px -12px rgba(0,0,0,.5);
  translate: -50% 8px; opacity: 0; scale: .92; transition: opacity .35s ease, translate .5s var(--apple), scale .5s var(--spring); pointer-events: none; }
.say.on { opacity: 1; translate: -50% 0; scale: 1; }
.say p { margin: 0; font-size: 16px; font-weight: 700; text-wrap: balance; line-height: 1.25; }
.say .sw { transition: opacity .2s; } .say .sw.hid { opacity: .3; }
.orb { position: relative; width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--rainbow); animation: spin 3s linear infinite; }
.orb::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: rgba(16,18,28,.75); }
.orb svg { position: relative; z-index: 1; width: 16px; height: 16px; }
.say.ok .orb { background: var(--g-ok); animation: none; } .say.ok .orb::after { background: transparent; }
@keyframes spin { to { --spin: 360deg; } }
.bars { position: relative; z-index: 1; display: flex; gap: 2px; align-items: center; height: 14px; }
.bars b { width: 3px; border-radius: 2px; background: #fff; animation: bar .9s ease-in-out infinite; }
.bars b:nth-child(2) { animation-delay: .15s; } .bars b:nth-child(3) { animation-delay: .3s; } .bars b:nth-child(4) { animation-delay: .45s; }
@keyframes bar { 0%, 100% { height: 4px; } 50% { height: 13px; } }

/* ---------- la carte du texte ---------- */
.card { flex: none; width: min(700px, 48vw); max-height: calc(100vh - 62px); border-radius: 30px; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.hd { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 22px; background: rgba(255,255,255,.08); }
.hd .av { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 900; font-size: 15px; color: var(--ink); background: linear-gradient(135deg, #FFD24A, #FF8A3D); }
.hd b { display: block; font-size: 15px; font-weight: 700; }
.hd span { font-size: 13px; color: var(--text2); font-weight: 600; }
.hd .ico { width: 38px; height: 38px; margin-left: auto; }
.hd .ico svg { width: 18px; height: 18px; }
.hd .ico.joue { background: #fff; color: var(--ink); }
.dots { display: flex; gap: 5px; padding: 0 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.22); transition: background .3s, scale .4s var(--spring); }
.dots i.ok { background: #4BE3B4; scale: 1.15; }
.txt { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; font-size: 25px; line-height: 1.5; font-weight: 600; }
.ln { margin: 0; padding: 10px 16px; border-radius: 16px; opacity: .36; transition: opacity .45s ease, background .45s ease; }
.ln.done { opacity: .9; }
.ln.cur { opacity: 1; background: rgba(255,255,255,.08); }
.gap { display: inline-block; position: relative; vertical-align: -0.22em; height: 1.36em; min-width: 5.2em; margin: 0 2px; border-radius: 10px; background: rgba(255,255,255,.08); transition: background .3s ease, min-width .45s var(--apple); }
.ln.cur .gap { background: rgba(255,255,255,.14); }
.gap .gw { position: absolute; inset: 0; display: grid; place-items: center; white-space: nowrap; opacity: 0; }
.gap.filled { background: transparent; min-width: 0; padding: 0 2px; }
.gap.filled .gw { position: static; display: inline; opacity: 1; font-weight: 800; color: #4BE3B4; animation: wordIn .7s var(--spring) both; }
@keyframes wordIn { from { filter: blur(6px); scale: .86; } to { filter: none; scale: 1; } }
@keyframes lineIn { from { transform: scaleX(0); } to { transform: none; } }
.gap.shake { animation: shake .5s ease; }
@keyframes shake { 20% { translate: -6px 0; } 40% { translate: 5px 0; } 60% { translate: -3px 0; } 80% { translate: 2px 0; } }
.ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.pied { position: relative; z-index: 4; min-height: 50px; display: flex; justify-content: center; }
.go { height: 50px; padding: 0 20px 0 22px; border-radius: 25px; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); font-weight: 700; font-size: 16px; box-shadow: 0 10px 26px -10px rgba(0,0,0,.5); animation: pebIn .6s var(--spring) both; }
.go svg { width: 18px; height: 18px; }
@keyframes pebIn { from { opacity: 0; transform: translateY(18px) scale(.8); } }

@media (max-width: 860px) and (orientation: portrait) {
  .stage { align-items: stretch; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  .row { flex-direction: column-reverse; gap: 12px; width: 100%; height: auto; align-items: center; }
  .pile { width: 100%; max-width: 560px; min-height: 0; height: 40vh; flex: none; border-radius: 26px; gap: 10px; }
  .deck { width: auto; height: 62%; }
  .aide { display: none; }
  .card { width: 100%; max-width: 560px; flex: 1; min-height: 0; max-height: none; border-radius: 26px; padding: 10px 10px 12px; gap: 8px; }
  .txt { font-size: 17px; gap: 4px; }
  .ln { padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body data-turn="boot">
<div class="env" aria-hidden="true"></div>
<main class="stage"><div class="row">
  <div class="pile" id="pile">
    <div class="say" id="say" aria-live="polite"><span class="orb" id="orb"></span><p id="sayText"></p></div>
    <div class="deck" id="deck" aria-label="La pile de cartes"></div>
    <div class="nav">
      <button class="ico" id="avant" aria-label="Carte précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="compte" id="compte"></span>
      <button class="ico" id="apres" aria-label="Carte suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="aide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.8-2.4L4.5 15a1.5 1.5 0 0 1 2.3-1.9L9 15"/></svg>Glisse pour voir les cartes · touche la bonne</div>
    <button class="bigplay" id="bigplay" aria-label="Écouter la consigne et commencer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.87l12.5-7.5a1 1 0 0 0 0-1.74L8.5 3.63A1 1 0 0 0 7 4.5z"/></svg></button>
  </div>

  <section class="card glass" id="card" aria-label="Les phrases à compléter">
    <div class="hd"><span class="av">Aa</span><div><b>Les adjectifs</b><span>Complète les phrases</span></div><div class="dots" id="dots"></div>
      <button class="ico" id="hp" aria-label="Réécouter la consigne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke-width="1.4"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button></div>
    <div class="txt" id="txt"></div>
    <div class="pied" id="pied"></div>
    <canvas class="ink" id="ink"></canvas>
  </section>
</div></main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ===== les phrases ([mot] = le trou) et les cartes ===== */
  const LINES = [
    'Kylian Mbappé est un buteur [français].',
    "Il joue pour l'équipe nationale [française].",
    "C'est un très [bon] joueur de foot.",
    "Il espère gagner le Ballon d'Or : c'est une [bonne] année pour lui.",
  ].map(t => ({ t, ans: t.match(/\[(.+?)\]/)[1] }));
  const CARTES = [ { m: 'française', c: '#FF4D8A' }, { m: 'bon', c: '#3AA8FF' }, { m: 'français', c: '#1DD6A0' }, { m: 'bonne', c: '#FFB531' } ];
  const CONSIGNE = { src: 'consigne.mp3', text: 'Complète les phrases. Fais glisser les cartes pour les voir, puis touche la bonne carte pour chaque phrase.',
                     w: [0.1, 0.52, 0.68, 1.68, 1.84, 2.18, 2.32, 2.7, 2.84, 3.0, 3.68, 4.1, 4.36, 4.5, 4.74, 5.18, 5.36, 5.6] };

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="#0B0D16" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    bars: '<span class="bars"><b></b><b></b><b></b><b></b></span>',
    again: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/></svg>',
  };

  /* ===== le texte ===== */
  const txt = $('#txt'), card = $('#card');
  let lineEls = [], gaps = [];
  function buildText() {
    txt.innerHTML = ''; lineEls = []; gaps = [];
    LINES.forEach((L, i) => {
      const p = document.createElement('p'); p.className = 'ln';
      p.innerHTML = L.t.replace(/\[(.+?)\]/, '<span class="gap" aria-label="mot à trouver"><span class="gw"></span></span>');
      txt.append(p); lineEls.push(p); gaps.push($('.gap', p));
    });
    $('#dots').innerHTML = LINES.map(() => '<i></i>').join('');
  }
  const setLine = i => lineEls.forEach((p, k) => p.classList.toggle('cur', k === i));

  /* ===== l'encre invisible des trous ===== */
  const ink = $('#ink'), ictx = ink.getContext('2d'), inkParts = new Map(), bursts = [];
  function partsFor(g, w, h) {
    let P = inkParts.get(g); const n = Math.round(w * h / 13);
    if (!P || Math.abs(P.length - n) > 40) { P = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .35, r: .7 + Math.random() * .9, ph: Math.random() * 6.28, sp: 1.5 + Math.random() * 3 })); inkParts.set(g, P); }
    return P;
  }
  function burst(g) {
    const cr = card.getBoundingClientRect(), r = g.getBoundingClientRect();
    (inkParts.get(g) || []).forEach(p => {
      const x = r.left - cr.left + p.x * r.width, y = r.top - cr.top + p.y * r.height;
      const a = Math.atan2(y - (r.top - cr.top + r.height / 2), x - (r.left - cr.left + r.width / 2)) + (Math.random() - .5) * .8, v = 40 + Math.random() * 120;
      bursts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, r: p.r, life: 1 });
    });
    inkParts.delete(g);
  }
  let lastT = performance.now();
  (function inkFrame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
    const cr = card.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1), W = Math.round(cr.width * dpr), H = Math.round(cr.height * dpr);
    if (ink.width !== W || ink.height !== H) { ink.width = W; ink.height = H; }
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0); ictx.clearRect(0, 0, cr.width, cr.height);
    const t = now / 1000;
    gaps.forEach(g => {
      if (g.classList.contains('filled')) return;
      const r = g.getBoundingClientRect(); if (!r.width) return;
      const x0 = r.left - cr.left + 3, y0 = r.top - cr.top + 3, w = r.width - 6, h = r.height - 6, P = partsFor(g, w, h);
      const k = g.closest('.ln').classList.contains('cur') ? 1 : .5;
      ictx.fillStyle = '#fff';
      for (const p of P) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < 0 || p.x > 1) { p.vx *= -1; p.x = Math.max(0, Math.min(1, p.x)); }
        if (p.y < 0 || p.y > 1) { p.vy *= -1; p.y = Math.max(0, Math.min(1, p.y)); }
        ictx.globalAlpha = Math.min(1, k * (.35 + .55 * (.5 + .5 * Math.sin(t * p.sp + p.ph))));
        ictx.beginPath(); ictx.arc(x0 + p.x * w, y0 + p.y * h, p.r, 0, 6.283); ictx.fill();
      }
    });
    for (let j = bursts.length - 1; j >= 0; j--) {
      const b = bursts[j]; b.life -= dt * 1.6; if (b.life <= 0) { bursts.splice(j, 1); continue; }
      b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= .96; b.vy = b.vy * .96 + 30 * dt;
      ictx.globalAlpha = b.life; ictx.fillStyle = b.life > .6 ? '#fff' : '#9ff0d6';
      ictx.beginPath(); ictx.arc(b.x, b.y, b.r * (1 + (1 - b.life)), 0, 6.283); ictx.fill();
    }
    ictx.globalAlpha = 1;
    requestAnimationFrame(inkFrame);
  })(performance.now());

  /* ===== la consigne : la seule voix de l'exercice ===== */
  const voix = new Audio(CONSIGNE.src); voix.preload = 'auto';
  const sayEl = $('#say'), sayText = $('#sayText'), orb = $('#orb');
  function sayShow(text, mode) { sayEl.classList.toggle('ok', mode === 'ok'); orb.innerHTML = mode === 'ok' ? ICON.check : ICON.bars; sayText.innerHTML = text.split(' ').map(w => `<span class="sw${mode === 'ok' ? '' : ' hid'}">${w}</span>`).join(' '); sayEl.classList.add('on'); }
  const sayHide = () => sayEl.classList.remove('on');
  function consigne() {
    audioCtx(); voix.pause(); voix.currentTime = 0; sayShow(CONSIGNE.text); $('#hp').classList.add('joue');
    const ws = $$('.sw', sayText);
    return new Promise(res => {
      let fini = false; const fin = () => { if (fini) return; fini = true; ws.forEach(w => w.classList.remove('hid')); $('#hp').classList.remove('joue'); setTimeout(sayHide, 900); res(); };
      const p = voix.play(); if (p && p.catch) p.catch(fin);
      const loop = () => { if (fini) return; ws.forEach((w, k) => w.classList.toggle('hid', voix.currentTime < (CONSIGNE.w[k] ?? 99) - .03)); if (voix.ended || (voix.paused && voix.currentTime > 0)) return fin(); requestAnimationFrame(loop); };
      requestAnimationFrame(loop); setTimeout(fin, 9000);
    });
  }
  $('#hp').addEventListener('click', () => { if (state.turn !== 'boot') consigne(); });

  /* ===== petits sons ===== */
  let ctx = null;
  function audioCtx() { try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {} return ctx; }
  function tone(f, t0, dur, gain, type = 'sine') {
    const c = audioCtx(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, c.currentTime + t0); g.gain.linearRampToValueAtTime(gain, c.currentTime + t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .02);
  }
  const sfx = { tick() { tone(2300, 0, .02, .02, 'triangle'); }, swipe() { tone(900, 0, .08, .025, 'triangle'); tone(1300, .04, .08, .02, 'triangle'); },
                ok() { tone(784, 0, .22, .06); tone(1175, .09, .38, .05); tone(1568, .18, .4, .03); }, try() { tone(392, 0, .18, .045, 'triangle'); tone(330, .1, .22, .035, 'triangle'); } };

  /* ===== la pile de cartes ===== */
  const deckEl = $('#deck');
  let pile = [];   // la première est sur le dessus
  function buildDeck() {
    deckEl.innerHTML = '';
    pile = CARTES.map(c => { const el = document.createElement('div'); el.className = 'wc'; el.style.setProperty('--c', c.c); el.dataset.m = c.m; el.setAttribute('role', 'button'); el.setAttribute('aria-label', c.m);
      el.innerHTML = `<span class="coin">Aa</span><span class="mot">${c.m}</span><span class="bas"></span>`; bind(el); deckEl.append(el); return el; });
    layout(true);
  }
  // l'éventail : chaque carte un peu plus bas, plus petite et tournée, la première devant
  function layout(entree) {
    pile.forEach((el, i) => {
      const rot = i === 0 ? 0 : (i % 2 ? -1 : 1) * (3 + i * 1.5), y = i * 14, s = 1 - i * .055;
      el.style.zIndex = 50 - i;
      el.style.transform = `translate(0px, ${y}px) rotate(${rot}deg) scale(${s})`;
      el.style.opacity = i > 3 ? 0 : 1;
      if (entree && !reduced) { el.animate([{ transform: `translate(0, 220px) rotate(${rot * 3}deg) scale(.8)`, opacity: 0 }, { transform: el.style.transform, opacity: 1 }], { duration: 650, delay: (pile.length - i) * 70, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' }); }
    });
    $('#compte').textContent = pile.length ? `1 / ${pile.length}` : '';
  }
  function tourner(sens) {   // sens 1 : la carte du dessus part derrière ; -1 : celle du dessous revient devant
    if (pile.length < 2) return;
    sfx.swipe();
    if (sens > 0) { const top = pile.shift(); pile.push(top); top.style.transform = `translate(${-260}px, 0) rotate(-18deg)`; setTimeout(layout, reduced ? 0 : 160); }
    else { pile.unshift(pile.pop()); layout(); }
    $$('.wc.indice').forEach(c => { if (c !== pile[0]) c.classList.remove('indice'); });
  }
  $('#avant').addEventListener('click', () => tourner(-1));
  $('#apres').addEventListener('click', () => tourner(1));
  addEventListener('keydown', e => { if (state.turn !== 'you') return; if (e.key === 'ArrowRight') tourner(1); if (e.key === 'ArrowLeft') tourner(-1); if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choisir(pile[0]); } });
  // le dessus se glisse : assez loin, il passe derrière ; un simple toucher le choisit
  function bind(el) {
    let x0 = 0, y0 = 0, tire = false, bouge = false;
    el.addEventListener('pointerdown', e => {
      if (state.turn !== 'you') return; audioCtx();
      if (el !== pile[0]) { // toucher une carte de derrière : elle vient devant
        while (pile[0] !== el) pile.push(pile.shift()); layout(); sfx.swipe(); return;
      }
      tire = true; bouge = false; x0 = e.clientX; y0 = e.clientY; el.setPointerCapture(e.pointerId); el.classList.add('lift');
    });
    el.addEventListener('pointermove', e => {
      if (!tire) return; const dx = e.clientX - x0, dy = e.clientY - y0; if (Math.hypot(dx, dy) > 8) bouge = true;
      el.style.transform = `translate(${dx}px, ${dy * .3}px) rotate(${dx / 14}deg)`;
    });
    const lache = e => {
      if (!tire) return; tire = false; el.classList.remove('lift');
      const dx = e.clientX - x0;
      if (!bouge) return choisir(el);
      if (Math.abs(dx) > 70) { sfx.swipe(); pile.shift(); pile.push(el); el.style.transform = `translate(${Math.sign(dx) * 320}px, 0) rotate(${Math.sign(dx) * 20}deg)`; setTimeout(layout, reduced ? 0 : 180); }
      else layout();
    };
    el.addEventListener('pointerup', lache); el.addEventListener('pointercancel', lache);
  }

  /* ===== le déroulé ===== */
  const state = { turn: 'boot', step: 0, tries: 0 };
  let flow = 0; const alive = f => f === flow;
  function setTurn(t) { state.turn = t; document.body.dataset.turn = t; }
  async function start() {
    const f = ++flow; audioCtx(); $('#bigplay').classList.add('off');
    setTurn('wait'); setLine(0);
    await consigne(); if (!alive(f)) return;
    goTask(0);
  }
  function goTask(n) { state.step = n; state.tries = 0; setLine(n); setTurn('you'); }
  async function choisir(el) {
    if (state.turn !== 'you' || !el) return;
    const f = flow, i = state.step, L = LINES[i], g = gaps[i];
    setTurn('wait');
    if (el.dataset.m === L.ans) {
      // la carte vole jusqu'au trou et s'y fond
      sfx.ok(); el.classList.add('choisi');
      const gr = g.getBoundingClientRect(), er = el.getBoundingClientRect();
      const dx = gr.left + gr.width / 2 - (er.left + er.width / 2), dy = gr.top + gr.height / 2 - (er.top + er.height / 2);
      await wait(reduced ? 0 : 180);
      el.classList.add('part'); el.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(.22)`;
      await wait(reduced ? 50 : 520); if (!alive(f)) return;
      burst(g); g.classList.add('filled'); $('.gw', g).textContent = L.ans;
      lineEls[i].classList.add('done'); $$('#dots i')[i].classList.add('ok');
      pile = pile.filter(c => c !== el); setTimeout(() => el.remove(), 600); layout();
      await wait(reduced ? 100 : 700); if (!alive(f)) return;
      i + 1 < LINES.length ? goTask(i + 1) : finale();
    } else {
      sfx.try(); state.tries++;
      el.classList.remove('non'); void el.offsetWidth; el.classList.add('non');
      g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
      await wait(reduced ? 50 : 550); if (!alive(f)) return;
      el.classList.remove('non'); g.classList.remove('shake');
      if (state.tries >= 2) { const bonne = pile.find(c => c.dataset.m === L.ans); if (bonne) { while (pile[0] !== bonne) pile.push(pile.shift()); layout(); bonne.classList.add('indice'); } }
      else tourner(1);
      setTurn('you');
    }
  }
  async function finale() {
    const f = ++flow; setTurn('end'); setLine(-1);
    sayShow('Bravo ! Tu as complété toutes les phrases.', 'ok'); sfx.ok();
    await wait(600); if (!alive(f)) return;
    const again = document.createElement('button'); again.className = 'go'; again.innerHTML = `<span>Recommencer</span>${ICON.again}`;
    again.addEventListener('click', restart); $('#pied').append(again);
  }
  function restart() { ++flow; sayHide(); $('#pied').innerHTML = ''; buildText(); buildDeck(); goTask(0); }
  $('#bigplay').addEventListener('click', start);

  buildText(); buildDeck(); setTurn('boot'); setLine(-1);
  window.__adj = { state, LINES, pile: () => pile.map(c => c.dataset.m) };
})();
</script>
</body>
</html>
