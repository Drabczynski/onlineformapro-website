<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>À la boulangerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* « À la boulangerie » : une situation, cinq exercices (QCM, texte à trous, vrai / faux, association, et le jeu de cartes du
   vocabulaire, vocabulaire.html, ouvert dans un cadre plein écran), dans l'interface
   du journal. En haut, une « île » pour passer d'un exercice à l'autre. Le vrai / faux défile comme des paroles de chanson :
   la phrase lue au centre, nette, qui se remplit mot à mot ; les autres au-dessus et en dessous, pâles et floues. */
:root {
  --text: #FFFFFF; --text2: rgba(255,255,255,.72); --text3: rgba(255,255,255,.48);
  --ink: #0B0D16; --env: #10121A; --glass: rgba(255,255,255,.13);
  --on: #fff; --off: rgba(255,255,255,.34);
  --tile: rgba(255,255,255,.1); --tile2: rgba(255,255,255,.17); --edge: rgba(255,255,255,.12);
  --ok: #4BE3B4; --bad: #ff7a8f;
  --g-ok: linear-gradient(135deg, #1DD6A0 0%, #2BC4F0 100%);
  --rainbow: conic-gradient(from var(--spin), #FF4D8A, #FF8A3D, #FFD24A, #1DD6A0, #3AA8FF, #8A5CFF, #FF4D8A);
  --font: "Figtree", system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --apple: cubic-bezier(.32,.72,0,1); --spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--env); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
svg { display: block; }

.fond { position: fixed; inset: -80px; z-index: 0; background: url(../../fiches/illustrations/A1/1.jpg) 50% 50% / cover no-repeat; filter: blur(46px) saturate(1.3); opacity: .45; pointer-events: none; }
.fond::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 50%, rgba(8,10,20,0), rgba(8,10,20,.78)); }
.env { position: fixed; inset: 0; z-index: 0; background: radial-gradient(55% 50% at 30% 45%, rgba(255,170,90,.16), transparent 70%), radial-gradient(45% 45% at 80% 60%, rgba(110,140,255,.12), transparent 72%), #0e1018; }

.glass { position: relative; background: var(--glass); isolation: isolate; backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 32px -12px rgba(0,0,0,.45); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(140deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 38%, rgba(255,255,255,.04) 62%, rgba(255,255,255,.25));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

.stage { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 66px 28px 24px; }
.row { display: flex; align-items: stretch; gap: 28px; height: min(720px, calc(100vh - 176px)); }
.pic { position: relative; flex: none; width: min(40vw, 560px); min-height: 400px; border-radius: 32px; overflow: hidden; background: #1b1e2b;
  box-shadow: 0 40px 90px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.14); isolation: isolate; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
.pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.55)); pointer-events: none; }
.card { flex: none; width: min(720px, 50vw); border-radius: 30px; overflow: hidden; display: grid; }
/* les deux vues de la carte, l'une sur l'autre : l'exercice, puis « Bravo » (la vague de distortion-waves passe de l'une à l'autre) */
.vue { grid-area: 1 / 1; min-width: 0; min-height: 0; isolation: isolate; position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px 14px; }
/* la vague travaille sur une image des vues, qui doivent être opaques : à la fin, la carte prend un fond plein
   aux couleurs qu'elle a sur la photo floutée (relevées sur une capture, avec l'illustration de la fiche A1 n° 1 ; en clair, l'image ne change presque rien) */
.card.vague .vue { background: radial-gradient(70% 60% at 30% 55%, #73533e, rgba(115,83,62,0) 75%), linear-gradient(160deg, #554236, #4c4140); }
body.clair .card.vague .vue { background: radial-gradient(70% 60% at 30% 55%, #efe3d8, rgba(239,227,216,0) 75%), linear-gradient(160deg, #f8f6f4, #f0eeec); }

/* ---------- le spectre, le lecteur, ce que dit l'appli (comme le journal) ---------- */
.spectre { position: absolute; left: 14px; right: 14px; bottom: 86px; z-index: 3; height: 110px; width: calc(100% - 28px); pointer-events: none; opacity: 0; transition: opacity .5s ease; }
body.playing .spectre { opacity: 1; }
.pic::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 55%; z-index: 2; pointer-events: none; background: linear-gradient(180deg, rgba(8,10,20,0), rgba(8,10,20,.6)); opacity: 0; transition: opacity .5s ease; }
body.playing .pic::before { opacity: 1; }
/* la loupe : sur une erreur au vrai / faux, au passage qui donne la réponse, le lecteur s'ouvre sur l'onde de ce passage,
   joué au ralenti, puis tout revient comme avant */
.loupe { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 5; height: 62px; border-radius: 26px; padding: 14px 18px 12px; display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  background: rgba(10,12,20,.6); backdrop-filter: blur(26px) saturate(1.6); -webkit-backdrop-filter: blur(26px) saturate(1.6); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 30px 60px -20px rgba(0,0,0,.7); opacity: 0; pointer-events: none;
  transition: height .75s var(--spring), opacity .35s ease, border-radius .6s var(--apple); }
.pic.zoom .loupe { opacity: 1; height: min(250px, calc(100% - 28px)); border-radius: 30px; }
.pic .player { transition: opacity .35s ease, translate .5s var(--apple); }
.pic.zoom .player { opacity: 0; }
.pic img { transition: transform 1.1s var(--apple), filter .8s ease; }
.pic.zoom img { transform: scale(1.07); filter: blur(5px) brightness(.62); }
.pic.zoom .spectre, .pic.zoom .qui, .pic.zoom .say { opacity: 0 !important; }
.lp-hd { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: rgba(255,255,255,.62); opacity: 0; transition: opacity .3s ease; }
.lp-lent { display: inline-flex; align-items: center; gap: 6px; color: #FFD24A; opacity: 0; transition: opacity .3s ease; }
.lp-lent svg { width: 16px; height: 16px; }
.loupe.lent .lp-lent { opacity: 1; }
.lp-txt { flex: none; text-wrap: balance; margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.015em; line-height: 1.15; opacity: 0; transition: opacity .3s ease; --on: #fff; --off: rgba(255,255,255,.3); }
.pic.zoom .lp-hd, .pic.zoom .lp-txt { opacity: 1; transition-delay: .3s; }
.lp-onde { flex: 1; min-height: 0; width: 100%; display: block; }
/* pendant la loupe, tout le reste s'assombrit (on le voit encore) : on se concentre sur le passage */
.card, .tray, .island, .theme, .fond { transition: filter .6s ease, opacity .6s ease; }
body.loupe-on .card, body.loupe-on .tray, body.loupe-on .island, body.loupe-on .theme { filter: brightness(.35) saturate(.6) blur(1.5px); }
body.loupe-on .fond { opacity: .15; }
body.loupe-on .pic { box-shadow: 0 0 0 1px rgba(255,210,74,.35), 0 40px 120px -20px rgba(255,170,60,.35), 0 40px 90px -30px rgba(0,0,0,.8); }
.pic { transition: box-shadow .6s ease; }
.qui { position: absolute; left: 50%; bottom: 206px; z-index: 4; translate: -50% 6px; padding: 6px 14px; border-radius: 16px; font-size: 14px; font-weight: 800; letter-spacing: .02em;
  background: rgba(16,18,28,.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); opacity: 0; transition: opacity .3s, translate .4s var(--apple); pointer-events: none; white-space: nowrap; }
.qui.on { opacity: 1; translate: -50% 0; }
.player { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 26px;
  background: rgba(16,18,28,.5); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 14px 30px -12px rgba(0,0,0,.5); transition: opacity .4s, translate .5s var(--apple); }
body[data-turn="boot"] .player { opacity: 0; translate: 0 12px; pointer-events: none; }
.ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); flex: none; transition: background .2s, color .2s, scale .3s var(--spring); }
.ico:active { scale: .92; }
.ico svg { width: 19px; height: 19px; }
.ico.play { width: 46px; height: 46px; background: #fff; color: var(--ink); }
.ico.play svg { width: 20px; height: 20px; }
.ico[aria-pressed="true"] { background: #fff; color: var(--ink); }
.time { flex: none; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; }
.track { position: relative; flex: 1; height: 34px; cursor: pointer; touch-action: none; }
.track .rail { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 6px; background: rgba(255,255,255,.22); overflow: hidden; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; border-radius: 6px; }
.track .tick { position: absolute; top: 50%; width: 3px; height: 14px; margin: -7px 0 0 -1.5px; border-radius: 2px; background: rgba(255,255,255,.55); pointer-events: none; }
.track .knob { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); transition: scale .2s var(--spring); }
.track:active .knob { scale: 1.25; }
.bigplay { position: absolute; left: 50%; top: 50%; z-index: 6; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(16,18,28,.55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 20px 40px -14px rgba(0,0,0,.6); transition: opacity .4s, scale .5s var(--spring); }
.bigplay svg { width: 36px; height: 36px; margin-left: 5px; }
.bigplay::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); animation: ringp 2.2s ease-out infinite; }
@keyframes ringp { from { opacity: .9; scale: .9; } to { opacity: 0; scale: 1.35; } }
.bigplay.off { opacity: 0; scale: .8; pointer-events: none; }
.say { position: absolute; left: 50%; top: 16px; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 7px 18px 7px 7px; border-radius: 24px; max-width: calc(100% - 28px); width: max-content; color: #fff;
  background: rgba(16,18,28,.58); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 14px 30px -12px rgba(0,0,0,.5);
  translate: -50% -8px; opacity: 0; scale: .92; transition: opacity .35s ease, translate .5s var(--apple), scale .5s var(--spring); pointer-events: none; }
.say.on { opacity: 1; translate: -50% 0; scale: 1; }
.say p { margin: 0; font-size: 17px; font-weight: 700; text-wrap: balance; line-height: 1.25; }
.orb { position: relative; width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--rainbow); animation: spin 3s linear infinite; }
.orb::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: rgba(16,18,28,.75); }
.orb svg { position: relative; z-index: 1; width: 16px; height: 16px; }
.say.ok .orb { background: var(--g-ok); animation: none; } .say.ok .orb::after { background: transparent; }
.say.non .orb { background: #ff4d6a; animation: none; } .say.non .orb::after { background: transparent; }
@keyframes spin { to { --spin: 360deg; } }

/* ---------- l'île : l'exercice en cours ; on la touche, elle s'ouvre sur les cinq ---------- */
.island { position: fixed; z-index: 40; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); translate: -50% 0; width: 248px; height: 42px; border-radius: 21px;
  background: #000; color: #fff; overflow: hidden; box-shadow: 0 14px 34px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
  transition: width .6s var(--spring), height .6s var(--spring), border-radius .6s var(--spring); }
.island.open { width: min(384px, calc(100vw - 24px)); height: 380px; border-radius: 32px; }
/* 5. le jeu de cartes du vocabulaire : un cadre sur tout l'écran ; l'île et le bouton clair / sombre restent au-dessus */
.jeu-voc { position: fixed; inset: 0; z-index: 25; width: 100%; height: 100%; border: 0; background: #0e1018; opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s; }
.jeu-voc.on { opacity: 1; visibility: visible; transition: opacity .5s ease, visibility 0s; }
body.clair .jeu-voc { background: #f1efed; }
.island.msg { width: min(330px, calc(100vw - 24px)); height: 60px; border-radius: 30px; }
.island > * { transition: opacity .22s ease, scale .4s var(--spring); }
.is-pill { position: absolute; left: 0; top: 0; width: 100%; height: 42px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 8px; }
.island.open .is-pill, .island.msg .is-pill { opacity: 0; scale: .9; pointer-events: none; }
.is-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--c, #3AA8FF); }
.is-ico svg { width: 16px; height: 16px; }
.is-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.is-dots { margin-left: auto; display: flex; gap: 5px; }
.is-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background .3s, scale .4s var(--spring); }
.is-dots i.cur { background: #fff; }
.is-dots i.ok { background: var(--ok); }
.is-list { position: absolute; inset: 0; padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 4px; opacity: 0; scale: .96; pointer-events: none; }
.island.open .is-list { opacity: 1; scale: 1; pointer-events: auto; transition-delay: .12s; }
.is-head { display: flex; align-items: baseline; gap: 8px; padding: 0 8px 8px; }
.is-head b { font-size: 16px; } .is-head span { font-size: 12.5px; color: rgba(255,255,255,.55); font-weight: 600; }
.is-head .niv { margin-left: auto; font-size: 12px; font-weight: 800; color: #000; background: #fff; border-radius: 8px; padding: 2px 7px; }
.is-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 18px; text-align: left; transition: background .2s; }
.is-item:hover, .is-item.cur { background: rgba(255,255,255,.1); }
.is-item .is-ico { width: 38px; height: 38px; } .is-item .is-ico svg { width: 19px; height: 19px; }
.is-item b { display: block; font-size: 15px; } .is-item span { font-size: 12.5px; color: rgba(255,255,255,.55); font-weight: 600; }
.is-st { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid rgba(255,255,255,.18); }
.is-st svg { width: 14px; height: 14px; opacity: 0; }
.is-item.ok .is-st { background: var(--ok); border-color: var(--ok); } .is-item.ok .is-st svg { opacity: 1; }
.is-msg { position: absolute; inset: 0; display: flex; align-items: center; gap: 12px; padding: 0 18px 0 12px; opacity: 0; scale: .9; pointer-events: none; }
.island.msg .is-msg { opacity: 1; scale: 1; transition-delay: .1s; }
.is-msg .is-ico { width: 38px; height: 38px; background: var(--g-ok); }
.is-msg .is-ico svg { width: 20px; height: 20px; }
.is-msg b { display: block; font-size: 15.5px; } .is-msg span { font-size: 12.5px; color: rgba(255,255,255,.6); font-weight: 600; }

/* ---------- l'en-tête de la carte ---------- */
.hd { position: relative; z-index: 2; display: flex; align-items: center; gap: 11px; padding: 6px 14px 6px 6px; border-radius: 22px; background: rgba(255,255,255,.08); }
.hd .is-ico { width: 42px; height: 42px; } .hd .is-ico svg { width: 21px; height: 21px; color: #fff; }
.hd b { display: block; font-size: 15px; font-weight: 700; }
.hd span { font-size: 13px; color: var(--text2); font-weight: 600; }
.hd .n { margin-left: auto; font-size: 13px; font-weight: 800; color: var(--text2); font-variant-numeric: tabular-nums; }

.body { position: relative; z-index: 2; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 8px 14px; overflow-y: auto; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.body.in { animation: bodyIn .55s var(--apple) both; }
@keyframes bodyIn { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } }
.ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

/* le remplissage mot à mot, comme des paroles */
.kw { --p: -10%; background: linear-gradient(90deg, var(--on) calc(var(--p) - 6%), var(--off) calc(var(--p) + 6%)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kw.lu { --p: 110%; }

/* ---------- 1. le QCM ---------- */
.question { margin: 0 0 26px; font-size: 32px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; cursor: pointer; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px; border-radius: 24px; text-align: left; font-size: 20px; font-weight: 700;
  background: var(--tile); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 1px var(--edge); transition: background .25s, box-shadow .25s, transform .5s var(--spring), opacity .3s; }
.opt:hover { background: var(--tile2); } .opt:active { transform: scale(.98); }
.opt .lt { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--tile2); font-weight: 800; transition: background .25s, color .25s; }
.opt .st { margin-left: auto; width: 26px; height: 26px; flex: none; color: var(--ok); opacity: 0; transition: opacity .25s, scale .5s var(--spring); scale: .6; }
.opt.ok { background: rgba(29,214,160,.2); box-shadow: 0 0 0 2px var(--ok); }
.opt.ok .lt { background: var(--g-ok); color: var(--ink); }
.opt.ok .st, .opt.faux .st { opacity: 1; scale: 1; }
.opt.faux .st { color: var(--bad); }
.opt.faux { background: rgba(255,77,106,.2); box-shadow: 0 0 0 2px rgba(255,77,106,.8); animation: shake .5s ease; }
.opt.faux .ot { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--bad); }
.opt.faux .lt { background: #ff4d6a; color: #fff; }
.opts.fini .opt:not(.ok) { opacity: .45; }
body:not([data-turn="you"]) .opt { pointer-events: none; }
.hint::after { content: ""; position: absolute; inset: -5px; border-radius: inherit; border: 2px solid rgba(255,255,255,.75); animation: hint 1.6s ease-in-out infinite; pointer-events: none; }
.opt.hint { position: relative; }
@keyframes hint { 0%, 100% { opacity: 0; scale: .97; } 50% { opacity: 1; scale: 1.02; } }
@keyframes shake { 20% { translate: -6px 0; } 40% { translate: 5px 0; } 60% { translate: -3px 0; } 80% { translate: 2px 0; } }

/* ---------- 2. le texte à trous (le dialogue) ---------- */
.dlg { display: flex; flex-direction: column; gap: 18px; font-size: 24px; line-height: 1.5; font-weight: 600; letter-spacing: -.005em; }
.ln { margin: 0; padding: 10px 14px; border-radius: 18px; position: relative; transition: background .45s ease; }
.ln .lab { display: block; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-bottom: 2px; }
.ln.cur { background: rgba(255,255,255,.07); }
.w { transition: opacity .18s ease; }
.ln.speak .w, .ln.speak .gap { opacity: .42; }
.ln.speak .w.said, .ln.speak .gap.said { opacity: 1; }
.gap { display: inline-block; position: relative; vertical-align: -0.2em; height: 1.32em; margin: 0 1px; border-radius: 9px; background: rgba(255,255,255,.08); transition: width .45s var(--apple), background .3s ease, opacity .18s ease; }
.gap.cible { background: rgba(255,255,255,.13); box-shadow: 0 0 0 1.5px rgba(255,255,255,.35); }
.gap .gw { position: absolute; inset: 0; display: grid; place-items: center; white-space: nowrap; opacity: 0; transition: opacity .2s ease; }
.gap.open { background: rgba(255,255,255,.22); }
.gap.open .gw { opacity: .62; }
.gap.filled { display: inline; height: auto; width: auto !important; vertical-align: baseline; background: transparent; box-shadow: none; margin: 0 .12em; padding: 0; }
.gap.filled .gw { position: static; display: inline-block; opacity: 1; font-weight: 800; color: var(--ok); animation: wordIn .7s var(--spring) both; }

      if (!ouverte) return;
      // seul le passage décisif passe au ralenti
      const doit = t >= P.s - .04 && t < P.e;
      if (doit !== lent) { lent = doit; dlg.playbackRate = doit ? LENT : base(); lp.classList.toggle('lent', doit); }
      if (kk) kk(t);
      if (t > we) fermer();
    };
    k.off = fermer;
    return k;
  }

  /* ===== 4. Association : on relie le mot à sa définition (toucher l'un puis l'autre, ou tirer un fil) ===== */
  function exAsso(f) {
    body.innerHTML = '<div class="asso" id="asso"><svg class="liens" id="liens"></svg></div>';
    const asso = $('#asso'), svg = $('#liens'), NS = 'http://www.w3.org/2000/svg';
    const mots = ASSO.mots.map((m, k) => { const b = document.createElement('button'); b.className = 'it mot'; b.style.gridRow = k + 1; b.textContent = m; b.dataset.k = k; asso.append(b); return b; });
    const defs = ASSO.defs.map((d, k) => { const b = document.createElement('button'); b.className = 'it def'; b.style.gridRow = k + 1; b.textContent = d; b.dataset.k = k; asso.append(b); return b; });
    const liens = [];
    const bord = (el, cote) => { const a = asso.getBoundingClientRect(), r = el.getBoundingClientRect(), d = el.querySelector ? parseFloat(getComputedStyle(el, '::after')[cote === 'd' ? 'right' : 'left']) + 6 : 0; return [(cote === 'd' ? r.right - d : r.left + d) - a.left, r.top + r.height / 2 - a.top]; };
    const courbe = ([x1, y1], [x2, y2], sens = 1) => { const dx = Math.max(24, Math.abs(x2 - x1) * .5); return `M${x1.toFixed(1)},${y1.toFixed(1)} C${(x1 + sens * dx).toFixed(1)},${y1.toFixed(1)} ${(x2 - sens * dx).toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`; };
    const chemin = cls => { const p = document.createElementNS(NS, 'path'); p.setAttribute('class', cls); svg.append(p); return p; };
    const tracer = () => liens.forEach(l => l.p.setAttribute('d', courbe(bord(mots[l.m], 'd'), bord(defs[l.d], 'g'))));
    new ResizeObserver(tracer).observe(asso);
    const relier = (m, d, cls) => { const p = chemin(cls); p.setAttribute('d', courbe(bord(mots[m], 'd'), bord(defs[d], 'g'))); return p; };
    if (state.done[3]) { ASSO.bon.forEach((d, m) => { mots[m].classList.add('ok'); defs[d].classList.add('ok'); liens.push({ m, d, p: relier(m, d, 'ok') }); }); setTurn('end'); suivant(); return {}; }
    setTurn('you');
    let sel = null, live = null;
    const choisir = el => { $$('.it.sel', asso).forEach(x => x.classList.remove('sel')); sel = el; if (el) el.classList.add('sel'); };
    const enFace = (a, b) => a && b && a !== b && a.classList.contains('mot') !== b.classList.contains('mot') && !b.classList.contains('ok');
    async function essayer(a, b) {
      const m = +(a.classList.contains('mot') ? a : b).dataset.k, d = +(a.classList.contains('mot') ? b : a).dataset.k;
      choisir(null);
      if (ASSO.bon[m] === d) {
        mots[m].classList.add('ok'); defs[d].classList.add('ok'); liens.push({ m, d, p: relier(m, d, 'ok') }); sfx.ok();
        if (liens.length === 4) reussi(3, f);
        return;
      }
      setTurn('wait'); relier(m, d, 'faux').addEventListener('animationend', e => e.target.remove());
      [mots[m], defs[d]].forEach(x => { x.classList.remove('faux'); void x.offsetWidth; x.classList.add('faux'); });
      const ok = await non(f, 'Non. Essaie encore.');
      [mots[m], defs[d]].forEach(x => x.classList.remove('faux'));
      if (!ok) return;
      if (state.tries >= 2) { const k = ASSO.bon[m]; defs[k].classList.add('hint'); setTimeout(() => defs[k].classList.remove('hint'), 3200); }
      setTurn('you');
    }
    [...mots, ...defs].forEach(el => {
      let tient = false, bouge = false, sx = 0, sy = 0, vise = null;
      el.addEventListener('pointerdown', e => {
        if (state.turn !== 'you' || el.classList.contains('ok')) return;
        unlock(); sfx.tick();
        if (enFace(sel, el)) { const a = sel; return essayer(a, el); }
        choisir(el); tient = true; bouge = false; sx = e.clientX; sy = e.clientY; el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', e => {
        if (!tient) return;
        if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) bouge = true;
        if (!bouge) return;
        const a = asso.getBoundingClientRect(), estMot = el.classList.contains('mot');
        if (!live) live = chemin('live');
        live.setAttribute('d', courbe(bord(el, estMot ? 'd' : 'g'), [e.clientX - a.left, e.clientY - a.top], estMot ? 1 : -1));
        const sous = document.elementFromPoint(e.clientX, e.clientY), cib = sous && sous.closest('.it');
        const v = enFace(el, cib) ? cib : null;
        if (v !== vise) { if (vise) vise.classList.remove('vise'); vise = v; if (v) { v.classList.add('vise'); sfx.tick(); } }
      });
      const up = () => {
        if (!tient) return; tient = false;
        if (live) { live.remove(); live = null; }
        if (vise) { vise.classList.remove('vise'); const v = vise; vise = null; return essayer(el, v); }
        if (bouge) choisir(null);
      };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    return {};
  }

  /* ===== 5. Vocabulaire : le jeu de cartes (vocabulaire.html) dans un cadre qui prend tout l'écran ; l'île reste au-dessus.
     Le cadre est créé la première fois, puis gardé : on retrouve la partie là où on l'a laissée. Il nous dit la fin (« fini »)
     et « Continuer » (« suivant ») ; on lui donne le thème clair / sombre et on lui demande le silence quand on le quitte. ===== */
  let jeuVoc = null;
  const versVoc = m => { try { if (jeuVoc && jeuVoc.contentWindow) jeuVoc.contentWindow.postMessage(Object.assign({ de: 'quiz' }, m), '*'); } catch (e) {} };
  function montrerVoc(on) {
    if (on && !jeuVoc) {
      jeuVoc = document.createElement('iframe'); jeuVoc.className = 'jeu-voc'; jeuVoc.id = 'jeuVoc'; jeuVoc.title = 'Vocabulaire : le jeu de cartes';
      jeuVoc.allow = 'autoplay'; jeuVoc.src = 'vocabulaire.html?integre=1';
      jeuVoc.addEventListener('load', () => { versVoc({ type: 'theme', clair: document.body.classList.contains('clair') }); if (jeuVoc.classList.contains('on')) versVoc({ type: 'montre' }); });
      document.body.append(jeuVoc);
    }
    if (!jeuVoc) return;
    if (on) { void jeuVoc.offsetWidth; jeuVoc.classList.add('on'); versVoc({ type: 'theme', clair: document.body.classList.contains('clair') }); versVoc({ type: 'montre' }); }
    else if (jeuVoc.classList.contains('on')) { jeuVoc.classList.remove('on'); versVoc({ type: 'pause' }); }
  }
  function exVoc() { body.innerHTML = ''; setTurn(state.done[VOC] ? 'end' : 'you'); return {}; }
  addEventListener('message', e => {
    if (!jeuVoc || e.source !== jeuVoc.contentWindow || !e.data || e.data.de !== 'vocabulaire') return;
    if (e.data.type === 'fini') {
      state.done[VOC] = true; majIle(); setTurn('end');
      const tous = state.done.every(Boolean), n = state.done.filter(Boolean).length;
      ileMessage(tous ? 'Bravo ! Tout est réussi.' : `${EX[VOC].nom} : bravo !`, tous ? `Les ${NOMBRE[EX.length]} exercices de la boulangerie` : `${n} exercice${n > 1 ? 's' : ''} sur ${EX.length}`, 2600);
    } else if (e.data.type === 'suivant') { const reste = apres(VOC); reste == null ? finale() : aller(reste); }
  });
  window.__quizVoc = { versVoc, montrerVoc };

  /* ===== la fin : la vague de distortion-waves (type « center ») part du rond « Bravo » et emporte l'exercice ===== */
  const vueA = $('#vueA'), vueB = $('#vueB');
  let vague = null;
  try { vague = new DistortionWaves.WaveController(card, vueA, vueB); } catch (e) { vague = null; }
  const montrerFin = on => {
    vueA.style.opacity = on ? '0' : ''; vueA.style.pointerEvents = on ? 'none' : '';
    vueB.style.opacity = on ? '' : '0'; vueB.style.pointerEvents = on ? '' : 'none';
  };
  async function finale() {
    const f = ++flow; stopAll(); sayHide(); idle.stop(); gaps = []; majIle(); setTurn('wait'); montrerVoc(false);
    $$('.peb.vol').forEach(p => p.remove()); tray.innerHTML = '';
    vueB.innerHTML = `<div class="hd"><span class="is-ico" style="--c:#1DD6A0">${ICON.checkB.replace('currentColor', '#fff')}</span><div><b>À la boulangerie</b><span>Acheter du pain et des viennoiseries</span></div><span class="n">A1</span></div>`
      + `<div class="body"><div class="fin"><div class="big" id="bigOk">${ICON.check}</div><h2>Bravo !</h2><p>Tu as réussi les ${NOMBRE[EX.length]} exercices.</p><div class="recap">${EX.map(x => `<div><span class="is-ico" style="--c:${x.c}">${x.ico}</span>${x.nom}</div>`).join('')}</div></div></div>`;
    sfx.bravo(); card.classList.add('vague');
    if (vague) {
      vague.update({ type: 'center', palette: 'colorful', onFinish: r => { if (r && alive(f)) montrerFin(true); } });
      try { await Promise.race([vague.prepare(), wait(1200)]); } catch (e) {}
      if (!alive(f)) return;
      vague.play({ source: $('#bigOk') });
    } else montrerFin(true);
    const b = document.createElement('button'); b.className = 'go'; b.innerHTML = `<span>Recommencer</span>${ICON.again}`;
    b.addEventListener('click', recommencer); tray.append(b);
    setTurn('end');
  }
  function recommencer() {
    if (vague) vague.reset(); montrerFin(false); vueB.innerHTML = ''; card.classList.remove('vague');
    state.done = EX.map(() => false); if (jeuVoc) jeuVoc.src = 'vocabulaire.html?integre=1'; majIle(); aller(0);
  }

  /* ===== le début : on écoute la scène, puis le premier exercice ===== */
  async function start(cible = 0) {
    const f = ++flow; unlock(); $('#bigplay').classList.add('off'); state.entendu = true;
    setTurn('listen'); sayShow('Écoute la scène.'); await wait(reduced ? 200 : 1300); if (!alive(f)) return; sayHide();
    await play(dlg, 0); if (!alive(f)) return;
    await wait(reduced ? 50 : 400); if (!alive(f)) return;
    aller(cible);
  }
  $('#bigplay').addEventListener('click', () => start(0));

  /* ===== le doigt fantôme (texte à trous) ===== */
  const finger = $('#finger');
  const idle = (() => {
    let tm = null, anim = null;
    const stop = () => { clearTimeout(tm); tm = null; if (anim) { anim.cancel(); anim = null; } finger.style.opacity = 0; };
    const show = () => {
      if (state.turn !== 'you' || state.ex !== 1 || !cur.cible) return;
      const p = $('.peb', tray), g = cur.cible(); if (!p || !g) return;
      const pr = p.getBoundingClientRect(), r = g.getBoundingClientRect(), gx = r.left + r.width / 2, gy = r.top + r.height / 2, px = pr.left + pr.width / 2, py = pr.top + pr.height / 2;
      anim = finger.animate([
        { transform: `translate(${px}px, ${py + 30}px) scale(1)`, opacity: 0 }, { transform: `translate(${px}px, ${py}px) scale(1)`, opacity: .9, offset: .15 },
        { transform: `translate(${px}px, ${py}px) scale(.8)`, opacity: .9, offset: .25 }, { transform: `translate(${gx}px, ${gy}px) scale(.8)`, opacity: .9, offset: .7 },
        { transform: `translate(${gx}px, ${gy}px) scale(1)`, opacity: .9, offset: .8 }, { transform: `translate(${gx}px, ${gy - 10}px) scale(1)`, opacity: 0 },
      ], { duration: 2200, easing: 'cubic-bezier(.45,0,.25,1)' });
      anim.onfinish = () => { anim = null; tm = setTimeout(show, 6000); };
    };
    return { stop, reset() { stop(); if (state.turn === 'you') tm = setTimeout(show, 6000); } };
  })();

  // avant l'écoute : le premier exercice est déjà là, en attente
  (function avant() {
    const x = EX[0];
    $('#hdIco').style.setProperty('--c', x.c); $('#hdIco').innerHTML = x.ico; $('#hdT').textContent = x.nom; $('#hdS').textContent = x.consigne; $('#hdN').textContent = `1 / ${EX.length}`;
    body.innerHTML = `<p class="question">${ENC.q.t.split(' ').map(m => `<span class="kw">${m}</span>`).join(' ')}</p><div class="opts">${QCM.opts.map((o, k) => `<div class="opt" style="opacity:.6"><span class="lt">${'ABC'[k]}</span><span class="ot">${o}</span></div>`).join('')}</div>`;
    majIle(); setTurn('boot');
  })();
  window.__boul = { state, aller, vague: () => vague, dlg, enc, ENC, QCM, TROUS, ASSO };
})();
</script>
