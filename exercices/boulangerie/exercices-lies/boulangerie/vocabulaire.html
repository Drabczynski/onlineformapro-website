<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vocabulaire · À la boulangerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Essai : le vocabulaire en duel de cartes contre la boulangère. Chaque mot existe en deux cartes : l'image (découpée dans
   l'illustration de la fiche A1 n° 1) et le mot écrit. On a une main de 5 cartes et une pioche ; la boulangère a les cartes
   qui vont avec. Elle pose une carte : un mot (qu'elle dit), on pose l'image ; une image, on pose le mot. Juste : la paire
   est gagnée et on repioche. Ordinateur seulement pour l'instant. */
:root {
  --text: #fff; --text2: rgba(255,255,255,.72); --ink: #0B0D16; --ok: #4BE3B4; --bad: #ff5c7a;
  --g-ok: linear-gradient(135deg, #1DD6A0 0%, #2BC4F0 100%);
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --apple: cubic-bezier(.32,.72,0,1); --spring: cubic-bezier(.34,1.4,.64,1);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #0e1018; color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
svg { display: block; }

.env { position: fixed; inset: 0; background: radial-gradient(55% 50% at 30% 45%, rgba(255,170,90,.16), transparent 70%), radial-gradient(45% 45% at 80% 60%, rgba(110,140,255,.12), transparent 72%), #0e1018; }
.fond { position: fixed; inset: -80px; background: url(../../fiches/illustrations/A1/1.jpg) 50% 50% / cover no-repeat; filter: blur(46px) saturate(1.3); opacity: .42; }
.fond::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 45%, rgba(8,10,20,.1), rgba(8,10,20,.82)); }
.table { position: fixed; left: 50%; width: 1000px; height: 560px; translate: -50% -50%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255,205,150,.15), rgba(255,205,150,.05) 60%, transparent); }

.titre { position: fixed; left: 22px; top: 18px; z-index: 5; display: flex; align-items: center; gap: 11px; padding: 6px 16px 6px 6px; border-radius: 22px; background: rgba(255,255,255,.08);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.titre .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #FF4D8A; }
.titre .ico svg { width: 18px; height: 18px; }
.titre b { display: block; font-size: 14px; } .titre span { font-size: 12.5px; color: var(--text2); font-weight: 600; font-variant-numeric: tabular-nums; }
.theme { position: fixed; z-index: 5; top: 18px; right: 18px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); backdrop-filter: blur(12px); }
.theme svg { width: 20px; height: 20px; } .theme .lune { display: none; }

/* la consigne, les deux places sur la table, la pioche et les paires gagnées */
.consigne { position: fixed; left: 50%; top: 0; z-index: 3; translate: -50% -50%; display: flex; align-items: center; gap: 12px; padding: 7px 22px 7px 7px; border-radius: 30px; white-space: nowrap;
  background: rgba(16,18,28,.55); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.consigne p { margin: 0; font-size: 19px; font-weight: 600; } .consigne p b { font-weight: 800; }
.consigne.change { animation: change .45s var(--spring); } @keyframes change { from { opacity: .3; scale: .93; } }
.hp { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #fff; color: var(--ink); transition: scale .3s var(--spring), background .25s, opacity .25s; }
.hp:active { scale: .9; } .hp svg { width: 22px; height: 22px; } .hp:disabled { opacity: .45; cursor: default; }
.hp.parle { animation: parle .9s ease-in-out infinite; } @keyframes parle { 50% { box-shadow: 0 0 0 8px rgba(255,255,255,.2); } }
.consigne.ok .hp { background: var(--g-ok); opacity: 1; } .consigne.non .hp { background: #ff4d6a; color: #fff; opacity: 1; }
.fente { position: fixed; left: 0; top: 0; z-index: 1; border-radius: 22px; border: 2px dashed rgba(255,255,255,.24); background: rgba(255,255,255,.035); display: grid; place-items: center; text-align: center;
  color: rgba(255,255,255,.4); font-size: 14px; font-weight: 700; transition: border-color .25s, background .25s, box-shadow .25s, scale .35s var(--spring); }
.fente.sienne { border-style: solid; border-color: rgba(255,255,255,.1); background: rgba(255,255,255,.02); }
.fente.vise { border-style: solid; border-color: rgba(255,255,255,.85); background: rgba(255,255,255,.1); box-shadow: 0 0 0 8px rgba(255,255,255,.06), 0 0 60px rgba(255,220,170,.25); scale: 1.04; }
.fente .cap { position: absolute; left: 50%; top: calc(100% + 10px); translate: -50% 0; white-space: nowrap; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.45); }
.go { display: flex; flex-direction: column; align-items: center; gap: 12px; color: #fff; font-size: 16px; font-weight: 800; }
.go i { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 18px 40px -14px rgba(0,0,0,.6); position: relative; transition: scale .4s var(--spring); }
.go:hover i { scale: 1.06; }
.go i::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); animation: anneau 2.2s ease-out infinite; }
@keyframes anneau { from { opacity: .9; scale: .9; } to { opacity: 0; scale: 1.35; } }
.go svg { width: 30px; height: 30px; } .go .play { margin-left: 4px; }
.tas { position: fixed; left: 0; top: 0; z-index: 70; pointer-events: none; text-align: center; }
.tas.plein .vide { opacity: 0; }
.tas .n { position: absolute; right: -10px; top: -10px; z-index: 60; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; display: grid; place-items: center; font-size: 14px; font-weight: 800;
  background: #fff; color: var(--ink); box-shadow: 0 6px 14px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
.tas .cap { position: absolute; left: 50%; top: calc(100% + 10px); translate: -50% 0; white-space: nowrap; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.tas .vide { position: absolute; inset: 0; border-radius: 14px; border: 1.5px dashed rgba(255,255,255,.16); }

/* les cartes : l'image ou le mot au recto, le dos de la boulangerie au verso */
.carte { position: fixed; left: 0; top: 0; z-index: 10; width: var(--cw); height: var(--ch); cursor: grab; touch-action: none; will-change: transform; perspective: 1000px;
  transition: transform .6s var(--spring); }
.carte.tire { transition: none; cursor: grabbing; }
.tourne { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s var(--apple); }
.carte.cachee .tourne { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 20px; padding: 7px; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: linear-gradient(155deg, #fdf7ee, #eadcc6 55%, #d6c09e);
  box-shadow: 0 2px 0 rgba(255,255,255,.7) inset, 0 -2px 0 rgba(120,80,30,.25) inset, 0 0 0 1px rgba(0,0,0,.25), 0 22px 44px -18px rgba(0,0,0,.8); transition: box-shadow .35s; }
.verso { transform: rotateY(180deg); }
/* certains navigateurs montrent le recto à l'envers malgré backface-visibility : on bascule les faces quand la carte est de profil.
   Avec la courbe --apple, le retournement (0,6 s) passe le profil à 0,1 s : c'est là qu'on échange recto et dos */
.recto { transform: rotateY(0deg) translateZ(.1px); visibility: visible; }
.verso { visibility: hidden; }
.face { transition: box-shadow .35s, visibility 0s linear .085s; }
@media (prefers-reduced-motion: reduce) { .face { transition-delay: 0s !important; } }
.carte.cachee .recto { visibility: hidden; }
.carte.cachee .verso { visibility: visible; }
.carte.haut .recto { box-shadow: 0 2px 0 rgba(255,255,255,.7) inset, 0 -2px 0 rgba(120,80,30,.25) inset, 0 0 0 1px rgba(0,0,0,.25), 0 40px 70px -22px rgba(0,0,0,.85); }
.img, .papier, .dos { position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden; }
/* l'image : la photo entière, l'objet net, le reste à peine flouté */
.img { background: #1b1d27; }
.img .bg, .img .obj { position: absolute; inset: 0; background-image: url(../../fiches/illustrations/A1/1.jpg); background-repeat: no-repeat; background-size: var(--bs); background-position: var(--bp); }
.img .bg { filter: blur(1.6px) brightness(.9) saturate(.92); transform: scale(1.02); }
.img .objw { position: absolute; inset: 0; filter: drop-shadow(0 3px 6px rgba(0,0,0,.28)); }
.img .obj { clip-path: var(--clip, none); }
.reflet { position: absolute; inset: 0; border-radius: 14px; pointer-events: none; mix-blend-mode: soft-light;
  background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,.55) 46%, transparent 60%) no-repeat; background-size: 260% 100%; background-position: 130% 0; transition: background-position .8s var(--apple); }
.carte.haut .reflet, .carte.tire .reflet { background-position: -30% 0; }
/* le mot écrit */
.papier { display: grid; place-items: center; padding: 16px 12px; text-align: center; color: #2b1d10;
  background: radial-gradient(120% 90% at 50% 0%, #fffdf8, #f4e9d6 70%, #ead9bd); box-shadow: inset 0 0 0 1.5px rgba(176,132,64,.45), inset 0 0 0 5px rgba(255,255,255,.5), inset 0 0 0 6.5px rgba(176,132,64,.25); }
.papier b { display: block; font-size: calc(var(--ch) * .105); font-weight: 800; line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; }
.papier b .art { display: block; font-size: .62em; font-weight: 600; opacity: .55; margin-bottom: .2em; }
.papier::before, .papier::after { content: ""; position: absolute; left: 50%; width: 34%; height: 2px; translate: -50% 0; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(176,132,64,.6), transparent); }
.papier::before { top: 22%; } .papier::after { bottom: 22%; }
/* le dos : le vert de la devanture, un filet doré */
.dos { background: radial-gradient(circle at 50% 45%, #2f5c52, #163029 75%); box-shadow: inset 0 0 0 1.5px rgba(226,190,120,.55), inset 0 0 0 6px rgba(22,48,41,1), inset 0 0 0 7px rgba(226,190,120,.3); }
.nom { position: absolute; left: 50%; bottom: 16px; translate: -50% 10px; padding: 7px 14px; border-radius: 15px; white-space: nowrap; font-size: 15px; font-weight: 800; color: #fff;
  background: rgba(16,18,28,.82); box-shadow: 0 8px 20px -8px rgba(0,0,0,.6); opacity: 0; transition: opacity .3s, translate .45s var(--spring), background .25s; backface-visibility: hidden; }
.nom .art { font-weight: 500; opacity: .7; }
.carte.nommee .nom { opacity: 1; translate: -50% 0; }
.carte.faux .nom { background: #e0466a; }
.carte.bon .recto { box-shadow: 0 0 0 3px var(--ok), 0 0 50px rgba(75,227,180,.45), 0 30px 60px -20px rgba(0,0,0,.8); }
.carte.faux .recto { box-shadow: 0 0 0 3px var(--bad), 0 0 40px rgba(255,92,122,.4), 0 30px 60px -20px rgba(0,0,0,.8); }
.carte.secoue .tourne { animation: secoue .5s ease; }
@keyframes secoue { 20% { translate: -9px 0; } 40% { translate: 7px 0; } 60% { translate: -4px 0; } 80% { translate: 2px 0; } }
.carte.indice .recto { animation: indice 1.2s ease-in-out infinite; }
.carte.montree .recto { box-shadow: 0 0 0 3px #fff, 0 0 46px rgba(255,255,255,.45), 0 30px 60px -20px rgba(0,0,0,.8); }
@keyframes indice { 50% { box-shadow: 0 0 0 3px #fff, 0 0 46px rgba(255,255,255,.55), 0 30px 60px -20px rgba(0,0,0,.8); } }
.carte.loin { cursor: default; }
.carte.loin .face { box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 10px 20px -10px rgba(0,0,0,.7); }

/* avant la partie : les paires sur la table, et « Jouer » (ou « Suivant ») en bas */
.fente, .tas { transition: opacity .5s ease, border-color .25s, background .25s, box-shadow .25s, scale .35s var(--spring); }
body.etude .fente, body.etude .tas { opacity: 0; pointer-events: none; }
.jouer { position: fixed; left: 50%; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); z-index: 95; translate: -50% 0; height: 56px; padding: 0 24px 0 28px; border-radius: 28px; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
  background: #fff; color: var(--ink); font-size: 17px; font-weight: 800; box-shadow: 0 14px 34px -12px rgba(0,0,0,.7); transition: opacity .35s ease, translate .5s var(--spring), scale .3s var(--spring); }
.jouer svg { width: 18px; height: 18px; } .jouer:active { scale: .95; }
.jouer .n { font-weight: 600; opacity: .55; font-variant-numeric: tabular-nums; }
/* l'accueil : le paquet de cartes, à déchirer par le haut */
.sachet { position: fixed; z-index: 30; perspective: 900px; cursor: grab; touch-action: none; outline: none; }
.sachet:focus-visible .incl { outline: 2px solid #fff; outline-offset: 6px; border-radius: 6px; }
.sachet .flotte { position: absolute; inset: 0; animation: flotte 3.4s ease-in-out infinite; }
@keyframes flotte { 0%, 100% { transform: translateY(-5px) rotate(-1.2deg); } 50% { transform: translateY(6px) rotate(1.2deg); } }
.sachet .incl { position: absolute; inset: 0; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .35s ease-out; transform-style: preserve-3d; }
.sachet .ombre { position: absolute; left: 14%; right: 14%; bottom: -36px; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.5), transparent); animation: ombre 3.4s ease-in-out infinite; }
@keyframes ombre { 0%, 100% { transform: scale(.92); opacity: .85; } 50% { transform: scale(1.05); opacity: .55; } }
.s-haut, .s-corps { position: absolute; left: 0; right: 0; overflow: hidden;
  background: radial-gradient(120% 80% at var(--mx, 30%) var(--my, 15%), rgba(255,255,255,.45), transparent 45%), linear-gradient(155deg, #ffc27a 0%, #ff8a2a 26%, #f2630f 52%, #ff8f33 78%, #ffbd6e 100%); }
.s-haut { top: 0; height: 15%; clip-path: var(--zh); transform-origin: 100% 100%; transform: translateY(calc(var(--p, 0) * -8px)) rotate(calc(var(--p, 0) * -9deg)); transition: transform .15s ease-out; }
.s-corps { top: 15%; bottom: 0; clip-path: var(--zb); box-shadow: inset 0 0 30px rgba(140,40,0,.35); }
.s-haut::after, .s-corps::after { content: ""; position: absolute; left: 0; right: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 2px, rgba(120,40,0,.14) 2px 4px, transparent 4px 7px); }
.s-haut::after { top: 0; height: 75%; } .s-corps::after { bottom: 0; height: 8%; }
.reflet-s { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.5) 44%, transparent 58%) no-repeat; background-size: 250% 100%; mix-blend-mode: soft-light; animation: balaie 4.2s ease-in-out infinite; }
@keyframes balaie { 0%, 55% { background-position: 130% 0; } 100% { background-position: -40% 0; } }
.s-titre { position: absolute; left: 0; right: 0; top: 7%; text-align: center; color: #fff; text-shadow: 0 2px 8px rgba(120,40,0,.45); }
.s-titre b { display: block; font-size: calc(var(--sw) * .105); font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
.s-titre span { font-size: calc(var(--sw) * .052); font-weight: 700; opacity: .92; letter-spacing: .08em; text-transform: uppercase; }
.s-image { position: absolute; left: 50%; top: 52%; width: 54%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: url(../../fiches/illustrations/A1/1.jpg) no-repeat;
  background-size: var(--ibs); background-position: var(--ibp); box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 12px 26px rgba(120,40,0,.45); }
.s-pied { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; color: rgba(255,255,255,.95); font-size: calc(var(--sw) * .055); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 2px 6px rgba(120,40,0,.4); }
.s-guide { position: absolute; left: 5%; right: 5%; top: 15%; border-top: 2px dashed rgba(255,255,255,.8); translate: 0 -1px; transition: opacity .3s; }
.s-main { position: absolute; top: 15%; left: 8%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 7px rgba(255,255,255,.3), 0 4px 10px rgba(0,0,0,.3);
  animation: glisseMain 2.2s ease-in-out infinite; transition: opacity .3s; }
@keyframes glisseMain { 0% { left: 8%; opacity: 0; } 15% { opacity: 1; } 75% { left: 88%; opacity: 1; } 100% { left: 92%; opacity: 0; } }
.sachet.dechire .s-main, .sachet.dechire .s-guide { animation: none; opacity: 0; }
.s-lueur { position: absolute; left: 0; top: 15%; height: 4px; width: calc(var(--p, 0) * 100%); translate: 0 -50%; border-radius: 2px; background: linear-gradient(90deg, #fff, #ffe2a8);
  box-shadow: 0 0 14px 4px rgba(255,226,168,.9), 0 -6px 18px 6px rgba(255,240,200,.55); }
.sachet.ouvert { pointer-events: none; }
.sachet.ouvert .flotte, .sachet.ouvert .ombre { animation: none; }
.sachet.ouvert .ombre { opacity: 0; transition: opacity .4s; }
.sachet.ouvert .s-haut { transform: translate(70%, -260%) rotate(40deg); opacity: 0; transition: transform .8s cubic-bezier(.2,.7,.3,1), opacity .8s ease .1s; }
.sachet.ouvert .s-corps, .sachet.ouvert .s-lueur { transform: translateY(160%) rotate(7deg); opacity: 0; transition: transform .75s cubic-bezier(.55,0,.8,.3) .12s, opacity .5s ease .4s; }
.carte.dans-sachet { opacity: 0; }
body.deballage .jouer { opacity: 0; translate: -50% 30px; pointer-events: none; }
.confettis { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 70; pointer-events: none; }
.consigne { transition: opacity .4s ease; }
body:not(.etude) .jouer { opacity: 0; translate: -50% 30px; pointer-events: none; }
.carte.etude { cursor: pointer; }
.carte.eclaire .recto { box-shadow: 0 0 0 3px #fff, 0 0 46px rgba(255,255,255,.5), 0 30px 60px -20px rgba(0,0,0,.8); }
body.clair .jouer { background: #24190f; color: #fff; }
body[data-mode="portrait"] .jouer, body[data-mode="paysage"] .jouer { height: 52px; font-size: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }

/* une paire ouverte en grand (avant la partie) : le fond se floute derrière */
.voile { position: fixed; inset: 0; z-index: 84; background: rgba(8,10,20,.45); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  opacity: 0; pointer-events: none; transition: opacity .4s ease; cursor: zoom-out; }
.voile.on { opacity: 1; pointer-events: auto; }
body.clair .voile { background: rgba(243,241,239,.45); }
.fleche { position: fixed; top: 50%; z-index: 95; width: 56px; height: 56px; margin-top: -18px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: rgba(255,255,255,.14); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 12px 28px -12px rgba(0,0,0,.6);
  opacity: 0; scale: .8; pointer-events: none; transition: opacity .3s ease, scale .4s var(--spring), background .2s; }
.fleche svg { width: 24px; height: 24px; }
.fleche.g { left: calc(50% - var(--zx, 400px) - 56px); } .fleche.d { left: calc(50% + var(--zx, 400px)); }
.fleche:hover { background: rgba(255,255,255,.24); } .fleche:active { scale: .92; }
body.zoome .fleche { opacity: 1; scale: 1; pointer-events: auto; }
body.clair .fleche { color: #24190f; background: rgba(255,255,255,.8); box-shadow: 0 12px 28px -14px rgba(90,45,15,.5); }

/* le bilan : les dix paires */
.bilan { position: fixed; left: 50%; top: 50%; z-index: 90; translate: -50% -46%; display: grid; grid-template-columns: repeat(5, auto); gap: 22px 26px; padding: 30px 34px 26px; border-radius: 30px;
  background: rgba(16,18,28,.72); backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 40px 90px -30px rgba(0,0,0,.8);
  opacity: 0; scale: .94; pointer-events: none; transition: opacity .5s ease, scale .6s var(--spring), translate .6s var(--spring); }
.bilan.on { opacity: 1; scale: 1; translate: -50% -50%; pointer-events: auto; }
.bilan h2 { grid-column: 1 / -1; margin: 0 0 4px; text-align: center; font-size: 26px; letter-spacing: -.02em; }
.bilan .paire { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.bilan .mini { width: 96px; height: 134px; border-radius: 12px; padding: 4px; background: linear-gradient(155deg, #fdf7ee, #d6c09e); box-shadow: 0 10px 22px -10px rgba(0,0,0,.7); transition: scale .35s var(--spring); }
.bilan .paire:hover .mini { scale: 1.06; }
.bilan .mini div { width: 100%; height: 100%; border-radius: 9px; background-image: url(../../fiches/illustrations/A1/1.jpg); background-repeat: no-repeat; }

  }

  // au début : les paires sur la table, « Retiens ces mots. » ; on touche une carte pour entendre le mot.
  // au téléphone, une paire à la fois : « Suivant » jusqu'à la dernière, puis « Jouer ».
  function ecouterPaire(k) {
    dire(k);
    cartes.filter(x => x.k === k).forEach(x => { x.el.classList.remove('eclaire'); void x.el.offsetWidth; x.el.classList.add('eclaire'); clearTimeout(x.tm); x.tm = setTimeout(() => x.el.classList.remove('eclaire'), 1300); });
  }
  // ouvrir une paire en grand (ordinateur) ; toucher le fond la referme
  function ouvrir_(k) { zoom = k; $('#voile').classList.add('on'); document.body.classList.add('zoome'); disposer(); setTimeout(() => { if (zoom === k) ecouterPaire(k); }, T(250)); }
  function fermerZoom() { if (zoom < 0) return; zoom = -1; $('#voile').classList.remove('on'); document.body.classList.remove('zoome'); disposer(); }
  // gauche / droite : la paire d'avant ou d'après (on fait le tour), sans revenir à la table
  const voisine = d => { if (zoom >= 0) { audio(); ouvrir_((zoom + d + MOTS.length) % MOTS.length); } };
  $('#prec').addEventListener('click', () => voisine(-1)); $('#suiv').addEventListener('click', () => voisine(1));
  $('#voile').addEventListener('click', fermerZoom);
  addEventListener('keydown', e => { if (e.key === 'Escape') fermerZoom(); else if (e.key === 'ArrowLeft') voisine(-1); else if (e.key === 'ArrowRight') voisine(1); });
  /* l'accueil : le paquet flotte ; on le déchire en glissant le long du haut (ou on le touche, ou « Ouvrir le paquet »).
     La languette s'envole, le paquet tombe, les cartes jaillissent en gerbe avec des confettis, puis se posent en paires. */
  const sachet = $('#sachet'); let dechire = 0, sachetOuvert = false, geste = null;
  const poserDechirure = p => { dechire = Math.max(dechire, Math.min(1, p)); sachet.style.setProperty('--p', dechire.toFixed(3)); };
  sachet.addEventListener('pointermove', e => {
    if (sachetOuvert) return;
    const r = sachet.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    sachet.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); sachet.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    sachet.style.setProperty('--ry', ((x - .5) * 18).toFixed(1) + 'deg'); sachet.style.setProperty('--rx', ((.5 - y) * 12).toFixed(1) + 'deg');
    if (!geste) return;
    if (Math.abs(e.clientX - geste.x) > 6) geste.bouge = true;
    if (geste.bouge) { sachet.classList.add('dechire'); poserDechirure(x); if (dechire >= .82) ouvrirSachet(); }
  });
  sachet.addEventListener('pointerleave', () => { if (!geste) { sachet.style.setProperty('--rx', '0deg'); sachet.style.setProperty('--ry', '0deg'); } });
  sachet.addEventListener('pointerdown', e => { if (sachetOuvert) return; e.preventDefault(); audio(); try { sachet.setPointerCapture(e.pointerId); } catch (er) {} geste = { x: e.clientX, bouge: false }; });
  const finGeste = () => { if (!geste) return; const g = geste; geste = null; if (!g.bouge && !sachetOuvert) dechirerAuto(); };
  sachet.addEventListener('pointerup', finGeste); sachet.addEventListener('pointercancel', finGeste);
  sachet.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dechirerAuto(); } });
  // déchirer tout seul (un toucher, le bouton) : la déchirure court de gauche à droite
  function dechirerAuto() {
    if (sachetOuvert) return; audio(); sachet.classList.add('dechire');
    const t0 = performance.now(), p0 = dechire, d = T(560);
    (function pas(now) { const k = Math.min(1, (now - t0) / d); poserDechirure(p0 + (1 - p0) * k * k * (3 - 2 * k)); if (k < 1) requestAnimationFrame(pas); else ouvrirSachet(); })(t0);
  }
  async function ouvrirSachet() {
    if (sachetOuvert) return; sachetOuvert = true; jeu.etalage = true; geste = null;
    sachet.classList.add('ouvert'); document.body.classList.add('deballage'); document.body.classList.remove('accueil'); majBouton();
    const r = sachet.getBoundingClientRect(); if (!reduit) confettis(r.left + r.width / 2, r.top + r.height * .15);
    // les cartes jaillissent du haut du paquet et s'éparpillent en gerbe, de travers
    const sortie = melanger([...cartes]), large = Math.min(G.W * .42, G.cw * 2.8);
    sortie.forEach((c, i) => {
      const a = (i / (sortie.length - 1) - .5) * 2;
      c.ex = Math.max(G.cw * .4, Math.min(G.W - G.cw * .4, G.sachet[0] + a * large * (.75 + Math.random() * .35)));
      c.ey = Math.max(G.ch * .35, G.sachet[1] - G.ch * (.25 + Math.random() * .55) + Math.abs(a) * G.ch * .35);
      c.er = a * 28 + (Math.random() - .5) * 24; c.es = mobile() ? .6 : .78; c.ordre = i;
      setTimeout(() => { c.el.classList.remove('dans-sachet'); c.lieu = 'gerbe'; disposer(); }, T(140 + i * 26));
    });
    await wait(T(140 + sortie.length * 26 + 950));
    // puis elles se posent en paires sur la table
    const ordre = [...cartes].sort((a, b) => a.k - b.k || (a.type === 'image' ? -1 : 1));
    ordre.forEach((c, i) => setTimeout(() => { c.lieu = 'etude'; disposer(); }, T(i * 45)));
    await wait(T(ordre.length * 45 + 400));
    sachet.style.display = 'none'; document.body.classList.remove('deballage'); consigne(RETIENS, '', true); jeu.etalage = false; dire(iRetiens);
  }
  // les confettis (sans arcs-en-ciel) : ils partent du haut du paquet, retombent et s'éteignent
  const toile = $('#confettis'), cg = toile.getContext('2d'); let bouts = [];
  function confettis(x, y) {
    const coul = ['#ff8a2a', '#ffc46b', '#fdf7ee', '#2f5c52', '#4BE3B4', '#ff5c7a', '#e9c46a'], vide = !bouts.length;
    for (let i = 0; i < 140; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 6 + Math.random() * 11;
      bouts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, c: coul[i % coul.length], vie: 1, rond: Math.random() < .3 });
    }
    if (vide) requestAnimationFrame(animer);
  }
  function animer() {
    const dp = toile.width / G.W; cg.setTransform(dp, 0, 0, dp, 0, 0); cg.clearRect(0, 0, G.W, G.H);
    bouts = bouts.filter(b => b.vie > 0 && b.y < G.H + 30);
    bouts.forEach(b => {
      b.vy += .3; b.vx *= .985; b.vy *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.vie -= .0055;
      cg.save(); cg.globalAlpha = Math.min(1, b.vie * 2); cg.translate(b.x, b.y); cg.rotate(b.r); cg.fillStyle = b.c;
      if (b.rond) { cg.beginPath(); cg.arc(0, 0, b.h / 1.4, 0, 6.283); cg.fill(); } else cg.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.max(.2, Math.abs(Math.cos(b.r * 2))));
      cg.restore();
    });
    if (bouts.length) requestAnimationFrame(animer); else cg.clearRect(0, 0, G.W, G.H);
  }
  function majBouton() {
    if (document.body.classList.contains('accueil')) { $('#goTxt').textContent = 'Ouvrir le paquet'; return; }
    const suivant = mobile() && vue < MOTS.length - 1;
    $('#goTxt').innerHTML = suivant ? `Suivant <span class="n">${vue + 1} / ${MOTS.length}</span>` : 'Jouer';
  }
  mesurer(); disposer(); majBouton();
  consigne(OUVRE);
  // le paquet apparaît : on le dit à l'oral. Seule, la page parle tout de suite (si le navigateur laisse jouer le son) ;
  // dans le quiz, elle attend qu'il la montre (elle peut être chargée en coulisse)
  const integre = /[?&]integre=1/.test(location.search);
  let ouvreDit = false;
  const direOuvre = () => { if (ouvreDit || !document.body.classList.contains('accueil')) return; ouvreDit = true; setTimeout(() => { if (document.body.classList.contains('accueil')) dire(iOuvre); }, T(600)); };
  if (!integre) direOuvre();
  addEventListener('resize', majBouton);
  $('#hp').addEventListener('click', () => { audio(); if (document.body.classList.contains('accueil')) dire(iOuvre); else if (!jeu.lance) dire(mobile() && vue > 0 ? vue : iRetiens); else if (!jeu.sienne) dire(iConsigne); else if (jeu.sienne.type === 'mot') dire(jeu.sienne.k); });
  $('#go').addEventListener('click', async () => {
    if (jeu.lance || jeu.etalage) return; audio();
    if (document.body.classList.contains('accueil')) { dechirerAuto(); return; }
    if (mobile() && vue < MOTS.length - 1) { vue++; disposer(); majBouton(); setTimeout(() => ecouterPaire(vue), T(350)); return; }
    fermerZoom(); jeu.lance = true; taire(); cartes.forEach(c => c.el.classList.remove('eclaire'));
    if (mobile()) {
      // au téléphone, pas de place pour la grande donne : les cartes se retournent et partent chez leur joueur
      cartes.forEach(c => c.el.classList.add('cachee')); sfx.tourne(); await wait(T(450));
      document.body.classList.remove('etude'); placerConsigne(); consigne(CONSIGNE, '', true);
      elle.forEach(c => { c.lieu = 'sa-main'; }); moi.forEach(c => { c.lieu = 'pioche'; }); disposer();
    } else {
      // 1. on ramasse : toutes les cartes au milieu, en un paquet mélangé
      melanger([...cartes]).forEach((c, i) => { c.ordre = i; c.lieu = 'centre'; });
      sfx.prise(); disposer(); await wait(T(750));
      // 2. le paquet se retourne, face contre la table
      cartes.forEach((c, i) => setTimeout(() => c.el.classList.add('cachee'), reduit ? 0 : i * 18)); sfx.tourne(); await wait(T(800));
      // 3. on le coupe en deux : à gauche les cartes de la boulangère, à droite les nôtres
      document.body.classList.remove('etude'); placerConsigne(); consigne(CONSIGNE, '', true);
      elle.forEach(c => { c.lieu = 'moitie-elle'; }); moi.forEach(c => { c.lieu = 'moitie-moi'; }); sfx.pose(); disposer(); await wait(T(750));
      // 4. chaque moitié va à son joueur : la sienne en haut (elle ouvre son éventail), la nôtre devient la pioche
      elle.forEach(c => { c.lieu = 'paquet-elle'; }); moi.forEach(c => { c.lieu = 'pioche'; }); disposer(); await wait(T(650));
      elle.forEach(c => { c.lieu = 'sa-main'; }); disposer();
    }
    const parle = dire(iConsigne); await wait(T(600));
    for (let i = 0; i < 5; i++) { await piocher(); await wait(T(170)); }
    await parle; await wait(T(300)); tour();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { mesurer(); disposer(); });
  const b = document.body, cle = 'exercices-theme';
  try { if (localStorage.getItem(cle) === 'clair') b.classList.add('clair'); } catch (e) {}
  $('#theme').addEventListener('click', () => { b.classList.toggle('clair'); try { localStorage.setItem(cle, b.classList.contains('clair') ? 'clair' : 'nuit'); } catch (e) {} });
  // les échanges avec le quiz qui nous ouvre : il donne le thème et demande le silence quand on le quitte ; on lui dit la fin
  function auQuiz(m) { try { if (window.parent !== window) window.parent.postMessage(Object.assign({ de: 'vocabulaire' }, m), '*'); } catch (e) {} }
  addEventListener('message', e => {
    if (e.source !== window.parent || !e.data || e.data.de !== 'quiz') return;
    if (e.data.type === 'theme') b.classList.toggle('clair', !!e.data.clair);
    else if (e.data.type === 'pause') taire();
    else if (e.data.type === 'montre') direOuvre();
  });
  window.__duel = { jeu, cartes, maMain, jouer: c => jouer(c) };
})();
</script>
