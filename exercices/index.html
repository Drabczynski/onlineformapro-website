<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Exercices FLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root {
  --clair-1: #f9f6ff; --clair-2: #f2edff; --clair-3: #edf0ff;
  --violet: #8745fd; --violet-fonce: #6a2fe0; --encre: #46288c; --encre-douce: #8676bf;
  --lavande: #ece4fd; --trou: #e6dcfd; --trou-bord: #cdb8fb; --trait: #e9e1fb;
  --vert-1: #cdfc2a; --vert-2: #8fe60c; --vert-levre: #5fae0c; --vert-texte: #2f7a07; --vert-fond: #eafbd0;
  --rose-1: #ffadf6; --rose-2: #ea62de; --rose-texte: #b0279f; --rose-fond: #fde3fa;
  --citron-1: #fffc96; --citron-2: #ffe35a; --citron-levre: #f0b03a;
  --titre: "Lexend", "Figtree", system-ui, sans-serif; --texte: "Figtree", "Segoe UI", system-ui, sans-serif;
  --ressort: cubic-bezier(.2, 1.4, .4, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--encre); font: 600 17px/1.5 var(--texte); background: linear-gradient(180deg, var(--clair-1), var(--clair-2) 55%, var(--clair-3)) fixed; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; border-radius: 12px; }

/* ---------- barre du haut */
.barre { position: sticky; top: 0; z-index: 5; background: rgba(249, 246, 255, .86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding-top: env(safe-area-inset-top, 0px); }
.barre-in { max-width: 1040px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.rond { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--encre); color: #fff; transition: transform .2s var(--ressort), background .2s; }
.rond:hover { transform: scale(1.06); background: var(--violet); }
.rond:disabled { opacity: .3; pointer-events: none; }
.rond svg { width: 20px; height: 20px; }
.rubrique { display: flex; align-items: center; gap: 10px; font: 700 19px/1 var(--titre); }
.hexa { width: 38px; height: 34px; display: grid; place-items: center; color: #fff; background: var(--violet); clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }
.hexa svg { width: 18px; height: 18px; }
.compte { margin-left: auto; font: 800 18px/1 var(--titre); color: var(--violet); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.progres { height: 4px; background: var(--trait); }
.progres i { display: block; height: 100%; width: 0; background: var(--violet); border-radius: 0 4px 4px 0; transition: width .5s cubic-bezier(.2, .8, .2, 1); }

/* ---------- la page d'un exercice */
main { max-width: 1040px; margin: 0 auto; padding: 28px 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
.surtitre { margin: 0 0 4px; font: 800 12px/1 var(--titre); letter-spacing: .16em; text-transform: uppercase; color: var(--encre-douce); }
h1 { margin: 0 0 18px; font: 800 clamp(26px, 4vw, 36px)/1.15 var(--titre); color: var(--violet); text-wrap: balance; }
h1 em { font-style: italic; }
.consigne { margin: 0; font: 700 19px/1.35 var(--titre); }
.aide { margin: 4px 0 0; color: var(--encre-douce); font-style: italic; }
.carte { margin-top: 22px; padding: 26px clamp(18px, 3vw, 32px); background: #fff; border: 1px solid var(--trait); border-radius: 26px; box-shadow: 0 18px 40px -24px rgba(120, 70, 220, .35); animation: entre .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes entre { from { opacity: 0; transform: translateY(14px); } }

/* ---------- le lecteur audio */
.lecteur { display: flex; align-items: center; gap: 14px; width: min(420px, 100%); padding: 8px 18px 8px 8px; margin-bottom: 22px; border-radius: 99px; background: var(--lavande); }
.lecteur .jouer { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--violet); color: #fff; box-shadow: 0 4px 0 var(--violet-fonce); transition: transform .15s; }
.lecteur .jouer:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--violet-fonce); }
.lecteur .jouer svg { width: 20px; height: 20px; }
.lecteur .piste { flex: 1; height: 8px; border-radius: 8px; background: #fff; cursor: pointer; position: relative; touch-action: none; }
.lecteur .piste i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 8px; background: var(--violet); }
.lecteur .temps { flex: none; font: 700 14px/1 var(--titre); color: var(--encre-douce); font-variant-numeric: tabular-nums; }
.extrait { margin: 0 0 8px; font: 800 16px/1 var(--titre); }

/* ---------- glisser les mots */
.glisser { display: grid; grid-template-columns: 1fr 200px; gap: 28px; align-items: start; }
.texte { line-height: 2.5; }
.texte ol { margin: 0; padding-left: 1.6em; }
.texte li { padding-left: .2em; }
.texte li::marker { font: 800 16px var(--titre); color: var(--violet); }
.trou { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; min-width: 150px; min-height: 36px; margin: 0 4px; padding: 2px 14px; border-radius: 12px; background: var(--trou); border: 2px dashed var(--trou-bord); font: 700 16px/1.2 var(--texte); color: var(--encre); transition: background .2s, border-color .2s, transform .2s var(--ressort); }
.trou.court { min-width: 110px; }
.trou.plein { background: #fff; border: 2px solid var(--violet); }
.trou.vise { background: var(--citron-1); border-color: var(--citron-levre); transform: scale(1.05); }
.trou.juste { background: var(--vert-fond); border: 2px solid var(--vert-2); color: var(--vert-texte); }
.trou.faux { background: var(--rose-fond); border: 2px solid var(--rose-2); color: var(--rose-texte); text-decoration: line-through; }
.corrige { display: inline-block; margin-right: 4px; padding: 1px 10px; border-radius: 10px; background: var(--vert-fond); color: var(--vert-texte); font-weight: 800; line-height: 1.6; animation: entre .35s both; }
.banque { position: sticky; top: 96px; display: flex; flex-direction: column; gap: 10px; }
.banque-titre { font: 800 12px/1 var(--titre); letter-spacing: .14em; text-transform: uppercase; color: var(--encre-douce); margin-bottom: 2px; }
.mot { padding: 10px 14px; border-radius: 14px; background: #fff; border: 2px solid var(--trou-bord); box-shadow: 0 4px 0 var(--trou-bord); font-weight: 800; text-align: center; touch-action: none; cursor: grab; transition: transform .15s var(--ressort), opacity .2s, background .2s; }
.mot:hover { transform: translateY(-2px); }
.mot.choisi { background: var(--citron-1); border-color: var(--citron-levre); box-shadow: 0 4px 0 var(--citron-levre); }
.mot.pris { opacity: .3; pointer-events: none; box-shadow: none; }
.fantome { position: fixed; z-index: 50; pointer-events: none; padding: 10px 14px; border-radius: 14px; background: var(--citron-1); border: 2px solid var(--citron-levre); font-weight: 800; color: var(--encre); box-shadow: 0 14px 30px -8px rgba(70, 40, 140, .4); transform: translate(-50%, -60%) rotate(-3deg); }

/* ---------- cliquer sur le bon mot */
.choix-texte { line-height: 2.6; }
.choix-texte p { margin: 0 0 6px; }
.option { display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; padding: 3px; border-radius: 12px; background: var(--lavande); }
.option button { padding: 3px 12px; border-radius: 9px; font-weight: 800; line-height: 1.5; transition: background .2s, color .2s, transform .2s var(--ressort); }
.option button:hover { background: #fff; }
.option button.choisi { background: var(--citron-2); box-shadow: 0 3px 0 var(--citron-levre); transform: translateY(-1px); }
.option button.juste { background: var(--vert-2); color: #16420a; box-shadow: 0 3px 0 var(--vert-levre); }
.option button.faux { background: var(--rose-2); color: #fff; box-shadow: 0 3px 0 var(--rose-texte); text-decoration: line-through; }
.option button.attendu { outline: 2px dashed var(--vert-2); outline-offset: -2px; color: var(--vert-texte); }

/* ---------- vrai ou faux */
.affirmations { display: grid; gap: 0; }
.affirmation { padding: 18px 0; border-top: 1px solid var(--trait); }
.affirmation:first-child { border-top: 0; padding-top: 0; }
.affirmation p { margin: 0 0 12px; }
.vf { display: flex; gap: 10px; }
.vf button { min-width: 116px; padding: 10px 18px; border-radius: 14px; background: #fff; border: 2px solid var(--trou-bord); box-shadow: 0 4px 0 var(--trou-bord); font-weight: 800; display: flex; align-items: center; gap: 8px; transition: transform .15s var(--ressort), background .2s; }
.vf button::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; opacity: .55; }
.vf button.choisi { background: var(--citron-1); border-color: var(--citron-levre); box-shadow: 0 4px 0 var(--citron-levre); }
.vf button.choisi::before { background: currentColor; opacity: 1; }
.vf button.juste { background: linear-gradient(180deg, var(--vert-1), var(--vert-2)); border-color: var(--vert-levre); box-shadow: 0 4px 0 var(--vert-levre); color: #16420a; }
.vf button.faux { background: var(--rose-2); border-color: var(--rose-texte); box-shadow: 0 4px 0 var(--rose-texte); color: #fff; text-decoration: line-through; }
.vf button.juste::before, .vf button.faux::before { background: currentColor; opacity: 1; }
.vf button.attendu { border-style: dashed; border-color: var(--vert-2); color: var(--vert-texte); }

/* ---------- valider */
.pied { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 26px; }
.gros { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 16px; font: 800 17px/1 var(--titre); letter-spacing: .06em; text-transform: uppercase; color: #2d1a5e; background: linear-gradient(180deg, var(--vert-1), var(--vert-2)); box-shadow: 0 6px 0 var(--vert-levre); transition: transform .12s, box-shadow .12s, filter .2s; }
.gros:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--vert-levre); }
.gros:disabled { filter: grayscale(1) opacity(.45); pointer-events: none; }
.gros.second { background: #fff; box-shadow: 0 6px 0 var(--trou-bord); border: 2px solid var(--trou-bord); }
.gros svg { width: 20px; height: 20px; }
.resultat { font: 800 18px/1.3 var(--titre); }
.resultat.bien { color: var(--vert-texte); }
.resultat.moyen { color: var(--rose-texte); }

/* ---------- le bilan */
.bilan { text-align: center; padding: 40px 0 10px; }
.bilan h1 { font-size: clamp(34px, 6vw, 56px); margin-bottom: 8px; }
.bilan .total { font: 800 20px var(--titre); color: var(--encre-douce); margin: 0 0 28px; }
.bilan ul { list-style: none; padding: 0; margin: 0 auto 30px; max-width: 520px; display: grid; gap: 10px; text-align: left; }
.bilan li { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #fff; border: 1px solid var(--trait); border-radius: 18px; }
.bilan li b { margin-left: auto; font: 800 17px var(--titre); font-variant-numeric: tabular-nums; }
.bilan li button { color: var(--violet); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 760px) {
  .glisser { grid-template-columns: 1fr; gap: 18px; }
  .banque { position: sticky; top: auto; bottom: 0; order: 2; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 -18px -26px; padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px)); background: rgba(242, 237, 255, .95); backdrop-filter: blur(8px); border-radius: 0 0 26px 26px; border-top: 1px solid var(--trait); }
  .banque-titre { width: 100%; text-align: center; }
  .mot { padding: 8px 12px; font-size: 15px; }
  .trou { min-width: 110px; }
  .rubrique span { display: none; }
  .texte, .choix-texte { line-height: 2.4; }
}
</style>
</head>
<body>
<header class="barre">
  <div class="barre-in">
    <a class="rond" href="../activites/" aria-label="Retour aux activités"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div class="rubrique"><div class="hexa" id="icone"></div><span id="rubrique"></span></div>
    <div class="compte" id="compte"></div>
    <button class="rond" id="prec" aria-label="Exercice précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="rond" id="suiv" aria-label="Exercice suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="progres"><i id="progres"></i></div>
</header>
<main id="page"></main>

<script>
/* Les exercices. Dans les textes : [réponse] = un trou ; {*juste|faux} = un choix (l'étoile marque la bonne réponse). */
const EXERCICES = [
  { rubrique: "Écouter", titre: "Extraits du <em>Journal en français facile</em>", consigne: "Écoutez et complétez les phrases avec les mots que vous entendez.", aide: "Déplacez les mots.",
    type: "glisser", son: "journal", liste: true,
    mots: ["sont arrivés", "est revenu", "est devenu", "sont descendues", "est entré", "est arrivé", "sont venus"],
    texte: [
      "Aujourd'hui, à Paris, les ambassadeurs français [sont venus] écouter Emmanuel Macron.",
      "François Bayrou, le nouveau Premier ministre de la France, [est arrivé] à l'hôtel Matignon.",
      "Mark Carney [est devenu] officiellement, aujourd'hui, le nouveau Premier ministre canadien.",
      "Olivier Grondeau a été libéré lundi, il [est revenu] en France.",
      "Le nouveau Premier ministre canadien Mark Carney [est entré] en fonction la semaine dernière.",
      "Les premiers avions [sont arrivés] en Ukraine.",
      "Des milliers de personnes [sont descendues] dans les rues." ] },
  { rubrique: "Vocabulaire", titre: "Le football", consigne: "Complétez le texte avec les mots de l'extrait.", aide: "Déplacez les mots au bon endroit.",
    type: "glisser", son: "football", court: true,
    mots: ["Ballon", "Foot", "gagner", "superstar", "buteur"],
    texte: [ "Enfin, avant de retrouver Radio [Foot] Internationale, cette petite phrase : « C'est peut-être la bonne année pour [gagner] le [Ballon] d'Or. » Phrase du jour, signée Kylian Mbappé. La [superstar] française pense que c'est peut-être son année, car il a été le meilleur [buteur] du Mondial." ] },
  { rubrique: "Grammaire", titre: "Les adjectifs", consigne: "Complétez les phrases.", aide: "Cliquez sur le bon mot.",
    type: "choix",
    texte: [
      "Kylian Mbappé est un buteur {*français|française}.",
      "Il joue pour l'équipe nationale {français|*française}.",
      "C'est un très {*bon|bonne} joueur de foot.",
      "Il espère gagner le Ballon d'Or : c'est une {bon|*bonne} année pour lui." ] },
  { rubrique: "Écouter", titre: "Les transports", consigne: "Écoutez l'extrait et répondez.", aide: "Vrai ou faux ?",
    type: "vraifaux", son: "transport",
    items: [
      ["Le transport des voyageurs et des marchandises représente environ 25 % des émissions mondiales de gaz à effet de serre.", true],
      ["Le prix de l'essence a beaucoup augmenté depuis le début du conflit en Ukraine.", true],
      ["Plus de 7 000 motos électriques ont été enregistrées en tout en Afrique depuis 2022.", false] ] },
  { rubrique: "Vocabulaire", titre: "La mobilité", consigne: "Écoutez les extraits.", aide: "Cliquez sur le mot que vous entendez.",
    type: "choix", son: "mobilite", extrait: "Extrait 1",
    texte: [ "Selon Stéphanie Schüler, les ventes de véhicules, de ces {monoroues|*deux-roues} qui ont comme énergie l'électricité, progressent fortement. En Afrique, le nombre de scooters, {vélos|*motos} et {trottinettes|*tricycles} électriques a pris son envol peu après l'invasion de l'Ukraine par la Russie." ] },
];

const ICONES = {
  "Écouter": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
  "Vocabulaire": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h4"/></svg>',
  "Grammaire": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L10 5h1l5 14M7 14h7"/><path d="M18 9v6"/></svg>',
};
const SVG_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
const SVG_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>';
const SVG_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const SVG_REDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>';
const SVG_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const scores = EXERCICES.map(() => null);
let n = 0, audio = null;

function afficher(i) {
  if (audio) { audio.pause(); audio = null; }
  n = i; const ex = EXERCICES[i];
  $("#rubrique").textContent = ex.rubrique; $("#icone").innerHTML = ICONES[ex.rubrique];
  $("#compte").textContent = `${i + 1} / ${EXERCICES.length}`; $("#progres").style.width = (i + 1) / EXERCICES.length * 100 + "%";
  $("#prec").disabled = i === 0; $("#suiv").disabled = false;
  document.title = `${ex.rubrique} · Exercices FLE`;
  const P = $("#page");
  P.innerHTML = `<p class="surtitre">Exercice ${i + 1}</p><h1>${ex.titre}</h1><p class="consigne">${ex.consigne}</p><p class="aide">${ex.aide}</p><div class="carte"></div>`;
  const C = P.querySelector(".carte");
  if (ex.extrait) C.insertAdjacentHTML("beforeend", `<p class="extrait">${ex.extrait}</p>`);
  if (ex.son) C.appendChild(lecteur("sons/" + ex.son + ".mp3"));
  const corps = document.createElement("div"); C.appendChild(corps);
  const outil = { glisser, choix, vraifaux }[ex.type](ex, corps);
  C.insertAdjacentHTML("beforeend", `<div class="pied"><button class="gros" id="valider">${SVG_OK} Valider</button><span class="resultat" id="resultat" aria-live="polite"></span></div>`);
  const V = $("#valider"), R = $("#resultat");
  let fini = false;
  const majBouton = () => { if (!fini) V.disabled = !outil.pret(); };
  outil.change = majBouton; majBouton();
  V.onclick = () => {
    if (!fini) {
      const [bon, total] = outil.corriger(); fini = true; scores[i] = [bon, total];
      R.textContent = bon === total ? "Bravo, tout est juste !" : `${bon} / ${total} — les bonnes réponses sont en vert.`;
      R.className = "resultat " + (bon === total ? "bien" : "moyen");
      V.innerHTML = i < EXERCICES.length - 1 ? `Suivant ${SVG_NEXT}` : `Voir le bilan ${SVG_NEXT}`;
      V.insertAdjacentHTML("afterend", `<button class="gros second" id="refaire">${SVG_REDO} Recommencer</button>`);
      $("#refaire").onclick = () => afficher(i);
    } else i < EXERCICES.length - 1 ? afficher(i + 1) : bilan();
  };
  scrollTo(0, 0);
}

/* ---------- le lecteur audio */
function lecteur(src) {
  const L = document.createElement("div"); L.className = "lecteur";
  L.innerHTML = `<button class="jouer" aria-label="Écouter">${SVG_PLAY}</button><div class="piste" role="slider" aria-label="Position"><i></i></div><span class="temps">0:00 / 0:00</span>`;
  const a = new Audio(src); audio = a; a.preload = "metadata";
  const B = L.querySelector(".jouer"), I = L.querySelector(".piste i"), T = L.querySelector(".temps"), Pi = L.querySelector(".piste");
  const mm = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
  const maj = () => { T.textContent = `${mm(a.currentTime)} / ${mm(a.duration)}`; I.style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%"; };
  a.addEventListener("loadedmetadata", maj); a.addEventListener("timeupdate", maj);
  a.addEventListener("play", () => { B.innerHTML = SVG_PAUSE; B.setAttribute("aria-label", "Pause"); });
  a.addEventListener("pause", () => { B.innerHTML = SVG_PLAY; B.setAttribute("aria-label", "Écouter"); });
  B.onclick = () => a.paused ? a.play() : a.pause();
  const aller = e => { const r = Pi.getBoundingClientRect(); if (a.duration) a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration; };
  Pi.addEventListener("pointerdown", e => { aller(e); Pi.setPointerCapture(e.pointerId); Pi.onpointermove = aller; });
  Pi.addEventListener("pointerup", () => Pi.onpointermove = null);
  return L;
}

/* ---------- glisser les mots dans les trous (ou : toucher un mot, puis un trou) */
function glisser(ex, el) {
  const html = ex.texte.map(t => esc(t).replace(/\[([^\]]+)\]/g, (_, r) => `<button class="trou${ex.court ? " court" : ""}" data-r="${r}" aria-label="Trou"></button>`));
  el.innerHTML = `<div class="glisser"><div class="texte">${ex.liste ? "<ol>" + html.map(h => `<li>${h}</li>`).join("") + "</ol>" : `<p style="margin:0">${html.join(" ")}</p>`}</div>
    <div class="banque"><div class="banque-titre">Les mots</div>${ex.mots.map(m => `<button class="mot" data-m="${m}">${m}</button>`).join("")}</div></div>`;
  const trous = [...el.querySelectorAll(".trou")], mots = [...el.querySelectorAll(".mot")];
  const O = { fini: false, change: () => {} };
  let choisi = null;
  const choisir = m => { mots.forEach(x => x.classList.toggle("choisi", x === m)); choisi = m; };
  const vider = t => { const m = mots.find(x => x.dataset.m === t.dataset.v); if (m) m.classList.remove("pris"); delete t.dataset.v; t.textContent = ""; t.classList.remove("plein"); };
  const poser = (t, m) => { if (t.dataset.v) vider(t); t.dataset.v = m.dataset.m; t.textContent = m.dataset.m; t.classList.add("plein"); m.classList.add("pris"); choisir(null); O.change(); };
  trous.forEach(t => t.onclick = () => { if (O.fini) return; if (choisi) poser(t, choisi); else if (t.dataset.v) { vider(t); O.change(); } });
  mots.forEach(m => {
    m.addEventListener("pointerdown", e => {
      if (O.fini) return; e.preventDefault();
      const x0 = e.clientX, y0 = e.clientY; let fant = null, vise = null;
      const bouge = ev => {
        if (!fant && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 6) return;
        if (!fant) { fant = document.createElement("div"); fant.className = "fantome"; fant.textContent = m.dataset.m; document.body.appendChild(fant); m.style.opacity = .4; }
        fant.style.left = ev.clientX + "px"; fant.style.top = ev.clientY + "px";
        const sous = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".trou");
        if (sous !== vise) { vise?.classList.remove("vise"); vise = sous; vise?.classList.add("vise"); }
      };
      const fin = () => {
        removeEventListener("pointermove", bouge); removeEventListener("pointerup", fin); removeEventListener("pointercancel", fin);
        if (fant) { fant.remove(); m.style.opacity = ""; vise?.classList.remove("vise"); if (vise) poser(vise, m); }
        else choisir(choisi === m ? null : m);
      };
      addEventListener("pointermove", bouge); addEventListener("pointerup", fin); addEventListener("pointercancel", fin);
    });
    m.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choisir(choisi === m ? null : m); } });
  });
  O.pret = () => trous.every(t => t.dataset.v);
  O.corriger = () => {
    O.fini = true; let bon = 0;
    trous.forEach(t => { const ok = t.dataset.v === t.dataset.r; bon += ok; t.classList.add(ok ? "juste" : "faux");
      if (!ok) t.insertAdjacentHTML("afterend", `<span class="corrige">${t.dataset.r}</span>`); });
    mots.forEach(m => m.classList.add("pris"));
    return [bon, trous.length];
  };
  return O;
}

/* ---------- cliquer sur le bon mot */
function choix(ex, el) {
  el.innerHTML = `<div class="choix-texte">${ex.texte.map(t => "<p>" + esc(t).replace(/\{([^}]+)\}/g, (_, o) =>
    `<span class="option" role="group">${o.split("|").map(x => `<button data-ok="${x[0] === "*" ? 1 : 0}">${x.replace(/^\*/, "")}</button>`).join("")}</span>`) + "</p>").join("")}</div>`;
  const groupes = [...el.querySelectorAll(".option")];
  const O = { change: () => {} }; let fini = false;
  groupes.forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => { if (fini) return; g.querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b)); O.change(); }));
  O.pret = () => groupes.every(g => g.querySelector(".choisi"));
  O.corriger = () => {
    fini = true; let bon = 0;
    groupes.forEach(g => { const c = g.querySelector(".choisi"), ok = c.dataset.ok === "1"; bon += ok;
      c.classList.remove("choisi"); c.classList.add(ok ? "juste" : "faux"); if (!ok) g.querySelector('[data-ok="1"]').classList.add("attendu"); });
    return [bon, groupes.length];
  };
  return O;
}

/* ---------- vrai ou faux */
function vraifaux(ex, el) {
  el.innerHTML = `<div class="affirmations">${ex.items.map(([t, v]) => `<div class="affirmation" data-v="${v ? 1 : 0}"><p>${esc(t)}</p><div class="vf" role="group"><button data-v="1">Vrai</button><button data-v="0">Faux</button></div></div>`).join("")}</div>`;
  const lignes = [...el.querySelectorAll(".affirmation")];
  const O = { change: () => {} }; let fini = false;
  lignes.forEach(l => l.querySelectorAll("button").forEach(b => b.onclick = () => { if (fini) return; l.querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b)); O.change(); }));
  O.pret = () => lignes.every(l => l.querySelector(".choisi"));
  O.corriger = () => {
    fini = true; let bon = 0;
    lignes.forEach(l => { const c = l.querySelector(".choisi"), ok = c.dataset.v === l.dataset.v; bon += ok;
      c.classList.remove("choisi"); c.classList.add(ok ? "juste" : "faux"); if (!ok) l.querySelector(`button[data-v="${l.dataset.v}"]`).classList.add("attendu"); });
    return [bon, lignes.length];
  };
  return O;
}

/* ---------- le bilan */
function bilan() {
  if (audio) { audio.pause(); audio = null; }
  const faits = scores.filter(Boolean), bon = faits.reduce((s, x) => s + x[0], 0), tot = faits.reduce((s, x) => s + x[1], 0);
  $("#compte").textContent = "Bilan"; $("#progres").style.width = "100%"; $("#suiv").disabled = true; $("#prec").disabled = false;
  $("#rubrique").textContent = "Bilan"; $("#icone").innerHTML = SVG_OK;
  $("#page").innerHTML = `<div class="bilan"><p class="surtitre">Exercices terminés</p><h1>${bon === tot && tot ? "Parfait !" : "Bien joué !"}</h1>
    <p class="total">${bon} bonnes réponses sur ${tot}</p>
    <ul>${EXERCICES.map((ex, i) => `<li><div class="hexa">${ICONES[ex.rubrique]}</div><span>${ex.titre}</span><b>${scores[i] ? scores[i][0] + " / " + scores[i][1] : `<button data-i="${i}">à faire</button>`}</b></li>`).join("")}</ul>
    <button class="gros" id="tout">${SVG_REDO} Tout recommencer</button></div>`;
  $("#page").querySelectorAll("[data-i]").forEach(b => b.onclick = () => afficher(+b.dataset.i));
  $("#tout").onclick = () => { scores.fill(null); afficher(0); };
  scrollTo(0, 0);
}

$("#prec").onclick = () => afficher($("#compte").textContent === "Bilan" ? EXERCICES.length - 1 : Math.max(0, n - 1));
$("#suiv").onclick = () => n < EXERCICES.length - 1 ? afficher(n + 1) : bilan();
addEventListener("keydown", e => { if (e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
  if (e.key === "ArrowRight" && !$("#suiv").disabled) $("#suiv").click(); if (e.key === "ArrowLeft" && !$("#prec").disabled) $("#prec").click(); });
afficher(0);
</script>
