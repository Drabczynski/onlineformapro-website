<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Exercices FLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&display=swap">
<style>
:root {
  --violet: #8745fd; --nuit: #2f2b6e; --nuit-douce: rgba(47, 43, 110, .62); --lavande: #ece4fd;
  --vert-1: #cdfc2a; --vert-2: #8fe60c; --vert-levre: #5fae0c; --rose-1: #ffadf6; --rose-2: #ea62de; --rose-levre: #b53cae;
  --levre: #d6c6fb; --titre: "Lexend", "Segoe UI", system-ui, sans-serif; --ressort: cubic-bezier(.2, 1.4, .4, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; color: var(--nuit); font: 700 18px/1.4 var(--titre); background: #e9e1f7; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 4px; border-radius: 16px; }
@keyframes pose { from { opacity: 0; transform: scale(.6); } }
@keyframes monte { from { opacity: 0; transform: translateY(18px); } }
@keyframes secoue { 20% { translate: -10px 0; } 40% { translate: 9px 0; } 60% { translate: -6px 0; } 80% { translate: 4px 0; } }
@keyframes pop { 50% { transform: scale(1.12); } }
@keyframes tourne { to { rotate: 360deg; } }

/* le fond : une ambiance pastel par partie */
.scene { position: fixed; inset: 0; overflow-y: auto; background: radial-gradient(55% 45% at 50% 40%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 70%), var(--amb); transition: background .6s; }
.amb-1 { --amb: linear-gradient(170deg, #bcd4f0 0%, #d4d9f4 50%, #e9d8f0 100%); }
.amb-2 { --amb: linear-gradient(170deg, #cdeedf 0%, #d3e5f1 55%, #e2def4 100%); }
.amb-3 { --amb: linear-gradient(180deg, #d8c8ee 0%, #e8d0e4 48%, #f5dfcc 100%); }
.amb-4 { --amb: linear-gradient(170deg, #bfe3e8 0%, #cfdff2 55%, #e1dcf4 100%); }
.amb-5 { --amb: linear-gradient(170deg, #f7dfcd 0%, #f3d5de 50%, #e5d5ef 100%); }

.haut { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; }
.rond { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .6); color: var(--nuit); transition: transform .2s var(--ressort); }
.rond:hover { transform: scale(1.08); }
.rond svg { width: 20px; height: 20px; }
.compte { position: fixed; z-index: 5; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); color: var(--nuit-douce); font-size: 15px; letter-spacing: .1em; font-variant-numeric: tabular-nums; }

/* l'écran de départ d'une partie */
.rideau { min-height: 100%; display: grid; place-items: center; align-content: center; gap: 6px; text-align: center; padding: 40px 16px; cursor: pointer; position: relative; overflow: hidden; }
.rayons { position: absolute; left: 50%; top: 42%; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%; pointer-events: none; background: repeating-conic-gradient(from 0deg, rgba(135, 69, 253, .1) 0deg 7deg, transparent 7deg 20deg); -webkit-mask: radial-gradient(closest-side, #000 30%, transparent); mask: radial-gradient(closest-side, #000 30%, transparent); animation: tourne 90s linear infinite; }
.rideau > *:not(.rayons) { position: relative; }
.rideau .tuile { --w: 150px; margin-bottom: 14px; animation: pose .5s var(--ressort) both; }
.rideau .tuile .mot svg { width: 30%; height: 30%; color: var(--violet); }
.rideau h1 { margin: 0; font: 800 clamp(64px, 11vw, 140px)/.95 var(--titre); color: var(--violet); letter-spacing: -.03em; text-shadow: 0 6px 0 rgba(135, 69, 253, .15); animation: monte .5s .1s both; }
.rideau p { margin: 10px 0 0; font-size: clamp(20px, 2vw, 26px); color: var(--nuit-douce); animation: monte .5s .2s both; }

/* une question : la photo à gauche, la carte de verre à droite */
.duo { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; padding: 80px 40px 56px; max-width: 1400px; margin: 0 auto; }
.photo { position: relative; border-radius: 34px; overflow: hidden; background: #cfc6e8 center / cover no-repeat; min-height: 420px; animation: monte .45s both; }
.phrase { position: absolute; left: 22px; right: 22px; bottom: 22px; padding: 22px 26px; border-radius: 28px; background: #fff; box-shadow: 0 6px 0 var(--levre); font: 800 clamp(22px, 2.1vw, 32px)/1.45 var(--titre); color: var(--nuit); text-wrap: balance; animation: monte .5s .15s both; }
.trou { display: inline-block; min-width: 4.2em; height: 1.15em; vertical-align: -.12em; margin: 0 .1em; border-bottom: 4px dashed var(--violet); }
.trou.rempli { min-width: 0; height: auto; padding: 0 .35em; border: 0; border-radius: 12px; background: linear-gradient(180deg, var(--vert-1), var(--vert-2)); box-shadow: 0 3px 0 var(--vert-levre); animation: pop .4s var(--ressort); }
.trou.corrige { background: linear-gradient(180deg, var(--vert-1), var(--vert-2)); }
.carte { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 36px 28px; border: 1.5px solid rgba(255, 255, 255, .8); border-radius: 34px; background: rgba(255, 255, 255, .6); -webkit-backdrop-filter: blur(22px) saturate(1.15); backdrop-filter: blur(22px) saturate(1.15); text-align: center; animation: monte .45s .08s both; }
.consigne { margin: 0; display: flex; align-items: center; gap: 12px; font: 800 clamp(26px, 2.6vw, 38px)/1.2 var(--titre); text-wrap: balance; }
.hp { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #9c8fd6; transition: color .2s, transform .2s var(--ressort); }
.hp:hover { color: var(--violet); transform: scale(1.1); }
.hp svg { width: 26px; height: 26px; }
.hp.joue { color: var(--violet); }
.ecouter { display: inline-flex; align-items: center; gap: 10px; padding: 6px 18px 6px 6px; border-radius: 99px; border: 1.5px solid rgba(255, 255, 255, .9); background: rgba(255, 255, 255, .7); font-size: 17px; transition: transform .2s var(--ressort); }
.ecouter:hover { transform: scale(1.05); }
.ecouter i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--violet); color: #fff; }
.ecouter i svg { width: 15px; height: 15px; }
.ecouter.joue i { animation: pop .8s infinite; }
.affirmation { margin: 0; font: 800 clamp(24px, 2.3vw, 34px)/1.3 var(--titre); text-wrap: balance; max-width: 18em; }

/* les tuiles hexagonales */
.tuile { --w: 150px; position: relative; display: block; width: var(--w); aspect-ratio: 120 / 112; color: var(--nuit); }
.tuile svg.forme { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tuile .levre { fill: var(--levre); stroke: var(--levre); }
.tuile .face { fill: url(#g-blanc); stroke: #fff; transition: translate .1s; }
.tuile .mot { position: absolute; left: 0; right: 0; top: 0; height: 92.8%; display: grid; place-items: center; padding: 0 14%; text-align: center; font: 700 calc(var(--w) * .135)/1.12 var(--titre); }
.tuile:hover .face, .tuile:hover .mot { translate: 0 -2px; }
.tuile:active .face, .tuile:active .mot { translate: 0 4px; }
.tuile.juste .face { fill: url(#g-vert); stroke: var(--vert-1); } .tuile.juste .levre { fill: var(--vert-levre); stroke: var(--vert-levre); }
.tuile.faux .face { fill: url(#g-rose); stroke: var(--rose-1); } .tuile.faux .levre { fill: var(--rose-levre); stroke: var(--rose-levre); }
.tuile.faux { animation: secoue .45s ease; }
.tuile.juste { animation: pop .4s var(--ressort); }
.tuile.eteint { opacity: .4; }
.alveoles { --w: clamp(130px, 11.5vw, 168px); --g: 12px; position: relative; width: calc(var(--w) * 2.5 + var(--g) * 1.732); height: calc(var(--w) * 1.807 + var(--g)); }
.alveoles > .tuile { position: absolute; --w: inherit; animation: pose .45s var(--ressort) both; animation-delay: calc(.12s + var(--n) * .07s); }
.alveoles > .tuile:nth-child(1) { left: calc(50% - var(--w) / 2); top: 0; }
.alveoles > .tuile:nth-child(2) { left: 0; top: calc(var(--w) * .433 + var(--g) / 2); }
.alveoles > .tuile:nth-child(3) { right: 0; top: calc(var(--w) * .433 + var(--g) / 2); }
.alveoles > .tuile:nth-child(4) { left: calc(50% - var(--w) / 2); top: calc(var(--w) * .866 + var(--g)); }
.alveoles.deux { display: flex; gap: calc(var(--g) * 2); width: auto; height: auto; }
.alveoles.deux > .tuile { position: relative; left: auto; right: auto; top: auto; }

/* le retour : un mot, un bouton */
.retour { display: grid; justify-items: center; gap: 14px; animation: monte .35s both; }
.retour b { font: 800 clamp(28px, 2.8vw, 40px)/1.1 var(--titre); }
.retour b.bien { color: #3f8f06; }
.retour b.non { color: var(--rose-levre); }
.gros { display: inline-flex; align-items: center; gap: 10px; padding: 16px 30px; border-radius: 18px; font: 800 18px/1 var(--titre); letter-spacing: .08em; text-transform: uppercase; color: #2d1a5e; background: linear-gradient(180deg, var(--vert-1), var(--vert-2)); box-shadow: 0 6px 0 var(--vert-levre); transition: transform .12s, box-shadow .12s; }
.gros:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--vert-levre); }
.gros svg { width: 20px; height: 20px; }

/* le bilan */
.bilan { min-height: 100%; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; padding: 40px 16px; position: relative; overflow: hidden; }
.bilan > *:not(.rayons):not(canvas) { position: relative; }
.bilan .tuile { --w: 190px; margin-bottom: 10px; animation: pose .6s var(--ressort) both; }
.bilan .tuile .mot { font-size: calc(var(--w) * .26); font-weight: 800; color: var(--violet); line-height: 1; }
.bilan .tuile .mot small { display: block; font-size: .45em; color: var(--nuit-douce); margin-top: 4px; }
.bilan h1 { margin: 0; font: 800 clamp(56px, 9vw, 110px)/1 var(--titre); color: var(--violet); animation: monte .5s .1s both; }
.bilan .gros { margin-top: 22px; animation: monte .5s .2s both; }
canvas#fete { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }

@media (max-width: 820px) {
  body { font-size: 16px; }
  .duo { grid-template-columns: 1fr; gap: 14px; padding: 72px 16px 52px; }
  .photo { min-height: 0; height: 40vh; border-radius: 26px; }
  .phrase { left: 12px; right: 12px; bottom: 12px; padding: 14px 16px; border-radius: 20px; font-size: 20px; }
  .carte { padding: 22px 14px; gap: 14px; border-radius: 26px; }
  .consigne { font-size: 22px; }
  .affirmation { font-size: 21px; }
  .alveoles { --w: min(118px, 30vw); --g: 8px; }
  .rideau .tuile { --w: 120px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="g-blanc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f1ebff"/></linearGradient>
  <linearGradient id="g-vert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdfc2a"/><stop offset="1" stop-color="#8fe60c"/></linearGradient>
  <linearGradient id="g-rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffadf6"/><stop offset="1" stop-color="#ea62de"/></linearGradient>
</defs></svg>
<div class="haut"><a class="rond" href="../activites/" aria-label="Quitter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
<div class="scene amb-1" id="scene"></div>
<div class="compte" id="compte"></div>

<script>
/* Cinq parties, une question par écran. « ___ » marque le trou de la phrase. */
const PARTIES = [
  { mot: "Écoutez", titre: "Le journal", photo: "radio", consigne: ["c-ecoutez", "Écoutez et complétez."], items: [
    { son: "j1", phrase: "Les ambassadeurs français ___ écouter Emmanuel Macron.", rep: "sont venus", choix: ["sont arrivés", "sont venus", "est entré", "sont descendues"] },
    { son: "j2", phrase: "François Bayrou ___ à l'hôtel Matignon.", rep: "est arrivé", choix: ["est arrivé", "sont arrivés", "est revenu", "est devenu"] },
    { son: "j3", phrase: "Mark Carney ___ Premier ministre du Canada.", rep: "est devenu", choix: ["est revenu", "est devenu", "est entré", "est arrivé"] },
    { son: "j4", phrase: "Olivier Grondeau ___ en France.", rep: "est revenu", choix: ["est devenu", "est arrivé", "est revenu", "sont venus"] },
    { son: "j5", phrase: "Mark Carney ___ en fonction la semaine dernière.", rep: "est entré", choix: ["est entré", "est revenu", "sont descendues", "est devenu"] },
    { son: "j6", phrase: "Les premiers avions ___ en Ukraine.", rep: "sont arrivés", choix: ["est arrivé", "sont venus", "sont arrivés", "sont descendues"] },
    { son: "j7", phrase: "Des milliers de personnes ___ dans les rues.", rep: "sont descendues", choix: ["sont venus", "sont descendues", "est entré", "sont arrivés"] } ] },
  { mot: "Écoutez", titre: "Le football", photo: "foot", consigne: ["c-ecoutez", "Écoutez et complétez."], items: [
    { son: "f1", phrase: "Avant de retrouver Radio ___ Internationale…", rep: "Foot", choix: ["Ballon", "Foot", "buteur", "gagner"] },
    { son: "f2", phrase: "C'est peut-être la bonne année pour ___ le Ballon d'Or.", rep: "gagner", choix: ["gagner", "superstar", "Foot", "Ballon"] },
    { son: "f2", phrase: "C'est peut-être la bonne année pour gagner le ___ d'Or.", rep: "Ballon", choix: ["buteur", "Ballon", "gagner", "Foot"] },
    { son: "f3", phrase: "La ___ française pense que c'est son année.", rep: "superstar", choix: ["Ballon", "buteur", "superstar", "Foot"] },
    { son: "f4", phrase: "Il a été le meilleur ___ du Mondial.", rep: "buteur", choix: ["superstar", "gagner", "Ballon", "buteur"] } ] },
  { mot: "Complétez", titre: "Les adjectifs", photo: "equipe", consigne: ["c-completez", "Complétez la phrase."], items: [
    { apres: "g1", phrase: "Kylian Mbappé est un buteur ___.", rep: "français", choix: ["français", "française"] },
    { apres: "g2", phrase: "Il joue pour l'équipe nationale ___.", rep: "française", choix: ["français", "française"] },
    { apres: "g3", phrase: "C'est un très ___ joueur de foot.", rep: "bon", choix: ["bon", "bonne"] },
    { apres: "g4", phrase: "C'est une ___ année pour lui.", rep: "bonne", choix: ["bon", "bonne"] } ] },
  { mot: "Écoutez", titre: "Les transports", photo: "circulation", consigne: ["c-vraifaux", "Vrai ou faux ?"], ecoute: "transport", items: [
    { dit: "t1", affirmation: "Le transport, c'est 25 % des gaz à effet de serre.", rep: "Vrai" },
    { dit: "t2", affirmation: "L'essence coûte plus cher depuis la guerre en Ukraine.", rep: "Vrai" },
    { dit: "t3", affirmation: "En Afrique, 7 000 motos électriques en tout depuis 2022.", rep: "Faux" } ] },
  { mot: "Écoutez", titre: "La mobilité", photo: "tricycle", consigne: ["c-mot", "Quel mot entendez-vous ?"], items: [
    { son: "m1", phrase: "Les ventes de ___ électriques progressent fortement.", rep: "deux-roues", choix: ["monoroues", "deux-roues"] },
    { son: "m2", phrase: "En Afrique, le nombre de scooters, ___ et tricycles électriques a pris son envol.", rep: "motos", choix: ["vélos", "motos"] },
    { son: "m2", phrase: "En Afrique, le nombre de scooters, motos et ___ électriques a pris son envol.", rep: "tricycles", choix: ["trottinettes", "tricycles"] } ] },
];

const ICO = {
  hp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  suite: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  refaire: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>',
};
const FORME = '<svg class="forme" viewBox="0 0 120 112" aria-hidden="true"><polygon class="levre" points="31,12 89,12 115,60 89,108 31,108 5,60" stroke-width="9" stroke-linejoin="round"/><polygon class="face" points="31,4 89,4 115,52 89,100 31,100 5,52" stroke-width="9" stroke-linejoin="round"/></svg>';
const tuile = (html, cls = "") => `<button class="tuile ${cls}">${FORME}<span class="mot">${html}</span></button>`;

const $ = s => document.querySelector(s), S = $("#scene");
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const ECRANS = PARTIES.flatMap((p, ip) => p.items.map((it, ii) => ({ p, ip, it, ii })));
let pos = -1, score = 0, partieVue = -1;

/* le son : un seul lecteur ; le bouton qui l'a lancé s'anime */
const voix = new Audio(); let bouton = null;
function jouer(id, b) {
  voix.pause(); bouton?.classList.remove("joue"); bouton = b || null;
  voix.src = "sons/" + id + ".mp3"; voix.play().catch(() => {}); bouton?.classList.add("joue");
}
voix.onended = voix.onpause = () => bouton?.classList.remove("joue");

function suivant() {
  pos++;
  if (pos >= ECRANS.length) return bilan();
  const e = ECRANS[pos];
  if (e.ip !== partieVue) { partieVue = e.ip; return rideau(e.p, e.ip); }
  question(e);
}

function rideau(p, ip) {
  voix.pause(); S.className = "scene amb-" + (ip + 1); $("#compte").textContent = "";
  S.innerHTML = `<div class="rideau" role="button" tabindex="0" aria-label="Commencer"><div class="rayons"></div>${tuile(ICO.play)}<h1>${p.mot}</h1><p>${p.titre}</p></div>`;
  const go = () => { pos--; suivant(); };
  const R = S.querySelector(".rideau"); R.onclick = go; R.onkeydown = ev => (ev.key === "Enter" || ev.key === " ") && go(); R.focus();
}

function question({ p, ip, it, ii }) {
  S.className = "scene amb-" + (ip + 1);
  $("#compte").textContent = `${pos + 1} / ${ECRANS.length}`;
  const photo = `<div class="photo" style="background-image:url(photos/${p.photo}.jpg)">${it.phrase ? `<div class="phrase">${esc(it.phrase).replace("___", '<span class="trou"></span>')}</div>` : ""}</div>`;
  const ecoute = it.son || p.ecoute;
  const choix = it.choix || ["Vrai", "Faux"];
  S.innerHTML = `<div class="duo">${photo}<div class="carte">
      <p class="consigne">${it.affirmation ? "" : p.consigne[1]}${it.affirmation ? "" : `<button class="hp" data-son="${p.consigne[0]}" aria-label="Écouter la consigne">${ICO.hp}</button>`}</p>
      ${ecoute ? `<button class="ecouter"><i>${ICO.play}</i>Réécouter</button>` : ""}
      ${it.affirmation ? `<p class="affirmation">${esc(it.affirmation)} <button class="hp" data-son="${it.dit}" aria-label="Écouter la phrase" style="display:inline-grid;vertical-align:middle">${ICO.hp}</button></p><p class="consigne" style="font-size:clamp(20px,1.8vw,26px);color:var(--nuit-douce)">${p.consigne[1]}</p>` : ""}
      <div class="alveoles ${choix.length === 2 ? "deux" : ""}">${choix.map((c, n) => tuile(esc(c)).replace('class="tuile ', `style="--n:${n}" data-c="${esc(c)}" class="tuile `)).join("")}</div>
      <div class="pied"></div></div></div>`;
  S.querySelectorAll(".hp").forEach(b => b.onclick = () => jouer(b.dataset.son, b));
  const E = S.querySelector(".ecouter"); if (E) E.onclick = () => jouer(ecoute, E);
  // on fait entendre la phrase (ou l'extrait, au premier vrai/faux) dès l'arrivée
  if (it.son) setTimeout(() => jouer(it.son, E), 450);
  else if (p.ecoute && ii === 0) setTimeout(() => jouer(p.ecoute, E), 450);
  let fini = false;
  const tuiles = [...S.querySelectorAll(".alveoles .tuile")];
  tuiles.forEach(t => t.onclick = () => {
    if (fini) return; fini = true;
    const ok = t.dataset.c === it.rep; score += ok;
    t.classList.add(ok ? "juste" : "faux");
    tuiles.forEach(x => { if (x !== t) x.classList.add(x.dataset.c === it.rep && !ok ? "juste" : "eteint"); });
    const trou = S.querySelector(".trou"); if (trou) { trou.textContent = it.rep; trou.classList.add("rempli"); }
    if (it.apres) setTimeout(() => jouer(it.apres), 350);
    else if (ok && it.son) setTimeout(() => jouer(it.son, E), 350);
    S.querySelector(".pied").innerHTML = `<div class="retour"><b class="${ok ? "bien" : "non"}">${ok ? "Bravo !" : "C'est « " + esc(it.rep) + " »."}</b><button class="gros" id="go">Continuer ${ICO.suite}</button></div>`;
    $("#go").onclick = suivant; $("#go").focus({ preventScroll: true });
  });
}

function bilan() {
  voix.pause(); S.className = "scene amb-3"; $("#compte").textContent = "";
  S.innerHTML = `<div class="bilan"><div class="rayons"></div>${tuile(`${score}<small>sur ${ECRANS.length}</small>`)}<h1>${score >= ECRANS.length * .8 ? "Bravo !" : "Bien joué !"}</h1><button class="gros" id="encore">${ICO.refaire} Recommencer</button></div>`;
  S.querySelector(".bilan .tuile").disabled = true;
  $("#encore").onclick = () => { pos = -1; score = 0; partieVue = -1; suivant(); };
  confettis();
}

function confettis() {
  const c = document.createElement("canvas"); c.id = "fete"; document.body.appendChild(c);
  const x = c.getContext("2d"), W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const coul = ["#8745fd", "#cdfc2a", "#ffadf6", "#42d8ff", "#ffe35a"];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2, y: H * .45, vx: (Math.random() - .5) * W * .025, vy: -Math.random() * H * .03 - H * .005, r: Math.random() * 8 + 5, a: Math.random() * 6, c: coul[Math.random() * 5 | 0] }));
  let t = 0; (function f() { x.clearRect(0, 0, W, H); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += H * .0009; p.a += .15; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (++t < 160) requestAnimationFrame(f); else c.remove(); })();
}

addEventListener("keydown", e => {
  const t = S.querySelectorAll(".alveoles .tuile")[+e.key - 1]; if (t) t.click();
});
suivant();
</script>
